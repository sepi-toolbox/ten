.fcin i.g{background:rgba(20,14,8,.5);box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.fname{left:9%;right:9%;top:calc(var(--nY)*1%);height:calc(var(--nH)*1%);z-index:3;
  display:flex;align-items:center;justify-content:flex-start;
  font-family:'Gowun Batang',serif;font-weight:700;color:#2a1c0d;
  font-size:calc(var(--cw)*.10);line-height:1.05;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 calc(var(--cw)*.03) rgba(238,228,205,.95),
    0 0 calc(var(--cw)*.06) rgba(238,228,205,.75), 0 1px 0 rgba(255,255,255,.5)}
.fcost{left:7%;top:calc(var(--cY)*1%);height:calc(var(--cH)*1%);z-index:3;
  display:flex;align-items:center;gap:calc(var(--cw)*.018)}
.fcost i{width:calc(var(--cw)*.082);height:calc(var(--cw)*.082);border-radius:50%;flex:none;
  background-size:100% 100%;background-repeat:no-repeat;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.55)}
.fcost i[style*="background-image"]{box-shadow:none;border-radius:0}
.fcost i.gap,.fcin i.gap{background:none;box-shadow:none}
.fcost i.g{background:rgba(20,14,8,.55);box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.feff{left:8%;right:8%;top:calc(var(--rY)*1%);height:calc(var(--rH)*1%);z-index:3;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  font-family:'Gowun Batang',serif;font-size:calc(var(--cw)*.068);line-height:1.3;
  color:#3a2a16;padding-top:calc(var(--cw)*.012)}
.feff b{color:#1d1408;font-weight:700}
.fstat{left:0;right:0;top:calc(var(--sY)*1%);height:calc(var(--sH)*1%);z-index:3;
  display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--cw)*.085)}
.fstat span{width:calc(var(--cw)*.185);height:calc(var(--cw)*.185);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:calc(var(--cw)*.115);
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.fstat .fa{color:#ffd9d2} .fstat .fh{color:#d6fff2}
.fstat .fa.dmg{color:#ffe6a8} .fstat .fh.dmg{color:#ff9a88}
.fstat .fa.buf,.fstat .fh.buf{color:#c6ff9e}
/* 인챈트 충전 — 효과문 판 오른쪽 아래 */
.tcard.fr.ench .fstat{left:auto;right:calc(var(--cw)*.03);top:auto;bottom:calc(var(--cw)*.045);
  height:auto;width:calc(var(--cw)*.2);padding:0;justify-content:center}

/* 크기 — 세 곳 모두 같은 규격, 폭만 다르다 */
.tcard.sm{--cw:100cqw}                       /* 보드: 슬롯 폭에 맞춘다 */
.tcard.md{--cw:var(--cardw,86px)}            /* 손패도 같은 규격 */
.tcard.lg{--cw:min(72vw,260px)}              /* 확대 (모바일 값은 아래 @media 900 블록이 아니라
                                                여기 뒤에 오므로, 모바일 전용 크기는 .zoom .tcard.lg 로 적는다) */
@supports not (width:1cqw){ .tcard.sm{--cw:84px} }

/* 상대 손패 — 뒷면만 보인다. 만질 수 없고 부채꼴은 아래로 편다(상대가 쥔 모양). */
.hand.foe{padding:6px 0 8px;align-items:flex-start}
.hand.foe .hcw{pointer-events:none;cursor:default}
.cback{width:var(--foecw,76px);aspect-ratio:5/7;border-radius:calc(var(--foecw,76px)*.06);
  border:1.5px solid var(--bronze);position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%, rgba(242,212,136,.16), transparent 60%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.22) 0 5px, transparent 5px 10px),
    linear-gradient(180deg,#3d2c1b,#1f1509);
  box-shadow:inset 0 0 0 1px rgba(242,212,136,.16),inset 0 0 18px rgba(0,0,0,.6),
             0 2px 6px rgba(0,0,0,.55)}
.cback::before{content:'';position:absolute;left:50%;top:50%;
  width:42%;height:42%;transform:translate(-50%,-50%) rotate(45deg);
  border:1.5px solid rgba(242,212,136,.5);border-radius:2px}
.cback::after{content:'';position:absolute;left:50%;top:50%;
  width:14%;height:14%;transform:translate(-50%,-50%) rotate(45deg);
  background:rgba(242,212,136,.55);border-radius:1px;
  box-shadow:0 0 8px rgba(242,212,136,.5)}

/* 손패 래퍼 */
/* 손패는 실제로 카드를 쥔 것처럼 부채꼴로 편다.
   회전·들림·확대를 각각 변수로 두고 transform 은 한 줄로만 쓴다 —
   여러 규칙에서 transform 을 덮어쓰면 서로 지워 버린다. */
.hand.measuring .hcw{transition:none!important}
.hcw{flex:none;position:relative;cursor:grab;touch-action:none;      /* ⚠ pan-x 로 두면 iOS가 제스처를 가로채 드래그가 취소된다 */
  transform-origin:50% 100%;
  transform:rotate(var(--rot,0deg)) translateY(var(--dy,0px)) scale(var(--sc,1));
  transition:transform .16s cubic-bezier(.2,.9,.3,1),filter .16s}
/* ⚠ 손패 카드는 눌러도 **제자리에 그대로 있어야 한다**.
   z-index를 올리는 것은 물론이고 들어올리거나(--dy) 키우는 것(--sc)도 안 된다 —
   옆 카드에 가려져 있던 부분이 위로 삐져나와 '갑자기 앞으로 튀어나온' 것처럼 보인다.
   강조는 **크기를 바꾸지 않는 테두리 광채**로만 한다. */
.hcw:hover,.hcw.zoomed,.hcw.sel{border-radius:7px;
  box-shadow:0 0 0 2px var(--gold-bright),0 0 18px rgba(242,212,136,.8)}
.hcw.zoomed,.hcw.sel{box-shadow:0 0 0 2.5px var(--gold-bright),0 0 24px rgba(242,212,136,.95)}
/* 끌고 있는 원본은 완전히 감춘다 — 반투명으로 두면 밑장이 비쳐 지저분하다 */
.hcw.dragging{opacity:0;transition:none}

/* 드래그 — 손패 밖으로 끌어내면 발동 */
.dgh{position:fixed;left:0;top:0;z-index:88;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.66))}
.dgh .tcard{--cw:92px;border-color:var(--gold-bright)}
.dgh.ok .tcard{box-shadow:0 0 0 2px var(--gold-bright),0 0 22px rgba(242,212,136,.75)}
body.dragmode .hand{outline:1px dashed rgba(242,212,136,.28);outline-offset:4px;border-radius:8px}
body.dragmode.armed .hand{outline-color:transparent}
.dztip{position:fixed;z-index:87;left:50%;transform:translateX(-50%);top:8px;pointer-events:none;
  font-family:'Gothic A1',sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;
  padding:7px 14px;border-radius:20px;border:1px solid var(--gold);
  background:rgba(20,14,6,.93);color:var(--gold-bright);white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.dztip.ok{border-color:var(--gold-bright);background:rgba(46,34,10,.96)}
.dztip.bad{border-color:#a2643c;background:rgba(38,18,10,.96);color:#f0c9a4}
.dgh.bad .tcard{filter:grayscale(.7) brightness(.7)}
/* 타게팅 — 손패 밖으로 끌어내면 카드가 판 위에 서고 대상 화살표가 손끝을 따라온다 */
/* ⚠ .tgtcard 는 **폐기**했다 — 겨누는 동안 판을 가려서 대상이 안 보였다(성권 지적).
   규칙은 남겨 두되 아무도 안 붙인다. */
.tgtcard{position:fixed;z-index:86;left:50%;transform:translateX(-50%);pointer-events:none;
  filter:drop-shadow(0 0 18px rgba(242,212,136,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.6));
  animation:tgtin .18s cubic-bezier(.2,.9,.3,1) both}
.tgtcard .tcard{--cw:var(--cardw,76px);border-color:var(--gold-bright)}
/* 대상을 고르는 동안 화면 전체를 어둡게 덮고, 고를 수 있는 것만 그 위로 올린다.
   ⚠ 이 딤은 반드시 `.wrap` **안**에 둔다 — `.wrap{z-index:1}` 이 쌓임 맥락을 만들기 때문에
      밖에 두면 안쪽의 `.slot.pick` 을 아무리 올려도 딤 위로 못 올라온다.
      (`position:fixed` 라도 조상의 쌓임 맥락에는 그대로 갇힌다.) */
.tgtdim{position:fixed;inset:0;z-index:40;display:none;pointer-events:none}
body.tgtmode .tgtdim,body.tidemode .tgtdim{display:block;animation:zfade .16s ease both}
body.tidemode .board>.slot.pick{z-index:41 !important}
body.tidemode .slot.pick{animation:tgtpulse 1.05s ease-in-out infinite}
body.tidemode .ctl{position:relative;z-index:41}
/* 고를 수 있는 슬롯만 딤 위로. 판 전체가 아니라 슬롯 하나씩 올려야 옆칸이 딸려 올라오지 않는다.
   ⚠ `!important` 가 필요하다 — `packRow` 가 겹침 순서를 위해 슬롯마다 z-index 를 **인라인으로**
      박아 넣는다(10+i). 스타일시트 선언은 인라인에 지므로 !important 아니면 무시된다. */
body.tgtmode .board>.slot.pick{z-index:41 !important}
/* 가운데 안내 줄도 딤 위로 — "빛나는 대상을 누르세요 / 빈 곳을 누르면 취소"를 못 읽으면
   딤이 오히려 방해가 된다. 조작 자체는 어차피 capture 단계에서 가로채므로 안전하다. */
body.tgtmode .ctl{position:relative;z-index:41}
/* 못 고르는 것에서 색기까지 빼면 무엇이 남았는지 알아보기 어렵다 — 딤만으로 충분하다.
   (예전에는 슬롯마다 filter 를 걸었는데, filter 는 쌓임 맥락을 만들어 딤 계산을 망친다.) */
@keyframes tgtin{0%{opacity:0;transform:translateX(-50%) scale(.85)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
/* SVG는 대체 요소라 inset:0 만으로는 300x150 고유 크기로 남는다 — 크기를 명시할 것 */
#tgtsvg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:85;pointer-events:none;overflow:visible}
#tgtsvg .ln{fill:none;stroke:#f2d488;stroke-width:4;stroke-linecap:round;
  filter:drop-shadow(0 0 5px #f2d488) drop-shadow(0 0 14px rgba(242,212,136,.75))}
#tgtsvg .hd{fill:#fff;filter:drop-shadow(0 0 6px #f2d488) drop-shadow(0 0 18px #f2d488)}
#tgtsvg.bad .ln{stroke:#c8603c;filter:drop-shadow(0 0 5px #c8603c)}
#tgtsvg.bad .hd{fill:#e88b62;filter:drop-shadow(0 0 6px #c8603c)}
body.tgtmode .slot.pick{animation:tgtpulse 1.05s ease-in-out infinite}
/* 본체 조준 — 상대 정보줄 전체가 하나의 큰 대상이 된다(이름·HP·체력바 어디든).
   ⚠ 슬롯과 같은 z-index 로 딤 위에 올려야 '고를 수 있다' 는 게 눈에 보인다. */
body.tgtmode #foeBar.pick{position:relative;z-index:41;border-radius:8px;
  outline:2px solid var(--gold-bright);animation:tgtpulse 1.05s ease-in-out infinite;cursor:pointer}
@keyframes tgtpulse{0%,100%{box-shadow:0 0 0 1px var(--gold-bright)}
  50%{box-shadow:0 0 0 2px var(--gold-bright),0 0 16px rgba(242,212,136,.75)}}
/* ══════════════════════════════════════════════════════════
   게임 화면 레이아웃 — 하스스톤/MTGA 배치. **모든 해상도에 적용된다.**
   한 화면 안에서 끝난다: 상대 → 내 판 → (가운데) 조작 → 손패.
   ⚠ 예전에는 `@media (max-width:900px)` 안에 있었다. 그 바람에 아이패드 가로(1194px)나
      데스크톱에서는 옛 세로 나열 레이아웃이 나와, **턴 종료 줄이 화면 밖 맨 아래**로 밀리고
      페이지가 스크롤됐다. 카드 크기가 vw·dvh 로 묶여 있으므로 넓은 화면에서도 그대로 통한다.
   높이는 dvh 로 잡는다(모바일 브라우저 주소창이 접히면 vh 가 어긋난다).
   ══════════════════════════════════════════════════════════ */
/* fixed 인 서랍은 body 의 overflow 로 잘리지 않는다 — html 에서 잘라야 문서가 안 늘어난다 */
html{overflow:hidden;height:100dvh}
/* 앱(standalone)으로 열면 노치·홈 인디케이터를 피해야 한다 */
body{padding:0;height:100dvh;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* ⚠ body 가 안전영역만큼 줄었으므로 .wrap 은 100dvh 가 아니라 그 **안쪽 높이**를 따라야 한다.
   100dvh 로 두면 노치·홈 인디케이터 높이만큼 아래가 잘린다(손패가 반만 보였다). */
.wrap{height:100%}
.gear{top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));
  width:34px;height:34px;font-size:16px}
.side{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
/* 넓은 화면에서 판이 좌우로 한없이 늘어나면 카드만 가운데 몰려 허전하다 — 놀이판 폭을 묶는다.
   좁은 화면에서는 100% 가 이겨서 영향이 없다. */
.wrap{max-width:min(100%,1180px);margin:0 auto;height:100%;
  display:flex;flex-direction:column;gap:0;padding:0}

/* 판 — 세로로 쌓고, 가운데에 조작 줄을 끼운다 */
/* 게임 화면은 **스크롤하지 않는다** — 해상도에 맞게 카드가 줄어 한 화면에 들어간다.
   ⚠ overflow-y:auto 를 두면 iOS 가 가로 팬까지 잡아채 손패 드래그를 취소시킨다(예전 증상). */
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 6px 0;
  overflow:hidden;overscroll-behavior:contain}
#foeHand{order:0} #foeBar{order:1} #foeLz{order:2} #foeBoard{order:3}
.ctl{order:4}
#myBoard{order:5} #myLz{order:6}
#myBar{order:7} #hand{order:8}

.bar{flex:none;gap:7px;padding:4px 8px;margin-bottom:1px;border-radius:5px}
.bar .who{font-size:10px;min-width:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .hp{font-size:17px;min-width:26px}
.bar .hpbar{height:8px;min-width:40px}
.bar .cnt{font-size:8.5px;letter-spacing:.03em;white-space:nowrap}
.mana{display:none}                      /* 지형존이 같은 정보를 더 잘 보여준다 */

/* 판 라벨은 없앴다. 남는 세로 여백은 각 판 **위**로 고르게 나눈다.
   (한 곳에 몰아주면 손패 위에 거대한 빈칸이 생긴다 — 실제로 그렇게 만들었다가 되돌림)
   ⚠ `.lbl` 자체를 숨기지 말 것 — 설정 서랍('덱 메커니즘'·'전투 로그')도 같은 클래스를 쓴다. */
.main .lbl{display:none}
/* ⚠ `.ctl` 도 반드시 포함할 것. 빼면 조작 줄 **위쪽만** 여백이 없어 위아래가 어긋난다.
   남는 세로를 이 다섯 곳이 똑같이 나눠 가져야 판 위아래가 대칭이 된다. */
#foeLz,#foeBoard,.ctl,#myBoard,#myLz{margin-top:auto}
.lzb{font-size:9px;padding:1px 6px;left:4px;top:3px}
.board{flex:none;padding:2px 4px;margin-bottom:1px;border-radius:5px;
  min-height:calc(var(--cardw)*1.4 + 6px)}
.board.packed>.slot{bottom:3px}
.slot{border-radius:3px;padding:1px}
.kb{font-size:5.5px;padding:1px 2px}
.kbs{gap:1px;right:1px}

/* 가운데 조작 줄 — 안내문 + 턴 종료 (하스스톤의 가운데 띠) */
/* ⚠ `margin` 축약형을 쓰면 위의 `margin-top:auto` 가 지워져 조작 줄 위쪽 여백만 사라진다.
   아래쪽만 0 으로 두고 위는 auto 가 맡게 한다. */
.ctl{flex:none;margin-bottom:0;gap:5px;flex-wrap:nowrap}
.hint{font-size:10.5px;padding:5px 8px;min-height:28px;min-width:0;flex:1;line-height:1.35}
.ctl button{font-size:10.5px;padding:7px 10px;flex:none}

/* 손패 — 넘치면 겹친다(--hgap 은 render 가 계산해 음수로 넣는다) */
/* 모바일 — 판 카드는 손패보다 조금만 작게. 10칸 격자를 버렸으니 크게 그릴 수 있다. */
/* 모바일 — 손패·판·지형존이 전부 이 하나를 쓴다. 세로 예산이 빠듯하니 여기서만 조절할 것. */
/* 카드 규격 하나. 상대 손패도 같은 값을 쓴다(뒷면만 다르다).
   ⚠ 폭(vw)뿐 아니라 **높이(dvh)로도 묶어야** 한다 — 판 4줄 + 손패 2줄이 전부 이 값을 따라
   커지기 때문에, 주소창이 있는 브라우저처럼 세로가 짧으면 화면 밖으로 밀린다.
   (앱으로 설치하면 주소창이 사라져 dvh 가 커지고 카드도 그만큼 커진다.)
   세로 예산 = 판 4줄(5.6W) + 내 손패 노출분(0.98W) + 상대 손패 노출분(0.64W) ≈ 7.2W + 바·조작줄 ~107px.
   라벨 4줄을 없애고 상대 손패를 절반까지 밀어 넣어 8.2dvh → 10dvh 로 올렸다.
   ⚠ 더 올리면 320×568 같은 화면에서 판 사이 여백이 0이 되고 손패가 잘린다(11dvh 에서 확인). */
:root{--cardw:min(clamp(46px,21vw,110px),10dvh)}
/* 상대 손패는 위로 절반을 밀어 넣는다.
   ⚠ margin-bottom 을 반드시 0 으로 되돌린다. `.hand.foe` 도 `.hand` 규칙을 함께 받으므로
      내 손패용 음수 margin-bottom 이 그대로 걸려, 아래에 오는 상대 HP 바를
      위로 끌어올려 뒷면 카드가 바를 덮어 버렸다. */
.hand.foe{flex:none;padding:0 12px 2px;margin-top:var(--foehide);margin-bottom:0}
/* 손패는 화면 바닥에 붙인다 — 남는 세로 여백이 판과 손패 사이로 간다 (하스스톤 배치) */
/* 손패는 화면 가장자리에 **70%만** 걸치게 한다 — 카드 높이(1.4W)의 30%를 밖으로 민다.
   좌우로도 여백을 줘서 화면에 딱 붙지 않게 한다. */
.hand{flex:none;margin-top:auto;padding:4px 12px 0;justify-content:center;overflow:visible;
  margin-bottom:var(--myhide)}
/* 터치에는 hover 가 없다. 강조는 광채뿐이라 따로 끌 것이 없다. */


/* ── 좁은 화면에서만 줄이는 것들(서랍·원정 화면). 레이아웃이 아니라 글자 크기 문제다. ── */
@media (max-width:900px){
  /* 로그·덱 설명은 아래에서 올라오는 서랍으로 */
  .side{width:min(94vw,420px);max-height:82dvh}
  .log{max-height:30dvh}

  /* 원정 화면 */
  .mbox{padding:14px 12px;max-height:92dvh}
  .mbox h2{font-size:18px}
  .mbox .msub{font-size:11px}
  .mrow{gap:8px;margin-bottom:18px}
  .mnode{width:64px;min-height:56px;padding:4px 2px}
  .mnode.boss{width:74px;min-height:66px}
  .mnode .ic{font-size:15px}
  .mnode .nm{font-size:7.5px}
  .mnode .fs{font-size:6.5px}
  .map{padding:10px 4px}
  .foecard{gap:10px;padding:9px}
  .foecard .fart{width:74px}
  .foecard .fnm{font-size:17px}
  .foecard .fdesc{font-size:11.5px}
  .rgcards{gap:6px}
  .over h2{font-size:34px}
  .dztip{font-size:11px;padding:6px 11px}
}

/* 아주 좁은 화면(360px 이하) — 카드와 글자를 한 단계 더 줄인다 */
@media (max-width:380px){
  :root{--cardw:min(clamp(44px,20vw,96px),10dvh)}
  .bar .hp{font-size:15px}
  .hint{font-size:9.5px}
}
/* 세로가 아주 짧은 화면(가로로 눕힌 휴대폰 등).
   고정 크롬(바 2줄 + 조작 줄 ≈ 107px)이 화면의 1/4을 넘어서, 10dvh 를 그대로 쓰면
   손패가 바닥으로 밀려 잘린다(390px 높이에서 24%만 보였다).
   → 크롬을 한 단계 더 줄이고 카드도 8.4dvh 로 낮춘다.
   ⚠ 예전 `--cardw:56px` 고정값은 지웠다 — 세로 390px 에서 56px 은 오히려 넘친다. */
@media (max-height:520px){
  :root{--cardw:min(clamp(38px,21vw,110px),8.4dvh)}
  .bar{padding:2px 6px;margin-bottom:0}
  .bar .hp{font-size:13px;min-width:20px}
  .bar .hpbar{height:5px}
  .bar .cnt{font-size:7.5px}
  .ctl{margin:1px 0 2px}
  .hint{font-size:9px;padding:3px 7px;min-height:20px}
  .ctl button{font-size:9px;padding:4px 9px}
  .lzb{font-size:8px;padding:0 5px}
}

/* 지도 노드의 적 표시 */
.mnode .fs{display:block;font-family:'Gothic A1',sans-serif;font-size:8.5px;font-weight:700;
  color:var(--c);opacity:.9;margin-top:2px;letter-spacing:-.01em;white-space:nowrap}
/* 적 조우 화면 */
.foecard{display:flex;gap:14px;align-items:stretch;margin:14px 0 6px;padding:12px;
  border:1px solid var(--c);border-left:5px solid var(--c);border-radius:8px;
  background:linear-gradient(100deg,rgba(20,14,7,.9),rgba(10,7,3,.9));
  box-shadow:0 0 22px color-mix(in srgb,var(--c) 22%,transparent)}
.foecard .fart{position:relative;flex:none;width:96px;border-radius:6px;overflow:hidden;
  background:#120c06 center/cover no-repeat;border:1px solid rgba(242,212,136,.35)}
.foecard .ftier{position:absolute;left:0;bottom:0;right:0;text-align:center;
  font-family:'Gothic A1',sans-serif;font-size:10px;font-weight:900;padding:3px 0;
  background:rgba(8,5,2,.88);color:var(--c);letter-spacing:.08em}
.foecard .finfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;justify-content:center}
.foecard .fnm{font-family:'Cinzel Decorative','Gothic A1',serif;font-weight:900;font-size:21px;
  color:#f4e6c4;text-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent);line-height:1.1}
.foecard .ftag{display:flex;flex-wrap:wrap;gap:5px}
.foecard .ftag .pill{font-family:'Gothic A1',sans-serif;font-size:10.5px;font-weight:700;
  padding:3px 9px;border-radius:20px;border:1px solid rgba(242,212,136,.45);
  background:rgba(8,5,2,.6);color:#e6d2a4;white-space:nowrap;letter-spacing:-.01em}
.foecard .ftag .pill.hp{border-color:#4fc4a6;color:#7fdcc2}
.foecard .ftag .pill.gold{border-color:#d99a2b;color:#f0c34f}
.foecard .fdesc{font-family:'Gowun Batang',serif;font-size:12.5px;color:#cdbb95;line-height:1.6}
.lbl2{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;color:var(--gold);
  opacity:.75;margin:12px 0 4px;text-transform:uppercase}
.rgcards.sm{gap:6px}
.toast{position:fixed;z-index:95;left:50%;bottom:22px;transform:translateX(-50%);
  font-family:'Gothic A1',sans-serif;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:20px;
  border:1px solid #a2643c;background:rgba(38,18,10,.96);color:#f0c9a4;pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.55);animation:tst 1.5s ease forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}
  75%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.hcw.sel .tcard,.hcw.zoomed .tcard{border-color:var(--gold-bright)}
.hcw.no{cursor:not-allowed}
/* 지금 실제로 드는 비용 — 인쇄값과 다를 때만 뜬다(용암거인) */
.costnow{position:absolute;right:-5px;top:-5px;z-index:6;min-width:21px;height:21px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  font-family:'Cinzel',serif;font-size:12.5px;font-weight:700;color:#0d0a06;
  background:radial-gradient(circle at 40% 32%,#ffe9a8,#e8b94a 62%,#a97d22);
  border:1.5px solid #3a2a10;box-shadow:0 0 10px rgba(242,212,136,.9)}
.hcw.no .tcard{filter:grayscale(.85) brightness(.52) contrast(.95)}

.slot.occ{padding:0;background:transparent;border:none!important;box-shadow:none!important}

/* 키워드 상태 뱃지 — 카드 아래쪽에 겹친다 */
/* 공/체 뱃지와 겹치지 않도록 일러스트 오른쪽에 세로로 쌓는다 */
.kbs{position:absolute;right:2px;top:27%;z-index:4;display:flex;flex-direction:column;
  align-items:flex-end;gap:2px;max-width:76%;pointer-events:none}
.kb{font-style:normal;font-family:'Gothic A1',sans-serif;font-size:6.5px;font-weight:700;
  line-height:1;padding:2px 3px;border-radius:3px;white-space:nowrap;
  border:1px solid rgba(0,0,0,.4);background:rgba(16,11,5,.94);color:#f2d488}
.kb.burn{color:#ffb27a;border-color:#a04a22}
.kb.doom{color:#d8b6ff;border-color:#6b3fa0;background:rgba(24,10,38,.96)}
.kb.grow{color:#9ce29a;border-color:#2f6d2c}
.kb.hard{color:#cfd8e6;border-color:#5d6a7d}
.kb.ward{color:#ffe9a8;border-color:#a8862c}
.kb.drain{color:#e8a4da;border-color:#7d3a6d}
.kb.echo{color:#8fd4ee;border-color:#2b6d8a}
.kb.form{color:#e0c08a;border-color:#7a5c2a}
.kb.heavy{color:#d7bb90;border-color:#6f5533}

/* ── 대기 중인 능력은 **카드 테두리 광채**로 알린다 ─────────────────
   ⚠ 광채는 `.slot` 이 아니라 그 안의 `.tcard` 에 건다 — `.slot.occ` 가
      border/box-shadow 를 `!important` 로 지우고 있어서 슬롯에 걸면 안 보인다.
   ⚠ 셋이 겹칠 수 있으므로 뒤에 오는 규칙이 이기게 두지 말고 각각 다른 색만 준다. */
/* ⚠ 카드 **테두리 색은 건드리지 않는다** — 그건 속성(=카드 정체)이다.
      한 번 `border-color:!important` 로 덮었더니 불 카드가 파랗게 보여 어느 속성인지 알 수 없었다.
      광채는 테두리 **바깥에 두른 고리**(box-shadow spread)로만 준다. */
/* 환류가 **아직 남은** 몸 — 파란 테두리가 일렁인다(성권 요청).
   ⚠ 다 쓴 몸은 u.echo 가 꺼져 이 클래스가 안 붙는다 = 한눈에 갈린다. */
.slot.echoon .tcard{animation:glowecho 1.4s ease-in-out infinite}
.slot.breedon .tcard{animation:glowbreed 1.8s ease-in-out infinite}
.slot.wardon .tcard{animation:glowward 1.8s ease-in-out infinite}
@keyframes glowecho{0%,100%{box-shadow:0 0 0 2px rgba(95,198,238,.85),0 0 8px rgba(95,198,238,.5)}
  50%{box-shadow:0 0 0 2px #5fc6ee,0 0 16px rgba(95,198,238,.95)}}
@keyframes glowbreed{0%,100%{box-shadow:0 0 0 2px rgba(111,216,106,.8),0 0 8px rgba(111,216,106,.45)}
  50%{box-shadow:0 0 0 2px #6fd86a,0 0 16px rgba(111,216,106,.9)}}
@keyframes glowward{0%,100%{box-shadow:0 0 0 2px rgba(255,215,94,.85),0 0 8px rgba(255,215,94,.5)}
  50%{box-shadow:0 0 0 2px #ffd75e,0 0 16px rgba(255,215,94,.95)}}
/* ── 상태를 몸으로 보여 주는 것들 (2026-08) ───────────────────────────
   ⚠ 전부 `.tcard` 안쪽 요소에 건다. `.slot` 자체는 때리는 연출(lunge)이 transform 을
     쓰므로, 여기서 또 transform 을 걸면 서로 덮어써서 둘 다 어긋난다. */
/* 비행 — 아주 약간 떠 있다 */
.slot.fly .tart,.slot.flyguard .tart{animation:hover 3.1s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5%)}}
/* 수호 — 체력 뱃지가 방패 모양이다 */
.slot.guard .tb.h,.slot.flyguard .tb.h{border-radius:22% 22% 46% 46%/18% 18% 74% 74%}
/* 면역 — 일러스트가 프리즘처럼 흐른다(희귀도 보석과 다른 결) */
.slot.veilon .tart::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(112deg,transparent 22%,rgba(190,230,255,.55) 38%,
    rgba(255,214,255,.55) 47%,rgba(190,255,238,.55) 56%,transparent 72%);
  background-size:260% 100%;mix-blend-mode:screen;animation:prism 2.6s linear infinite}
@keyframes prism{0%{background-position:180% 0}100%{background-position:-80% 0}}
/* 연소가 실제로 타는 순간 — 그 자리에서 불이 올랐다 사라진다.
   ⚠⚠ **슬롯에 클래스로 걸면 안 된다.** endStep 이 끝나며 render() 가 슬롯을 다시 그려
     클래스가 통째로 날아간다(실제로 불이 한 번도 안 보였다). body 위에 띄운다. */
.burnfx{position:fixed;z-index:127;pointer-events:none;border-radius:9px;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,150,60,.9),rgba(255,80,20,.4) 45%,transparent 72%);
  animation:burnup .62s ease-out both}
@keyframes burnup{0%{opacity:0;transform:translateY(6%) scaleY(.7)}
  30%{opacity:1;transform:translateY(0) scaleY(1.05)}
  100%{opacity:0;transform:translateY(-14%) scaleY(1.2)}}
/* 광분 — 한 번 더 칠 때 붉게 달아오른다 */
.slot.raging .tcard{animation:ragepulse .5s ease-out both}
@keyframes ragepulse{0%{box-shadow:none;filter:none}
  35%{box-shadow:0 0 0 3px #ff5a46,0 0 22px rgba(255,90,70,.95);filter:brightness(1.45) saturate(1.5)}
  100%{box-shadow:none;filter:none}}
/* 맞은 쪽이 뒤로 밀린다 — 때리는 연출의 짝 */
.slot.bumped .tcard{animation:bump .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes bump{0%{transform:none}30%{transform:translateY(6%) scale(.94) rotate(2deg)}
  100%{transform:none}}
/* 성장까지 남은 턴 — **일러스트 왼쪽 위**. 카드 맨 위에 두면 이름 첫 글자를 덮는다(실제로 덮었다).
   오른쪽은 키워드 뱃지 줄(.kbs)이 쓰므로 왼쪽만 비어 있다. */
.gtim{position:absolute;left:2px;top:27%;z-index:6;font-style:normal;
  font-family:'Cinzel',serif;font-size:8px;font-weight:700;line-height:1;
  min-width:13px;height:13px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:1px solid #2f6d2c;background:rgba(10,22,9,.95);color:#9ce29a;
  box-shadow:0 0 6px rgba(111,216,106,.5)}

.tcard.land{border-style:dashed}
.tcard.land .landart{background:
  radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--el) 55%,transparent), transparent 70%), #16100a}

/* ↓↓ 엘리멘츠 모드 규격(etg.template.html) — 같은 자리에서 온다 ↓↓ */
 은 본편 prototype/index.html 에서 통째로 가져온 카드 규격이다 —
      카드·판·손패·확대창을 본편과 **같은 규격**으로 그리기 위해서다.

  ■ 왜 페이지가 따로인가
    본편(../index.html)과 **자바스크립트를 한 줄도 공유하지 않는다.** 자원 모델도,
    전투도, 승패 조건도 다른 게임이기 때문이다. 본편에 끼워 넣었다면 manaLeft·strike·
    cleanup 같은 단일 통로를 전부 '모드에 따라 갈라지는' 함수로 만들어야 했고,
    그 순간 본편의 30개 검사가 전부 이 모드의 인질이 된다. 그래서 나눴다.
    **가져오는 것은 CSS 뿐이고, 데이터(POOL·ART·FRAMES)는 한 줄도 안 가져온다.**

  ■ 카드
    data.js (tools/gen_etg.py 가 만든다) 만 읽는다. TEN 의 POOL 은 쳐다보지 않는다.

  ■ 원작 규칙 중 여기서 지킨 것
    · 퀀텀은 **속성별로 쌓인다**(최대 75). 턴마다 초기화되지 않는다. ← TEN 과 가장 큰 차이
    · 기둥/탑/진자와 문장은 **자기 턴이 끝날 때** 퀀텀을 만든다 (openEtG v_endturn 순서 그대로)
    · **막기가 없다.** 유닛은 언제나 상대 얼굴을 때리고, 실드만 그 피해를 깎는다
    · 소환 멀미가 없다 — 낸 턴에 바로 때리고 능력도 쓴다
    · 체력 100, 덱 30~60장, 같은 카드 6장까지, 손패 8장 상한, 덱이 마르면 패배
    · 유닛 23칸 · 노드 16칸 · 웨폰 1 · 실드 1
-->
<!--TENCSS-->
<style>
/* ══ 여기부터는 이 모드에만 있는 것 — 본편에 없는 것만 더한다 ════════════════
   ⚠ 위 본편 CSS 를 **덮어쓰는 규칙은 최소로 유지할 것.** 덮어쓰기 시작하면
     규격이 두 벌이 되고, 본편 카드가 바뀌어도 이쪽이 안 따라온다. */
/* ⚠ 본편보다 카드가 **커야 한다** — 이 모드는 카드 안에 규칙 전문을 싣기 때문이다.
   판은 packRow 가 겹쳐 주므로 23칸이어도 넘치지 않는다.
   ⚠⚠ 다만 **화면 높이에 묶어야 한다.** 78px 로 못 박았더니 740px·667px 짜리 폰에서
     손패가 화면 밖으로 잘렸다(전투 화면은 스크롤하지 않으므로 잘리면 못 만진다).
     줄이 넷(상대 노드·상대 판·내 판·내 노드) + 손패 = 카드 다섯 줄이 세로로 들어가야 한다. */
/* ⚠⚠⚠ **이 body 규칙은 본편 CSS 뒤에 온다** — 본편이 걸어 둔
     `padding-top:env(safe-area-inset-top)` 을 통째로 덮어 버린다.
     제목줄이 있을 때는 그 32px 가 완충이 돼서 안 드러났는데, 제목줄을 없애자마자
     상대 체력줄이 시계 밑으로 기어 들어갔다(성권: "화면이 이상하게 위로 올라가있어").
     앱으로 깔면 `viewport-fit=cover` 라 100dvh 는 노치·홈 인디케이터 **밑까지** 센다.
     여백을 덮어쓸 거면 안전영역도 같이 챙겨야 한다. */
:root{
  --safeT:env(safe-area-inset-top, 0px);
  --safeB:env(safe-area-inset-bottom, 0px);
  --safeL:env(safe-area-inset-left, 0px);
  --safeR:env(safe-area-inset-right, 0px);
  /* 진짜로 쓸 수 있는 세로 — 안전영역을 뺀 값이다. 카드 크기도 여기에 맞춘다.
     ⚠ 100dvh 로 재면 노치 있는 폰에서 한 화면 계산이 그만큼 어긋난다. */
  --vh:calc(100dvh - var(--safeT) - var(--safeB));
  /* ⚠ 카드는 **세로에 묶여 있다** — 폰에서 가로는 남고 세로가 모자란다.
     667·740·844·932 네 높이에서 판 아래끝을 재는 sweep 으로 넘치기 직전 값을 잡았다.
     기울기(12.5%)와 절편(−21px)을 따로 둔 이유: dvh 만 쓰면 제일 작은 폰이 상한을
     정해 버려서 큰 폰이 손해를 본다.
     ⚠ 이 숫자를 올릴 때는 반드시 667px 화면에서 '한 화면' 검사를 다시 돌릴 것. */
  /* ⚠⚠ `--vh` 는 화면이 조금만 흔들려도 같이 흔들린다. 그래서 판이 열려 있는 동안에는
     **실제로 잰 판의 높이**(fitBoard 가 --vhpx 로 넣는다)를 먼저 쓴다. 잰 값이 없을
     때만 dvh 로 돌아간다. 이렇게 해야 카드 크기가 브라우저 UI 에 흔들리지 않는다. */
  --cardw:min(96px, calc(var(--vhpx, var(--vh))*0.125 - 21px), 24vw);
  --foecw:min(64px, calc(var(--vhpx, var(--vh))*0.083 - 14px));
}
body{padding:calc(var(--safeT) + 3px) calc(var(--safeR) + 4px)
              calc(var(--safeB) + 8px) calc(var(--safeL) + 4px)}
/* ⚠⚠ **판이 위로 밀려 올라가는 증상.** 판은 한 화면에 딱 맞으므로 스크롤할 것이 없는데도
   iOS 에서는 자꾸 위로 밀린다. 원인이 하나가 아니라 셋이라 셋 다 막는다.
   ① 본편 CSS 가 `html,body{touch-action:pan-x pan-y}` 로 **패닝을 허용**해 둔다.
      본편은 그게 맞지만 이 판은 한 화면이라 패닝할 것이 없다 — 손가락이 미끄러지면
      화면만 흔들린다. 전투 중에는 패닝을 끈다(덱 화면은 스크롤해야 하므로 그대로 둔다).
   ② 겹쳐 뜨는 확대창을 끝까지 끌면 스크롤이 **바깥으로 이어져** 판을 민다.
   ③ 두 번 두드리기 확대(iOS)는 `user-scalable=no` 로 안 막힌다 — manipulation 이 막는다. */
html,body{overscroll-behavior:none}
/* ⚠⚠⚠ **판은 고정 자리다.** 가운데 알림줄이 길어지면 줄 수가 늘고, 그만큼 아래가
   통째로 밀린다 — 크리처 줄도 손패도 매번 다른 자리에 온다(성권: "가운데 텍스트가
   길어지면 막 움직이는데?"). 그리고 그렇게 늘어난 만큼 판이 화면을 넘치면
   모바일에서 위로 말려 올라간다. **높이를 글에 맡기지 않는다** —
   두 줄 자리를 늘 잡아 두고, 넘치는 글은 그 안에서 줄여 넣는다. */
.ctl{flex-wrap:nowrap;align-items:center}
.hint{height:calc(2.7em + 10px);min-height:0;padding-top:0;padding-bottom:0;
  display:flex;align-items:center;overflow:hidden}
.hint>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;line-height:1.35;width:100%}
.ctl button{flex:none;white-space:nowrap}
/* ⚠⚠⚠ **판은 화면에 못박는다.** 앞서 '밀리면 되돌린다' 로 잡으려다 스크롤과 싸워서
   화면이 떨었다(성권: "계속 위아래로 화면이 움직여"). 되돌리는 게 아니라
   **애초에 밀릴 수 없게** 만든다 — 자리 잡힌(fixed) 상자 안에 판을 넣으면
   문서가 어떻게 되든 판은 제자리다.
   ① `position:fixed` — 문서 스크롤과 완전히 무관해진다
   ② 안전영역 여백을 여기서 준다(이 상자가 곧 화면 전부이므로)
   ③ `touch-action:none` — 판 위에서는 손가락으로 화면을 끌 수 없다.
      `manipulation` 은 **패닝을 여전히 허용한다** — 그게 모자랐다.
   ⚠ 덱 화면과 카드 에디터는 스크롤해야 하므로 `body.deckmode` 에서는 풀린다. */
body.playmode{touch-action:none}
body.playmode .wrap{
  position:fixed;
  top:var(--safeT); right:var(--safeR); bottom:var(--safeB); left:var(--safeL);
  height:auto; max-width:none; padding:3px 4px 8px;
  display:flex; flex-direction:column; overflow:hidden}
/* 이제 판의 높이는 **화면이 정한다** — 글이 길어지든 카드가 많아지든 밖으로 못 나간다.
   예전에는 `#screen` 이 안 늘어나서 `.main{flex:1}` 이 놀고 있었고, 판 높이를 **내용**이
   정했다. 그래서 내용이 커지면 화면을 넘쳤다. */
body.playmode #screen{flex:1;min-height:0;display:flex;flex-direction:column}
body.playmode .main{flex:1;min-height:0;justify-content:flex-start}
/* ⚠⚠⚠ **판이 오르내리던 진짜 원인.**
   상대 손패 줄(.hand.foe)은 본편에서 `margin-top: 카드폭 * -0.42` 로 위로 당겨 놓는다
   — 카드 뒷면이 화면 위끝에 살짝 걸치게 하는 연출이다. 그런데 그 여백이 **카드 크기에
   비례**하고, 카드 크기는 `100dvh` 에 묶여 있다. 그래서 화면 높이가 조금만 달라져도
   (iOS 주소줄·홈 인디케이터·확대) 그 음수 여백이 같이 변하고, **판 전체가 통째로 위아래로
   움직인다.** 성권이 본 게 이것이다 — 스크롤이 아니라 **레이아웃 자체가 움직인 것**이라
   앞서 스크롤을 못 하게 막은 것으로는 하나도 해결되지 않았다.

   그래서 이 줄의 높이를 **고정 px** 로 못 박는다. 뒷면은 그 안에서 잘려 딱 그만큼만
   보인다(연출은 그대로다). 카드가 커지든 작아지든 아래 줄들의 시작점은 안 움직인다. */
body.playmode #foeHand{margin-top:0;height:16px;min-height:16px;flex:none;overflow:hidden}
/* 확대창은 제 안에서 세로로 굴러야 한다 — 몸통의 touch-action:none 이 그것까지 막는다 */
.zoom{touch-action:pan-y}
.zoom,.logbox{overscroll-behavior:contain}

/* ══ 덱 편집 화면만은 **스크롤한다** ═══════════════════════════════════════
   ⚠⚠ 본편 CSS 는 html·body 를 `height:100dvh; overflow:hidden` 으로 묶는다 —
     전투 화면이 한 화면에서 끝나야 하기 때문이다(그게 본편의 설계다).
     그걸 통째로 물려받는 바람에 **덱 목록이 잘린 채 스크롤도 안 됐다.**
     한 속성에 카드가 20장인데 첫 화면에 들어가는 건 열 몇 장뿐이라, 나머지는
     손가락을 아무리 끌어도 닿을 수가 없었다. 성권이 "덱목록에서 드래그가 안 된다"
     고 한 것이 이것이다.
   ⚠ html 에도 걸어야 한다 — body 만 풀면 html 의 overflow:hidden 이 그대로 자른다. */
html.deckmode,body.deckmode{height:auto;min-height:100dvh;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--safeB) + 24px)}   /* 덱 화면은 끝까지 내려가야 한다 */
body.deckmode .wrap{height:auto}
.foot{text-align:center;font-size:11px;color:var(--gold);opacity:.65;margin:10px 0 0}
.panel{border:1px solid var(--rule);border-radius:8px;padding:9px 10px;margin-bottom:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.12))}

/* ══ 카드 규격은 **본편 그대로** 둔다 ══════════════════════════════════
   ⚠⚠⚠ **텍스트 박스는 고정 크기다. 일러스트 영역을 절대 침범하지 않는다.**
     한 번 그림 자리를 얇은 띠로 줄이고 그 높이를 설명란에 넘겼다가 되돌렸다.
     글이 길다고 상자를 키우면 카드마다 규격이 달라지고, 그건 더 이상 같은 카드가 아니다.
   그래서 **상자는 그대로 두고 글자를 줄인다**(effClass). 잘라 내지도, 상자를 키우지도 않는다.
   ⚠ 줄 수 제한(-webkit-line-clamp:3)만 푼다 — 그건 크기가 아니라 '몇 줄까지 보일지'라,
     글자를 줄여 네 줄이 들어가도 세 줄에서 잘라 버린다. 높이는 여전히 .tbody 가 묶는다. */
.tcard .teff{-webkit-line-clamp:unset;display:block}
/* 글이 길수록 작게 — **고정된 상자 안에** 전문이 들어가도록. 상자는 손대지 않는다. */
.tcard .teff.s {font-size:calc(var(--cw)*.066);line-height:1.24}
.tcard .teff.m {font-size:calc(var(--cw)*.056);line-height:1.2}
.tcard .teff.l {font-size:calc(var(--cw)*.048);line-height:1.17}
.tcard .teff.xl{font-size:calc(var(--cw)*.042);line-height:1.14}

/* 카드 그림 자리 — 이 모드는 일러스트가 없다. 원작 아트는 우리 것이 아니라 싣지 않았다.
   빈 상자로 두면 무슨 카드인지 알 수가 없으므로 **속성과 종류**를 앉힌다.
   ⚠ 종류(액션·유닛·노드·웨폰·실드)는 테두리 모양만으로는 안 갈린다 — 본편은 유닛이
     대부분이라 테두리로 됐지만 여기는 다섯 종류가 고루 섞인다. 글로 적어야 한다. */
/* 속성·종류 — **발치 줄 가운데**. 이미 있는 줄이라 카드 높이가 하나도 안 늘어난다.
   ⚠ 그림 자리(.tart)에는 아무것도 얹지 않는다. 나중에 일러스트가 들어갈 자리다. */
/* ⚠ 속성 글자를 뺐으면 **남은 글도 자리를 다시 잡아야 한다.** 두 줄짜리 자리에
   한 줄만 덜렁 남겨 두면 공/체 숫자와 같은 높이에서 맞붙어 세 번째 수치처럼 읽힌다.
   아래로 내려 바닥선에 붙이고, 숫자보다 작게 해서 '이름표' 로 읽히게 한다. */
.ttag{font-style:normal;flex:1;min-width:0;text-align:center;align-self:flex-end;
  font-family:'Gothic A1',sans-serif;font-weight:700;line-height:1;
  font-size:calc(var(--cw)*.068);letter-spacing:.06em;
  color:var(--ink-faint);white-space:nowrap;overflow:hidden;
  padding:0 calc(var(--cw)*.015) calc(var(--cw)*.012)}
.tb.sp{border:none;background:none;box-shadow:none}   /* 자리만 잡는 빈 칸 */
/* 카드 글 안의 속성 표시 — `[불]` 같은 자리를 **속성 구슬**로 바꿔 놓은 것.
   ⚠⚠ 크기를 px 로 잡으면 안 된다. 글자는 카드 폭과 글 길이에 따라 네 단계로 줄어드는데
     (teff.s/m/l/xl) 구슬만 안 줄면 작은 카드에서 구슬이 글을 밀어내 줄이 늘고,
     **고정 상자 안에서 글이 잘린다.** 그래서 em 으로 글자를 따라가게 한다.
   ⚠ 세로 정렬을 baseline 그대로 두면 구슬이 줄 높이를 키운다 — 줄 수가 늘어나
     역시 상자를 넘친다. vertical-align 로 글자 안에 앉힌다. */
.elp{display:inline-block;width:.82em;height:.82em;border-radius:.16em;
  background:var(--ec);border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28);
  vertical-align:-.06em;margin:0 .1em}
/* 글 속의 **굵게** · *기울임* — 성권이 카드 글을 직접 쓰기 때문에 받는다.
   ⚠⚠ 속성 구슬도 `<i>` 다(.elp). 기울임을 그냥 `i` 로 잡으면 **구슬까지 기운다.**
     그래서 구슬을 뺀 i 만 기울인다. */
.teff i:not(.elp),.kd i:not(.elp){font-style:italic}
.teff b,.kd b{font-weight:800}
/* 비용이 7 이상이면 구슬 대신 숫자 — 구슬 15개는 머리줄을 넘친다 */
.cpn{font-family:'Cinzel',serif;font-weight:700;font-size:calc(var(--cw)*.095);
  color:var(--ink);margin-left:calc(var(--cw)*.03);line-height:1}

/* 퀀텀줄 — 본편 마나줄 자리를 그대로 쓴다(.bar .mana) */
.bar{flex-wrap:wrap;row-gap:6px}
.qrow{display:flex;gap:2px;flex-wrap:nowrap;flex-basis:100%;justify-content:space-between}
.qp{width:15px;height:17px;border-radius:3px;border:1px solid var(--qc);
  background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  font-style:normal;position:relative}
.qp b{font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:var(--qc)}
.qp.z{opacity:.28}
.qp.mk{box-shadow:0 0 0 1px var(--gold-bright),0 0 6px rgba(242,212,136,.7)}
/* 지금 내려는 카드가 먹는 통 — 낼 수 있으면 초록, 모자라면 붉게 */
.qp.need{opacity:1;background:rgba(20,60,30,.85);box-shadow:0 0 0 1.5px #6ee08a,0 0 9px rgba(110,224,138,.8)}
.qp.short{opacity:1;background:rgba(70,18,14,.9);box-shadow:0 0 0 1.5px #ff8a7a,0 0 9px rgba(255,120,100,.8);
  animation:qshort .9s ease-in-out infinite}
@keyframes qshort{50%{box-shadow:0 0 0 1.5px #ffb0a4,0 0 14px rgba(255,120,100,1)}}
@media (prefers-reduced-motion:reduce){.qp.short{animation:none}}
.mkl{font-style:normal;font-family:'Gowun Batang',serif;font-size:9px;margin-left:4px;opacity:.9}

/* 노드줄은 유닛줄보다 낮게 — 세로 예산을 아끼려고 */
.board.pmrow{min-height:calc(var(--cardw)*1.0 + 8px);margin-bottom:8px;--eqw:calc(var(--cardw)*0.78)}
.board.pmrow>.slot{width:calc(var(--cardw)*0.78)}
.board.pmrow.empty::after{content:'노드'}
.board.empty::after{content:'유닛'}

/* ⚠⚠ 웨폰·실드는 **판에 하나씩뿐인 자리**다 — 새로 내면 앞의 것이 사라진다.
   그런데 기둥·노드와 같은 줄에 그냥 섞여 있어서, 어느 게 웨폰인지 알 수가 없었다
   (성권: "무기, 방패 슬롯이 없는데 어디에 놔?").
   줄을 새로 만들지 않고(전투는 한 화면 안에서 끝나야 한다) **양 끝에 못박는다.**
   비어 있을 때도 테두리와 이름이 보여서 '여기가 그 자리' 라는 게 늘 보인다. */
.pmrow .eq{position:absolute;bottom:5px;width:var(--eqw);z-index:30}
.pmrow .eq.wpn{left:4px}
.pmrow .eq.shd{right:4px}
.pmrow .eq>.slot{position:static;width:100%;left:auto;bottom:auto}
.pmrow .eq.mt{height:calc(var(--eqw)*1.4);border:1px dashed var(--rule);border-radius:4px;
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22)}
.pmrow .eq.mt::after{font-family:'Gowun Batang',serif;letter-spacing:.08em;
  font-size:calc(var(--eqw)*.17);color:var(--parch);opacity:.42}
.pmrow .eq.wpn.mt::after{content:'웨폰'}
.pmrow .eq.shd.mt::after{content:'실드'}
/* ⚠ 카드가 놓이면 이름표를 따로 붙이지 않는다 — 카드 발치 줄이 이미 '웨폰'·'실드' 라고
   적고 있고, 위에 겹쳐 놓으면 카드 이름을 덮는다. 자리는 위치가 말한다. */

/* ⚠⚠ 본편은 손패를 `margin-bottom:calc(cardw*-0.42)` 로 화면 밖에 걸쳐 놓는다
   (거기선 손패 아래에 아무것도 없다). 여기는 손패 **아래에 기록줄**이 있어서,
   그 음수 여백이 기록줄을 손패 밑으로 끌어올려 **첫 줄이 카드에 가려 안 보였다.**
   기록은 이 게임에서 무슨 일이 일어났는지 아는 유일한 창이다. 겹치지 않게 되돌린다. */
.hand{margin-bottom:0}
/* 기록도 화면 높이에 맞춰 준다 — 여기가 넘치면 손패가 밀려 나간다 */
.logbox{height:clamp(34px,6dvh,66px);overflow-y:auto;font-family:'Gowun Batang',serif;font-size:11px;line-height:1.55;
  border:1px solid var(--rule);border-radius:6px;padding:5px 8px;margin-top:8px;
  background:rgba(0,0,0,.3);color:var(--parch)}
.logbox .a{color:var(--gold-bright)}.logbox .b{color:#9ecbff}.logbox .c{color:#ff9a9a}

/* 덱 편집 — 카드를 실제 규격으로 늘어놓는다(글자 목록이 아니라) */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:6px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.pcard .tcard{opacity:.55;transition:opacity .15s}
.pcard.has .tcard{opacity:1;box-shadow:0 0 0 2px var(--gold-bright),0 2px 8px rgba(0,0,0,.5)}
.pcard.full .tcard{box-shadow:0 0 0 2px #6ee08a,0 2px 8px rgba(0,0,0,.5)}   /* 6장 꽉 참 */
.pcard{cursor:pointer}
.pctl{display:flex;align-items:center;gap:5px}
.pctl button{padding:1px 8px;font-size:12px;border-radius:4px}
.pctl b{font-family:'Cinzel',serif;font-size:12px;color:var(--gold-bright);min-width:12px;text-align:center}
.deckpick button.elb{padding:4px 8px;font-family:'Gowun Batang',serif;font-size:11px;letter-spacing:0}

/* ── 쓸 수 있는 능력 ──────────────────────────────────────────────────
   ⚠ 본편의 '가호' 광채(.wardon)를 빌려 썼더니 다른 상태 표시와 구별이 안 됐다.
     이건 **지금 누르면 된다** 는 신호라 따로 둔다.
   ⚠⚠ 예전에는 초록 맥동 + 왼쪽 아래 **비용 뱃지**였다. 그런데 왼쪽 아래는 **공격력 자리**다 —
     '지금 쓸 수 있다' 를 알리려고 공격력을 가리고 있었다. 게다가 비용은 이미 설명 첫머리에
     `[1불] 아블레이즈` 로 적혀 있어서 두 번 말하는 셈이었다.
     성권 제안대로 **카드를 살짝 띄워 둥실거리게** 한다 — 숫자를 하나도 안 가리고,
     판을 훑기만 해도 움직이는 것이 눈에 걸린다.
   ⚠ 자리는 packRow 가 `left` 로 잡는다. 그러니 띄우는 건 반드시 **transform** 으로 한다
     (top/bottom 을 건드리면 자리 계산과 싸운다). */
/* ⚠⚠⚠ 빛은 **`.slot` 이 아니라 `.tcard` 에 걸어야 한다.**
     본편에 `.slot.occ{border:none!important;box-shadow:none!important}` 가 있어서
     `.slot` 쪽 테두리·그림자는 무엇을 적든 통째로 지워진다.
     예전 '초록 맥동' 이 한 번도 안 보였던 이유가 이것이다 — 클래스는 붙는데 그림이 없었다.
     (검사도 `.canuse` 가 붙었는지만 보고 있어서 못 잡았다. 지금은 실제 값을 잰다.) */
.board.packed>.slot{transition:transform .2s}
.slot.canuse{transform:translateY(calc(var(--cardw)*-0.06));
  /* ⚠ `.slot{overflow:hidden}` 이 카드 밖으로 나가는 빛을 잘라 낸다 —
     모서리에만 초록이 삐져나와 흠집처럼 보였다. 이 칸만 잘라 내지 않는다. */
  overflow:visible;
  animation:canuse 2.4s ease-in-out infinite}
.slot.canuse .tcard{
  /* ① 또렷한 초록 링(무엇인지 알아보게) ② 번짐(곁눈에 걸리게) ③ 밑그림자(떠 보이게) */
  box-shadow:0 0 0 2px rgba(110,224,138,.9),0 0 14px rgba(110,224,138,.5),
             0 5px 9px rgba(0,0,0,.6);
  animation:canuseglow 2.4s ease-in-out infinite}
@keyframes canuse{ 50%{transform:translateY(calc(var(--cardw)*-0.115))} }
@keyframes canuseglow{
  50%{box-shadow:0 0 0 2px rgba(160,255,190,1),0 0 22px rgba(110,224,138,.95),
                 0 11px 15px rgba(0,0,0,.55)}}
/* ── 손패도 같은 규칙 ────────────────────────────────────────────────
   낼 수 있는 카드(퀀텀이 되고 · 겨눌 것이 있고 · 내 턴이고 · 자리가 있는)만 뜬다.
   ⚠ 들어올리는 건 `.hcw` 가 아니라 **안쪽 카드**다 — `.hcw` 의 transform 은
     부채꼴(--rot)과 드래그(--dy/--sc)가 이미 쓰고 있어서, 거기에 애니메이션을
     얹으면 끌고 있는 동안 값이 서로를 덮어쓴다.
   ⚠ 본편 주석의 경고("손패 카드를 들어올리면 옆 카드에 가려져 있던 데가 삐져나온다")는
     **한 장만 눌러서 튀어나올 때**의 이야기다. 여기는 낼 수 있는 것들이 **함께** 뜨고
     가림은 좌우로 생기므로 그 증상이 나지 않는다. 대신 폭은 판보다 얕게 잡는다. */
.hcw.ok .tcard{
  transform:translateY(calc(var(--cardw)*-0.04));
  /* ⚠ 손패는 카드가 서로 겹쳐 있다 — 판에서 쓰던 만큼 번지게 두면 옆 장까지
     초록으로 물들어 어느 게 낼 수 있는 건지 도로 흐려진다. 링은 또렷하게, 번짐은 얕게. */
  box-shadow:0 0 0 2px rgba(110,224,138,.85),0 0 8px rgba(110,224,138,.3),
             0 4px 8px rgba(0,0,0,.55);
  animation:handbob 2.4s ease-in-out infinite}
@keyframes handbob{
  50%{transform:translateY(calc(var(--cardw)*-0.085));
      box-shadow:0 0 0 2px rgba(160,255,190,1),0 0 12px rgba(110,224,138,.5),
                 0 9px 12px rgba(0,0,0,.5)}}
/* 여덟 장이 한 몸처럼 출렁이면 그게 더 어지럽다 — 위상을 어긋내 준다 */
.hand .hcw:nth-child(3n+2) .tcard{animation-delay:-.8s}
.hand .hcw:nth-child(3n+3) .tcard{animation-delay:-1.6s}
/* 고르는 중이거나 끌고 있는 장은 멈춘다 — 신호가 둘이면 둘 다 안 읽힌다 */
.hcw.sel .tcard,.hcw.dragging .tcard{animation:none;transform:none}

/* 움직임을 싫어하는 사람에게는 **띄운 채로 멈춰 있게** 한다 — 신호는 남는다 */
@media (prefers-reduced-motion:reduce){
  .slot.canuse{animation:none;transform:translateY(calc(var(--cardw)*-0.085))}
  .slot.canuse .tcard{animation:none}
  .hcw.ok .tcard{animation:none;transform:translateY(calc(var(--cardw)*-0.06))}}

/* ⚠⚠ 본편 `.main` 은 자식을 **id 로 재배열한다**(#foeHand:0 … #hand:8).
   그래서 HTML 에 적은 순서가 화면 순서가 아니다 — 처음에 이걸 모르고 붙였다가
   상대 판·내 판·기록이 뒤죽박죽으로 섞여 나왔다.
   이 모드의 노드줄은 본편 지형줄과 **같은 자리**를 쓴다(#foeLz:2 · #myLz:6).
   order 를 안 준 요소는 0 이 되어 맨 위로 튀므로 로그에도 반드시 준다. */
#foePm{order:2} #myPm{order:6} #log{order:9}
/* ⚠ 덱 설정 화면에서는 제목줄을 걷는다 — 성권: "덱설정 유아이만 있으면 됨".
   전투 화면에는 그대로 둔다(거기선 판 위 정보가 아니라 게임 이름표 노릇을 한다).
   판 번호는 덱 화면 맨 아래 한 줄로 옮겨 붙는다 — 어떤 판이 떠 있는지는 봐야 한다. */

</style>
<style>

*{box-sizing:border-box}
html,body{height:auto;min-height:100dvh;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch}
body{padding:calc(env(safe-area-inset-top,0px) + 8px) 10px

.edrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

input,textarea,select{font-family:'Gowun Batang',serif;font-size:13px;color:var(--parch);

textarea{line-height:1.5;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-bright)}

   판이 들썩이면 못 쓴다. 확대를 막는 대신(접근성) 입력칸만 16px 로 올린다. */

/* ⚠ `.tcard.md` 는 `--cw:var(--cardw)` 를 쓴다 — **길이**여야 한다.
   `--cw:100%` 로 덮었더니 안쪽 글자 크기 계산(calc(var(--cw)*.079))이 통째로 무너져
   카드가 제 규격을 잃었다. 규격은 건드리지 말고 `--cardw` 만 정해 준다. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;

/* 고치는 자리 — 아래에서 올라오는 시트 */

.ef{margin-bottom:9px}

.list{display:flex;flex-direction:column;gap:8px}

  letter-spacing:.04em;margin-bottom:4px}

  margin-top:4px;line-height:1.4}

.io textarea{height:34dvh;font-family:ui-monospace,Menlo,monospace;font-size:12px}

</style>

<div class="wrap">
  <div class="edbar">
    <b>카드 에디터</b><span class="edv" id="ver"></span>

    <button class="ghost" id="back">← 게임</button>
  </div>
  <div class="edtabs">

    <button data-t="el">속성 이름</button>

    <b>주고받기 → 내보내기</b>.<br>원본은 손대지 않는다 — 언제든 되돌릴 수 있다.</p>
</div>

<script>window.ETG_NOBOOT=1;</script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
/* ⚠ 엔진과 **같은 전역**을 쓴다 — 엔진에 이미 `$`·`esc` 가 있어서 여기서 또 선언하면
   `Identifier '$' has already been declared` 로 페이지가 통째로 죽는다.
   에디터 코드는 통째로 제 방(IIFE) 안에 둔다. */
(function(){
const D=window.ETGDBG;
const $=s=>document.querySelector(s);
const esc=D.esc;
document.getElementById('ver').textContent='v'+D.VERSION;
$('#back').onclick=()=>{ location.href='index.html'; };

let TAB='card', ELF=-1, Q='';

/* 고친 값을 넣고 · 저장하고 · 다시 덮고 · 다시 그린다. 이 넷은 늘 같이 간다 —
   하나라도 빠지면 화면과 저장된 값이 어긋난다. */
function put(path,key,val){
  const M=D.MODREF;
  if(!M[path]) M[path]={};
  if(val===''||val===null||val===undefined) delete M[path][key];
  else M[path][key]=val;
  if(!Object.keys(M[path]).length) delete M[path];
  D.saveMod(); D.applyMod();
}
function putCard(code,field,val){
  const M=D.MODREF;
  if(!M.card) M.card={};
  const o=M.card[code]||(M.card[code]={});
  if(val===''||val===null||val===undefined) delete o[field];
  else o[field]=val;
  if(!Object.keys(o).length) delete M.card[code];
  if(!Object.keys(M.card).length) delete M.card;
  D.saveMod(); D.applyMod();
}

/* ── 카드 탭 ────────────────────────────────────────────────────────── */
const PLAY=()=>ETG.cards.filter(c=>!c.up&&D.playable(c));
function cardTab(){
  const els=D.ELKO;
  const btn=(i,ko)=>`<button data-el="${i}" class="${ELF===i?'on':''}"
     style="--dc:${D.ELC[i]||D.ELC[0]}">${esc(ko)}</button>`;
  let list=PLAY();
  if(ELF>=0) list=list.filter(c=>c.el===ELF);
  if(Q) list=list.filter(c=>(c.ko+' '+c.en).toLowerCase().includes(Q));
  return `<div class="elbar">
      <button data-el="-1" class="${ELF<0?'on':''}">전부</button>
      ${els.map((k,i)=>i?btn(i,k):'').join('')}
      <button data-el="0" class="${ELF===0?'on':''}">무색</button>
    </div>
    <div class="edrow"><input type="search" id="q" placeholder="이름으로 찾기" value="${esc(Q)}">
      <span class="ehint">${list.length}장</span></div>
    <div class="grid">${list.map(c=>`
      <div class="gcard${D.modded(c.code)?' dirty':''}" data-code="${c.code}">
        ${D.etgCardHTML(c,{size:'md'})}
        <div class="gname">${esc(c.ko)}</div>
      </div>`).join('')}</div>`;
}

/* ── 속성 이름 · 키워드 · 능력 글 ──────────────────────────────────── */
function elTab(){
  return `<div class="list">${D.ELKO.map((k,i)=>i?`
    <div class="item${(D.MODREF.el||{})[i]?' dirty':''}">
      <div class="ek" style="color:${D.ELC[i]}">${i}</div>
      <input data-el="${i}" value="${esc(k)}">
      <div class="ewho">원래 이름 — ${esc(D.ORIG.el[i])}</div>
    </div>`:'').join('')}</div>`;
}
function flagTab(){
  const M=D.MODREF.flag||{};
  return `<div class="list">${Object.keys(D.FLAGKO).map(k=>`
    <div class="item${M[k]?' dirty':''}">
      <div class="ek">${k}</div>
      <input data-flag="${k}" value="${esc(D.FLAGKO[k])}">
      <div class="ewho">원래 이름 — ${esc(D.ORIG.flag[k])}</div>
    </div>`).join('')}</div>`;
}
/* 어느 카드가 이 능력을 쓰는지 — 글을 고칠 때 '어디에 걸리나' 를 봐야 한다 */
const SKUSERS=(()=>{
  const m={};
  PLAY().forEach(c=>c.sk.forEach(s=>{ (m[s.id]=m[s.id]||[]).push(c); }));
  return m;
})();
function skTab(){
  const M=D.MODREF.sk||{};
  const ids=Object.keys(D.SK).filter(id=>D.SK[id].d&&SKUSERS[id])
    .filter(id=>!Q||(id+' '+D.SK[id].d).toLowerCase().includes(Q))
    .sort();
  return `<div class="edrow"><input type="search" id="q" placeholder="능력 이름·글로 찾기"
      value="${esc(Q)}"><span class="ehint">${ids.length}종</span></div>
    <div class="ehint" style="margin-bottom:8px"><b>여기서 고친 글은 카드 앞면이 아니라
      길게 눌러 보는 <b>확대창</b>에 나온다.</b> 카드 앞면 글은 [카드] 탭에서 한 장씩 고친다.<br>
      중괄호는 <b>카드마다 다른 값이 들어가는 자리</b>다 —
      <b>{N}</b> 숫자 · <b>{A}|{H}</b> 공격|체력 · <b>{EL}</b> 속성 · <b>{SUM}</b> 불러내는 카드.
      그대로 두면 카드마다 알맞은 값이 들어간다.</div>
    <div class="list">${ids.map(id=>{
      const who=SKUSERS[id]||[];
      return `<div class="item${M[id]?' dirty':''}">
        <div class="ek">${id}</div>
        <textarea data-sk="${id}" rows="2">${esc(D.SK[id].d)}</textarea>
        <div class="ewho">${who.length}장에 걸린다 —
          ${who.slice(0,4).map(c=>esc(c.ko)).join(' · ')}${who.length>4?' …':''}</div>
        <div class="ewho">원래 글 — ${esc(D.ORIG.sk[id])}</div>
      </div>`;}).join('')}</div>`;
}

/* ── 그리기 ────────────────────────────────────────────────────────── */
function draw(){
  $('#body').innerHTML=TAB==='card'?cardTab():TAB==='el'?elTab()
    :TAB==='flag'?flagTab():skTab();
  bind();
}
function bind(){
  document.querySelectorAll('[data-el]').forEach(el=>{
    if(el.tagName==='BUTTON'){ el.onclick=()=>{ ELF=+el.dataset.el; draw(); }; return; }
    el.oninput=()=>{ put('el',el.dataset.el,el.value.trim()); };
  });
  document.querySelectorAll('[data-flag]').forEach(el=>{
    el.oninput=()=>{ put('flag',el.dataset.flag,el.value.trim()); };
  });
  document.querySelectorAll('[data-sk]').forEach(el=>{
    el.oninput=()=>{ put('sk',el.dataset.sk,el.value.trim()); };
  });
  document.querySelectorAll('.gcard').forEach(el=>{
    el.onclick=()=>openCard(+el.dataset.code);
  });
  const q=$('#q');
  if(q) q.oninput=()=>{ Q=q.value.trim().toLowerCase();
    const at=q.selectionStart; draw(); const n=$('#q'); if(n){n.focus();n.setSelectionRange(at,at);} };
}
document.querySelectorAll('.edtabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.edtabs button').forEach(x=>x.classList.toggle('on',x===b));
  TAB=b.dataset.t; Q=''; draw();
});

/* ── 카드 한 장 고치기 ─────────────────────────────────────────────── */
let CUR=null;
function autoText(c){
  /* 개조 글을 잠깐 걷고 **자동으로 지어지는 글**을 본다 — 무엇을 덮어쓰는지 알아야 한다 */
  const keep=c.txt; delete c.txt;
  /* ⚠⚠ 태그를 그냥 지우면 **속성 구슬이 통째로 사라진다.** 카드 글의 `[불]` 은 이제
     `<i class="elp">` 로 그려지는데, 태그만 걷어내면 '내가 가진  10마다' 처럼
     속성이 빠진 글이 남는다 — 그걸 보고 베껴 적으면 카드가 망가진다.
     에디터는 **적는 자리**라서 대괄호로 되돌려 보여 준다. */
  const box=document.createElement('div');
  box.innerHTML=D.ruleText(c,null);
  box.querySelectorAll('.elp').forEach(i=>
    i.replaceWith(document.createTextNode('['+(i.getAttribute('title')||'')+']')));
  const t=box.textContent;
  if(keep!==undefined) c.txt=keep;
  return t;
}
function openCard(code){
  CUR=code; $('#sheet').classList.add('on'); drawSheet();
}
function drawSheet(){
  const c=D.CARD[CUR], o=(D.MODREF.card||{})[CUR]||{}, og=D.ORIG.card[CUR];
  const hasAct=c.sk.some(s=>s.ev==='cast'&&c.kind!=='spell');
  const isBody=(c.kind==='creature'||c.kind==='weapon');
  const elsel=(name,val)=>`<select data-f="${name}">${D.ELKO.map((k,i)=>
      `<option value="${i}"${(+val)===i?' selected':''}>${i?esc(k):'무색'}</option>`).join('')}</select>`;
  /* 숫자를 고쳤는데 설명에 옛 숫자가 그대로 남아 있으면 짚어 준다 —
     '설명은 곧 규칙' 이라 어긋나는 순간 카드가 거짓말을 한다 */
  const shown=c.txt||autoText(c);
  const drift=['cost','atk','hp','cast'].filter(f=>
    o[f]!==undefined&&+o[f]!==og[f]&&og[f]&&
    new RegExp('(^|[^0-9])'+og[f]+'([^0-9]|$)').test(shown));
  $('#sheetin').innerHTML=`
    <div class="shhead"><b>${esc(c.en)}</b>
      <button class="ghost" id="revert">이 카드 되돌리기</button>
      <button id="close">닫기</button></div>
    <div class="prevwrap">${D.etgCardHTML(c,{size:'md'})}</div>
    <div class="ef"><label>이름</label><input data-f="ko" value="${esc(c.ko)}"></div>
    ${c.abilko!==undefined&&c.abilko!==''||og.abilko?`
      <div class="ef"><label>능력 이름</label>
        <input data-f="abilko" value="${esc(c.abilko||'')}"
          placeholder="비우면 이름 없음"></div>`:''}
    <div class="ef"><label>비용</label><div class="ef2">
      <input data-f="cost" type="number" inputmode="numeric" value="${c.cost}">
      ${elsel('costel',c.costel)}</div></div>
    ${hasAct?`<div class="ef"><label>능력 비용</label><div class="ef2">
      <input data-f="cast" type="number" inputmode="numeric" value="${c.cast||0}">
      ${elsel('castel',c.castel||0)}</div></div>`:''}
    ${isBody?`<div class="ef"><label>공격 · 체력</label><div class="ef2">
      <input data-f="atk" type="number" inputmode="numeric" value="${c.atk}">
      <input data-f="hp" type="number" inputmode="numeric" value="${c.hp}"></div></div>`
      :(c.kind==='shield'?`<div class="ef"><label>막는 양</label>
        <input data-f="hp" type="number" inputmode="numeric" value="${c.hp}"></div>`:'')}
    <div class="ef"><label>카드 글 — 비우면 원래 글로 돌아간다</label>
      <textarea data-f="txt" rows="3" placeholder="${esc(autoText(c))}">${esc(c.txt||'')}</textarea>
      <div class="ehint">원래 글: ${esc(autoText(c))}</div>
      <div class="ehint">대괄호 <b>[불]</b> 처럼 적으면 <b>속성 구슬</b>로 바뀐다.
        이름을 바꿨다면 바꾼 이름(<b>[이상]</b>)으로 적어도 되고, 원래 이름으로 적어도 된다.</div>
      <div class="ehint">별 두 개 <b>**굵게**</b> · 별 하나 <b>*기울임*</b>.</div></div>
    ${drift.length?`<div class="warn">숫자를 바꿨는데 설명에 옛 값(${
        drift.map(f=>og[f]).join(' · ')})이 그대로 남아 있다. 설명도 같이 고칠 것.</div>`:''}
    <div class="ef"><label>원문 (Elements the Game)</label>
      <div class="eorig">${esc(c.otxt||'(없음)')}</div></div>`;
  $('#close').onclick=closeSheet;
  $('#revert').onclick=()=>{
    const M=D.MODREF; if(M.card) delete M.card[CUR];
    if(M.card&&!Object.keys(M.card).length) delete M.card;
    D.saveMod(); D.applyMod(); drawSheet(); markDirty();
  };
  $('#sheetin').querySelectorAll('[data-f]').forEach(el=>{
    const ev=el.tagName==='SELECT'?'onchange':'oninput';
    el[ev]=()=>{
      const f=el.dataset.f;
      const v=(el.type==='number'||f==='costel'||f==='castel')
        ?(el.value===''?'':+el.value):el.value;
      putCard(CUR,f,v);
      /* 미리보기와 어긋남 경고만 다시 그린다 — 입력칸을 다시 그리면 커서가 튄다 */
      const box=$('#sheetin .prevwrap');
      if(box) box.innerHTML=D.etgCardHTML(D.CARD[CUR],{size:'md'});
      markDirty();
    };
  });
}
function closeSheet(){ $('#sheet').classList.remove('on'); CUR=null; draw(); }
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };
function markDirty(){
  const g=document.querySelector(`.gcard[data-code="${CUR}"]`);
  if(g) g.classList.toggle('dirty',D.modded(CUR));
}

/* ── 주고받기 ──────────────────────────────────────────────────────── */
$('#io').onclick=()=>{
  const json=JSON.stringify(D.MODREF,null,1);
  const n=(D.MODREF.card?Object.keys(D.MODREF.card).length:0);
  $('#sheet').classList.add('on');
  $('#sheetin').innerHTML=`
    <div class="shhead"><b>주고받기</b><button id="close">닫기</button></div>
    <div class="ehint">카드 ${n}장 · 속성 ${Object.keys(D.MODREF.el||{}).length} ·
      키워드 ${Object.keys(D.MODREF.flag||{}).length} ·
      능력 글 ${Object.keys(D.MODREF.sk||{}).length} 을 고쳤다.</div>
    <div class="ef io"><label>내보내기 — 이 글을 통째로 저장하거나 나한테 주면 된다</label>
      <textarea id="out" readonly>${esc(json)}</textarea>
      <div class="ef2" style="margin-top:6px">
        <button id="copy">복사</button><button class="ghost" id="dl">파일로 내려받기</button>
      </div></div>
    <div class="ef io"><label>가져오기 — 받은 글을 붙여 넣고 적용</label>
      <textarea id="in" placeholder='{"card":{…}}'></textarea>
      <div class="ef2" style="margin-top:6px">
        <input type="file" id="file" accept=".json,application/json">
        <button id="apply">적용</button></div>
      <div class="ehint" id="msg"></div></div>
    <div class="ef"><button class="ghost" id="wipe">전부 되돌리기</button>
      <div class="ehint">고친 것을 모두 버리고 원래 엘리멘츠로 돌아간다.</div></div>`;
  $('#close').onclick=closeSheet;
  $('#copy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(json); $('#copy').textContent='복사했다'; }
    catch(e){ const t=$('#out'); t.focus(); t.select(); $('#copy').textContent='길게 눌러 복사'; }
  };
  $('#dl').onclick=()=>{
    const b=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='ten-etg-mod.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  const load=txt=>{
    try{
      const m=JSON.parse(txt);
      if(typeof m!=='object'||!m) throw 0;
      D.setMod(m); D.saveMod(); D.applyMod();
      $('#msg').textContent='적용했다.'; draw();
    }catch(e){ $('#msg').textContent='이 글은 못 읽겠다 — JSON 이 맞는지 봐 줘.'; }
  };
  $('#apply').onclick=()=>load($('#in').value);
  $('#file').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>load(String(r.result)); r.readAsText(f);
  };
  $('#wipe').onclick=()=>{
    if(!confirm('고친 것을 모두 버린다. 되돌릴 수 없다.'))return;
    D.setMod({}); D.saveMod(); D.applyMod(); closeSheet();
  };
};

/* ⚠ 주소로 개조 받기(#mod=)는 **엔진이 한다** — 게임 쪽에서 열어도 똑같이 먹어야 하고,
   같은 일을 두 곳에 두면 반드시 갈라진다. 여기서는 '적용됐다' 는 것만 보여 준다. */
document.addEventListener('etg:mod',()=>{ draw(); toast('링크로 받은 개조를 적용했다.'); });
/* 열자마자 걸린 경우 — 엔진이 화면을 그리기 전에 끝내므로 이벤트가 아니라 깃발로 안다 */
if(window.ETG_MODLINK) toast('링크로 받은 개조를 적용했다.');

draw();
function toast(msg){
  let t=document.getElementById('etoast');
  if(!t){ t=document.createElement('div'); t.id='etoast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2600);
}
window.EDDBG={get MOD(){return D.MODREF;},draw,openCard,closeSheet,put,putCard,
  get tab(){return TAB;},
  setTab(t){ TAB=t; Q='';
    document.querySelectorAll('.edtabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
    draw(); }};
})();
</script>
</body>
</html>
