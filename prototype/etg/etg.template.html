<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<meta name="color-scheme" content="light only">
<title>테스트.</title>
<!-- 앱(PWA) — **게임·카드 뷰어와 별개의 앱**으로 깔린다. scope 가 /prototype/etg/ 라
     홈 화면 아이콘도 따로 생긴다(열두 갈래 색 고리). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120d09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="테스트.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Gothic+A1:wght@700&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<!--
  엘리멘츠 대전 모드 — Elements the Game 의 카드와 규칙을 그대로 옮긴 별도 모드.

  ⚠⚠ 이 파일은 **생성물이다.** 고치지 말고 prototype/etg/etg.template.html 을 고친 뒤
      `python3 tools/build_etg_page.py` 를 다시 돌릴 것.
      아래 <style> 은 본편 prototype/index.html 에서 통째로 가져온 카드 규격이다 —
      카드·판·손패·확대창을 본편과 **같은 규격**으로 그리기 위해서다.

  ■ 왜 페이지가 따로인가
    본편(../index.html)과 **자바스크립트를 한 줄도 공유하지 않는다.** 자원 모델도,
    전투도, 승패 조건도 다른 게임이기 때문이다. 본편에 끼워 넣었다면 manaLeft·strike·
    cleanup 같은 단일 통로를 전부 '모드에 따라 갈라지는' 함수로 만들어야 했고,
    그 순간 본편의 30개 검사가 전부 이 모드의 인질이 된다. 그래서 나눴다.
    **가져오는 것은 CSS 뿐이고, 데이터(POOL·ART·FRAMES)는 한 줄도 안 가져온다.**

  ■ 카드
    data.js (tools/gen_etg.py 가 만든다) 만 읽는다. TEN 의 POOL 은 쳐다보지 않는다.

  ■ 원작 규칙 중 여기서 지킨 것
    · 퀀텀은 **속성별로 쌓인다**(최대 75). 턴마다 초기화되지 않는다. ← TEN 과 가장 큰 차이
    · 기둥/탑/진자와 문장은 **자기 턴이 끝날 때** 퀀텀을 만든다 (openEtG v_endturn 순서 그대로)
    · **막기가 없다.** 크리처는 언제나 상대 얼굴을 때리고, 방패만 그 피해를 깎는다
    · 소환 멀미가 없다 — 낸 턴에 바로 때리고 능력도 쓴다
    · 체력 100, 덱 30~60장, 같은 카드 6장까지, 손패 8장 상한, 덱이 마르면 패배
    · 크리처 23칸 · 기물 16칸 · 무기 1 · 방패 1
-->
<!--TENCSS-->
<style>
/* ══ 여기부터는 이 모드에만 있는 것 — 본편에 없는 것만 더한다 ════════════════
   ⚠ 위 본편 CSS 를 **덮어쓰는 규칙은 최소로 유지할 것.** 덮어쓰기 시작하면
     규격이 두 벌이 되고, 본편 카드가 바뀌어도 이쪽이 안 따라온다. */
/* ⚠ 본편보다 카드가 **커야 한다** — 이 모드는 카드 안에 규칙 전문을 싣기 때문이다.
   판은 packRow 가 겹쳐 주므로 23칸이어도 넘치지 않는다.
   ⚠⚠ 다만 **화면 높이에 묶어야 한다.** 78px 로 못 박았더니 740px·667px 짜리 폰에서
     손패가 화면 밖으로 잘렸다(전투 화면은 스크롤하지 않으므로 잘리면 못 만진다).
     줄이 넷(상대 기물·상대 판·내 판·내 기물) + 손패 = 카드 다섯 줄이 세로로 들어가야 한다. */
/* ⚠⚠⚠ **이 body 규칙은 본편 CSS 뒤에 온다** — 본편이 걸어 둔
     `padding-top:env(safe-area-inset-top)` 을 통째로 덮어 버린다.
     제목줄이 있을 때는 그 32px 가 완충이 돼서 안 드러났는데, 제목줄을 없애자마자
     상대 체력줄이 시계 밑으로 기어 들어갔다(성권: "화면이 이상하게 위로 올라가있어").
     앱으로 깔면 `viewport-fit=cover` 라 100dvh 는 노치·홈 인디케이터 **밑까지** 센다.
     여백을 덮어쓸 거면 안전영역도 같이 챙겨야 한다. */
:root{
  --safeT:env(safe-area-inset-top, 0px);
  --safeB:env(safe-area-inset-bottom, 0px);
  --safeL:env(safe-area-inset-left, 0px);
  --safeR:env(safe-area-inset-right, 0px);
  /* 진짜로 쓸 수 있는 세로 — 안전영역을 뺀 값이다. 카드 크기도 여기에 맞춘다.
     ⚠ 100dvh 로 재면 노치 있는 폰에서 한 화면 계산이 그만큼 어긋난다. */
  --vh:calc(100dvh - var(--safeT) - var(--safeB));
  /* ⚠ 카드는 **세로에 묶여 있다** — 폰에서 가로는 남고 세로가 모자란다.
     667·740·844·932 네 높이에서 판 아래끝을 재는 sweep 으로 넘치기 직전 값을 잡았다.
     기울기(12.5%)와 절편(−21px)을 따로 둔 이유: dvh 만 쓰면 제일 작은 폰이 상한을
     정해 버려서 큰 폰이 손해를 본다.
     ⚠ 이 숫자를 올릴 때는 반드시 667px 화면에서 '한 화면' 검사를 다시 돌릴 것. */
  --cardw:min(96px, calc(var(--vh)*0.125 - 21px), 24vw);
  --foecw:min(64px, calc(var(--vh)*0.083 - 14px));
}
body{padding:calc(var(--safeT) + 3px) calc(var(--safeR) + 4px)
              calc(var(--safeB) + 8px) calc(var(--safeL) + 4px)}
/* ⚠⚠ **판이 위로 밀려 올라가는 증상.** 판은 한 화면에 딱 맞으므로 스크롤할 것이 없는데도
   iOS 에서는 자꾸 위로 밀린다. 원인이 하나가 아니라 셋이라 셋 다 막는다.
   ① 본편 CSS 가 `html,body{touch-action:pan-x pan-y}` 로 **패닝을 허용**해 둔다.
      본편은 그게 맞지만 이 판은 한 화면이라 패닝할 것이 없다 — 손가락이 미끄러지면
      화면만 흔들린다. 전투 중에는 패닝을 끈다(덱 화면은 스크롤해야 하므로 그대로 둔다).
   ② 겹쳐 뜨는 확대창을 끝까지 끌면 스크롤이 **바깥으로 이어져** 판을 민다.
   ③ 두 번 두드리기 확대(iOS)는 `user-scalable=no` 로 안 막힌다 — manipulation 이 막는다. */
html,body{overscroll-behavior:none}
/* ⚠⚠⚠ **판은 고정 자리다.** 가운데 알림줄이 길어지면 줄 수가 늘고, 그만큼 아래가
   통째로 밀린다 — 크리처 줄도 손패도 매번 다른 자리에 온다(성권: "가운데 텍스트가
   길어지면 막 움직이는데?"). 그리고 그렇게 늘어난 만큼 판이 화면을 넘치면
   모바일에서 위로 말려 올라간다. **높이를 글에 맡기지 않는다** —
   두 줄 자리를 늘 잡아 두고, 넘치는 글은 그 안에서 줄여 넣는다. */
.ctl{flex-wrap:nowrap;align-items:center}
.hint{height:calc(2.7em + 10px);min-height:0;padding-top:0;padding-bottom:0;
  display:flex;align-items:center;overflow:hidden}
.hint>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;line-height:1.35;width:100%}
.ctl button{flex:none;white-space:nowrap}
/* ⚠⚠⚠ **판은 화면에 못박는다.** 앞서 '밀리면 되돌린다' 로 잡으려다 스크롤과 싸워서
   화면이 떨었다(성권: "계속 위아래로 화면이 움직여"). 되돌리는 게 아니라
   **애초에 밀릴 수 없게** 만든다 — 자리 잡힌(fixed) 상자 안에 판을 넣으면
   문서가 어떻게 되든 판은 제자리다.
   ① `position:fixed` — 문서 스크롤과 완전히 무관해진다
   ② 안전영역 여백을 여기서 준다(이 상자가 곧 화면 전부이므로)
   ③ `touch-action:none` — 판 위에서는 손가락으로 화면을 끌 수 없다.
      `manipulation` 은 **패닝을 여전히 허용한다** — 그게 모자랐다.
   ⚠ 덱 화면과 카드 에디터는 스크롤해야 하므로 `body.deckmode` 에서는 풀린다. */
body.playmode{touch-action:none}
body.playmode .wrap{
  position:fixed;
  top:var(--safeT); right:var(--safeR); bottom:var(--safeB); left:var(--safeL);
  height:auto; max-width:none; padding:3px 4px 8px;
  display:flex; flex-direction:column; overflow:hidden}
/* 이제 판의 높이는 **화면이 정한다** — 글이 길어지든 카드가 많아지든 밖으로 못 나간다.
   예전에는 `#screen` 이 안 늘어나서 `.main{flex:1}` 이 놀고 있었고, 판 높이를 **내용**이
   정했다. 그래서 내용이 커지면 화면을 넘쳤다. */
body.playmode #screen{flex:1;min-height:0;display:flex;flex-direction:column}
body.playmode .main{flex:1;min-height:0}
/* 확대창은 제 안에서 세로로 굴러야 한다 — 몸통의 touch-action:none 이 그것까지 막는다 */
.zoom{touch-action:pan-y}
.zoom,.logbox{overscroll-behavior:contain}

/* ══ 덱 편집 화면만은 **스크롤한다** ═══════════════════════════════════════
   ⚠⚠ 본편 CSS 는 html·body 를 `height:100dvh; overflow:hidden` 으로 묶는다 —
     전투 화면이 한 화면에서 끝나야 하기 때문이다(그게 본편의 설계다).
     그걸 통째로 물려받는 바람에 **덱 목록이 잘린 채 스크롤도 안 됐다.**
     한 속성에 카드가 20장인데 첫 화면에 들어가는 건 열 몇 장뿐이라, 나머지는
     손가락을 아무리 끌어도 닿을 수가 없었다. 성권이 "덱목록에서 드래그가 안 된다"
     고 한 것이 이것이다.
   ⚠ html 에도 걸어야 한다 — body 만 풀면 html 의 overflow:hidden 이 그대로 자른다. */
html.deckmode,body.deckmode{height:auto;min-height:100dvh;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--safeB) + 24px)}   /* 덱 화면은 끝까지 내려가야 한다 */
body.deckmode .wrap{height:auto}
.foot{text-align:center;font-size:11px;color:var(--gold);opacity:.65;margin:10px 0 0}
.panel{border:1px solid var(--rule);border-radius:8px;padding:9px 10px;margin-bottom:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.12))}

/* ══ 카드 규격은 **본편 그대로** 둔다 ══════════════════════════════════
   ⚠⚠⚠ **텍스트 박스는 고정 크기다. 일러스트 영역을 절대 침범하지 않는다.**
     한 번 그림 자리를 얇은 띠로 줄이고 그 높이를 설명란에 넘겼다가 되돌렸다.
     글이 길다고 상자를 키우면 카드마다 규격이 달라지고, 그건 더 이상 같은 카드가 아니다.
   그래서 **상자는 그대로 두고 글자를 줄인다**(effClass). 잘라 내지도, 상자를 키우지도 않는다.
   ⚠ 줄 수 제한(-webkit-line-clamp:3)만 푼다 — 그건 크기가 아니라 '몇 줄까지 보일지'라,
     글자를 줄여 네 줄이 들어가도 세 줄에서 잘라 버린다. 높이는 여전히 .tbody 가 묶는다. */
.tcard .teff{-webkit-line-clamp:unset;display:block}
/* 글이 길수록 작게 — **고정된 상자 안에** 전문이 들어가도록. 상자는 손대지 않는다. */
.tcard .teff.s {font-size:calc(var(--cw)*.066);line-height:1.24}
.tcard .teff.m {font-size:calc(var(--cw)*.056);line-height:1.2}
.tcard .teff.l {font-size:calc(var(--cw)*.048);line-height:1.17}
.tcard .teff.xl{font-size:calc(var(--cw)*.042);line-height:1.14}

/* 카드 그림 자리 — 이 모드는 일러스트가 없다. 원작 아트는 우리 것이 아니라 싣지 않았다.
   빈 상자로 두면 무슨 카드인지 알 수가 없으므로 **속성과 종류**를 앉힌다.
   ⚠ 종류(주문·크리처·기물·무기·방패)는 테두리 모양만으로는 안 갈린다 — 본편은 크리처가
     대부분이라 테두리로 됐지만 여기는 다섯 종류가 고루 섞인다. 글로 적어야 한다. */
/* 속성·종류 — **발치 줄 가운데**. 이미 있는 줄이라 카드 높이가 하나도 안 늘어난다.
   ⚠ 그림 자리(.tart)에는 아무것도 얹지 않는다. 나중에 일러스트가 들어갈 자리다. */
/* ⚠ 속성 글자를 뺐으면 **남은 글도 자리를 다시 잡아야 한다.** 두 줄짜리 자리에
   한 줄만 덜렁 남겨 두면 공/체 숫자와 같은 높이에서 맞붙어 세 번째 수치처럼 읽힌다.
   아래로 내려 바닥선에 붙이고, 숫자보다 작게 해서 '이름표' 로 읽히게 한다. */
.ttag{font-style:normal;flex:1;min-width:0;text-align:center;align-self:flex-end;
  font-family:'Gothic A1',sans-serif;font-weight:700;line-height:1;
  font-size:calc(var(--cw)*.068);letter-spacing:.06em;
  color:var(--ink-faint);white-space:nowrap;overflow:hidden;
  padding:0 calc(var(--cw)*.015) calc(var(--cw)*.012)}
.tb.sp{border:none;background:none;box-shadow:none}   /* 자리만 잡는 빈 칸 */
/* 비용이 7 이상이면 구슬 대신 숫자 — 구슬 15개는 머리줄을 넘친다 */
.cpn{font-family:'Cinzel',serif;font-weight:700;font-size:calc(var(--cw)*.095);
  color:var(--ink);margin-left:calc(var(--cw)*.03);line-height:1}

/* 퀀텀줄 — 본편 마나줄 자리를 그대로 쓴다(.bar .mana) */
.bar{flex-wrap:wrap;row-gap:6px}
.qrow{display:flex;gap:2px;flex-wrap:nowrap;flex-basis:100%;justify-content:space-between}
.qp{width:15px;height:17px;border-radius:3px;border:1px solid var(--qc);
  background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  font-style:normal;position:relative}
.qp b{font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:var(--qc)}
.qp.z{opacity:.28}
.qp.mk{box-shadow:0 0 0 1px var(--gold-bright),0 0 6px rgba(242,212,136,.7)}
/* 지금 내려는 카드가 먹는 통 — 낼 수 있으면 초록, 모자라면 붉게 */
.qp.need{opacity:1;background:rgba(20,60,30,.85);box-shadow:0 0 0 1.5px #6ee08a,0 0 9px rgba(110,224,138,.8)}
.qp.short{opacity:1;background:rgba(70,18,14,.9);box-shadow:0 0 0 1.5px #ff8a7a,0 0 9px rgba(255,120,100,.8);
  animation:qshort .9s ease-in-out infinite}
@keyframes qshort{50%{box-shadow:0 0 0 1.5px #ffb0a4,0 0 14px rgba(255,120,100,1)}}
@media (prefers-reduced-motion:reduce){.qp.short{animation:none}}
.mkl{font-style:normal;font-family:'Gowun Batang',serif;font-size:9px;margin-left:4px;opacity:.9}

/* 기물줄은 크리처줄보다 낮게 — 세로 예산을 아끼려고 */
.board.pmrow{min-height:calc(var(--cardw)*1.0 + 8px);margin-bottom:8px;--eqw:calc(var(--cardw)*0.78)}
.board.pmrow>.slot{width:calc(var(--cardw)*0.78)}
.board.pmrow.empty::after{content:'기물'}
.board.empty::after{content:'크리처'}

/* ⚠⚠ 무기·방패는 **판에 하나씩뿐인 자리**다 — 새로 내면 앞의 것이 사라진다.
   그런데 기둥·기물과 같은 줄에 그냥 섞여 있어서, 어느 게 무기인지 알 수가 없었다
   (성권: "무기, 방패 슬롯이 없는데 어디에 놔?").
   줄을 새로 만들지 않고(전투는 한 화면 안에서 끝나야 한다) **양 끝에 못박는다.**
   비어 있을 때도 테두리와 이름이 보여서 '여기가 그 자리' 라는 게 늘 보인다. */
.pmrow .eq{position:absolute;bottom:5px;width:var(--eqw);z-index:30}
.pmrow .eq.wpn{left:4px}
.pmrow .eq.shd{right:4px}
.pmrow .eq>.slot{position:static;width:100%;left:auto;bottom:auto}
.pmrow .eq.mt{height:calc(var(--eqw)*1.4);border:1px dashed var(--rule);border-radius:4px;
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22)}
.pmrow .eq.mt::after{font-family:'Gowun Batang',serif;letter-spacing:.08em;
  font-size:calc(var(--eqw)*.17);color:var(--parch);opacity:.42}
.pmrow .eq.wpn.mt::after{content:'무기'}
.pmrow .eq.shd.mt::after{content:'방패'}
/* ⚠ 카드가 놓이면 이름표를 따로 붙이지 않는다 — 카드 발치 줄이 이미 '무기'·'방패' 라고
   적고 있고, 위에 겹쳐 놓으면 카드 이름을 덮는다. 자리는 위치가 말한다. */

/* ⚠⚠ 본편은 손패를 `margin-bottom:calc(cardw*-0.42)` 로 화면 밖에 걸쳐 놓는다
   (거기선 손패 아래에 아무것도 없다). 여기는 손패 **아래에 기록줄**이 있어서,
   그 음수 여백이 기록줄을 손패 밑으로 끌어올려 **첫 줄이 카드에 가려 안 보였다.**
   기록은 이 게임에서 무슨 일이 일어났는지 아는 유일한 창이다. 겹치지 않게 되돌린다. */
.hand{margin-bottom:0}
/* 기록도 화면 높이에 맞춰 준다 — 여기가 넘치면 손패가 밀려 나간다 */
.logbox{height:clamp(34px,6dvh,66px);overflow-y:auto;font-family:'Gowun Batang',serif;font-size:11px;line-height:1.55;
  border:1px solid var(--rule);border-radius:6px;padding:5px 8px;margin-top:8px;
  background:rgba(0,0,0,.3);color:var(--parch)}
.logbox .a{color:var(--gold-bright)}.logbox .b{color:#9ecbff}.logbox .c{color:#ff9a9a}

/* 덱 편집 — 카드를 실제 규격으로 늘어놓는다(글자 목록이 아니라) */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:6px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.pcard .tcard{opacity:.55;transition:opacity .15s}
.pcard.has .tcard{opacity:1;box-shadow:0 0 0 2px var(--gold-bright),0 2px 8px rgba(0,0,0,.5)}
.pcard.full .tcard{box-shadow:0 0 0 2px #6ee08a,0 2px 8px rgba(0,0,0,.5)}   /* 6장 꽉 참 */
.pcard{cursor:pointer}
.pctl{display:flex;align-items:center;gap:5px}
.pctl button{padding:1px 8px;font-size:12px;border-radius:4px}
.pctl b{font-family:'Cinzel',serif;font-size:12px;color:var(--gold-bright);min-width:12px;text-align:center}
.deckpick button.elb{padding:4px 8px;font-family:'Gowun Batang',serif;font-size:11px;letter-spacing:0}

/* ── 쓸 수 있는 능력 ──────────────────────────────────────────────────
   ⚠ 본편의 '가호' 광채(.wardon)를 빌려 썼더니 다른 상태 표시와 구별이 안 됐다.
     이건 **지금 누르면 된다** 는 신호라 따로 둔다.
   ⚠⚠ 예전에는 초록 맥동 + 왼쪽 아래 **비용 뱃지**였다. 그런데 왼쪽 아래는 **공격력 자리**다 —
     '지금 쓸 수 있다' 를 알리려고 공격력을 가리고 있었다. 게다가 비용은 이미 설명 첫머리에
     `[1불] 아블레이즈` 로 적혀 있어서 두 번 말하는 셈이었다.
     성권 제안대로 **카드를 살짝 띄워 둥실거리게** 한다 — 숫자를 하나도 안 가리고,
     판을 훑기만 해도 움직이는 것이 눈에 걸린다.
   ⚠ 자리는 packRow 가 `left` 로 잡는다. 그러니 띄우는 건 반드시 **transform** 으로 한다
     (top/bottom 을 건드리면 자리 계산과 싸운다). */
/* ⚠⚠⚠ 빛은 **`.slot` 이 아니라 `.tcard` 에 걸어야 한다.**
     본편에 `.slot.occ{border:none!important;box-shadow:none!important}` 가 있어서
     `.slot` 쪽 테두리·그림자는 무엇을 적든 통째로 지워진다.
     예전 '초록 맥동' 이 한 번도 안 보였던 이유가 이것이다 — 클래스는 붙는데 그림이 없었다.
     (검사도 `.canuse` 가 붙었는지만 보고 있어서 못 잡았다. 지금은 실제 값을 잰다.) */
.board.packed>.slot{transition:transform .2s}
.slot.canuse{transform:translateY(calc(var(--cardw)*-0.06));
  /* ⚠ `.slot{overflow:hidden}` 이 카드 밖으로 나가는 빛을 잘라 낸다 —
     모서리에만 초록이 삐져나와 흠집처럼 보였다. 이 칸만 잘라 내지 않는다. */
  overflow:visible;
  animation:canuse 2.4s ease-in-out infinite}
.slot.canuse .tcard{
  /* ① 또렷한 초록 링(무엇인지 알아보게) ② 번짐(곁눈에 걸리게) ③ 밑그림자(떠 보이게) */
  box-shadow:0 0 0 2px rgba(110,224,138,.9),0 0 14px rgba(110,224,138,.5),
             0 5px 9px rgba(0,0,0,.6);
  animation:canuseglow 2.4s ease-in-out infinite}
@keyframes canuse{ 50%{transform:translateY(calc(var(--cardw)*-0.115))} }
@keyframes canuseglow{
  50%{box-shadow:0 0 0 2px rgba(160,255,190,1),0 0 22px rgba(110,224,138,.95),
                 0 11px 15px rgba(0,0,0,.55)}}
/* ── 손패도 같은 규칙 ────────────────────────────────────────────────
   낼 수 있는 카드(퀀텀이 되고 · 겨눌 것이 있고 · 내 턴이고 · 자리가 있는)만 뜬다.
   ⚠ 들어올리는 건 `.hcw` 가 아니라 **안쪽 카드**다 — `.hcw` 의 transform 은
     부채꼴(--rot)과 드래그(--dy/--sc)가 이미 쓰고 있어서, 거기에 애니메이션을
     얹으면 끌고 있는 동안 값이 서로를 덮어쓴다.
   ⚠ 본편 주석의 경고("손패 카드를 들어올리면 옆 카드에 가려져 있던 데가 삐져나온다")는
     **한 장만 눌러서 튀어나올 때**의 이야기다. 여기는 낼 수 있는 것들이 **함께** 뜨고
     가림은 좌우로 생기므로 그 증상이 나지 않는다. 대신 폭은 판보다 얕게 잡는다. */
.hcw.ok .tcard{
  transform:translateY(calc(var(--cardw)*-0.04));
  /* ⚠ 손패는 카드가 서로 겹쳐 있다 — 판에서 쓰던 만큼 번지게 두면 옆 장까지
     초록으로 물들어 어느 게 낼 수 있는 건지 도로 흐려진다. 링은 또렷하게, 번짐은 얕게. */
  box-shadow:0 0 0 2px rgba(110,224,138,.85),0 0 8px rgba(110,224,138,.3),
             0 4px 8px rgba(0,0,0,.55);
  animation:handbob 2.4s ease-in-out infinite}
@keyframes handbob{
  50%{transform:translateY(calc(var(--cardw)*-0.085));
      box-shadow:0 0 0 2px rgba(160,255,190,1),0 0 12px rgba(110,224,138,.5),
                 0 9px 12px rgba(0,0,0,.5)}}
/* 여덟 장이 한 몸처럼 출렁이면 그게 더 어지럽다 — 위상을 어긋내 준다 */
.hand .hcw:nth-child(3n+2) .tcard{animation-delay:-.8s}
.hand .hcw:nth-child(3n+3) .tcard{animation-delay:-1.6s}
/* 고르는 중이거나 끌고 있는 장은 멈춘다 — 신호가 둘이면 둘 다 안 읽힌다 */
.hcw.sel .tcard,.hcw.dragging .tcard{animation:none;transform:none}

/* 움직임을 싫어하는 사람에게는 **띄운 채로 멈춰 있게** 한다 — 신호는 남는다 */
@media (prefers-reduced-motion:reduce){
  .slot.canuse{animation:none;transform:translateY(calc(var(--cardw)*-0.085))}
  .slot.canuse .tcard{animation:none}
  .hcw.ok .tcard{animation:none;transform:translateY(calc(var(--cardw)*-0.06))}}

/* ⚠⚠ 본편 `.main` 은 자식을 **id 로 재배열한다**(#foeHand:0 … #hand:8).
   그래서 HTML 에 적은 순서가 화면 순서가 아니다 — 처음에 이걸 모르고 붙였다가
   상대 판·내 판·기록이 뒤죽박죽으로 섞여 나왔다.
   이 모드의 기물줄은 본편 지형줄과 **같은 자리**를 쓴다(#foeLz:2 · #myLz:6).
   order 를 안 준 요소는 0 이 되어 맨 위로 튀므로 로그에도 반드시 준다. */
#foePm{order:2} #myPm{order:6} #log{order:9}
/* ⚠ 덱 설정 화면에서는 제목줄을 걷는다 — 성권: "덱설정 유아이만 있으면 됨".
   전투 화면에는 그대로 둔다(거기선 판 위 정보가 아니라 게임 이름표 노릇을 한다).
   판 번호는 덱 화면 맨 아래 한 줄로 옮겨 붙는다 — 어떤 판이 떠 있는지는 봐야 한다. */
</style>
</head>
<body>
<div class="wrap">
  <!-- 대상 지정 딤 — .wrap 안에 있어야 .slot.pick 이 이 위로 올라온다(본편과 같다) -->
  <div class="tgtdim" id="tgtdim"></div>
  <div id="screen"></div>
</div>
<div class="zoom" id="zoom"></div>

<script src="data.js"></script>
<script>
'use strict';
const VERSION='0.33.0', BUILD='2026-09-02';
/* ⚠ 제목줄은 없다 — 성권: "배틀 유아이에서도 헤더 지우고 넓게 써".
   판 번호는 덱 화면 발치 한 줄에만 남는다(배포 확인이 이 번호에 걸려 있다). */

/* ═══════════════════════════════════════════════════════════════════════════
   0. 원작 상수
   ═══════════════════════════════════════════════════════════════════════════ */
const ELS=ETG.els, ELKO=ETG.elko;
const QCAP=75;              /* 원작(Original)의 속성별 퀀텀 상한 */
const HANDMAX=8;            /* 손패 상한 — 넘치면 뽑은 카드가 버려진다 */
const MAXCR=23, MAXPM=16;   /* 크리처 23칸 · 기물 16칸 */
const STARTHP=100;
const DECKMIN=30, DECKMAX=60, COPYMAX=6;

const CARD={};              /* code → 카드 */
ETG.cards.forEach(c=>{CARD[c.code]=c;});
const BYNAME={};
ETG.cards.forEach(c=>{ if(!c.up) BYNAME[c.en]=c; });

/* ═══════════════════════════════════════════════════════════════════════════
   0-2. 개조(MOD) — 성권이 자기 게임으로 고쳐 쓰는 층
   ───────────────────────────────────────────────────────────────────────────
   ⚠⚠ **원본 데이터는 한 글자도 안 고친다.** data.js 는 그대로 두고, 그 **위에** 덮는다.
     그래야 ① 언제든 원래대로 되돌릴 수 있고 ② 무엇을 바꿨는지 대조할 수 있고
     ③ 원작 자료를 다시 뽑아도(gen_etg.py) 고친 것이 안 날아간다.
   ⚠ 덮어쓰기는 **되돌린 뒤 다시 덮는** 방식이다(applyMod). 그래야 에디터에서
     고칠 때마다 불러도 값이 겹겹이 쌓이지 않는다.
   ═══════════════════════════════════════════════════════════════════════════ */
const MODKEY='ten-etg-mod-v1';
let MOD=(()=>{ try{ return JSON.parse(localStorage.getItem(MODKEY))||{}; }catch(e){ return {}; } })();
function saveMod(){ try{ localStorage.setItem(MODKEY,JSON.stringify(MOD)); }catch(e){} }
/* 손대기 전의 값 — '되돌리기' 와 '원래 뭐였나' 가 전부 여기서 나온다 */
const ORIG={el:null,flag:null,sk:null,card:null};
const CARDFIELDS=['ko','abilko','cost','costel','atk','hp','cast','castel'];
function snapOrig(){
  if(ORIG.el)return;                      /* 한 번만 — 두 번 뜨면 고친 값이 원본이 된다 */
  ORIG.el=ELKO.slice();
  ORIG.flag=Object.assign({},FLAGKO);
  ORIG.sk={}; for(const k in SK) ORIG.sk[k]=SK[k].d;
  ORIG.card={};
  ETG.cards.forEach(c=>{ const o={}; CARDFIELDS.forEach(f=>o[f]=c[f]); ORIG.card[c.code]=o; });
}
function resetToOrig(){
  ORIG.el.forEach((v,i)=>{ ELKO[i]=v; });
  for(const k in ORIG.flag) FLAGKO[k]=ORIG.flag[k];
  for(const k in ORIG.sk) if(SK[k]) SK[k].d=ORIG.sk[k];
  for(const code in ORIG.card){
    const c=CARD[code]; if(!c)continue;
    CARDFIELDS.forEach(f=>{ c[f]=ORIG.card[code][f]; });
    delete c.txt;
  }
}
function applyMod(){
  snapOrig(); resetToOrig();
  const m=MOD||{};
  if(m.el) for(const i in m.el){ if(m.el[i]) ELKO[+i]=m.el[i]; }
  if(m.flag) for(const k in m.flag){ if(m.flag[k]) FLAGKO[k]=m.flag[k]; }
  if(m.sk) for(const k in m.sk){ if(SK[k]&&m.sk[k]) SK[k].d=m.sk[k]; }
  if(m.card) for(const code in m.card){
    const c=CARD[+code]; if(!c)continue;
    const o=m.card[code];
    CARDFIELDS.forEach(f=>{
      if(o[f]===undefined||o[f]===null||o[f]==='')return;
      c[f]=(typeof ORIG.card[code][f]==='number')?+o[f]:o[f];
    });
    if(o.txt) c.txt=o.txt;
  }
}
/* 이 카드를 손댔나 — 에디터의 '고침' 표시와 '되돌리기' 가 쓴다 */
function modded(code){
  const o=(MOD.card||{})[code]; if(!o)return false;
  return Object.keys(o).some(k=>o[k]!==undefined&&o[k]!==null&&o[k]!=='');
}

/* ═══════════════════════════════════════════════════════════════════════════
   1. 능력 — 구현한 것만 여기 있다
   ───────────────────────────────────────────────────────────────────────────
   ⚠⚠ 여기 없는 능력을 가진 카드는 **덱에 들어가지 않는다**(playable() 참조).
      "카드는 있는데 조용히 아무 일도 안 일어난다" 를 만들지 않기 위해서다.
      빠진 목록은 docs/etg_import.md 에 그대로 적어 뒀다.

   각 항목: {t:대상종류, f:함수(g,me,src,tgt,arg), d:'한국어 설명'}
     대상종류 — null(대상없음) · 'cr'(아무 크리처) · 'foecr' · 'mycr'
                · 'pm'(아무 기물) · 'foepm' · 'any'(크리처+무기+방패+기물)
                · 'crw'(크리처 또는 무기)
   ═══════════════════════════════════════════════════════════════════════════ */
const SK={};
const def=(id,t,d,f)=>{SK[id]={t,d,f};};

/* ── 퀀텀 생산 ─────────────────────────────────────────────────────────── */
def('pillar',null,'매 턴 끝에 자기 속성 퀀텀 1을 만든다 (무색이면 무작위 3)',(g,me,s)=>{
  const n=s.charges||1, e=s.c.el;
  if(e===0) for(let i=0;i<3*n;i++) gain(me,1+rnd(12),1); else gain(me,e,n);
});
def('pend',null,'매 턴 끝에 자기 속성과 문장 속성을 번갈아 만든다',(g,me,s)=>{
  s.pendstate=!s.pendstate;
  const e=s.pendstate?(me.mark||s.c.el):s.c.el, n=s.charges||1;
  if(e===0) for(let i=0;i<3*n;i++) gain(me,1+rnd(12),1); else gain(me,e,n);
});
def('pillar1',null,'낼 때 자기 속성 퀀텀 1을 더 준다',(g,me,s)=>{
  const e=s.c.el; if(e===0) for(let i=0;i<3;i++) gain(me,1+rnd(12),1); else gain(me,e,1);
});
/* ⚠ 값이 **속성 번호**다. 카드 자신의 속성이 아니다 —
   반딧불(바람)은 [빛] 을, 정예 반딧불은 [불] 을 만든다. 카드 속성으로 읽으면 둘 다 바람이 된다. */
def('quanta',null,'매 턴 끝에 {EL} 퀀텀 1을 만든다',(g,me,s,t,a)=>{
  const e=(typeof a==='number')?a:s.c.el;
  if(e===0){ for(let i=0;i<3;i++) gain(me,1+rnd(12),1); } else gain(me,e,1);
});
def('cpower','cr','대상에게 무작위 강화 (체력 +1~6 · 공격 +1~5, 두 값은 한 번에 뽑는다)',(g,me,s,t)=>{
  if(!t)return; const b=rnd(25); buff(t,b%5+1,Math.floor(b/5)+1);
});
def('nova2',null,'12속성 퀀텀을 2씩 얻는다. 한 턴에 2장 이상 쓰면 특이점이 나온다',(g,me)=>{
  for(let e=1;e<=12;e++) gain(me,e,2);
  me.nova=(me.nova||0)+2;
  if(me.nova>=4){ const c=BYNAME['Singularity']; if(c) summon(me,c.code); me.nova=0; }
});
def('v_virusplague',null,'자신을 희생해 상대 크리처 전부에게 독을 준다',(g,me,s)=>{
  foe(me).cr.forEach(u=>{ if(u) addPoison(u,1); });
  kill(s);
});
def('nova',null,'12속성 퀀텀을 1씩 얻는다. 한 턴에 3장 이상 쓰면 특이점이 나온다',(g,me)=>{
  for(let e=1;e<=12;e++) gain(me,e,1);
  me.nova=(me.nova||0)+1;
  if(me.nova>=3&&BYNAME['Singularity']) summon(me,BYNAME['Singularity'].code);
});
def('v_relic',null,'아무 일도 하지 않는다 — 도로 손에 들어온다',(g,me,s)=>{
  if(me.hand.length<HANDMAX) me.hand.push(mk(s.c.code,me));
});
def('photosynthesis',null,'생명 퀀텀 2를 얻고, 이 능력을 다시 쓸 수 있게 된다',(g,me,s)=>{

/* ⚠⚠ 원작 카드 글은 3 이라 적혀 있는데 **openEtG 원작판 코드는 기본 2 · 강화 3** 이다

def('v_firebolt','any','불 퀀텀 10마다 피해 3씩 늘어난다 (기본 3)',(g,me,s,t,a)=>{

def('v_storm',null,'상대 크리처 전부에게 피해 {N}',(g,me,s,t,a)=>{

});
/* ⚠ 원문: "attacking creatures have a 75% chance to be **infected**" — 피해는 없다.

def('v_firewall',null,'때린 크리처에게 피해 1',(g,me,s,t)=>{ if(t) spellDmg(me,t,1); });

/* ⚠ 원문: "Frozen creatures deal **50% more** damage. Poisoned creatures **transfer poisons**."
   얼면 두 배로 때리고 있었고(1.5배다), 독은 옮기지 않았다. */
def('catapult','mycr','자기 크리처를 던진다. 체력이 클수록 큰 피해. 얼어 있으면 1.5배, 독은 상대에게 옮긴다',
  (g,me,s,t)=>{
    if(!t)return;
    /* openEtG 공식 그대로: (체력 × (얼었으면 151, 아니면 101) + 99) / (체력 + 100), 내림 */
    const hp=Math.max(0,t.hp), fz=t.frozen>0;
    const d=Math.floor((hp*(fz?151:101)+99)/(hp+100));
    const ps=t.poison>0?t.poison:0;
    kill(t);
    const f=foe(me);
    spellDmg(me,f,d);
    if(ps) f.poison=(f.poison||0)+ps;
    if(fz) f.frozen=3;               /* 언 몸을 던지면 상대도 3턴 언다 */
  });
def('v_blackhole',null,'상대 속성마다 퀀텀을 최대 3씩 빨아들이고, 빨아들인 만큼 회복한다',(g,me)=>{

def('v_plague',null,'상대 크리처 전부에게 독 1',(g,me)=>{

/* ⚠⚠ 원문: "Destroy up to 3 pillars in the **target** cluster."
   고르는 것은 **쓰는 사람**이다. 제일 큰 더미를 코드가 알아서 집어 가면

def('earthquake','foepillar','겨눈 기둥 더미에서 {N}장을 부순다',(g,me,s,t,a)=>{

def('v_scramble',null,'상대 퀀텀을 뒤섞는다',(g,me)=>{
  const f=foe(me); if(!canTouchQuanta(f))return; let n=0;

/* ⚠ 파편(Shard)들은 **내 문장이 그 속성이면 값이 커진다.** 그게 파편의 설계다 —

def('devour','devour','체력이 자기보다 작은 크리처를 먹고 +1|+1. 유독한 몸을 먹으면 자기도 중독된다',

/* ── 강화·약화 ─────────────────────────────────────────────────────────── */
def('bless','cr','대상에게 +3|+3',(g,me,s,t)=>{ buff(t,3,3); });
/* ⚠⚠ openEtG: `incrAtk(t, n)` 다음 `spelldmg(t, n)` — **최대 체력은 안 깎이고**
   지금 체력만 n 줄어든다(그래서 죽을 수도 있다). `buff(t,n,-n)` 은 최대 체력까지
   깎아서 다른 카드였다. 얼음을 푸는 것도 신판 전용이라 뺐다. */
def('rage','cr','대상에게 +{N} 공격력. 그만큼 주문 피해를 입는다',(g,me,s,t)=>{

def('v_stoneform',null,'+0|+20 을 얻고 능력을 잃는다',(g,me,s)=>{ buff(s,0,20); s.sk=[]; });
/* ⚠ 이건 **눌러서 쓰는 능력**이다(불의 정령·숲의 정령·중력자 불먹보 — 비용을 낸다).

   그래서 설명에 '언제' 를 적으면 한쪽이 반드시 거짓말이 된다 — '무엇을' 만 적고,

   성권이 "불의 정령은 공격할 때가 아니라 눌러서 쓰는 것 아니냐" 고 짚어 준 자리다. */
def('growth',null,'+{A}|+{H} 를 얻는다',(g,me,s,t,a,ar)=>{

def('v_bblood','cr','대상에게 +0|+20. 6턴 동안 공격도 능력도 못 쓴다',(g,me,s,t)=>{ buff(t,0,20); t.delayed=6; });

def('freeze','crw','대상을 {N}턴 얼린다',(g,me,s,t,a)=>{ freeze(t,a||3); });
def('v_cold',null,'때린 크리처를 확률로 3턴 얼린다',(g,me,s,t)=>{ if(t&&Math.random()<0.3) freeze(t,3); });
def('purify','cr','독을 씻어내고 오히려 독 -{N} 을 준다',(g,me,s,t,a)=>{
  const n=a||2; t.poison=Math.min((t.poison||0)-n,-n);

def('acceleration','cr','대상의 능력을 「공격할 때마다 +{N}|-1」 로 바꾼다',(g,me,s,t,a)=>{ t.sk=[{ev:'ownattack',id:'accel',arg:(a||2)}]; });
def('accel',null,'공격할 때마다 +{N}|-1',(g,me,s,t,a)=>{ buff(s,a||2,-1); });
def('adrenaline','cr','대상이 한 턴에 여러 번 공격한다. 약할수록 더 많이',(g,me,s,t)=>{ t.adren=1; });
/* ⚠ 원문: "ignores shield effects **and gains +1/+1**". +1|+1 이 빠져 있었다. */
def('momentum','cr','대상이 방패를 무시하고 +1|+1 을 얻는다',(g,me,s,t)=>{

def('gpullspell','foecr','대상이 그 편의 모든 공격을 대신 맞는다',(g,me,s,t)=>{ owner(t).gpull=t; });

def('nightmare','cr','상대 손패를 그 카드로 채우고, 채운 만큼 피해를 준다',(g,me,s,t)=>{

/* ⚠ 카드 글은 13 이지만 openEtG 원작판 코드는 **기본 10 · 강화 13** 이다. */
def('v_obsession',null,'손패가 넘쳐 이 카드가 버려지면 주인이 {N} 피해를 받는다',(g,me,s)=>{ dmgP(me,s&&s.up?13:10); });
/* ⚠⚠⚠ 완전의 파편 — 예전에는 '파편 한 장마다 +2|+2' 라고 **내가 정한 규칙**이었다.
   실제 openEtG 원작판(`Self::v_integrity`)은 **표 한 장**이다:
     · 손에 있는 파편을 전부 먹고, 속성마다 몸값이 다르다
       (대지 +4공|+1체 · 중력 +6공 · 불 +3체 · 나머지 +2|+2, 강화 파편은 +1|+1 더)
     · 시작값은 4공|1체 (파편의 파편 자신이 대지 하나로 센다)
     · **가장 많이 넣은 속성**과 **그 개수**로 능력이 정해진다 (12속성 × 6단계 표)
     · 바람 하나라도 → 비행 · 어둠 둘 → 부두, 하나 → 흡수 · 에테르 둘 → 실체 없음
       중력 둘 → 관성 · 생명 둘 → 아드레날린
   표를 옮겨 적는다. 값이 음수인 것은 발동형이 아니라 **저절로 도는 능력**이다. */
const SHARDSK=[
  ['deadalive','v_mutation','paradox','v_improve','v_scramble','antimatter'],   /* 엔트로피 */
  ['poison','growth','growth','poison','aflatoxin','poison'],                    /* 죽음 */
  ['devour','devour','devour','devour','devour','v_blackhole'],                  /* 중력 */
  ['burrow','v_stoneform','guard','guard','v_bblood','v_bblood'],                /* 대지 */
  ['growth','adrenaline','adrenaline','adrenaline','adrenaline','mitosis'],      /* 생명 */
  ['growth','growth','fiery','destroy','destroy','rage'],                        /* 불 */
  ['steam','steam','freeze','freeze','v_nymph','v_nymph'],                       /* 물 */
  ['mend','v_endow','v_endow','luciferin','luciferin','luciferin'],              /* 빛 */
  ['summon','summon','snipe','dive','gas','gas'],                                /* 바람 */
  ['summon','summon','deja','deja','precognition','precognition'],               /* 시간 */
  ['vampire','vampire','vampire','vampire','liquid','v_steal'],                  /* 어둠 */
  ['lobotomize','lobotomize','lobotomize','quint','quint','quint']];             /* 에테르 */
/* 표 안에서 값이 붙는 자리 — 위 표는 id 만 적었으므로 여기서 값을 준다 */
const SHARDARG={
  '2:0':1,'2:3':1,'2:5':2,                       /* 죽음: 독 1 · 1 · 2 */
  '2:1':[1,1],'2:2':[1,1],                       /* 죽음: +1|+1 */
  '5:0':[2,2],                                   /* 생명: +2|+2 */
  '6:0':[2,0],'6:1':[2,0],                       /* 불: +2|+0 */
  '7:2':3,'7:3':3,                               /* 물: 3턴 얼림 */
  '9:0':1908,'9:1':1908,                         /* 바람: 반딧불 */
  '10:0':2010,'10:1':2010};                      /* 시간: 스카라브 */
/* 발동 비용. 음수는 '저절로 도는 자리' — −4 죽을 때 · −3 지속 · −2 때릴 때 · −1 매 턴 */
const SHARDCOST={deadalive:1,v_mutation:2,paradox:2,v_improve:2,v_scramble:-2,antimatter:4,
  poison1:1,poisonN:-2,growth11:-4,aflatoxin:2,devour:3,v_blackhole:4,growth22:2,
  adrenaline:2,mitosis:4,growth20:1,fiery:-3,destroy:3,rage:2,steam:2,freeze:2,v_nymph:4,
  mend:1,v_endow:2,luciferin:4,summon:2,snipe:2,dive:2,gas:2,deja:4,precognition:2,
  vampire:-2,liquid:2,v_steal:3,lobotomize:2,quint:2,burrow:1,v_stoneform:1,guard:1,v_bblood:2};
const SHARDEV={'-4':'death','-3':'buff','-2':'hit','-1':'ownattack'};
def('v_integrity',null,'손에 있는 파편을 모두 합쳐 골렘 하나를 만든다. 가장 많이 넣은 속성이 골렘의 능력을 정한다',
  (g,me,s)=>{
    const gc=BYNAME['Shard Golem']; if(!gc)return;
    const tally=new Array(13).fill(0);
    tally[4]=1;                                   /* 파편의 파편 자신이 대지 하나 */
    let hp=(s&&s.up)?2:1, atk=hp+3;
    const keep=[];
    me.hand.forEach(x=>{
      if(!/^Shard of /.test(x.c.en)){ keep.push(x); return; }
      const e=x.c.el; tally[e]++;
      const b=(e===4)?[4,1]:(e===3)?[6,0]:(e===6)?[0,3]:[2,2];
      atk+=b[0]; hp+=b[1];
      if(x.c.up){ atk++; hp++; }
    });
    if(keep.length===me.hand.length)return;       /* 파편이 하나도 없으면 아무 일도 없다 */
    me.hand=keep;
    let pick=4, max=0;
    for(let e=1;e<=12;e++) if(tally[e]>max){ max=tally[e]; pick=e; }
    const step=Math.min(max-1,5);
    const id=SHARDSK[pick-1][step];
    const arg=SHARDARG[pick+':'+step];
    const u=summon(me,gc.code);
    if(!u)return;
    u.atk=atk; u.hp=u.maxhp=hp;
    /* 능력을 어디에 다는가 — 비용이 음수면 저절로 도는 자리다 */
    let key=id;
    if(id==='poison') key=(step===0)?'poison1':'poisonN';
    if(id==='growth') key=(String(arg)==='1,1')?'growth11':(String(arg)==='2,2'?'growth22':'growth20');
    const cost=SHARDCOST[key]!==undefined?SHARDCOST[key]:0;
    const sk={ev:'cast',id,arg:Array.isArray(arg)?arg[0]:(arg===undefined?null:arg),
              args:Array.isArray(arg)?arg:(arg===undefined?[]:[arg])};
    if(cost<0){ sk.ev=SHARDEV[String(cost)]; u.sk=[sk]; }
    else { u.sk=[sk]; u.cast=cost; u.castel=4; }
    if(tally[9]>0&&!u.flags.includes('airborne')) u.flags.push('airborne');
    if(tally[11]>1){ if(!u.flags.includes('voodoo')) u.flags.push('voodoo'); }
    else if(tally[11]>0) u.sk.push({ev:'ownattack',id:'siphon',arg:null,args:[]});
    if(tally[12]>1&&!u.flags.includes('immaterial')) u.flags.push('immaterial');
    if(tally[3]>1&&!u.flags.includes('momentum')) u.flags.push('momentum');
    if(tally[5]>1) u.adren=1;
    log(`${ELKO[pick]} 골렘 ${atk}|${hp}`,'a');
  });

   **크리처가 아니라 내 최대 체력**이다. 크리처에 +0|+N 을 주고 있었다 — 대상이 아예 틀렸다.
   openEtG 원작판은 거기서 이 카드의 비용을 한 번 더 뺀다(vanilla 전용 보정). */
def('sskin',null,'남은 대지 퀀텀에서 이 카드 비용을 뺀 만큼 내 최대 체력이 늘어난다',(g,me,s)=>{

/* ⚠⚠ 범람 — 원문: "Kill any creature along the edges of the field.
   Water and neutral creatures are immune. Absorb [물] per turn."
   표에는 유지 비용(upkeep)만 잡혀 있어서, **가장자리를 쓸어버리는 본체가 통째로 없었다.**
   물 기둥 하나 값을 매 턴 내면서 아무 일도 안 하는 카드였다. */
/* openEtG 원작판(game.rs 의 공격 차례): `i > floodingIndex && element != Water` 면 죽는다.
   floodingIndex 는 5 라서 **여섯 칸째(0부터 세어 6번 자리)부터** 잠긴다.
   @지어냄: 원작은 범람을 깐 **첫 턴만 일곱 칸**을 봐준다(floodingIndex 7). 우리는 늘 여섯
   칸으로 뒀다 — 첫 턴만 다른 규칙은 판에서 읽어 낼 방법이 없어서 혼란만 준다고 봤다. */
const EDGE=6;
def('flood',null,'매 턴, 여섯 칸째부터의 크리처를 죽인다. 물 속성 크리처는 무사하다',(g)=>{
  [g.me,g.ai].forEach(p=>{
    p.cr.forEach((u,i)=>{
      if(!u||i<EDGE)return;
      if(u.c.el===7)return;            /* ⚠ '수생 표식' 이 아니라 **물 속성** 이다(원작판) */
      if(u.flags.includes('immaterial'))return;
      log(`${u.c.ko} 이(가) 물에 잠겼다`,'c');
      kill(u);
    });
  });
});
/* ⚠⚠⚠ 인내의 파편 — 카드 글("+1/+0; 물 +2/+2, 범람하면 +4/+4")을 보고 **한 번 붙는
   고정 강화**로 만들어 뒀는데, openEtG 원작판(game.rs 공격 차례)은 전혀 다르다:
     매 턴 **내 크리처를 한 턴 묶고**(그래서 공격하지 않는다) **+2|+2 씩 쌓아 준다.**
     범람한 칸의 물 크리처는 **+5|+5**.
   즉 이건 '버티면 자란다' 는 카드다. 고정 강화로 두면 카드의 뜻이 통째로 사라진다.
   그래서 aura(syncPatience) 를 걷고, 턴마다 도는 것으로 옮겼다. */
function patienceTick(p){
  if(!patienceOn(p))return;
  const fl=floodOn(p);
  p.cr.forEach((u,i)=>{
    if(!u)return;
    const n=(fl&&i>=EDGE&&u.c.el===7)?5:2;
    buff(u,n,n);
    if(!u.delayed) u.delayed=1;          /* 그래서 이번 턴은 안 때린다 */
  });
}
function syncPatience(p){}                /* (더는 쓰지 않는다 — 위 tick 이 대신한다) */
/* 땅거미·개기일식 — 야행성 크리처의 체력 몫. 공격력은 trueAtk 가 그때그때 센다. */
function syncNightfall(p){
  const n=nightfallArgs(p).hp;
  p.cr.forEach(u=>{
    if(!u)return;
    const want=u.flags.includes('nocturnal')?n:0, cur=u.nf||0;
    if(cur!==want){ u.nf=want; buff(u,0,want-cur); }
  });
}
/* ⚠⚠ 스카라브 — "base HP is equal to the number of Scarabs you control, including this one".
   나는 이걸 **공격력**에 걸어 두고 있었다. 공격력은 카드에 적힌 2(정예 3)가 맞고,
   변하는 것은 체력이다. */
function syncSwarm(p){
  const n=p.cr.filter(x=>x&&x.sk.some(k=>k.id==='v_swarmhp')).length;
  p.cr.forEach(u=>{
    if(!u||!u.sk.some(k=>k.id==='v_swarmhp'))return;
    /* '기본 체력이 스카라브 수' 다 — 더하는 게 아니라 **덮어쓰는** 값이다.
       카드에 적힌 체력을 시작점으로 잡고 그 차이만큼만 움직인다. */
    const want=Math.max(1,n), cur=(u.swarm===undefined)?u.c.hp:u.swarm;
    if(cur!==want){ u.swarm=want; buff(u,0,want-cur); }
  });
}
function syncAuras(){
  if(!(G&&G.me&&G.ai))return;
  [G.me,G.ai].forEach(p=>{ syncPatience(p); syncNightfall(p); syncSwarm(p); });
}

def('luciferin',null,'체력을 10 회복하고, 능력이 없는 내 크리처 전부가 발광을 얻는다 (매 턴 빛 1)',

  });

/* ⚠⚠ 예전에 여기 넷을 **내가 지어내 놓고** 성권이 물을 때까지 말하지 않았다.
   원작 카드 글("This object is not defined and not well-behaved")과 openEtG 의
   능력 설명("That was a bad idea")이 둘 다 아무 말도 안 해서 없는 줄 알았는데,
   **구현은 openEtG 소스(src/rs/src/skill.rs)에 그대로 있었다.** 그걸 옮긴다. */
def('singularity',null,
  '공격력이 양수가 되면 도로 음수로 뒤집힌다. 그 밖에는 매 턴 하나가 일어난다 — '
 +'상대가 모든 속성 퀀텀 +1 · 흡혈로 바뀜 · 실체 없음 · 체력이 늘고 공격력이 더 내려감 · '
 +'아드레날린 · 자기 복제',
  (g,me,s)=>{
    /* 공격력이 양수면 그것부터 되돌린다 — 반물질로 고쳐 쓰지 못하게 하는 장치다 */
    if(trueAtk(s)>0){ s.atk-=trueAtk(s)*2; return; }
    let r=rnd(12); if(r>9) r=0;
    if(r===0){ const f=foe(me); for(let e=1;e<=12;e++) gain(f,e,1); }
    else if(r<3){ s.sk=s.sk.filter(k=>k.ev!=='hit').concat([{ev:'hit',id:'vampire',arg:null,args:[]}]); }
    else if(r<5){ if(!s.flags.includes('immaterial')) s.flags.push('immaterial'); }
    else if(r<7){ const b=rnd(25); buff(s,-(1+b%5),Math.floor(b/5)+1); }
    else if(r<9){ s.adren=1; }
    else { SK.parallel.f(g,me,s,s); }
  });

  me.gpull=u;                      /* ⚠ 원문에 중력 견인도 있다 — 합친 몸이 전부 대신 맞는다 */
});
