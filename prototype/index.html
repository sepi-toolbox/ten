       간이 지형은 자원이 모자랄 때 쓰이고 지형 상한을 무시한다(임시라서). */
    burnRightLand(p,name);
    /* 수정구의 힘 — **뒤집힌 채** 깔린다. 다음 내 턴 리필 때 앞면이 되어 한 번 쓰이고,
       그 다음 리필 때 사라진다. 지형 상한(MANACAP)을 무시한다 — 임시이기 때문이다. */
    /* ⚠ **'만든다' 에 붙여서** 읽는다. 그냥 /지형 (\d+)장/ 으로 두면 산불의
       "내 지형 맨 오른쪽 1장을 부수고" 를 먼저 집어서 **부술 지형을 만들어 버린다**
       (실제로 간이 지형이 한 장도 안 깔렸다). 이름은 cardBefore 와 같은 수로 찾는다. */
    const m=rule(name).match(/([가-힣A-Za-z][가-힣A-Za-z ]*?) (\d+)장을 만든다/);
    if(!m){ log(`${who} ${name} — 만들 지형을 못 찾았다`,'t'); return; }
    const land=(()=>{ const w=m[1].trim().split(/\s+/);
      for(let i=Math.max(0,w.length-3);i<w.length;i++){
        const nm=w.slice(i).join(' '); if(LANDS[nm])return nm; }
      return ''; })();
    const k=+m[2];
    if(!LANDS[land]){ log(`${who} ${name} — ${land} 지형이 없다`,'t'); return; }
    for(let i=0;i<k;i++)putLand(p,land,{used:true});
    log(`${who} ${name} — ${land} ${k}장 (뒤집힌 채로)`,'t');
  }

/* 개체 하나를 **손으로 되돌린다.** 소환체도 이제 진짜 카드라 그대로 손에 잡힌다

function toHand(side,idx){
  const u=S[side].board[idx]; if(!u||u.kind!=='cr'||!u.insts.length)return false;
  /* ⚠ 빼앗은 몸은 **원래 주인의 손**으로 간다(성권 결정) — 되돌리는 통로도 여기 하나다 */
  const own=ownerOf(side,u);
  /* 연출은 **지우기 전에** 뜬다 — 슬롯이 사라지면 뜰 모습이 없다 */
  toHandFx(side,idx,own);
  u.insts.shift();
  if(POOL[u.name]&&S[own].hand.length<8){
    S[own].hand.push(u.name);
    /* 되돌아간 카드는 **상대 손에서도 앞면**이다(성권 결정) — 판에서 보고 있던 몸이라
       어느 카드가 손으로 갔는지는 원래 양쪽이 다 안다. 환류와 같은 장치를 쓴다. */
    S[own].shown=S[own].shown||{};
    S[own].shown[u.name]=(S[own].shown[u.name]||0)+1;
  }
  if(!u.insts.length){
    S[side].board.splice(idx,1);
  }
  return true;
}
/* 환류로 **제 발로** 손에 돌아온 카드(소멸 → 손). 문어 다리가 여기에 반응한다.
   ⚠ 밀물·정신분열 같은 강제 바운스는 환류가 아니다 — 그쪽은 이 함수를 안 부른다. */
function echoToHand(side,name){
  if(POOL[name]&&S[side].hand.length<8){
    S[side].hand.push(name);
    /* 환류로 **생겨난** 장은 일렁이며 나타난다.
       ⚠ 상대 것도 **앞면으로** 보여 준다(성권 결정) — 무엇이 돌아갔는지는 원래 양쪽이
         다 아는 정보다(판 위에서 죽는 걸 보고 있었다). 뒷면으로 덮으면 없는 안개를 만든다. */
    /* ⚠⚠ **번호가 아니라 이름으로 표시한다.** 주문 환류는 `pay()` 안에서 손패 맨 뒤에
       카드를 얹고, 부르는 쪽은 **그 뒤에** 쓴 카드를 splice 로 뺀다 — 번호가 한 칸 밀려
       일렁임이 엉뚱한 자리(또는 빈칸)를 가리켰다. 실제로 투명화의 환류 연출이 안 떴다.
       같은 이름의 **맨 뒤 장**이 방금 생긴 장이다(환류는 항상 뒤에 얹는다). */
    S[side].echoNew=name;
    S[side].shown=S[side].shown||{};
    S[side].shown[name]=(S[side].shown[name]||0)+1;
    setTimeout(()=>{ if(S[side])S[side].echoNew=null; render(); },Math.round(800/SPEED));
  }
  fireEnch(side,'echo',{name});
}
function resolveOnFoe(p,name,idx){
  const foe=p==='me'?'ai':'me', c=POOL[name], B=S[foe].board, u=B[idx];
  const who=p==='me'?'나':'상대';
  if(!u) return false;

    if(u.kind!=='en') return false;
    const b=u.charge; u.charge=Math.max(0,u.charge-c.v);
    log(`${who} ${name} → ${u.name} 충전 ${b}→${u.charge}`,'e');
    return true;
  }
  if(u.kind!=='cr'||!u.insts.length) return false;
  if(c.mode==='dmg'&&!spellHits(p,u)){       /* 세이렌 — 겨눠도 안 맞는다 */
    log(`${who} ${name} → ${u.name} — 주문 피해 무효`,'g');
    return true;
  }
  /* 노화 — 피해가 아니라 ATK 을 못 박는다. 몸은 그대로 남는다. */
  const ag=rule(name).match(/크리처 1개체의 ATK 을 (\d+) 로 만든다/);

    const mine=[]; S[p].board.forEach((x,i)=>{ if(sacOK(x)&&!x.token)mine.push(i); });
    if(!mine.length){ log(`${who} ${name} — 던질 아군이 없다`,'t'); return true; }
    const j=mine[rnd(mine.length)], src=S[p].board[j];
    const v=Math.max(0,src.insts[0].hp)*(+th[1]), nm=src.name;
    src.insts.forEach(i=>{i.hp=0;}); cleanup(p);
    if(!u.insts.length){ log(`${who} ${name} — ${nm} 을(를) 던졌지만 대상이 이미 사라졌다`,'t'); return true; }
    if(!spellHits(p,u)){ log(`${who} ${name} → ${u.name} — 주문 피해 무효`,'g'); return true; }
    const b=u.insts[0].hp; hurt(u,u.insts[0],v);
    log(`${who} ${name} — ${nm}(HP ${v/(+th[1])}) 을 던져 ${u.name} ${b}→${Math.max(0,u.insts[0].hp)}`,'a');
    return true;
  }
  if(c.mode==='dmg'){
    const v=dmgVal(p,name,u), b=u.insts[0].hp;
    if(ignoresHard(name))hurtRaw(u,u.insts[0],v); else hurt(u,u.insts[0],v);
    log(`${who} ${name} → ${u.name} ${b}→${Math.max(0,u.insts[0].hp)}`
        +`${v!==c.v?` (조건 충족 ${v})`:''}${ignoresHard(name)?' · 경화 무시':''}`,'a');
    if(u.insts[0].hp<=0)log(`  ${u.name} 1개체 파괴`,'a');
  }else if(c.mode==='kill'){
    /* 사신의 수확 — 지금 죽이지 않는다. **다음 내 턴 시작**에 죽는다(startTurn 이 본다).
       그동안 상대는 그 몸을 쓸 수 있다 — 그게 즉시 요격보다 싼 이유다. */

      u.doom=(u.doom||0)+1; u.doomBy=p;
      log(`${who} ${name} → ${u.name} 에 사신의 표식 (다음 ${who} 턴 시작에 파괴)`,'a');
      return true;
    }
    u.insts[0].hp=0;
    log(`${who} ${name} → ${u.name} 1개체 파괴`,'a');
    spellSelfDmg(p,name);                    /* 소이탄 — 내 크리처 전체 2 피해 */
    spellHeal(p,name,1);                     /* 심판 — 내 HP 8 회복 */
    const bf=parseBuff(rule(name).split('·').slice(1).join('·'));  /* 포식 — 내 크리처 1개체 +2/+2 */
    if(bf.a||bf.h){
      let j=-1,bv=-1;
      S[p].board.forEach((x,i)=>{ if(x&&x.kind==='cr'&&x.insts.length){
        const v=x.a*10+x.insts[0].hp; if(v>bv){bv=v;j=i;} } });

}
function resolveOnMine(p,name,idx){

  }

    const free=freeLands(p).filter(l=>l.els.includes('fire'));
    let g=0; free.forEach(l=>{ l.used=true; l.justUsed=true; g+=landN(l); });
    u.a+=g; u.insts.forEach(i=>{i.hp+=g;i.mh+=g;});
    log(`${who} ${name} → ${u.name} +${g}/+${g} (남은 불 자원 ${g})`,'g'); return true;
  }
  if(/파괴하고 그 ATK 만큼 내 크리처 전체 강화/.test(c.d||'')){ /* 피의 문신 */
    const g=u.a;
    u.insts.forEach(i=>{i.hp=0;}); cleanup(p);
    let k=0;
    S[p].board.forEach(x=>{ if(!x||x.kind!=='cr'||!x.insts.length)return;
      x.a+=g; x.insts.forEach(i=>{i.hp+=g;i.mh+=g;}); k++; });
    log(`${who} ${name} — ${u.name}(ATK ${g}) 을 제물로 · 아군 ${k}종 +${g}/+${g}`,'a');
    return true;

     ⚠ 지형·스펠·인챈트는 능력치가 없다 → 0/0. 카드가 없어도 0/0.
     ⚠ 이 주문은 이미 손에서 빠진 뒤에 해결된다 — 그래서 자기 자신을 보지 않는다. */
  if(/내 손 맨 왼쪽 카드의 능력치를/.test(c.d||'')){

    return true;

    return true;
  }

     ⚠ 이 덱에서는 손해가 아니다 — 단말마를 터뜨리는 통로이기도 하다. */
  if(/내 크리처 1개체를 파괴하고 그 HP 만큼 내 HP 회복/.test(c.d||'')){
    const g=Math.max(0,u.insts[0].hp), b=S[p].hp;
    u.insts.forEach(i=>{i.hp=0;}); cleanup(p);
    S[p].hp=Math.min(S[p].maxhp||MAXHP,S[p].hp+g);
    log(`${who} ${name} — ${u.name}(HP ${g}) 을 갈아 HP ${b}→${S[p].hp}`,'g');

    u.insts.forEach(i=>{i.hp=0;});
    log(`${who} ${name} → ${u.name} 을(를) 제물로`,'a');
    cleanup(p);
    const k=drawCount(c.v);
    for(let i=0;i<k;i++)draw(p);
    log(`  카드 ${k}장`,'t');
    return true;
  }
  const gr=grantOf(c.d);
  if(gr.burn){ u.burn=(u.burn||0)+gr.burn;   /* 연소는 **더한다** — 심지를 하나 더 붙이는 것 */
    log(`  ${u.name} 연소 ${gr.burn} 부여 (합계 ${u.burn})`,'a'); }
  if(gr.hard){ u.hard=(u.hard||0)+gr.hard; log(`  ${u.name} 경화 ${gr.hard} 부여 (합계 ${u.hard})`,'g'); }
  if(gr.ward){ u.ward=true; log(`  ${u.name} 가호 부여`,'g'); }
  if(gr.veil){ grantVeil(u); log(`  ${u.name} 면역 부여 — HP 가 줄지 않는다`,'g'); }
  /* ⚠ 면역과 수호는 양립하지 않는다 — 면역이 이미 붙어 있으면 수호를 얹지 않는다
     (grantVeil 이 수호를 푸는데, 여기서 도로 켜면 규칙이 어긋난다). */
  if(gr.guard&&!u.veil){ u.g=true; log(`  ${u.name} 수호 부여`,'g'); }
  if(gr.echo){ u.echo=true; log(`  ${u.name} 환류 부여 — 소멸하면 손으로 돌아온다`,'g'); }
  if(!b.a&&!b.h&&!gr.burn&&!gr.hard&&!gr.ward&&!gr.veil&&!gr.guard&&!gr.echo)
    log(`${who} ${name} → ${u.name} (부여 — 규칙 미구현)`,'t');
  return true;
}
/* 규칙문에서 '부여' 되는 키워드를 뽑는다. 예: "+5/+0 · 연소 3 부여" · "경화 1을 부여한다" */
function grantOf(d){
  const t=d||'';
  return {burn:(t.match(/연소\s*(\d+)\s*(을|를)?\s*부여/)||[])[1]|0,
          hard:(t.match(/경화\s*(\d+)\s*(을|를)?\s*부여/)||[])[1]|0,
          ward:/가호를?\s*부여/.test(t),
          veil:/면역을?\s*부여/.test(t),
          guard:/수호를?\s*부여/.test(t),      /* 얼음 방패 · 눈보라 */
          echo:/환류를?\s*부여/.test(t)};      /* 허영 */
}
/* 덱에서 **인쇄 비용이 가장 높은 크리처**를 하나 꺼내 판에 세운다(일대일 대련).
   ⚠ costOf 가 아니라 인쇄값(c.c)으로 고른다 — 개전은 아직 아무것도 안 죽은 시점이라
      깎이는 비용(용암거인)이 의미가 없고, '제일 비싼 카드' 라는 문구 그대로여야 한다. */

  return true;

  if(/이번 판에서 소멸한 내 크리처 1개체를 무작위로 소환/.test(c.d||'')){
    const g=(S[p].grave||[]).filter(n=>POOL[n]);
    if(!g.length){ log(`${who} ${name} — 무덤이 비어 있다`,'t'); return false; }
    if(!boardRoom(p)){ log(`${who} ${name} — 자리가 없다`,'t'); return false; }
    const n=g[rnd(g.length)], at=S[p].board.length;
    placeCreature(p,n,at); onSummon(p,n,at);
    log(`${who} ${name} — 무덤에서 ${n} 이(가) 일어난다`,'g');
    return true;
  }
  /* 해골쌓기 — **이번 판에서 죽은 크리처 수**가 곧 그 몸의 HP 다(양쪽을 다 센다). */
  const sk=(c.d||'').match(/이번 판에서 소멸한 크리처 수만큼 HP 를 가진 수호 크리처 1개체를 소환/);
  if(sk){
    if(!boardRoom(p)){ log(`${who} ${name} — 자리가 없다`,'t'); return false; }
    const hp=Math.max(1,S.dead||0), at=S[p].board.length;
    placeCreature(p,'해골탑',at);
    const u=S[p].board[at];
    u.insts.forEach(i=>{ i.hp=hp; i.mh=hp; });
    onSummon(p,'해골탑',at);
    log(`${who} ${name} — 해골탑 0/${hp} (이번 판 소멸 ${S.dead||0}체)`,'g');
    return true;
  }
  /* 일대일 대련 — 양쪽이 **각자 자기 덱에서** 제일 비싼 몸을 하나씩 꺼낸다 */
  if(/양쪽 모두 자기 덱에서 가장 비용이 높은 크리처/.test(c.d||'')){
    ['me','ai'].forEach(q=>summonBiggestFromDeck(q,name));
    return true;
  }
  /* 지옥문 소환 — **내 크리처를 전부 갈아** 그 수만큼 부른다. 개수가 판에서 나온다. */
  let sacked=0;
  if(/내 크리처를 전부 파괴하고 그 수만큼/.test(c.d||'')){
    S[p].board.forEach(u=>{ if(u&&u.kind==='cr'&&u.insts.length){
      sacked+=u.insts.length; u.insts.forEach(i=>{i.hp=0;}); } });
    if(sacked){ log(`${who} ${name} — 내 크리처 ${sacked}개체를 제물로`,'a'); cleanup(p); }
    else log(`${who} ${name} — 제물로 삼을 크리처가 없다`,'t');
  }
  let cnt=sacked||t.n;
  if(cnt===-1){                              /* 화산 폭발 — 빈 칸을 남기지 않는다 */
    cnt=SLOTS-S[p].board.filter(Boolean).length;
    if(cnt<=0)log(`${who} ${name} — 빈 슬롯이 없다`,'t');
  }
  if(cnt===null){                            /* 정령의 불꽃 — 패를 통째로 몸으로 바꾼다 */
    /* ⚠ 이 카드 자신은 이미 손에서 빠진 뒤여야 한다(부르는 쪽이 먼저 뺀다). */
    const h=S[p].hand; cnt=h.length;
    if(cnt)log(`${who} ${name} — 패 ${cnt}장을 버린다 (${h.join(' · ')})`,'a');
    else   log(`${who} ${name} — 버릴 패가 없다`,'t');
    h.forEach(n=>{ if((POOL[n]||{}).k==='sp')burnSpell(p,n); });   /* 버린 주문도 소각 더미로 */
    h.length=0;
  }
  const gr=grantOf(c.d);                     /* "· 연소 1 부여" — 나오는 토큰에 심는다 */
  let made=0;
  const born=[];
  for(let k=0;k<cnt;k++){
    if(!boardRoom(p))break;
    /* ⚠ 소환물은 **언제나 판의 오른쪽 끝**에 붙는다(모든 소환 카드 공통 규칙).
       떨어뜨린 자리에 끼워 넣으면 카드마다 결과가 달라져 예측이 안 된다. */
    const at=S[p].board.length;
    if(t.real){
      placeCreature(p,t.real,at);
      const nu=S[p].board[at];
      /* ⚠ 토큰만 부여를 받던 시절의 흔적 — 진짜 카드로 바꾼 뒤 여기를 빠뜨려
         정령의 불꽃의 용암 정령이 연소를 못 받고 안 죽었다. */
      if(nu&&gr.burn){ nu.burn=(nu.burn||0)+gr.burn; nu.kw=(nu.kw==='—'?'':nu.kw+' · ')+'연소 '+gr.burn; }
      if(nu&&gr.hard)nu.hard=(nu.hard||0)+gr.hard;
      if(nu&&gr.ward)nu.ward=true;
      born.push(at);
    }
    else{
      const tk=mkToken(t.nm,t.a,t.h);
      if(gr.burn){ tk.burn=gr.burn; tk.kw='토큰 · 연소 '+gr.burn; }
      if(gr.hard){ tk.hard=gr.hard; }
      if(gr.ward){ tk.ward=true; }
      S[p].board.splice(at,0,tk);
    }
    made++;
  }
  log(`${who} ${name} — ${t.real||`${t.a}/${t.h} ${t.nm}`} ${made}개체 소환`
      +(gr.burn?` (연소 ${gr.burn})`:''),'g');
  /* 진짜 카드로 나온 것은 소환 판정도 정식으로 받는다(대가·축복·인챈트 트리거) */
  born.forEach(i=>onSummon(p,t.real,i));
  /* "· 상대 1개체를 손으로" — 밀물 키워드와 같은 장치를 쓴다(코스트 제한은 없다) */
  if(/상대 1개체를 손으로/.test(rule(name))){
    const list=tideTargets(p,99);
    if(!list.length)log(`  ${name} — 되돌릴 상대가 없다`,'t');
    else if(p==='ai'){
      let best=list[0],bv=-1;
      list.forEach(i=>{ const x=S.me.board[i]; const v=x.a*10+x.insts[0].hp; if(v>bv){bv=v;best=i;} });
      tideBounce(p,best,(POOL[name]||{}).el);
    }else{ S.tide={p,idx:null,cost:99,list,el:(POOL[name]||{}).el};
      toast('손으로 되돌릴 상대 크리처를 고르세요'); }
  }
  /* 패를 버리는 카드는 **버린 것 자체가 발동**이다 — 자리가 없어 0개체여도 무르지 않는다 */
  return made>0||t.n===null;
}

/* ============ 입력 ============ */
/* 손패 카드를 '탭해서 고르는' 흐름은 없앴다 — 카드는 **손패 밖으로 끌어야만** 나간다.
   (탭은 이제 아무것도 하지 않고, 길게 누르면 확대만 된다.)
   clickSlot 은 남는다 — 대상 지정(타게팅)이 유효 대상을 확정할 때 이걸 부른다. */
async function clickSlot(side,idx){
  if(S.over||S.busy||S.active!=='me')return;
  /* 마인드 플레어 — **양쪽 판** 어디든 고른다. 밀물보다 먼저 잡는다(반드시 골라야 끝난다). */
  if(S.pick){
    const hit=S.pick.list.find(t=>t.side===side&&t.idx===idx);
    if(hit){ const act=S.pick.act; S.pick=null; act(side,idx);
      cleanup('me'); cleanup('ai'); render(); }
    return;
  }
  if(S.mind){
    const hit=S.mind.list.find(t=>t.side===side&&t.idx===idx);
    if(hit){ mindWipe(side,idx); S.mind=null; cleanup(side); render(); }
    else toast('빛나는 크리처 중 하나를 고르세요');
    return;
  }
  /* 밀물 — 소환 직후 대상 지정. 다른 어떤 조작보다 먼저 잡는다. */
  if(S.tide){
    if(side==='ai'&&S.tide.list.includes(idx))tideBounce('me',idx,S.tide.el);
    else toast(`${S.tide.cost}코 이하 상대 크리처만 고를 수 있습니다`);
    return;
  }
  if(S.rush){
    if(side==='me'&&S.rush.list.includes(idx))rushAttack('me',idx);
    else toast('지금 공격할 수 있는 내 크리처만 고를 수 있습니다');
    return;
  }
  if(S.sel===null)return;
  const n=S.me.hand[S.sel],c=POOL[n];
  if(S.mode==='place'&&side==='me'){
    /* idx 는 '몇 번째에 끼울지'다 — 그 자리에 카드가 있어도 밀어 넣는다 */
    if(!placeCreature('me',n,idx))return;
    log(`나 ${n} 소환 [${Math.min(idx,S.me.board.length)+1}번째]`,c.g?'g':(c.f?'f':''));
    onSummon('me',n,idx);
    S.spawn={side:'me',idx};setTimeout(()=>{S.spawn=null;},520/SPEED);
  }else if(S.mode==='ench'&&side==='me'){
    if(!boardRoom('me'))return;
    const at=Math.max(0,Math.min(S.me.board.length,idx));
    S.me.board.splice(at,0,{name:n,kind:'en',v:c.v,charge:c.ch});
    log(`나 ${n} 배치 [${at+1}번째] 충전 ${c.ch}`,'e');
    S.spawn={side:'me',idx};setTimeout(()=>{S.spawn=null;},520/SPEED);
  }else if(S.mode==='summon'&&side==='me'){
    if(S.me.board[idx])return;
    /* ⚠ 손패를 **먼저** 뺀다 — 정령의 불꽃은 남은 패의 장수를 세기 때문에
       자기 자신이 손에 남아 있으면 하나 더 세고, 뒤늦게 splice 하면 자리가 어긋난다.
       못 내면 원래 자리에 되돌려 놓는다. */
    const back=S.sel; S.me.hand.splice(back,1);
    if(!resolveSummon('me',n,idx)){ S.me.hand.splice(back,0,n); return; }
    pay('me',n); S.sel=null; S.mode=null;
    S.spawn={side:'me',idx};setTimeout(()=>{S.spawn=null;},520/SPEED);
    render(); return;
  }else if(S.mode==='mine'&&side==='me'){
    if(!resolveOnMine('me',n,idx))return;
  }else if(S.mode==='target'&&side==='ai'&&idx===FACE){
    /* 본체에 꽂는다 — 크리처를 거치지 않는다. faceDmg 를 지나므로 무효화 장치도 그대로 먹는다. */
    S.busy=true; render();
    await castBolt('me',boltTarget('ai',FACE),n);
    S.busy=false;
    const v=dmgVal('me',n,null);
    const dv=faceDmg('ai',v);
    log(`나 ${n} → 상대 본체 ${dv} 피해 · HP ${Math.max(0,S.ai.hp)}`,'a');
    pay('me',n);S.me.hand.splice(S.sel,1);S.sel=null;S.mode=null;
    S.busy=true; render();
    phaseCard(n);
    await sleep(500);
    S.busy=false; render();
    checkEnd();
    return;
  }else if(S.mode==='target'&&side==='ai'){
    const u=S.ai.board[idx];
    if(!u)return;
    const hpBefore=(u.kind==='cr'&&u.insts[0])?u.insts[0].hp:0;
    /* 발사체가 먼저 날아가 맞고, 그 다음에 피해가 들어간다 — 순서를 뒤집으면
       맞고 나서 날아가는 것처럼 보인다. */
    S.busy=true; render();
    await castBolt('me',boltTarget('ai',idx),n);
    S.busy=false;
    if(!resolveOnFoe('me',n,idx))return;
    const dead=u.kind==='cr'&&u.insts[0]&&u.insts[0].hp<=0;
    pay('me',n);S.me.hand.splice(S.sel,1);S.sel=null;S.mode=null;
    S.busy=true;
    S.fx={tSide:'ai',tIdx:idx,dmg:c.mode==='dmg'?c.v:0,struck:true,
          kill:dead?`${u.name} 파괴`:null};
    render();
    /* ⚠⚠ **맞는 그 순간에 부서진다.** 예전에는 섬광 + '파괴' 라벨을 620ms 보여 준 **뒤에야**
       cleanup 이 돌아 카드가 깨졌다 — 맞을 때 한 번, 한참 뒤에 또 한 번 터지는 것처럼 보였다
       (성권이 '파괴 연출이 두 번' 으로 잡았다). 갓 그린 슬롯(섬광까지 얹힌 모습)을 그대로
       떠서 부수고, 원본은 바로 판에서 뺀다. */
    if(dead){ cleanup('ai'); S.fx=null; render(); }
    await sleep(620);
    S.fx=null;S.busy=false;
    cleanup('ai');render();
    return;
  }else return;
  pay('me',n);S.me.hand.splice(S.sel,1);S.sel=null;S.mode=null;render();
}
async function castSelectedInstant(){
  if(S.busy||S.sel===null)return;
  const n=S.me.hand[S.sel],c=POOL[n];
  if(c.mode!=='aoe'){                       /* 드로우·회복 — 대상 없음 */
    resolveInstant('me',n);
    pay('me',n);S.me.hand.splice(S.sel,1);S.sel=null;S.mode=null;
    phaseCard(n);render();return;
  }
  return castSelectedAoe();
}
async function castSelectedAoe(){
  if(S.busy)return;
  const n=S.me.hand[S.sel],c=POOL[n];
  pay('me',n);S.me.hand.splice(S.sel,1);S.sel=null;S.mode=null;
  /* 인어의 노래·비명 — 피해가 아니라 ATK 을 0 으로. 몸은 남으니 cleanup 도 필요 없다. */
  if(aoeSilence('me',n)!==null){ phaseCard(n); render(); return; }
  if(darkMass('me',n)!==null){ phaseCard(n); render(); return; }
  burnRightLand('me',n);                     /* 화산 폭발 — 내 지형 맨 오른쪽을 부순다 */
  const v=aoeVal('me',n);                    /* 분신·연쇄 폭발처럼 값이 변하는 것들 */
  /* ⚠ '모든 크리처' 라고 적힌 광역은 **내 판도 같이** 맞는다(폭풍우·메테오). 기본은 상대만이다. */
  const sides=aoeBoth(n)?['ai','me']:['ai'];
  log(`나 ${n} 사용 — ${aoeBoth(n)?'양쪽':'상대'} 전체 개체에 ${v} 피해`,'a');
  aoeSpread('me',n,sides,v);
  if(aoeFace(n))faceDmg('ai',v);             /* 메테오 — 얼굴에도 같은 값 */
  let killed=0;
  S.ai.board.forEach(u=>{if(u&&u.kind==='cr')killed+=u.insts.filter(i=>i.hp<=0).length;});
  S.busy=true;S.aoeFx={side:'ai',v};render();
  phaseCard(n);
  await sleep(760);
  S.aoeFx=null;S.busy=false;
  sides.forEach(sd=>S[sd].board.forEach(u=>{if(u&&u.kind==='cr'){const k=u.insts.filter(i=>i.hp<=0).length;if(k)log(`  ${u.name} ${k}개체 파괴`,'a');}}));
  sides.forEach(cleanup);
  spellSelfDmg('me',n);                      /* 겁화 — 내 크리처도 3 피해 */
  spellHeal('me',n,killed);                  /* 흡혈 파도 — 처치한 수만큼 회복 */
  render();
}

/* 손패가 화면 폭을 넘으면 겹쳐서 한 줄에 담는다 (하스스톤 방식).
   가로 스크롤로 두면 세로 화면에서 카드가 화면 밖으로 숨어 버린다. */
function fanHand(id,invert){
  const h=document.getElementById(id||'hand'); if(!h)return;
  const cards=[...h.children];
  const n=cards.length;
  if(!n)return;
  /* ⚠ 지난 번에 걸어 둔 축소를 먼저 푼다. 안 풀고 재면 줄어든 폭을 기준으로 또 줄여
        (겹침 → 축소 → 더 좁은 폭 → 더 축소) 손패가 계속 작아진다. 실제로 그렇게 망가졌다. */
  h.style.transform='none';
  /* 1) 가로 — 넘치면 겹친다. 겹치더라도 한 장이 최소 이만큼은 보이게 둔다.
        offsetWidth 는 조상 transform 의 영향을 받지 않는다 — 반드시 이걸로 잰다. */
  const base=cards[0].offsetWidth||86;
  /* ⚠ clientWidth 는 padding 을 **포함**한다. 그대로 쓰면 손패 좌우 여백이 무시되고
        카드가 화면 끝까지 붙는다(갑갑해 보였던 원인). 안쪽 폭으로 깎아서 쓴다. */
  const cs=getComputedStyle(h);
  const pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const avail=h.clientWidth-pad-4;
  const need=n*base+(n-1)*7;
  let gap=7;
  if(n>1&&need>avail){
    const minShow=Math.max(26,base*0.34);
    gap=Math.max(minShow-base,(avail-base)/(n-1)-base);
  }
  h.style.setProperty('--hgap',gap.toFixed(1)+'px');
  /* 2) 기울이지 않는다 — 좌우로 곧게 나열하고 겹치기만 한다.
        (부채꼴로 폈다가 되돌림. 회전이 들어가면 폭 계산·터치 판정이 전부 까다로워진다.) */
  cards.forEach((el,i)=>{
    el.style.setProperty('--rot','0deg');
    el.style.setProperty('--dy','0px');
    el.style.zIndex=String(10+i);                  /* 오른쪽 카드가 왼쪽을 덮는다 */
  });
  /* 3) 그래도 넘치면 손패 전체를 줄인다(카드가 화면 밖으로 나가는 것보다 낫다). */
  /* ⚠ 전환 애니메이션이 켜져 있으면 아직 회전 전 상태를 재게 된다 — 잠시 꺼 놓고 잰다 */
  h.classList.add('measuring');
  const hb=h.getBoundingClientRect();
  let l=Infinity,r=-Infinity;
  cards.forEach(c=>{const b=c.getBoundingClientRect(); if(b.left<l)l=b.left; if(b.right>r)r=b.right;});
  h.classList.remove('measuring');
  const span=r-l, room=hb.width-4;
  const k=span>room?Math.max(0.6,room/span):1;
  h.style.transform=k<1?`scale(${k.toFixed(3)})`:'none';
  h.style.transformOrigin=invert?'50% 0':'50% 100%';   /* invert = 상대 손패(위쪽 기준) */
}
/* 상대 손패 — 매수만 뒷면으로 보여 준다 */
function renderFoeHand(){
  const el=document.getElementById('foeHand'); if(!el)return;
  const A=S.ai||{hand:[]};
  const shown=A.shown||{};
  /* ⚠ 낡은 표시를 **스스로 지운다.** 그 이름이 손에 남은 수보다 표시가 많으면 이미 낸 것이다.
     낼 때마다 지우는 자리를 따로 두면(splice 하는 곳이 여럿이다) 언젠가 한 곳을 빠뜨린다. */
  const cnt={}; A.hand.forEach(n=>{cnt[n]=(cnt[n]||0)+1;});
  Object.keys(shown).forEach(n=>{ if(shown[n]>(cnt[n]||0))shown[n]=cnt[n]||0; });
  const used={};
  el.innerHTML=A.hand.map((n,i)=>{
    used[n]=(used[n]||0)+1;
    const fx=(A.echoNew&&i===A.hand.lastIndexOf(A.echoNew))?' echoin':'';
    if(used[n]<=(shown[n]||0))
      return `<div class="hcw open${fx}">${isLand(n)?landCardHTML(n,'md'):tcardHTML(n,{size:'md'})}</div>`;
    return `<div class="hcw back${fx}"><div class="cback"></div></div>`;
  }).join('');
  fanHand('foeHand',true);
}

/* ============ 손패 밖으로 끌어 놓으면 발동 ============ */
/* 슬롯을 고르지 않는다 — 소환·배치는 왼쪽 빈 칸부터 채우고, 스펠은 대상을 알아서 고른다.
   드롭 지점이 마침 유효한 대상이면 그 대상을 존중한다. */
function modeOf(n){
  if(isLand(n))return 'land';
  const c=POOL[n]; if(!c)return null;
  if(c.k==='cr')return 'place';
  if(c.k==='en')return 'ench';
  if(c.mode==='summon')return 'summon';
  if(isSac(n)||/내 크리처 1개체 HP −/.test(c.d||''))return 'mine';   /* 제물·자해 드로우는 내 개체를 고른다 */
  if(isMassBuff(n))return 'instant';         /* 불씨 살리기 — 내 전체가 대상이라 고를 게 없다 */
  if(INSTANT.includes(c.mode))return 'instant';
  /* ⚠ '부여' 라고 다 내 편이 아니다 — 소이탄은 **상대**에게 연소를 심는다.
     규칙문에 '상대 크리처' 가 있으면 대상이 반대편이다. */
  if(NEEDS_MINE.includes(c.mode))
    return isFoeMass(n)?'instant':(isFoeGrant(n)?'target':'mine');
  /* ⚠ 여기까지 왔는데 **상대를 겨누는 모드가 아니면** 등록을 빠뜨린 것이다.
     조용히 'target' 으로 떨어뜨리면 대상이 필요 없는 카드에 대상 선택 창이 뜬다. */
  if(!NEEDS_FOE.includes(c.mode)){
    console.warn(`modeOf: 등록 안 된 mode '${c.mode}' (${n}) — INSTANT 나 modeOf 분기에 넣을 것`);
    return 'instant';
  }
  return 'target';
}
function leftFree(p){ return boardRoom(p)?S[p].board.length:-1; }
function slotOkFor(mode,n,side,idx){
  const u=S[side].board[idx];
  if(mode==='place'||mode==='ench'||mode==='summon') return boardRoom(side);
  if(mode==='mine'){
    if(!u||u.kind!=='cr'||!u.insts.length)return false;
    /* 제물·자해 스펠만 핵심 몸(이그니스)을 못 고른다. 순수 버프는 얼마든지 얹을 수 있다. */
    return isSacLike(n)?!u.core:true;
  }
  if(mode==='target') return !!u&&(POOL[n].mode==='shatter'?u.kind==='en':u.kind==='cr');
  return false;
}
/* ⚠⚠ **이 몸은 절대 제물로 쓰지 않는다.** 이그니스는 죽는 순간 그 판이 끝난다 —
   깃털(희생 드로우) · 도화선(연소 부여) · 분신(태워서 광역) · 전차(삼킴)가 전부 여기를 본다.
   한 곳만 빠뜨려도 AI 가 제 목숨을 스스로 갈아 넣는다. */
const sacOK=u=>!!u&&u.kind==='cr'&&!u.core&&u.insts&&u.insts.length>0;
const isSacLike=n=>isSac(n)||/내 크리처 1개체 HP −/.test((POOL[n]||{}).d||'')
                   ||!!grantOf((POOL[n]||{}).d||'').burn;
function autoMine(n){                      /* 강화 대상 — 제일 값나가는 내 크리처 */
  let best=-1,bv=-1;
  for(let i=0;i<SLOTS;i++){ const u=S.me.board[i];
    if(!u||u.kind!=='cr'||!u.insts.length)continue;
    if(u.core&&n&&isSacLike(n))continue;   /* 제 목숨을 갈아 넣지 않는다 */
    const v=u.a*10+u.insts[0].hp; if(v>bv){bv=v;best=i;} }
  return best;
}
/* 이 주문이 **상대 본체**를 겨눌 수 있나. 규칙문이 곧 판정이다
   ("크리처 1개체 또는 상대에게 N 피해" — 파이어 애로우 · 화염구). */
const canFace=n=>/또는 상대에게/.test(rule(n));
/* 지금 이 주문이 고를 수 있는 대상이 하나라도 있나.
   ⚠ 본체를 때릴 수 있는 주문은 **판이 비어도** 언제나 대상이 있다. 이걸 안 보면
     상대 판이 비었을 때 손패에서 흐려진 채 못 나간다. */
function hasTargetFor(mode,n){
  if(mode==='target'&&canFace(n))return true;
  return autoIdx(mode,n)>=0;
}
function autoFoe(n){                       /* 제거 대상 — 잡을 수 있으면 그중 최고, 없으면 최고 위협 */
  const c=POOL[n], D=S.ai.board;
  if(c.mode==='shatter'){ for(let i=0;i<SLOTS;i++) if(D[i]&&D[i].kind==='en') return i; return -1; }
  let best=-1,bv=-1,kill=-1,kv=-1;
  for(let i=0;i<SLOTS;i++){ const u=D[i];
    if(!u||u.kind!=='cr'||!u.insts.length)continue;
    const v=u.a*10+u.insts[0].hp;
    if(v>bv){bv=v;best=i;}
    const bn=grantOf(c.d||'').burn||0;
    const lethal=(c.mode==='kill'||c.mode==='bounce'||(c.v||0)>=u.insts[0].hp
                  ||(bn>0&&u.insts[0].hp<=bn*2));
    if(lethal&&v>kv){kv=v;kill=i;} }
  return kill>=0?kill:best;
}
function autoIdx(mode,n){
  if(mode==='place'||mode==='ench'||mode==='summon') return boardRoom('me')?S.me.board.length:-1;
  if(mode==='mine')   return autoMine(n);
  if(mode==='target') return autoFoe(n);
  return -1;
}
const NOSLOT={place:'빈 슬롯이 없다',ench:'인챈트를 놓을 빈 슬롯이 없다',
  summon:'토큰을 놓을 빈 슬롯이 없다',mine:'강화할 내 크리처가 없다',target:'상대 대상이 없다'};
/* 지금 이 카드를 낼 수 있나? 못 내면 **그 이유**를 돌려준다(null 이면 낼 수 있다).
   손패 흐리기 · 드래그 팁 · 실패 토스트가 전부 이 하나를 본다 —
   예전에는 손패가 마나만 보고 흐려져서, 대상이 없어 못 쓰는 카드가 멀쩡해 보였다. */
function whyNotPlayable(n){
  if(isLand(n)){
    const L=LANDS[n];
    if(L.extra)return manaLeft('me')>=(L.pay||0)?null:`자원 ${L.pay} 이 모자란다`;
    return S.me.landPlayed?'이번 턴 지형은 이미 놓았다':null;
  }
  const c=POOL[n]; if(!c)return '알 수 없는 카드';
  if(!hpGateOK('me',n))return '아직 낼 수 없다 (HP 조건)';
  if(!canPay('me',n))return '마나가 모자란다';
  const mode=modeOf(n);
  if(mode==='instant')return null;          /* 즉시 발동은 자리가 필요 없다 */
  /* ⚠ 본체를 때릴 수 있는 주문은 상대 판이 비어도 낼 수 있다 → hasTargetFor 가 본다 */
  return hasTargetFor(mode,n)?null:(NOSLOT[mode]||'놓을 수 없다');
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1600);
}
/* hit = {side,idx} 드롭 지점의 슬롯(없으면 null) */
function playFromHand(i,hit,at){
  if(S.over||S.busy||S.active!=='me')return false;
  const n=S.me.hand[i]; if(n===undefined)return false;
  if(isLand(n)){
    const why=whyNotPlayable(n);
    if(why){toast(why);return false;}
    playLand('me',n); S.me.hand.splice(i,1); S.sel=null; S.mode=null; render(); return true;
  }
  const c=POOL[n]; if(!c)return false;
  if(!canPay('me',n)){toast('마나가 모자란다');return false;}
  const mode=modeOf(n);
  S.sel=i; S.mode=mode;
  if(mode==='instant'){ render(); castSelectedInstant(); return true; }
  /* ⚠ 대상이 필요한 주문은 **여기서 발동하지 않는다.** 떨어진 자리로 대상을 정하던 길은
     없앴다 — 내려놓는 손짓과 겨누는 손짓이 섞이면 엉뚱한 몸에 꽂힌다.
     대상은 화살표 타게팅으로만 고른다(빈 곳을 누르면 취소). */
  if(mode==='target'||mode==='mine'){
    if(!hasTargetFor(mode,n)){ S.sel=null;S.mode=null;render(); toast(NOSLOT[mode]||'놓을 수 없다'); return false; }
    const r=document.querySelector('#myBoard')?.getBoundingClientRect();
    startTargeting(i,n,mode,r?r.left+r.width/2:innerWidth/2,r?r.top:innerHeight/2);
    return true;
  }
  /* 소환·배치는 슬롯을 고르지 않는다 — 어디에 떨궈도 무조건 왼쪽 빈 칸부터.
     드래그가 정해 준 끼울 자리를 쓴다(없으면 맨 뒤). */
  let idx=-1;
  if(at!=null&&boardRoom('me'))idx=Math.max(0,Math.min(S.me.board.length,at));
  if(idx<0)idx=autoIdx(mode,n);
  if(idx<0){ S.sel=null;S.mode=null;render(); toast(NOSLOT[mode]||'놓을 수 없다'); return false; }
  clickSlot('me',idx);
  return true;
}

/* 희귀도 — POOL 의 `r` 필드(없으면 커먼). 예산 배수는 tools/gen_decks.py 가 정본. */
const RARKO={common:'커먼',uncommon:'언커먼',rare:'레어',legendary:'레전더리'};
const RARMULT={common:1.00,uncommon:1.10,rare:1.22,legendary:1.40};
/* ⚠ 지형은 POOL 에 없고 LANDS 에 있다 — 여기서 안 보면 보상 지형이 전부 common 으로 잡혀
   희귀도 가중 뽑기가 헛돈다(레전더리 화염의 원천이 커먼 취급을 받았다). */
const rarOf=n=>((POOL[n]||{}).r)||((LANDS[n]||{}).r)||'common';
/* ============ 통합 카드 컴포넌트 ============ */
/* ⚠ 이 구간은 카드 뷰어(cards/index.html)가 `tools/build_cards_page.py` 로 **그대로 떼어 간다**.
   여기의 마크업이 곧 카드 규격이다 — 뷰어용으로 따로 그리지 말 것. */
/* 프레임 이미지가 있으면 그걸로, 없으면 기존 CSS 카드로 그린다 */
function frameKey(el,kind){ const k=el+'-'+kind; return FRAMES[k]?k:null; }
function frameVars(g){
  return `--aX:${g.art[0]};--aY:${g.art[1]};--aW:${g.art[2]};--aH:${g.art[3]};`
    +`--nY:${g.name[0]};--nH:${g.name[1]};--cY:${g.cost[0]};--cH:${g.cost[1]};`
    +`--rY:${g.rules[0]};--rH:${g.rules[1]};--sY:${g.stat[0]};--sH:${g.stat[1]};`;
}
function frameCardHTML(name,opt,c,el,ec,key){
  const g=FRAMES[key], u=opt.unit;
  const cc=Math.min(+c.cc||1,c.c);
  const orbC=ORBS[el]?`<i style="background-image:url(${ORBS[el]})"></i>`
                     :`<i style="background:${ec}"></i>`;
  const orbG='<i class="gap"></i>';   /* 무색 = 프레임의 빈 소켓을 그대로 보여준다 */
  const orbs=orbC.repeat(cc)+orbG.repeat(c.c-cc);
  const hasCostBand=g.cost[1]>0;
  const pips=hasCostBand?orbs:'';
  const inline=hasCostBand?'':`<span class="fcin">${orbs}</span>`;
  let eff='';
  if(c.k==='cr'){
    /* ⚠ 판 위 카드는 **인쇄된 글이 아니라 지금 그 개체의 상태**를 보여 준다.
       카드 효과로 얻은 수호·면역·환류·흡혈 …이 설명란에 안 뜨면, 무엇이 붙었는지
       알 방법이 없다(뱃지는 작아서 확대해도 규칙을 읽을 수가 없었다). */
    const u0=opt.unit;
    const tag=u0?((u0.g&&u0.f)?'비행·수호':u0.g?'수호':u0.f?'비행':(u0.p?'관통':''))
                :((c.g&&c.f)?'비행·수호':c.g?'수호':c.f?'비행':(c.p?'관통':''));
    const kw=liveKw(name,u0,opt);
    eff=(tag?`<b>${tag}</b>`:'')+((tag&&kw)?' · ':'')+kw;
  } else eff=c.d||'';
  let stat='';
  if(g.mode==='two'){
    const atk=u?u.a:c.a, hp=(u&&u.insts[0])?Math.max(0,u.insts[0].hp):c.h;
    const ac=u&&atk!==c.a?(atk>c.a?'buf':'dmg'):'', hc=u&&hp!==c.h?(hp>c.h?'buf':'dmg'):'';
    stat=`<div class="fstat"><span class="fa ${ac}">${atk}</span><span class="fh ${hc}">${hp}</span></div>`;

  }

                     :'<div class="fart"></div>';

    ${art}<div class="fimg" style="background-image:url(${g.img})"></div>

    ${pips?`<div class="fcost">${pips}</div>`:''}
    <div class="feff">${eff}</div>${stat}
  </div>`;
}
/* ── 카드 설명란에 찍히는 키워드 줄 ────────────────────────────
   개체가 있으면 **그 개체의 지금 상태**로 다시 만든다. 카드 효과로 붙은 것은 표시를 달고,
   잃은 것(환류를 이미 쓴 몸)은 아예 빼 준다.
   ⚠ **되만들 수 있는 것만 인쇄 글에서 떼어 낸다.** 밀물·제물·축복·성장·개전은 개체 필드가
     없으므로 글 그대로 남긴다 — 떼어 내면 정보가 사라진다. */
const KWRE=/^(연소\s*\d+|폭발|환류|흡혈|경화\s*\d+|가호|면역|연격\s*\d+|광분|육중|속공|증식|연마|진형|연합)$/;
function liveKw(name,u,opt){
  const c=POOL[name]||{};
  let printed=(c.kw&&c.kw!=='—')?c.kw:'';
  /* ⚠⚠ **써 버려 사라진 능력은 글에서도 지운다.** 안 그러면 "아직 한 번 더 되살아난다" 로
     읽힌다 — 판을 보고 판단할 방법이 없어진다(성권이 짚었다).
     · 단말마 '(1회)' — 되살아난 몸은 `u.dr` 이 비어 있다.
     · 환류 — 아래 `u.echo` 가 이미 그 일을 한다(KWRE 에 걸려 상태에서 다시 만든다).
     ⚠ **조각으로 못 지운다.** 단말마는 '단말마 —' 뒤부터 줄 끝까지가 한 덩어리라
       (drText 와 같은 규칙) ' · ' 로 잘라 내면 본드래곤처럼 뒤 문장이 홀로 남는다. */
  if(u&&u.kind==='cr'&&!u.dr)printed=printed.replace(/(?:\s*·)?\s*단말마 — .*$/,'').trim();
  const parts=printed.split('·').map(t=>t.trim()).filter(Boolean);
  const prose=parts.filter(t=>!KWRE.test(t));       /* 고유 문구는 그대로 둔다 */
  const had=t=>parts.some(x=>x.replace(/\s+/g,'')===t.replace(/\s+/g,''));
  const live=[];
  const add=t=>{ if(!t)return; live.push(had(t)?t:`<b class="gr">${t}</b>`); };
  if(u){
    if(u.burn)add(`연소 ${u.burn}`);
    if(u.boom)add('폭발');
    /* ⚠ 포그위저드가 걸어 준 면역(u.vaura)도 보여야 한다 — 안 보이면 지금 이 몸이
       왜 안 깎이는지 알 수가 없다. 인쇄에 없으므로 금색(부여)으로 뜬다. */
    if(veiled(u))add('면역');
    if(u.ward)add('가호');
    if(u.hard)add(`경화 ${u.hard}`);
    if(u.drain)add('흡혈');
    if(u.echo)add('환류');
    if((u.multi||1)>1)add(`연격 ${u.multi}`);
    if(u.rage)add('광분');
    if(u.heavy)add('육중');
    if(u.rush)add('속공');
    if(u.breed)add('증식');
    if(u.hone)add('연마');
    if(u.awake)add('진형');
    if(u.ally)add('연합');
  }else{
    /* 손패·목록 — 개체가 없다. 인쇄 그대로 두되, **환류를 이미 쓴 이름**이면 뺀다. */
    parts.forEach(t=>{ if(!KWRE.test(t)){return;} 
      if(t==='환류'&&opt&&opt.noecho)return;        /* 돌아온 장 — 이제 발동 안 한다 */
      live.push(t); });
  }
  return live.concat(prose).join(' · ');
}
function tcardHTML(name,opt){

  }
  const el=CE[name]||c.el||'steel', ec=(EL[el]||EL.steel).c;
  const cc=Math.min(+c.cc||1,c.c);
  const pips=`<i class="cp c" style="background:${ec}"></i>`.repeat(cc)+'<i class="cp g"></i>'.repeat(c.c-cc);
  let cls=c.k==='cr'?((c.g&&c.f)?'flyguard':c.g?'guard':c.f?'fly':(c.p?'pierce':'normal')):c.k;
  /* 희귀도 클래스는 커먼이 아닐 때만 붙인다(커먼은 기본 모습 그대로) */
  if(c.r&&c.r!=='common')cls+=' r-'+c.r;
  let eff='';
  if(c.k==='cr'){
    /* ⚠ 판 위 카드는 **인쇄된 글이 아니라 지금 그 개체의 상태**를 보여 준다.
       카드 효과로 얻은 수호·면역·환류·흡혈 …이 설명란에 안 뜨면 무엇이 붙었는지 알 수 없다. */
    const u0=opt.unit;
    const tag=u0?((u0.g&&u0.f)?'비행·수호':u0.g?'수호':u0.f?'비행':(u0.p?'관통':''))
                :((c.g&&c.f)?'비행·수호':c.g?'수호':c.f?'비행':(c.p?'관통':''));
    const kw=liveKw(name,u0,opt);
    eff=(tag?`<b>${tag}</b>`:'')+((tag&&kw)?' · ':'')+kw;
  } else eff=c.d||'';
  /* 강화 카드는 자기 일러스트가 없다 — 원본(base)의 것을 빌려 쓴다 */
  const src=ART[name]||(c.base?ART[c.base]:null);
  /* 희귀도 보석 — 일러스트 안쪽 오른쪽 아래 */
  const gem=`<i class="rgem ${c.r||'common'}" title="${RARKO[c.r||'common']}"></i>`;
  const art=src?`<div class="tart" style="background-image:url(${src})">${gem}</div>`
                :`<div class="tart">${gem}</div>`;
  const u=opt.unit;
  let foot='';
  if(c.k==='cr'){
    const atk=u?u.a:c.a, hp=(u&&u.insts[0])?Math.max(0,u.insts[0].hp):c.h;
    const ac=u&&atk!==c.a?(atk>c.a?'buf':'dmg'):'', hc=u&&hp!==c.h?(hp>c.h?'buf':'dmg'):'';
    foot=`<div class="tstat"><span class="tb a ${ac}">${atk}</span><span class="tb h ${hc}">${hp}</span></div>`;
  } else if(c.k==='en'){
    foot=`<div class="tstat"><span></span><span class="tb ch">${u?u.charge:c.ch}</span></div>`;
  } else foot='<div class="tstat"></div>';   /* 스펠 — 뱃지는 없지만 자리는 차지한다 */
  /* 레전더리에는 프리즘 2·3단계가 쓸 여분의 층을 하나 넣어 둔다(1단계에서는 숨는다) */
  return `<div class="tcard ${cls} ${opt.size||'md'}" style="--el:${ec}">
    <div class="thead"><div class="tname">${name}</div><div class="tcost">${pips}</div></div>
    ${art}
    <div class="tbody"><div class="teff">${eff}</div></div>${foot}
  </div>`;
}
/* CARDJS_END */

/* ============ 렌더 ============ */
/* 살아 있는 키워드 상태를 슬롯 위에 표시한다 (남은 연소 턴·성장 횟수·가호 유무 등) */
/* 이 이름의 다음 한 장이 **환류를 이미 쓴 장**인가.
   크리처는 noecho, 주문은 nospell 에 이름별로 쌓인다(둘 다 '돌아온 장 수'). */
function echoSpent(p,n){
  const P=S[p]||{};
  return ((P.noecho&&P.noecho[n])>0)||((P.nospell&&P.nospell[n])>0);
}
function kwBadges(u){
  if(!u||u.kind!=='cr')return '';
  const b=[];
  if(u.burn)b.push(`<i class="kb burn">연소 ${u.burn}</i>`);
  if(u.boom)b.push(`<i class="kb burn">폭발 ${u.a}</i>`);
  if(u.hone)b.push('<i class="kb grow">연마</i>');
  if(u.breed)b.push('<i class="kb grow">증식</i>');
  else if(u.bred)b.push('<i class="kb grow">복제</i>');
  if(u.hard)b.push(`<i class="kb hard">경화 ${u.hard}</i>`);
  if(u.ward)b.push('<i class="kb ward">가호</i>');
  if(u.awake)b.push('<i class="kb form">진형</i>');
  if(u.drain)b.push('<i class="kb drain">흡혈</i>');
  if(u.echo)b.push('<i class="kb echo">환류</i>');
  if(u.veil)b.push('<i class="kb ward">면역</i>');
  if((u.multi||1)>1)b.push(`<i class="kb burn">연격 ${u.multi}</i>`);
  if(u.rage)b.push('<i class="kb burn">광분</i>');
  if(u.sick)b.push('<i class="kb heavy">육중</i>');
  if(u.ate)b.push(`<i class="kb echo">삼킴</i>`);
  if(u.doom)b.push('<i class="kb doom">수확</i>');   /* 다음 그 턴 시작에 죽는다 */
  return b.length?`<div class="kbs">${b.join('')}</div>`:'';
}
function slotHTML(u,side,i){
  if(!u)return '';
  let cls='slot occ';
  if(u.kind==='en')cls+=' ench';
  else if(u.g&&u.f)cls+=' flyguard';
  else if(u.g)cls+=' guard';
  else if(u.f)cls+=' fly';
  else if(u.p)cls+=' pierce';
  /* 아직 안 쓴 능력은 색 광채로 알린다 — 환류 파랑 · 증식 초록 · 가호 노랑 */
  if(u.echo)cls+=' echoon';
  if(u.breed)cls+=' breedon';
  if(u.ward)cls+=' wardon';
  if(u.doom)cls+=' doomed';                 /* 사신의 수확 — 표식이 남아 있는 동안 계속 */
  if(veiled(u))cls+=' veilon';              /* 면역 — 일러스트가 프리즘처럼 흐른다 */
  const tim=(u.grow&&u.grow.left>0)?`<i class="gtim" title="성장까지 ${u.grow.left}턴">${u.grow.left}</i>`:'';
  return `<div class="${cls}" data-side="${side}" data-idx="${i}">`
    +`${tcardHTML(u.name,{size:'sm',unit:u})}${kwBadges(u)}${tim}</div>`;
}
/* 판 한 줄을 가운데로 모으고, 폭이 모자라면 손패처럼 오른쪽이 왼쪽을 덮게 겹친다.
   ⚠ 카드를 **절대 배치**로 깐다. 플렉스 + 음수 margin 으로 하려다 실패했다 —
   판의 슬롯은 `container-type:inline-size` 라 컨테인먼트가 걸려 있어서
   margin(인라인·!important 포함)이 먹지 않았다. left 로 직접 놓으면 그런 변수가 없다. */
function packRow(el,stack){
  if(!el)return;
  const cards=[...el.querySelectorAll(':scope > .slot')];
  const n=cards.length;
  el.classList.toggle('empty',!n);
  el.classList.toggle('packed',!!n);
  if(!n)return;
  const cw=cards[0].offsetWidth||60;
  const avail=Math.max(40,el.clientWidth-8);
  /* stack=true(지형존) → 자리가 남아도 **항상** 겹쳐 쌓는다. 손에 쥔 카드 뭉치처럼 보이게. */
  let step=stack?cw*0.52:cw+5;
  if(n>1&&cw+(n-1)*step>avail){
    const minShow=Math.max(24,cw*0.36);              /* 한 장이 최소 이만큼은 보이게 */
    step=Math.max(minShow,(avail-cw)/(n-1));
  }
  const vis=cw+(n-1)*step;
  const x0=Math.max(4,(el.clientWidth-vis)/2);
  cards.forEach((c,i)=>{
    c.style.left=(x0+i*step).toFixed(1)+'px';
    c.style.zIndex=String(10+i);                     /* 오른쪽 카드가 왼쪽을 덮는다 */
  });
}
function boardHTML(p){
  const side=p==='me'?'me':'ai';
  const cards=S[p].board.map((u,i)=>slotHTML(u,side,i)).join('');
  return cards+(p==='me'?'<i class="dropbar" id="dropbar"></i>':'');
}
function render(){
  /* ⚠ 원정에서는 **전투 중 HP 를 실시간으로 RG.hp 에 흘려보낸다.**
     예전에는 전투가 끝날 때(checkEnd) 한 번만 옮겼는데, 그 바람에
     "지고 있는 전투를 설정 → 지도로 나갔다가 다시 들어오면 HP 가 만피로 돌아오는" 구멍이 있었다.
     RG.fighting 이 켜져 있을 때만 흘린다 — 지도·이벤트 화면에서 흘리면
     이벤트가 올려 놓은 HP 를 지난 전투의 낡은 S.me.hp 가 도로 깎는다. */
  /* ⚠⚠ `RG.entering` — **커튼이 내려가 새 판을 차리는 동안**은 흘려보내지 않는다.
     그 사이의 render() 는 아직 **지난 전투의 낡은 S.me.hp** 를 들고 있어서, 이벤트로
     회복한 HP 가 전투에 들어가기도 전에 도로 깎인다(전체 검사에서 이따금 잡혔다).
     ⚠ '#rg 창이 떠 있으면 건너뛴다' 로 막아 봤다가 **전투 중 실시간 반영이 통째로 죽었다** —
       창이 아니라 '차리는 중' 인지를 봐야 한다. */
  if(RG.on&&RG.fighting&&!RG.entering&&S.me)RG.hp=Math.max(0,S.me.hp);
  const mine=S.active==='me'&&!S.over&&!S.busy;
  /* 처리 중에는 화면을 가리지 않고 조작만 막는다(위쪽 얇은 진행 막대) */
  if(TUT.on)tutSync();               /* 튜토리얼 — 상태가 바뀌면 저절로 다음 단계로 */
  /* ⚠ 판이 끝났으면 **무슨 일이 있어도** 가리개를 걷는다. busy 를 누가 안 껐더라도
     승패 화면·보상 창이 눌리지 않는 상태로 갇히면 안 된다(실제로 그렇게 멈췄다). */
  if(S.busy&&!S.over)busyOn(S.active==='me'?'전투 처리 중…':'상대 턴 진행 중…'); else busyOff();
  // bars
  document.getElementById('myHp').textContent=Math.max(0,S.me.hp);
  document.getElementById('foeHp').textContent=Math.max(0,S.ai.hp);
  document.getElementById('myHpBar').style.width=Math.max(0,S.me.hp/(S.me.maxhp||MAXHP)*100)+'%';
  document.getElementById('foeHpBar').style.width=Math.max(0,S.ai.hp/(S.ai.maxhp||MAXHP)*100)+'%';
  ['me','ai'].forEach(p=>{
    const el=document.getElementById(p==='me'?'myMana':'foeMana');
    el.innerHTML=`<span class="mtxt">${manaLeft(p)}/${S[p].lands.length}</span>`;
    const lzEl=document.getElementById(p==='me'?'myLz':'foeLz');
    lzEl.innerHTML=lzHTML(p); packRow(lzEl,true);   /* 지형은 항상 겹쳐 쌓는다 */
    /* 왼쪽 위 배지: 남은 마나 / 배치한 지형 수. packRow 뒤에 붙여야 위치 계산에 안 끼어든다. */
    lzEl.insertAdjacentHTML('beforeend',
      `<i class="lzb" id="${p==='me'?'myLzInfo':'foeLzInfo'}" title="남은 마나 / 배치한 지형"`
      +` aria-label="남은 마나 ${manaLeft(p)}, 배치한 지형 ${S[p].lands.length}">`
      +`<b>${manaLeft(p)}</b><i>/</i>${S[p].lands.length}</i>`);
    /* ⚠ 무덤 수는 **해골쌓기·혼령 부활이 읽는 값**이라 눈에 보여야 한다(성권 요청).
       0 일 때는 안 찍는다 — 늘 붙어 있으면 줄이 길어져 세로 예산을 먹는다. */
    const gv=(S[p].grave||[]).length;
    document.getElementById(p==='me'?'myCnt':'foeCnt').textContent=
      `손 ${S[p].hand.length} · 덱 ${S[p].deck.length}`+(gv?` · 무덤 ${gv}`:'');
  });
  document.getElementById('turnMeta').textContent=`TURN ${S.turn} · ${S.active==='me'?'내 턴':'상대 턴'}`;
  // boards
  document.getElementById('foeBoard').innerHTML=boardHTML('ai');
  document.getElementById('myBoard').innerHTML=boardHTML('me');
  packRow(document.getElementById('foeBoard'));
  packRow(document.getElementById('myBoard'));
  // pick highlight
  /* 밀물 대상 지정 — 딤 규칙을 그대로 쓴다(뒤 조작을 막는 오버레이는 전부 같은 배경) */
  document.body.classList.toggle('tidemode',!!(S.tide||S.rush));
  if(S.tide){
    document.querySelectorAll('.slot').forEach(el=>{
      if(el.dataset.side==='ai'&&S.tide.list.includes(+el.dataset.idx))el.classList.add('pick');
    });
  }
  if(S.rush){
    document.querySelectorAll('.slot').forEach(el=>{
      if(el.dataset.side==='me'&&S.rush.list.includes(+el.dataset.idx))el.classList.add('pick');
    });
  }
  /* ⚠ #foeBar 는 슬롯과 달리 **다시 그려지지 않는다** — 켠 표시를 매번 손으로 지워야
     타게팅이 끝난 뒤에도 상대 정보줄이 빛나는 채로 남지 않는다. */
  document.getElementById('foeBar')?.classList.remove('pick');
  if(mine&&S.sel!==null){
    const n=S.me.hand[S.sel],c=POOL[n];
    document.querySelectorAll('.slot').forEach(el=>{
      const side=el.dataset.side,idx=+el.dataset.idx,u=S[side==='me'?'me':'ai'].board[idx];
      let ok=false;
      /* 마인드 플레어는 **양쪽 판**을 비춘다. 다른 지정과 겹치지 않도록 먼저 잡고 끝낸다. */
      if(S.pick) ok=S.pick.list.some(t=>t.side===side&&t.idx===idx);
      else if(S.mind) ok=S.mind.list.some(t=>t.side===side&&t.idx===idx);
      else{
      if(S.mode==='place'&&side==='me') ok=!u;
      if(S.mode==='ench'&&side==='me') ok=!u;
      if(S.mode==='summon'&&side==='me') ok=!u;
      if(S.mode==='mine'&&side==='me') ok=!!u&&u.kind==='cr';
      if(S.mode==='target'&&side==='ai') ok=!!u&&(POOL[n].mode==='shatter'?u.kind==='en':u.kind==='cr');
      }
      if(ok)el.classList.add('pick');
    });
    /* 본체도 고를 수 있으면 상대 정보줄을 통째로 켠다 — 이게 없으면
       '본체를 때릴 수 있다' 는 걸 알 방법이 없다(누를 데가 안 보인다). */
    const fb=document.getElementById('foeBar');
    if(fb&&S.mode==='target'&&canFace(n))fb.classList.add('pick');
  }
  document.querySelectorAll('.slot').forEach(el=>{
    el.onclick=()=>clickSlot(el.dataset.side,+el.dataset.idx);
  });
  // 전투 연출
  document.querySelectorAll('.bar').forEach(b=>b.classList.remove('struck'));
  document.querySelectorAll('.reveal').forEach(e=>e.remove());
  if(S.spawn){
    const el=slotEl(S.spawn.side,S.spawn.idx);
    if(el)el.classList.add('spawned');
  }
  /* 개체에 붙은 연출 표시 — **자리가 밀려도 따라가고, 다시 그려도 안 지워진다.**
     ⚠⚠ 슬롯에 클래스로 직접 걸면 바로 다음 render() 가 통째로 날려 버린다.
       광분 광채와 피격 반동이 실제로 그렇게 한 번도 안 보였다. 개체에 표시를 달아 둔다. */
  const FXCLS={revfx:'revived',ragefx:'raging',bumpfx:'bumped'};
  ['me','ai'].forEach(sd=>{ const B=(S[sd]||{}).board||[];
    B.forEach((u,i)=>{ if(!u)return; const el=slotEl(sd,i); if(!el)return;
      Object.keys(FXCLS).forEach(k=>{ if(u[k])el.classList.add(FXCLS[k]); }); }); });
  if(S.aoeFx){
    S[S.aoeFx.side].board.forEach((u,i)=>{
      if(!u||u.kind!=='cr')return;
      const el=slotEl(S.aoeFx.side,i);
      if(el){el.classList.add('struck');el.insertAdjacentHTML('beforeend',`<div class="pop">−${S.aoeFx.v}</div>`);}
    });
  }
  if(S.reveal){
    /* 상대가 낸 카드는 **평소 카드를 그대로 크게** 보여 준다(확대 UI 와 같은 `lg` 규격).
       예전에는 .rcard 라는 전용 마크업이었는데, 같은 카드가 다른 모양으로 나와 혼란스러웠다.
       ⚠ 새 카드 요소를 만들 땐 tcardHTML / landCardHTML 을 쓸 것. 규격은 하나뿐이다. */
    const nm=S.reveal.name;
    const card=POOL[nm]?tcardHTML(nm,{size:'lg'}):(LANDS[nm]?landCardHTML(nm,'lg'):'');
    document.body.insertAdjacentHTML('beforeend',
      `<div class="reveal"><div class="rwrap"><div class="rl">상대가 사용</div>${card}</div></div>`);
  }
  if(S.fx){
    const f=S.fx;
    const aEl=f.aSide!=null?slotEl(f.aSide,f.aIdx):null;
    if(aEl)aEl.classList.add('attacking');
    if(f.tIdx!=null){
      const tEl=slotEl(f.tSide,f.tIdx);
      if(tEl){
        tEl.classList.add(f.struck?'struck':'aimed');
        if(f.dmg!=null){
          tEl.insertAdjacentHTML('beforeend',`<div class="pop">−${f.dmg}</div>`);
          if(f.kill)tEl.insertAdjacentHTML('beforeend',`<div class="pop kill">${f.kill}</div>`);
          if(f.waste)tEl.insertAdjacentHTML('beforeend',`<div class="pop zero" style="top:30px">${f.waste}</div>`);
        }
      }
    }
    if(f.tHero){
      const bar=document.getElementById(f.tHero==='me'?'myBar':'foeBar');
      if(bar&&f.struck){
        bar.classList.add('struck');
        bar.insertAdjacentHTML('beforeend',`<div class="pop">−${f.dmg}</div>`);
      }
    }
  }
  /* hand
     ⚠ 드래그 중에는 손패 DOM 을 갈아엎으면 안 된다.
     터치에서는 pointerdown 대상에 **암묵적 포인터 캡처**가 걸리는데, 그 노드를 지우면
     브라우저가 pointercancel 을 쏘고 이후 pointermove 가 끊긴다 → 드래그가 통째로 죽는다.
     (마우스에는 암묵적 캡처가 없어서 데스크톱 테스트로는 절대 안 잡힌다.) */
  if(!(typeof DR!=='undefined'&&DR)&&!HANDLOCK){
  document.getElementById('hand').innerHTML=S.me.hand.map((n,i)=>{
    if(isLand(n)){
      const no=(!mine||S.me.landPlayed)?' no':'';
      return `<div class="hcw${no}" data-h="${i}">${landCardHTML(n,'md')}</div>`;
    }
    const c=POOL[n]; if(!c)return '';
    let cls='hcw';
    /* 마나뿐 아니라 **대상·빈 자리가 없는 카드도** 흐리게 — 왜 못 쓰는지 손패에서 바로 보이게 */
    if(!mine||whyNotPlayable(n))cls+=' no';
    if(S.sel===i)cls+=' sel';
    /* 인쇄 비용과 실제 비용이 다른 카드(용암거인)는 **오버레이 뱃지**로 지금 값을 알린다 —
       카드에 찍힌 숫자는 늘 기본값이라는 규칙(스탯과 같다)을 지킨다. */
    const cw=costOf('me',n);
    const badge=cw!==c.c?`<span class="costnow">${cw}</span>`:'';
    /* ⚠ 환류로 **돌아온 장**은 이제 발동하지 않는다 → 설명에서 '환류' 를 뺀다.
       빼지 않으면 '또 돌아온다' 고 읽혀서 그 계산으로 판을 짜게 된다. */
    if(S.me.echoNew&&i===S.me.hand.lastIndexOf(S.me.echoNew))
      cls+=' echoin';                         /* 환류로 방금 생겨난 장 */
    return `<div class="${cls}" data-h="${i}">${tcardHTML(n,{size:'md',noecho:echoSpent('me',n)})}${badge}</div>`;
  }).join('');
  /* 손패 탭에는 아무 동작도 걸지 않는다(끌어야만 발동). 길게 누르기는 전역 핸들러가 처리한다. */
  fanHand();
  }
  renderFoeHand();
  // hint
  /* 취소 버튼은 없앴다 — 대상 지정 중에는 **빈 곳을 누르면** 취소되고, 그 밖에는 취소할 상태가 없다. */
  const hint=document.getElementById('hint');
  if(S.busy&&!S.over){hint.className='hint';hint.textContent='전투 처리 중…';}
  else if(!mine){hint.className='hint idle';hint.textContent='상대 턴 진행 중…';}
  else if(S.sel===null){hint.className='hint idle';
    hint.textContent=innerWidth<=900?'카드를 위로 끌어 놓으면 발동'
      :'카드를 손패 밖으로 끌어 놓으면 발동 · 길게 누르면 확대';}
  else{
    hint.className='hint';
    const n=S.me.hand[S.sel];
    const cm=POOL[n]||{};
    if(isLand(n))hint.textContent=`${n} — 손패 밖에 놓으면 지형 배치`;
    else if(S.mode==='place')hint.textContent=`${n} — 판 위로 끌면 놓일 자리가 표시된다 (사이에도 끼울 수 있다)`;
    else if(S.mode==='ench')hint.textContent=`${n} — 판 위로 끌면 놓일 자리가 표시된다`;
    else if(S.mode==='summon')hint.textContent=`${n} — 판 위로 끌면 토큰이 놓일 자리가 표시된다`;
    else if(S.mode==='mine')hint.textContent=`${n} — 빛나는 내 크리처를 누르세요 (빈 곳을 누르면 취소)`;
    else if(S.mode==='target')hint.textContent=`${n} — 빛나는 상대 ${cm.mode==='shatter'?'인챈트':'크리처'}를 누르세요 (빈 곳을 누르면 취소)`;
    else hint.textContent=`${n} — ${SPELL_KO[cm.mode]||''} 즉시 발동`;
  }
  document.getElementById('end').disabled=!mine;
}

/* 전환 연출 — 가린 채로 work() 를 돌리고 잠깐 뒤 걷는다 */
function veilRun(t,work,ms){
  veilOn(t);
  const d=Math.max(16,(ms==null?360:ms)/Math.max(1,SPEED));
  setTimeout(()=>{ try{work&&work();}finally{ setTimeout(veilOff,Math.max(16,d*0.5)); } },d);
}

/* ============ 앱으로 설치 (PWA) ============
   홈 화면에 추가하면 주소창이 사라져 세로 공간이 그만큼 더 생긴다. */
/* ── 새 판 자동 적용 ────────────────────────────────────────────
   서비스워커는 `install` 에서 skipWaiting, `activate` 에서 clients.claim 을 한다.
   그래서 새 sw.js 를 받으면 곧바로 이 페이지의 컨트롤러가 바뀌고 `controllerchange` 가 뜬다.
   ⚠ 브라우저는 알아서 갱신을 확인하지 않는다 — **직접 찔러야(reg.update) 한다.**
      앱으로 깔면 페이지 이동이 없어서 몇 날이고 옛 판이 뜬다.
   ⚠⚠ **전투 중에 새로고침하면 판이 통째로 날아간다.** 안전한 순간(메뉴·승패 화면)에만 적용하고,
      전투 중이면 위쪽에 알림 칩만 띄워 두었다가 메뉴로 나올 때 자동으로 적용한다.
   ⚠ 첫 설치에도 controllerchange 가 뜬다 — 그때 새로고침하면 켤 때마다 한 번씩 깜빡인다.
      등록 **전에** 컨트롤러가 있었는지를 기억해 두고 그때만 갱신으로 친다. */
let NEWVER=false, RELOADING=false;
function updateSafe(){
  if(PAGE)return true;                    /* 흐름 페이지(모드·덱 선택) 위 = 잃을 판이 없다 */
  if(typeof S==='undefined'||!S.me)return true;
  return !!S.over;                        /* 승패 화면도 안전 */
}
function applyUpdate(){
  if(!NEWVER||RELOADING)return;
  const chip=document.getElementById('newver');
  if(!updateSafe()){ if(chip)chip.classList.add('on'); return; }
  RELOADING=true;
  if(chip){ chip.textContent='새 버전 적용 중…'; chip.classList.add('on'); }
  setTimeout(()=>location.reload(),600);
}
if('serviceWorker' in navigator&&location.protocol!=='file:')
  addEventListener('load',()=>{
    /* ⚠ `updateViaCache:'none'` 이 없으면 브라우저가 **HTTP 캐시에 있는 옛 sw.js** 와 비교해
       바뀐 걸 못 알아챈다 — 자동 갱신이 통째로 안 돈다(실제로 그래서 안 됐다). */
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const poke=()=>{ try{ reg.update(); }catch(e){} };
      setInterval(poke,10*60*1000);
      addEventListener('visibilitychange',()=>{ if(!document.hidden)poke(); });
      addEventListener('online',poke);
      /* ⚠ **첫 설치와 갱신을 구분해야 한다.** 둘 다 새 워커가 activated 로 가는데,
         첫 설치에서 새로고침하면 앱을 켤 때마다 한 번씩 깜빡인다.
         구분은 `updatefound` 시점에 **이미 컨트롤러가 있었나** 하나로 한다. */
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing; if(!nw)return;
        const hadCtrl=!!navigator.serviceWorker.controller;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='activated'&&hadCtrl){ NEWVER=true; applyUpdate(); }
        });
      });
      poke();
    }).catch(()=>{});
    setInterval(applyUpdate,5000);   /* 전투가 끝나 안전해지면 그때 적용한다 */
    const chip=document.getElementById('newver');
    if(chip)chip.onclick=()=>{ RELOADING=true; location.reload(); };
  });

/* ============ 롱프레스 카드 확대 ============ */
/* 카드 본문에 찍힌 이름들에서 용어를 뽑는다. 설명은 카드 밖(옆 패널)에만 둔다. */
function glossaryFor(name,u){
  const c=POOL[name]||{}; const keys=[];
  const push=k=>{ if(GLOSSARY[k]&&!keys.includes(k))keys.push(k); };
  if(c.k==='cr'){
    /* ⚠ 개체가 있으면 **그 개체의 지금 태그**를 본다 — 면역을 얻으면 수호가 풀린다.
       인쇄값으로 두면 없는 수호를 설명하고 얻은 면역은 설명하지 않는다. */
    const g=u?u.g:c.g, f=u?u.f:c.f, pp=u?u.p:c.p;
    if(g&&f)push('비행·수호'); else if(g)push('수호'); else if(f)push('비행');
    if(pp)push('관통');
  }
  if(u&&u.token)push('토큰');
  /* ⚠⚠ 설명은 **카드 설명란과 같은 줄**을 읽는다(liveKw). 인쇄 글을 읽던 시절엔
     투명화로 면역을 받은 몸의 옆 패널이 **빈칸**이었다 — 카드에는 '면역' 이라고 떠 있는데
     설명은 아무것도 없었다(성권이 잡았다). 둘이 어긋나면 어느 쪽을 믿어야 할지 알 수 없다. */
  const txt=(u&&c.k==='cr')?liveKw(name,u).replace(/<[^>]+>/g,'')
                           :(c.kw||(u&&u.kw)||'');
  txt.split('·').forEach(part=>push(part.trim().split(/[\s0-9+]/)[0]));
  if(!keys.length)return '';
  return `<div class="zside">${keys.map(k=>{
    const [cat,def]=GLOSSARY[k];
    return `<div class="zdef"><div class="k"><span class="kn">${k}</span><span class="kc">${cat}</span></div>`
      +`<div class="kd">${def}</div></div>`;
  }).join('')}</div>`;
}
/* 성장·진형 카드는 **상위 몸을 뒤에 겹쳐** 보여 준다. 좌우로 스와이프(또는 탭)하면 앞뒤가 바뀐다.
   ⚠ 상위 몸은 GROWN 에만 있고 덱·목록에는 없다 — 여기서 안 보여 주면 "뭐가 되는지" 를 알 길이 없다. */
function grownPeer(name){
  const c=POOL[name]||{};
  if(c.grown&&c.base)return c.base;                     /* 이미 상위 몸 → 원본을 뒤에 */
  const kw=c.kw||'';
  if(/성장/.test(kw)&&POOL['성장한 '+name])return '성장한 '+name;
  if(/진형/.test(kw)&&POOL['각성한 '+name])return '각성한 '+name;
  const r=riseOf(kw); if(r)return r;                     /* 작열 좀비 → 잿더미 좀비 */
  return riseBase(name);                                 /* 잿더미 좀비 → 작열 좀비 (역방향) */
}
/* 이 카드를 남기는 원본을 되찾는다. 되살아나는 몸에는 역방향 표시가 없으므로 풀을 훑는다
   (155종 · 확대할 때 한 번뿐이라 값싸다). */
function riseBase(name){
  for(const n in POOL){ if(riseOf((POOL[n]||{}).kw)===name)return n; }
  return null;
}
/* 확대창 아래 안내 문구 — 뒤에 겹친 카드가 무엇인지에 따라 달라진다 */
function peerLabel(front,back,u){
  if(u&&u.ate&&u.ate===back)return '삼킨 크리처';
  if((POOL[back]||{}).grown)return '성장한 몸';
  if((POOL[front]||{}).grown)return '원래 몸';
  if(riseOf((POOL[front]||{}).kw)===back)return '남기는 몸';
  if(riseOf((POOL[back]||{}).kw)===front)return '원래 몸';
  return '뒷면';
}
function zoomHTML(name,u){
  if(POOL[name]){
    /* 뒤에 겹쳐 보여 줄 카드 — 성장/진형의 상위 몸이거나, 고블린 전차가 **삼킨 개체**다.
       삼킨 쪽이 우선한다(지금 실제로 그 안에 들어 있는 것이니까). */
    const peer=(u&&u.ate&&POOL[u.ate])?u.ate:grownPeer(name);
    const stack=peer
      ? `<div class="zstack" data-a="${name}" data-b="${peer}">`
        +`<div class="zfront">${tcardHTML(name,{size:'lg',unit:u})}</div>`
        +`<div class="zback">${tcardHTML(peer,{size:'lg'})}</div>`
        +`<i class="zswipe">← 넘겨서 ${peerLabel(name,peer,u)} 보기 →</i></div>`
      : tcardHTML(name,{size:'lg',unit:u});
    return `<div class="zwrap">${stack}${glossaryFor(name,u)}</div>`
      +`<div class="zhint">${peer?'카드를 넘겨 뒷면 · <b>카드 밖</b>을 눌러 닫기'
                               :'아무 곳이나 눌러 닫기'}</div>`;
  }
  if(LANDS[name]) return landCardHTML(name,'lg')+'<div class="zhint">아무 곳이나 눌러 닫기</div>';
  if(u&&u.token){                                /* 소환된 토큰 */
    return `<div class="zwrap"><div class="tcard lg" style="--el:#8894A6">
      <div class="thead"><div class="tname">${name}</div><div class="tcost"></div></div>
      <div class="tart"></div>
      <div class="tbody"><div class="teff"><b>토큰</b> — 스펠이 만들어 낸 개체. 손으로 돌아가지 않는다.</div></div>
      <div class="tstat"><span class="tb a">${u.a}</span><span class="tb h">${Math.max(0,u.insts[0]?u.insts[0].hp:0)}</span></div>
      </div>${glossaryFor(name,u)}</div><div class="zhint">아무 곳이나 눌러 닫기</div>`;
  }
  return '';
}
let lpT=null, lpFired=false, lpSrc=null, lpHold=false, lpAt=0, lpDown=false;
const zoomOn=()=>document.getElementById('zoom').classList.contains('on');
/* hold 는 이제 쓰지 않는다(항상 false = 팝업).
   손패도 보드도 길게 누르면 **팝업으로 떠 있고, 화면 아무 곳이나 눌러야 닫힌다.**
   예전에는 손패만 '누르고 있는 동안'이었는데, 손을 떼면 사라져 카드를 읽을 시간이 없었다. */
function showZoom(name,u,src,hold){
  const z=document.getElementById('zoom');
  z.innerHTML=zoomHTML(name,u); z.classList.add('on');
  /* 확대하는 동안 손패의 원본도 살짝 커져서 '이 카드' 임을 알려 준다 */
  if(lpSrc)lpSrc.classList.remove('zoomed');
  lpSrc=src&&src.classList&&src.classList.contains('hcw')?src:null;
  if(lpSrc)lpSrc.classList.add('zoomed');
  lpHold=!!hold;
  z.classList.toggle('hold',!!hold);
  bindZoomSwipe(z);
  if(!hold)setTimeout(()=>armZoomCloser(),60);
}
/* '아무 곳이나 누르면 닫힘' 을 document 의 **캡처** 단계에 건다.
   ⚠⚠ 그래서 겹친 카드(.zstack) 위에서 손을 대도 이게 **먼저** 잡아 창이 닫혔다 —
      .zstack 쪽 stopPropagation 은 캡처가 끝난 뒤라 이미 늦는다. 성장·삼킴·되살아남 카드를
      넘겨 보려는 손짓이 매번 창을 닫아 버려 뒷면을 아예 볼 수 없었다.
   그래서 카드 안에서 시작한 손짓이면 **닫지 않고 다시 건다**(once 로 걸었으니 재무장). */
function armZoomCloser(){
  document.addEventListener('pointerdown',zoomCloser,{once:true,capture:true});
}
function zoomCloser(e){
  const z=document.getElementById('zoom');
  if(!z.classList.contains('on'))return;
  if(e.target&&e.target.closest&&e.target.closest('.zstack')){ armZoomCloser(); return; }
  hideZoom(e);
}
/* 성장 전/후 넘기기 — 가로로 24px 이상 끌거나 그냥 탭하면 앞뒤가 바뀐다.
   ⚠ 여기서 이벤트를 **삼켜야** 한다. 확대창은 '아무 데나 누르면 닫힘' 이라
      막지 않으면 넘기려던 손짓이 그대로 창을 닫는다. */
function bindZoomSwipe(z){
  const st=z.querySelector('.zstack'); if(!st)return;
  let x0=null,y0=null;
  const flip=e=>{ e.stopPropagation(); e.preventDefault();
    st.classList.toggle('flip');
    const sw=st.querySelector('.zswipe');
    if(sw){ const a=st.dataset.a,b=st.dataset.b, f=st.classList.contains('flip');
      sw.textContent=`← 넘겨서 ${peerLabel(f?b:a,f?a:b)} 보기 →`; }
  };
  st.addEventListener('pointerdown',e=>{ e.stopPropagation(); x0=e.clientX; y0=e.clientY; },true);
  st.addEventListener('pointerup',e=>{
    if(x0===null)return;
    const dx=Math.abs(e.clientX-x0), dy=Math.abs(e.clientY-y0);
    x0=null;
    if(dx>=24&&dx>dy)flip(e);          /* 가로 스와이프 */
    else if(dx<10&&dy<10)flip(e);      /* 그냥 탭 */
    else e.stopPropagation();
  },true);
}
/* swallow===false 면 뒤따르는 click 을 막지 않는다(짧게 눌렀다 뗀 것 = 선택). */
function hideZoom(swallow){
  const z=document.getElementById('zoom');
  if(lpSrc){ lpSrc.classList.remove('zoomed'); lpSrc=null; }
  lpHold=false;
  if(!z.classList.contains('on'))return;
  z.classList.remove('on','hold'); z.innerHTML='';
  if(swallow!==false)lpFired=true;      // 닫는 탭이 카드 플레이로 이어지지 않도록
}
let lpX=0,lpY=0;
document.addEventListener('pointerdown',e=>{
  if(document.getElementById('zoom').classList.contains('on'))return;
  const lzs=e.target.closest('.lz .slot');
  const slot=e.target.closest('.slot.occ'), hc=e.target.closest('.hcw,.hc');
  let name=null,u=null;
  /* ⚠ 지형존을 **먼저** 본다. 지형 슬롯도 `.slot.occ` 라 아래 분기에 먼저 걸리면
     board[undefined] 를 읽고 조용히 아무것도 안 한다(= 지형 확대가 안 됐던 이유).
     뒤집힌 지형도 DOM 이 아니라 데이터에서 이름을 찾으므로 그대로 확대된다. */
  if(lzs&&S[lzs.dataset.lz]){ const l=S[lzs.dataset.lz].lands[+lzs.dataset.i]; if(l)name=l.name; }
  else if(slot){ u=S[slot.dataset.side==='me'?'me':'ai'].board[+slot.dataset.idx]; if(u)name=u.name; }
  else if(hc){ name=S.me.hand[+hc.dataset.h]; }
  if(!name)return;
  lpFired=false; lpDown=true; clearTimeout(lpT); lpT=null; lpX=e.clientX; lpY=e.clientY; lpAt=Date.now();
  /* 길게 눌러야(420ms) 열리고, 그 다음엔 **팝업으로 남는다**.
     ⚠ 그래도 '끌기 탈출구'는 반드시 살려 둘 것 — 팝업이 화면에 남은 채 손가락이 그대로
        움직이면(아래 pointermove) 확대를 접고 드래그로 넘긴다. 이게 없으면
        "카드 끌기가 갑자기 안 된다"가 된다(예전에 실제로 겪은 증상). */
  lpT=setTimeout(()=>showZoom(name,u,hc||null,false),420);
});
/* 손가락이 조금 흔들려도 취소되지 않도록 이동 임계값을 둔다 */
document.addEventListener('pointermove',e=>{
  const far=Math.hypot(e.clientX-lpX,e.clientY-lpY)>12;
  if(lpT&&far){clearTimeout(lpT);lpT=null;}
  /* 누른 채로 움직였다 = 끌기. 팝업이 떠 있어도 접고 드래그로 넘긴다. */
  if(lpDown&&far&&zoomOn())hideZoom(false);
},{passive:true});
['pointerup','pointercancel','scroll'].forEach(ev=>
  document.addEventListener(ev,()=>{
    clearTimeout(lpT); lpT=null;
    /* 팝업이 이 누름으로 열렸다면, 손 뗄 때 따라오는 click 이 카드 선택으로 새지 않게 막는다.
       (닫는 건 다음 탭이 한다 — 여기서 닫지 않는다) */
    if(lpDown&&zoomOn())lpFired=true;
    lpDown=false;
  },{passive:true}));
document.addEventListener('click',e=>{ if(lpFired){e.stopPropagation();e.preventDefault();lpFired=false;} },true);
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.slot.occ,.hcw,.hc'))e.preventDefault(); });

/* ============ 드래그 앤 드롭 ============ */
/* 손패는 가로 스크롤이므로 제스처를 나눈다 — 가로 우세 = 스크롤 · 세로(위) = 카드 끌어내기.
   드롭 판정은 "손패 사각형 밖이면 발동". 슬롯을 정확히 맞출 필요가 없다. */
let DR=null, dg=null, HANDLOCK=false;
const DZTIP={land:'지형 배치',place:'표시된 자리에 소환',ench:'표시된 자리에 배치',
  summon:'표시된 자리에 토큰 소환',instant:'즉시 발동',
  mine:'대상 지정으로',target:'대상 지정으로'};
function handRect(){ return document.getElementById('hand').getBoundingClientRect(); }
function inHand(x,y){
  const r=handRect();
  return x>=r.left-10&&x<=r.right+10&&y>=r.top-8&&y<=r.bottom+12;
}
function dragStart(i,x,y,dgid){
  if(S.over||S.busy||S.active!=='me')return;
  const n=S.me.hand[i]; if(n===undefined)return;
  if(!isLand(n)&&!POOL[n])return;
  const mode=modeOf(n); if(!mode)return;
  const why=whyNotPlayable(n);
  hideZoom(false); endTargeting();
  clearTimeout(lpT); lpT=null;
  /* 모드를 미리 세워 두면 기존 슬롯 하이라이트(.pick)가 그대로 켜진다.
     ⚠ 이때 손패는 건드리지 않는다(HANDLOCK) — 지금 손가락이 잡고 있는 노드다. */
  S.sel=i; S.mode=mode==='land'?null:mode;
  HANDLOCK=true; render(); HANDLOCK=false;
  const src=document.querySelector(`.hcw[data-h="${i}"]`);
  if(src)src.classList.add('dragging');
  const g=document.createElement('div'); g.className='dgh';
  g.innerHTML=isLand(n)?landCardHTML(n,'md'):tcardHTML(n,{size:'md'});
  document.body.appendChild(g);
  const tip=document.createElement('div'); tip.className='dztip'+(why?' bad':'');
  tip.textContent=why?`${n} — ${why}`:`${n} — 손패 밖에 놓으면 ${DZTIP[mode]||'발동'}`;
  document.body.appendChild(tip);
  document.body.classList.add('dragmode');
  DR={i,n,mode,g,tip,payable:!why,why,pid:dgid};
  dragMove(x,y);
}
/* 손끝 x 로 '몇 번째에 끼울지'를 정한다 — 카드 중심을 지나면 그 다음 자리. */
function insertAt(x){
  const b=document.getElementById('myBoard'); if(!b)return 0;
  const cards=[...b.querySelectorAll(':scope > .slot')];
  let at=0;
  cards.forEach(c=>{ const r=c.getBoundingClientRect(); if(x>r.left+r.width/2)at++; });
  return Math.min(at,cards.length);
}
function showDropbar(at){
  const b=document.getElementById('myBoard'), bar=document.getElementById('dropbar');
  if(!b||!bar)return;
  const cards=[...b.querySelectorAll(':scope > .slot')];
  const bb=b.getBoundingClientRect();
  let x;
  if(!cards.length) x=bb.width/2;                                   /* 비면 한가운데 */
  else if(at<=0) x=cards[0].getBoundingClientRect().left-bb.left-3;
  else if(at>=cards.length) x=cards[cards.length-1].getBoundingClientRect().right-bb.left+3;
  else{ const a=cards[at-1].getBoundingClientRect(), c=cards[at].getBoundingClientRect();
        x=(Math.max(a.right,c.left)+c.left)/2-bb.left; }
  bar.style.left=x+'px'; bar.classList.add('on');
}
function hideDropbar(){ const bar=document.getElementById('dropbar'); if(bar)bar.classList.remove('on'); }
function dragMove(x,y){
  if(!DR)return;
  DR.g.style.transform=`translate(${x-46}px,${y-74}px) rotate(-3.5deg) scale(1.05)`;
  const ok=!inHand(x,y)&&DR.payable;
  DR.g.classList.toggle('ok',ok);
  DR.g.classList.toggle('bad',!DR.payable);
  DR.tip.classList.toggle('ok',ok);
  document.body.classList.toggle('armed',ok);
  /* 소환·배치는 놓일 자리를 미리 보여 준다 */
  if(ok&&(DR.mode==='place'||DR.mode==='ench'||DR.mode==='summon')&&boardRoom('me')){
    DR.at=insertAt(x); showDropbar(DR.at);
  }else{ DR.at=null; hideDropbar(); }
}
function dragEnd(x,y,cancel){
  if(!DR)return; const d=DR; DR=null;
  d.g.remove(); d.tip.remove(); hideDropbar();
  if(d.pid!=null){ try{document.body.releasePointerCapture(d.pid);}catch(_){ } }
  document.body.classList.remove('dragmode','armed');
  document.querySelectorAll('.hcw.dragging').forEach(e=>e.classList.remove('dragging'));
  dbg(`end #${d.i} ${cancel?'취소':'놓음'} @${Math.round(x)},${Math.round(y)}`);
  if(cancel||inHand(x,y)){ S.sel=null;S.mode=null;render(); return; }
  const el=document.elementFromPoint(x,y);
  const slot=el&&el.closest?el.closest('.slot[data-side]'):null;
  const hit=slot?{side:slot.dataset.side,idx:+slot.dataset.idx}:null;
  /* 대상이 필요한 스펠 — **언제나** 화살표 타게팅으로 넘어간다.
     ⚠ 예전에는 '대상 위에 바로 떨구면 그대로 발동' 하는 지름길이 있었다. 없앴다 —
       카드를 내려놓는 손짓과 대상을 고르는 손짓이 한 동작에 섞여서, 판이 붐빌수록
       엉뚱한 몸에 꽂히기 쉬웠다. 이제 **내면 대상 선택이 뜨고, 골라야 나간다.** */
  if(d.mode==='target'||d.mode==='mine'){
    if(!hasTargetFor(d.mode,d.n)){ toast(NOSLOT[d.mode]); S.sel=null;S.mode=null;render(); return; }
    startTargeting(d.i,d.n,d.mode,x,y); return;
  }
  playFromHand(d.i, hit, d.at);
}

/* ============ 타게팅 (하스스톤 방식) ============ */
/* 카드는 판 위에 선 채로 멈추고, 손끝까지 화살표가 이어진다. 유효 대상을 탭하면 발동. */
/* 본체를 가리키는 슬롯 번호. 실제 슬롯과 절대 겹치지 않는 값이어야 한다. */
const FACE=-99;
let TGT=null;
function tgtValid(x,y){
  if(!TGT)return null;
  const el=document.elementFromPoint(x,y);
  /* 본체 — 상대 정보줄(이름·HP·체력바) 어디를 눌러도 잡힌다. 슬롯보다 **먼저** 본다. */
  if(TGT.mode==='target'&&canFace(TGT.n)&&el&&el.closest&&el.closest('#foeBar'))
    return {side:'ai',idx:FACE};
  const slot=el&&el.closest?el.closest('.slot[data-side]'):null;
  if(!slot)return null;
  const side=slot.dataset.side, idx=+slot.dataset.idx;
  const want=TGT.mode==='target'?'ai':'me';
  if(side!==want||!slotOkFor(TGT.mode,TGT.n,side,idx))return null;
  return {side,idx};
}
function tgtDraw(x,y){
  if(!TGT)return;
  /* ⚠ 예전엔 화면 가운데에 **고른 카드를 크게 띄우고** 거기서 화살표를 뽑았다.
     그런데 그 카드가 판을 통째로 가려서 **무엇을 겨누는지 안 보였다**(성권 지적).
     카드는 없애고, 화살표만 그 자리(내 판 가운데)에서 뽑는다 — 시작점만 있으면 된다. */
  const x1=TGT.ox, y1=TGT.oy;
  const dx=x-x1, dy=y-y1;
  const cx=x1+dx*0.5, cy=y1+dy*0.5-Math.min(150,Math.abs(dx)*0.45+40);   /* 위로 휘는 곡선 */
  TGT.svg.classList.toggle('bad',!tgtValid(x,y));
  const ang=Math.atan2(y-cy,x-cx), L=15;
  const p1=`${x-L*Math.cos(ang-0.42)},${y-L*Math.sin(ang-0.42)}`;
  const p2=`${x-L*Math.cos(ang+0.42)},${y-L*Math.sin(ang+0.42)}`;
  TGT.svg.innerHTML=`<path class="ln" d="M${x1},${y1} Q${cx},${cy} ${x},${y}"/>`
    +`<polygon class="hd" points="${x},${y} ${p1} ${p2}"/>`;
}
function startTargeting(i,n,mode,x,y){
  S.sel=i; S.mode=mode; render();
  /* 화살표가 뽑히는 자리 — 내 판 가운데(없으면 손패 바로 위). 카드는 안 띄운다. */
  const bd=document.getElementById('myBoard');
  const hr=document.getElementById('hand').getBoundingClientRect();
  const br=bd?bd.getBoundingClientRect():null;
  const ox=br?br.left+br.width/2:hr.left+hr.width/2;
  const oy=br?br.top+br.height/2:hr.top-18;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='tgtsvg'; document.body.appendChild(svg);
  document.body.classList.add('tgtmode');
  TGT={i,n,mode,svg,ox,oy};
  /* 조작 줄에서 안내를 뺐으므로 여기서 한 번 알려 준다 */
  toast(mode==='mine'?'빛나는 내 크리처를 누르세요 · 빈 곳을 누르면 취소'
                     :'빛나는 대상을 누르세요 · 빈 곳을 누르면 취소');
  tgtDraw(x,y);
}
function endTargeting(){
  if(!TGT)return;
  TGT.svg.remove();
  document.body.classList.remove('tgtmode');
  TGT=null;
}
function cancelTargeting(){ endTargeting(); S.sel=null; S.mode=null; render(); }
/* 타게팅 중에는 슬롯의 기본 클릭보다 먼저 가로챈다 */
document.addEventListener('pointerdown',e=>{
  if(!TGT)return;
  const t=tgtValid(e.clientX,e.clientY);
  e.stopPropagation(); e.preventDefault();
  const i=TGT.i; endTargeting();
  if(t){ lpFired=true; clickSlot(t.side,t.idx); }
  else { S.sel=null;S.mode=null;render(); toast('취소 — 카드가 손으로 돌아왔다'); }
},true);
document.addEventListener('pointermove',e=>{ if(TGT)tgtDraw(e.clientX,e.clientY); },{passive:true});
/* 화면 확대 차단 — CSS(touch-action)만으로는 iOS 사파리가 새어 나간다.
   ⚠ touchend 로 더블탭을 막는 흔한 수법은 쓰지 않는다. 카드 탭 → 슬롯 탭처럼
      빠른 연타가 정상 조작이라 그 클릭까지 삼켜 버린다. 확대 제스처만 정확히 막는다. */
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches.length>1)e.preventDefault(); },{passive:false});
/* 길게 눌렀을 때 뜨는 컨텍스트 메뉴(돋보기·복사)도 막는다 — 카드 확대와 겹친다 */
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('input,textarea,[contenteditable]'))return;
  e.preventDefault();});
const DBG=/[?&]dbg=1/.test(location.search);   /* 주소 끝에 ?dbg=1 을 붙이면 포인터 동작을 로그로 남긴다 */
function dbg(m){ if(DBG)log('· '+m,'t'); }
document.addEventListener('pointerdown',e=>{
  /* 확대 여부를 보고 막지 않는다 — 손패는 누르는 순간 확대되므로 여기서 막으면 드래그가 죽는다 */
  const hc=e.target.closest('.hcw'); if(!hc)return;
  dbg(`down ${e.pointerType} #${hc.dataset.h} ${S.me.hand[+hc.dataset.h]||''} @${Math.round(e.clientX)},${Math.round(e.clientY)}`);
  /* 낼 수 없는 카드도 끌리게 둔다 — 아무 반응이 없으면 '드래그가 안 된다'로 읽힌다.
     놓는 순간 playFromHand 가 이유를 알려 준다(마나 부족 / 이번 턴 지형 이미 놓음 …). */
  dg={i:+hc.dataset.h,x:e.clientX,y:e.clientY,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(DR){ e.preventDefault(); dragMove(e.clientX,e.clientY); return; }
  if(!dg)return;
  const dx=e.clientX-dg.x, dy=e.clientY-dg.y;
  if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.4){ dg=null; return; }   /* 가로 = 손패 스크롤 */
  if(dy<-14||Math.hypot(dx,dy)>26){
    const i=dg.i, pid=dg.id; dg=null; dbg(`start #${i}`); dragStart(i,e.clientX,e.clientY,pid);
    /* 손가락을 몸통(body)에 붙들어 둔다 — 중간에 대상 노드가 사라지거나 브라우저가
       스크롤로 가져가려 해도 pointermove 가 끊기지 않는다. 모바일에서만 나던 끊김의 보루. */
    if(DR&&pid!=null){ try{document.body.setPointerCapture(pid);}catch(_){ } }
  }
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(DR){ lpFired=true; dragEnd(e.clientX,e.clientY,false); }   /* 뒤따르는 click 이 카드 선택으로 새지 않게 */
  dg=null;
});
document.addEventListener('pointercancel',()=>{
  if(DR){ dragEnd(0,0,true); toast('제스처가 중단되어 취소됐다'); log('드래그 취소 — pointercancel','t'); }
  dg=null;
});

/* ── 시작 로딩 ─────────────────────────────────────────
   글꼴이 늦게 오면 카드 글자가 튀므로 글꼴까지 기다렸다 내린다.
   무슨 일이 있어도 2.5초 뒤에는 반드시 걷는다(멈춰 보이면 최악이다). */
(function boot(){
  const t0=Date.now(), MIN=420, MAX=2500;
  const done=()=>setTimeout(bootDone,Math.max(0,MIN-(Date.now()-t0)));
  bootSay('카드 데이터 준비 중…');
  const fonts=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  fonts.then(()=>bootSay('화면 구성 중…')).catch(()=>{});
  Promise.race([
    Promise.all([fonts.catch(()=>{}),
      new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r,{once:true}))]),
    new Promise(r=>setTimeout(r,MAX))
  ]).then(done);
  setTimeout(bootDone,MAX+400);
})();

/* 시작 — 모드 선택 페이지부터. ?dev=1 이면 바로 배틀(자동 테스트용). */
if(DEV){ FLOW={mode:'battle',my:'steel',foe:'steel'}; startBattle(); }
else { newGame(); pgMode(); }
document.getElementById('verTag').textContent=`TEN v${VERSION} · ${BUILD}`;
</script>
</body>
