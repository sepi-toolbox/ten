const FOEBANDS=(typeof ENEMY!=='undefined'&&ENEMY.bands)?ENEMY.bands:[0,3,7];
const FOEBY={}; FOES.forEach(e=>{ FOEBY[e.id]=e; });
function bandOf(floor){                 /* 층 → 난이도 단계 0·1·2 */
  let b=0; FOEBANDS.forEach((f,i)=>{ if(floor>=f)b=i; }); return b;
}
function foeHpFor(tier,floor){
  const [base,per]=FOEHP[tier]||FOEHP.normal;
  return Math.round(base+per*floor);
}
/* 내 속성은 빼고 고른다. 최근에 쓴 적은 잠시 제외해 같은 얼굴이 연달아 나오지 않게 한다. */
let FOEUSED=[];
function pickFoe(tier,el,floor,seed){
  let cand=FOES.filter(e=>e.tier===tier&&e.el!==el);
  if(!cand.length)return null;
  const fresh=cand.filter(e=>!FOEUSED.includes(e.id));
  if(fresh.length)cand=fresh;
  const e=cand[rnd(cand.length)];
  FOEUSED.push(e.id);
  if(FOEUSED.length>Math.max(4,Math.floor(FOES.length/4)))FOEUSED.shift();
  return e;
}
const NODEKO={normal:'일반',elite:'정예',event:'이벤트',shop:'상점',boss:'보스'};

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function rgEl(){ return RG.el; }
/* 이 속성의 기본 카드 20종(지형 제외) */
/* ⚠ 적 전용 카드(POOL[n].foe)는 보상·상점에 **절대** 안 나온다 — 균형을 안 맞춘 카드다 */
/* 원정 보상·상점에 뜰 수 있는 카드. ⚠ **토큰은 뺀다** — 해그의 시약·관·듀라한의 머리처럼
   부모 카드가 만들어 내기만 하는 것들이다. 손에 넣어도 낼 수 없거나(0코 토큰) 덱에서
   혼자 굴러다니면 아무 일도 안 한다. 보상으로 나오고 있었다(성권이 잡았다). */
function poolOf(el){
  return Object.keys(POOL).filter(n=>POOL[n].el===el
    &&!POOL[n].over&&!POOL[n].foe&&!POOL[n].tok); }
/* 희귀도 가중 뽑기 — 보상·상점에서 어떤 카드가 뜰지 정한다.
   가중치는 rogue.json(config.rarityWeights)이 정본이고, 없으면 아래 기본값을 쓴다.
   ⚠ '있는 카드 중에서' 고르는 것이라, 그 속성에 레전더리가 없으면 가중치가 아무리 높아도 안 나온다. */
const RARW=(RC.rarityWeights)||{normal:{common:60,uncommon:26,rare:11,legendary:3}};
function pickByRarity(names,mode){
  if(!names.length)return null;
  const w=RARW[mode]||RARW.normal||{};
  let tot=0; const acc=[];
  names.forEach(n=>{ tot+=(w[rarOf(n)]!=null?w[rarOf(n)]:1); acc.push(tot); });
  if(tot<=0)return pick(names);
  const r=Math.random()*tot;
  for(let i=0;i<acc.length;i++) if(r<acc[i])return names[i];
  return names[names.length-1];
}
function overOf(el){ return Object.keys(POOL).filter(n=>POOL[n].el===el&&POOL[n].over); }

function rgOpen(html){ const m=document.getElementById('rg'); m.innerHTML=`<div class="mbox">${html}</div>`; m.classList.add('on'); return m; }
function rgClose(){ const m=document.getElementById('rg'); m.classList.remove('on'); m.innerHTML=''; }
function rgHead(t,sub){
  return `<h2>${t}</h2>${sub?`<div class="msub">${sub}</div>`:''}
   <div class="rgbar" style="justify-content:center">
     <span class="pill hp">HP <b>${RG.hp}</b>/${RG.maxhp}</span>
     <span class="pill gold">골드 <b>${RG.gold}</b></span>
     <span class="pill">덱 <b>${RG.deck.length}</b>장</span>
     <span class="pill">${RG.cleared}/${RC.floors-1} 층</span></div>`;
}

/* ── 지도 생성 ─────────────────────────────────────────── */
function rgMakeMap(){
  const F=RC.floors, W=RC.width, w=RC.nodeWeights, map=[];
  const roll=()=>{ let t=0,r=Math.random()*(w.normal+w.elite+w.event+w.shop);
    for(const k of ['normal','elite','event','shop']){ t+=w[k]; if(r<t)return k; } return 'normal'; };
  for(let f=0;f<F;f++){
    if(f===F-1){
      const bn={t:'boss'}, be=pickFoe('boss',RG.el,f,0);
      if(be){ bn.e=be.id; bn.hp=foeHpFor('boss',f); bn.band=bandOf(f); }
      map.push([bn]); continue;
    }
    const n=f===0?3:1+rnd(W);
    const row=[];
    for(let i=0;i<n;i++){
      let t=f===0?'normal':roll();
      if(f<2&&t!=='normal'&&t!=='event')t='normal';     /* 초반엔 정예·상점 없음 */
      if(f===F-2&&t==='elite')t='shop';                 /* 보스 직전엔 정비 */
      const nd={t};
      if(t==='normal'||t==='elite'||t==='boss'){        /* 어떤 적인지 지도에서 미리 보인다 */
        const e=pickFoe(t,RG.el,f,i);
        if(e){ nd.e=e.id; nd.hp=foeHpFor(t,f); nd.band=bandOf(f); }
      }
      row.push(nd);
    }
    map.push(row);
  }
  /* 다음 층으로 가는 간선 — 이웃한 인덱스로만 이어 경로 선택이 의미 있게 */
  for(let f=0;f<F-1;f++){
    const cur=map[f], nxt=map[f+1];
    cur.forEach((nd,i)=>{
      const c=Math.round(i/Math.max(1,cur.length-1)*(nxt.length-1));
      const set=new Set([c]);
      if(Math.random()<.55)set.add(Math.max(0,c-1));
      if(Math.random()<.55)set.add(Math.min(nxt.length-1,c+1));
      nd.to=[...set].sort((a,b)=>a-b);
    });
    nxt.forEach((nd,j)=>{ if(!cur.some(x=>x.to.includes(j))) cur[Math.min(j,cur.length-1)].to.push(j); });
  }
  return map;
}
function rgReach(){                     /* 지금 갈 수 있는 노드 */
  if(RG.floor<0)return map0();
  const nd=RG.map[RG.floor][RG.at];
  return {f:RG.floor+1, idx:(nd&&nd.to)?nd.to:[]};
  function map0(){ return {f:0, idx:RG.map[0].map((_,i)=>i)}; }
}

/* ── 지도 화면 ─────────────────────────────────────────── */
function rgMap(){
  RG.fighting=false;              /* 전투를 도중에 접고 나왔어도 깎인 HP 는 그대로 남는다 */
  const reach=rgReach();
  const rows=RG.map.map((row,f)=>{
    const cells=row.map((nd,i)=>{
      const can=f===reach.f&&reach.idx.includes(i);
      const done=f<=RG.floor&&(f<RG.floor||i===RG.at);
      const cls=['mnode',nd.t==='boss'?'boss':'',can?'can':'',done?'done':''].filter(Boolean).join(' ');
      const e=nd.e?FOEBY[nd.e]:null;
      return `<div class="${cls}" data-f="${f}" data-i="${i}">
        <span class="ic">${NODEICON[nd.t]}</span><span class="nm">${e?e.name:NODEKO[nd.t]}</span>
        ${e?`<span class="fs" style="--c:${(EL[e.el]||EL.steel).c}">${e.style} · HP ${nd.hp}</span>`:''}</div>`;
    }).join('');
    return `<div class="mrow">${cells}</div>`;
  }).reverse().join('');
  rgOpen(rgHead('원정 지도','아래에서 위로 올라갑니다. 빛나는 칸만 갈 수 있고, 경로에 따라 만나는 적과 보상이 달라집니다.')
    + `<div class="map"><svg id="mapsvg"></svg>${rows}</div>`
    + `<div class="mbtns"><button id="rgDeck">내 덱 보기</button><button id="rgQuit">원정 포기</button></div>`);
  rgDrawEdges(reach);
  document.querySelectorAll('#rg .mnode.can').forEach(el=>el.onclick=()=>rgEnter(+el.dataset.f,+el.dataset.i));
  document.getElementById('rgDeck').onclick=rgDeckView;
  document.getElementById('rgQuit').onclick=()=>{ rgClose(); flowHome(); };
}
/* 경로선 — 노드 위치를 실측해 SVG로 잇는다. 갈 수 있는 길만 밝게. */
function rgDrawEdges(reach){
  const svg=document.getElementById('mapsvg'); if(!svg)return;
  const map=svg.parentElement, mb=map.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${mb.width} ${mb.height}`);
  const at=(f,i)=>{ const e=map.querySelector(`.mnode[data-f="${f}"][data-i="${i}"]`); if(!e)return null;
    const r=e.getBoundingClientRect();
    return {x:r.left-mb.left+r.width/2, y:r.top-mb.top+r.height/2, h:r.height/2}; };
  let out='';
  RG.map.forEach((row,f)=>row.forEach((nd,i)=>{
    (nd.to||[]).forEach(j=>{
      const a=at(f,i), b=at(f+1,j); if(!a||!b)return;
      const live=(f===RG.floor&&i===RG.at)||(RG.floor<0&&f===0);
      const done=f<RG.floor||(f===RG.floor&&i===RG.at);
      const col=done?'rgba(79,196,166,.75)':(live?'rgba(242,212,136,.85)':'rgba(160,130,80,.22)');
      const wdt=done||live?2.2:1.4;
      const my=(a.y-a.h+b.y+b.h)/2;
      out+=`<path d="M${a.x} ${a.y-a.h} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y+b.h}"
        fill="none" stroke="${col}" stroke-width="${wdt}" stroke-linecap="round"
        ${live?'style="filter:drop-shadow(0 0 5px rgba(242,212,136,.8))"':''}/>`;
    });
  }));
  svg.innerHTML=out;
}
function rgDeckView(){
  const cnt={}; RG.deck.forEach(n=>cnt[n]=(cnt[n]||0)+1);
  const names=Object.keys(cnt).sort((a,b)=>(POOL[a].c-POOL[b].c)||a.localeCompare(b));
  /* ⚠ 판 번호를 여기 같이 찍는다. 옛 캐시가 남아 **지운 카드가 그대로 보이는** 일이 있었는데,
     화면만 봐서는 '카드가 안 지워졌다' 와 '옛 판을 보고 있다' 를 구분할 수가 없었다.
     이 줄 하나면 스크린샷만으로 판가름이 난다. */
  const lands=runLands();
  const nl=lands.reduce((a,[,c])=>a+c,0);
  rgOpen(rgHead('내 덱',`카드 ${RG.deck.length}장 + 지형 ${nl}장 = ${RG.deck.length+nl}장`
      +` <span style="opacity:.55">· v${VERSION}</span>`)
    +`<div class="lbl" style="margin:2px 0 6px">카드 ${RG.deck.length}장</div>`
    +`<div class="rgcards">${names.map(n=>`<div class="rgc ${POOL[n].over?'ovr':''}">
        ${tcardHTML(n,{size:'md'})}<span class="price">×${cnt[n]}</span></div>`).join('')}</div>`
    /* ⚠ 지형도 같이 보여 준다. 원정 보상으로 지형을 얻을 수 있게 된 뒤로는
       '내가 무슨 지형을 들고 있나' 가 곧 덱 정보다. */
    +`<div class="lbl" style="margin:14px 0 6px">지형 ${nl}장</div>`
    +`<div class="rgcards">${lands.map(([n,c])=>`<div class="rgc">
        ${landCardHTML(n,'md')}<span class="price">×${c}</span></div>`).join('')}</div>`
    +`<div class="mbtns"><button class="go" id="rgBack">지도로</button></div>`);
  document.getElementById('rgBack').onclick=rgMap;
}

/* ── 노드 진입 ─────────────────────────────────────────── */
/* 지형 매수는 카드 수에 비례시킨다. 견본 덱이 카드 23 + 지형 17이므로 그 비율(≈0.74)을 유지.
   덱이 커질수록 원하는 카드가 덜 오는 것이 로그라이크의 압박이고, 카드 제거가 그 해답이다. */
function landsFor(n){ return Math.max(8, Math.round(n*17/23)); }
function rgEnter(f,i){
  const nd=RG.map[f][i];
  if(nd.t==='event'){ RG.floor=f; RG.at=i; return rgEvent(); }
  if(nd.t==='shop'){ RG.floor=f; RG.at=i; return rgShop(); }
  return rgEncounter(nd,f,i);          /* 전투는 '전투 시작'을 눌러야 진입 확정 */
}
/* 적 조우 — 누구와 싸우는지, 어떤 덱인지 먼저 보여준다 */
function rgEncounter(nd,f,i){
  const e=nd.e?FOEBY[nd.e]:null;
  const go=()=>{ RG.floor=f; RG.at=i; rgFight(nd.t,e,nd); };
  if(!e)return go();
  const band=nd.band||0, deck=e.decks[band]||e.decks[0];
  const stars='★'.repeat(band+1)+'☆'.repeat(2-band);
  const ec=(EL[e.el]||EL.steel).c;
  const over=deck.filter(([n])=>n.startsWith('강화 ')).reduce((s,[,c])=>s+c,0);
  const top=deck.slice().sort((a,b)=>{
    const ca=(POOL[a[0]]||{}).c||0, cb=(POOL[b[0]]||{}).c||0; return cb-ca;
  }).slice(0,4);
  const names=deck.map(([x])=>x.replace(/^강화 /,''));
  const cr=names.filter(x=>(POOL[x]||{}).k==='cr').sort((a,b)=>POOL[b].c-POOL[a].c);
  const port=ART[cr.find(x=>ART[x])]||ART[names.find(x=>ART[x])]||'';
  rgOpen(rgHead('적 조우')
    + `<div class="foecard" style="--c:${ec}">
        <div class="fart"${port?` style="background-image:url(${port})"`:''}>
          <span class="ftier">${NODEKO[e.tier]}</span></div>
        <div class="finfo">
          <div class="fnm">${e.name}</div>
          <div class="ftag"><span class="pill" style="border-color:${ec};color:${ec}">${(EL[e.el]||{}).ko} · ${e.style}</span>
            <span class="pill hp">HP ${nd.hp}</span>
            <span class="pill">난이도 ${stars}</span>
            ${over?`<span class="pill gold">강화 ${over}장</span>`:''}</div>
          <div class="fdesc">${e.desc}</div>
        </div>
       </div>
       <div class="lbl2">주력 카드</div>
       <div class="rgcards sm">${top.map(([n,c])=>`<div class="rgc ${(POOL[n]||{}).over?'ovr':''}">
          ${tcardHTML(n,{size:'md'})}<span class="price">×${c}</span></div>`).join('')}</div>
       <div class="mbtns"><button class="go" id="rgGo">전투 시작</button>
         <button id="rgBack2">지도로</button></div>`);
  document.getElementById('rgGo').onclick=go;
  document.getElementById('rgBack2').onclick=rgMap;
}
/* 적 덱 — 명단의 적이 자기 난이도 단계 덱을 그대로 들고 나온다 */
function rgFight(kind,e,nd){
  let cards, land, hp, label;
  if(e){
    const band=(nd&&nd.band)||0;
    cards=(e.decks[band]||e.decks[0]).map(([n,c])=>[n,c]);
    land=e.land; hp=(nd&&nd.hp)||foeHpFor(e.tier,RG.floor);
    label=`${e.name} (${(EL[e.el]||{}).ko} · ${e.style} · ${band+1}단계)`;
  }else{                                  /* 명단이 없을 때의 보루 — 견본 덱 */
    const others=Object.keys(DECKS).filter(x=>x!==RG.el);
    const foe=others[(RG.floor*3+rnd(others.length))%others.length];
    cards=DECKS[foe].list.filter(([n])=>!LANDS[n]).map(([n,c])=>[n,c]);
    land=DECKS[foe].list.find(([n])=>LANDS[n])[0];
    hp=foeHpFor(kind==='boss'?'boss':(kind==='elite'?'elite':'normal'),RG.floor);
    label=`${(EL[foe]||{}).ko} 견본 덱`;
  }
  const total=cards.reduce((s,[,c])=>s+c,0);
  /* 고정 덱을 가진 적은 **지형 구성까지 지정**한다(고블린 요새처럼 자원을 안 내는 지형 포함).
     지정이 없으면 예전대로 기본 지형 한 종류를 카드 수에 비례해 깐다. */
  EDECK=cards.concat((e&&e.lands&&e.lands.length)
    ? e.lands.map(([n,c])=>[n,c])
    : splitBasics(e?e.el:RG.el,landsFor(total)));
  EHP=hp; EOPEN=(e&&e.opener)||null;
  const pc={}; RG.deck.forEach(n=>pc[n]=(pc[n]||0)+1);
  PDECK=Object.entries(pc).map(([n,c])=>[n,c]);
  /* 원정에서 얻은 특수 지형(화염의 원천·지하 감옥…)은 기본 지형 몫에서 그만큼 빼고 섞는다.
     ⚠ 계산은 runLands() 한 곳에만 둔다 — 덱 화면이 같은 값을 보여 줘야 한다. */
  runLands().forEach(([n,c])=>PDECK.push([n,c]));
  RG.foe=e?e.id:null;
  rgClose();
  log(`— ${NODEKO[kind]} 전투 · ${RG.floor+1}층 · ${label} · 적 HP ${hp}`,'a');
  /* ⚠ `RG.fighting` 은 **newGame() 뒤에** 켠다. 여기서 미리 켜면 커튼이 떠 있는 동안의
     render() 가 **지난 전투의 낡은 S.me.hp** 를 RG.hp 로 흘려보낸다 —
     이벤트로 회복한 HP 가 전투에 들어가기도 전에 도로 깎였다(실제로 밟았다). */
  RG.entering=true;                     /* 차리는 동안 RG.hp 를 지킨다 */
  veilRun(`${e?e.name:'적'} 과(와)의 전투 준비 중…`,
          ()=>{ newGame(); RG.entering=false; RG.fighting=true; });
}
/* 속성별 기본 지형. **여러 종류일 수 있다** — 장수를 그 종류들에 고르게 나눠 담는다.
   ⚠ 2026-08 불·물은 기본 지형을 세 종씩 새로 지정했다(옛 화산·심해는 목록에 없어 지웠다).
   ⚠ 정본은 tools/promote_decks.py 의 BASIC_LAND 다 — 그쪽을 고치면 여기도 같이 고칠 것. */
const BASICLAND={fire:['불지옥','용암 폭포','용암 동굴'],water:['파도 지대','폭포','설원 지대'],
  dark:['죽음의 늪','죽음의 호수','죽음의 대지'],
  nature:['수림'],steel:['대장간'],earth:['고원'],light:['성소']};
/* n 장을 기본 지형 종류들에 고르게 나눈다. 나머지는 앞쪽부터 한 장씩. */
function splitBasics(el,n){
  const ks=BASICLAND[el]||['화산'];
  const q=Math.floor(n/ks.length), r=n%ks.length;
  return ks.map((nm,i)=>[nm,q+(i<r?1:0)]).filter(([,c])=>c>0);
}
/* 이번 원정의 **지형 구성**. 기본 지형으로 채우되 원정에서 얻은 특수 지형(화염의 원천·지하 감옥…)
   이 있으면 그만큼 기본 지형 몫을 뺀다.
   ⚠⚠ 전투(startFight)와 덱 화면(rgDeckView)이 **반드시 같은 값**을 써야 한다. 예전에는 이 계산이
     전투 쪽에만 있어서 덱 화면에 지형이 아예 안 보였다 — 보상으로 얻은 지형을 확인할 길이 없었다. */
function runLands(){
  const sp=(RG.lands||[]).slice();
  const n=Math.max(1,landsFor(RG.deck.length)-sp.length);
  const out=splitBasics(RG.el,n);          /* 기본 지형 여러 종에 고르게 */
  sp.forEach(x=>out.push([x,1]));
  return out;
}

/* ── 전투 종료 ─────────────────────────────────────────── */
function rgAfterBattle(win){
  const nd=RG.map[RG.floor][RG.at];
  if(!win){
    rgOpen(`<h2 style="color:#e0796e">원정 실패</h2>
      <div class="msub">${RG.floor+1}층에서 쓰러졌습니다. 클리어한 층 <b>${RG.cleared}</b>개.</div>
      <div class="mbtns"><button class="go" id="rgNew">다시 도전하기</button><button id="rgOut">초기 화면</button></div>`);
    document.getElementById('rgNew').onclick=()=>{rgClose();flowRetry();};
    document.getElementById('rgOut').onclick=()=>{rgClose();flowHome();};
    return true;
  }
  RG.cleared++;
  if(nd.t==='boss'){
    rgOpen(`<h2>원정 성공</h2>
      <div class="msub">보스를 쓰러뜨렸습니다. ${(EL[RG.el]||{}).ko} 원정 클리어 —
        최종 덱 <b>${RG.deck.length}장</b> · 남은 HP <b>${RG.hp}</b> · 골드 <b>${RG.gold}</b></div>
      <div class="mbtns"><button class="go" id="rgNew">다시 도전하기</button><button id="rgOut">초기 화면</button></div>`);
    document.getElementById('rgNew').onclick=()=>{rgClose();flowRetry();};
    document.getElementById('rgOut').onclick=()=>{rgClose();flowHome();};
    return true;
  }
  const g=RC.gold[nd.t==='elite'?'elite':'normal'];
  const got=g[0]+rnd(g[1]-g[0]+1);
  RG.gold+=got;
  rgReward(nd.t==='elite', got);
  return true;
}

/* ── 카드 보상 (3장 중 1장) ─────────────────────────────── */
/* 속성별 '보상 지형' — 시작 덱에는 없고 원정에서만 얻는 지형이다. **한 종류당 한 장**만.
   ⚠ 카드가 아니라 지형이라 RG.deck 이 아니라 RG.lands 로 들어간다(기본 지형 몫을 그만큼 뺀다).
   ⚠ 예전엔 `RICHLAND={fire:'화염의 원천'}` 로 속성당 딱 하나만 손으로 적어 뒀다. 그래서 뒤에
     새로 넣은 특수 지형(호수 유적·바닷속 풍경·인어 기둥)이 **영영 안 나오는 죽은 카드**였다.
     이제 lands.csv 가 정본이다 — 희귀도가 붙은 지형(rich·extra·special)이 곧 보상 지형이고,
     평범한 기본 지형은 뽑아 봐야 화산과 똑같으니 후보에서 뺀다(함정 선택지가 된다). */
function landOffers(el){
  /* ⚠ 원정에는 **덱 장수 제한도 동명 카드 제한도 없다.** 예전에는 이미 가진 지형을 후보에서
     뺐는데(`!had.includes(n)`), 그것도 동명 제한이라 없앴다 — 화염의 원천 둘을 쌓는 것도
     플레이어의 선택이다. 시작 덱의 '카드 23 + 지형 17 · 동명 2장' 은 **시작 덱 규칙**이고
     원정은 그 규칙 밖이다. */
  return Object.keys(LANDS).filter(n=>{
    const L=LANDS[n];
    return L.el===el && L.r && !L.temp;
  });
}
function richOffer(){
  const c=landOffers(RG.el);
  return c.length?pickByRarity(c,'normal'):null;
}
function rewardPool(elite){
  const base=poolOf(RG.el), over=overOf(RG.el), out=[];
  const n=RC.rewardChoices||3;
  let guard=0;
  while(out.length<n&&guard++<200){
    const useOver=elite&&Math.random()<(RC.eliteOverChance||0.6);
    const c=pickByRarity(useOver?over:base, elite?'elite':'normal');
    if(c&&!out.includes(c))out.push(c);
  }
  /* 정예를 잡으면 더 자주 뜬다 — 램프 지형은 판을 통째로 바꾸는 보상이라 아껴 준다 */
  const land=richOffer();
  if(land&&Math.random()<(elite?0.35:0.12))out[out.length-1]=land;
  return out;
}
function rgReward(elite,gold){
  const cs=rewardPool(elite);
  rgOpen(rgHead(elite?'정예 격파':'승리',
    `골드 <b>+${gold}</b> 획득. 카드 한 장을 골라 덱에 넣습니다.`
    +(elite?`<br>정예 보상에는 <b>밸런스보다 ${ROGUE.overPct}% 강한 강화 카드</b>가 섞입니다.`:''))
    +`<div class="rgcards">${cs.map((n,i)=>`<div class="rgc ${(POOL[n]||{}).over?'ovr':''}" data-c="${i}">`
        +`${isLand(n)?landCardHTML(n,'md'):tcardHTML(n,{size:'md'})}</div>`).join('')}</div>`
    +`<div class="mbtns"><button id="rgSkip">넘기기</button></div>`);
  document.querySelectorAll('#rg .rgc').forEach(el=>el.onclick=()=>{
    const n=cs[+el.dataset.c];
    /* 지형은 덱 목록이 아니라 지형 몫으로 들어간다 — 기본 지형 한 장과 바뀐다 */
    if(isLand(n))(RG.lands=RG.lands||[]).push(n); else RG.deck.push(n);
    log(`보상 획득 — ${n}`,'g'); rgMap();
  });
  document.getElementById('rgSkip').onclick=rgMap;
}

/* ── 카드 제거 / 강화 선택 ──────────────────────────────── */
function rgChoose(title,sub,n,fn){
  const picked=[];
  const draw=()=>{
    rgOpen(rgHead(title,sub+`<br>남은 선택 <b>${n-picked.length}</b>장`)
      +`<div class="rgcards">${RG.deck.map((c,i)=>picked.includes(i)?'':
          `<div class="rgc ${POOL[c].over?'ovr':''}" data-i="${i}">${tcardHTML(c,{size:'md'})}</div>`).join('')}</div>`);
    document.querySelectorAll('#rg .rgc').forEach(el=>el.onclick=()=>{
      picked.push(+el.dataset.i);
      if(picked.length>=n){ fn(picked); } else draw();
    });
  };
  draw();
}
function rgRemove(n,then){
  n=Math.min(n,RG.deck.length);
  if(!n)return then();
  rgChoose('카드 제거',`덱에서 뺄 카드를 고르세요. 덱이 얇을수록 원하는 카드가 자주 옵니다.`,n,idx=>{
    idx.sort((a,b)=>b-a).forEach(i=>{ log(`덱에서 제거 — ${RG.deck[i]}`,'t'); RG.deck.splice(i,1); });
    then();
  });
}
function rgUpgrade(n,then){
  const cand=RG.deck.map((c,i)=>i).filter(i=>POOL['강화 '+RG.deck[i]]);
  if(!cand.length)return then();
  rgChoose('카드 강화',`고른 카드가 <b>강화판</b>으로 바뀝니다 (밸런스보다 ${ROGUE.overPct}% 강함).`,Math.min(n,cand.length),idx=>{
    idx.forEach(i=>{ const o='강화 '+RG.deck[i]; if(POOL[o]){ log(`강화 — ${RG.deck[i]} → ${o}`,'g'); RG.deck[i]=o; } });
    then();
  });
}
function rgAddCard(then){
  const cs=rewardPool(false);
  rgOpen(rgHead('카드 획득','한 장을 골라 덱에 넣습니다.')
    +`<div class="rgcards">${cs.map((n,i)=>`<div class="rgc" data-c="${i}">${tcardHTML(n,{size:'md'})}</div>`).join('')}</div>`);
  document.querySelectorAll('#rg .rgc').forEach(el=>el.onclick=()=>{
    RG.deck.push(cs[+el.dataset.c]); log(`획득 — ${cs[+el.dataset.c]}`,'g'); then();
  });
}

/* ── 이벤트 ────────────────────────────────────────────── */
function rgEvent(){
  const ev=pick(ROGUE.events);
  const opts=ev.opts.map((o,i)=>{
    const bad=(o.cost&&RG.gold<o.cost)||(o.hp&&RG.hp<=o.hp);
    const tag=(o.cost?`<span class="cost">−${o.cost}골드</span>`:'')+(o.hp?`<span class="cost">−HP ${o.hp}</span>`:'');
    return `<button class="rgopt" data-o="${i}" ${bad?'disabled':''}>${o.t}${tag}</button>`;
  }).join('');
  rgOpen(rgHead(ev.name,`<i>${ev.text}</i>`)+`<div style="margin-top:10px">${opts}</div>`);
  document.querySelectorAll('#rg .rgopt').forEach(el=>el.onclick=()=>{
    const o=ev.opts[+el.dataset.o];
    if(o.cost)RG.gold-=o.cost;
    if(o.hp)RG.hp=Math.max(1,RG.hp-o.hp);
    log(`이벤트 [${ev.name}] — ${o.t}`,'t');
    runEffects((o.do||[]).slice(),()=>rgMap());
  });
}
function runEffects(q,done){
  if(!q.length)return done();
  const [k,v]=q.shift();
  const next=()=>runEffects(q,done);
  if(k==='gold'){ RG.gold+=v; next(); }
  else if(k==='heal'){ RG.hp=Math.min(RG.maxhp,RG.hp+v); next(); }
  else if(k==='maxhp'){ RG.maxhp+=v; RG.hp+=v; next(); }
  else if(k==='remove'){ rgRemove(v,next); }
  else if(k==='upgrade'){ rgUpgrade(v,next); }
  else if(k==='addcard'){ rgAddCard(next); }
  else next();
}

/* ── 상점 ──────────────────────────────────────────────── */
function priceOf(n){
  const sh=RC.shop, c=POOL[n];
  let p=sh.priceBase+sh.pricePerCost*c.c;
  if(c.over)p=Math.round(p*sh.overMult);
  return p;
}
function rgShop(){
  const sh=RC.shop;
  if(!RG.shopStock||RG.shopFloor!==RG.floor){
    const base=poolOf(RG.el), over=overOf(RG.el), st=[];
    let g=0;
    while(st.length<sh.cards&&g++<200){
      const n=Math.random()<.35?pickByRarity(over,'shop'):pickByRarity(base,'shop');
      if(n&&!st.includes(n))st.push(n); }
    RG.shopStock=st; RG.shopFloor=RG.floor;
  }
  const rm=sh.removeBase+sh.removeStep*RG.removes;
  rgOpen(rgHead('상점','골드로 카드를 사거나, 덱에서 카드를 뺄 수 있습니다.')
    +`<div class="rgcards">${RG.shopStock.map((n,i)=>{
        const p=priceOf(n), no=RG.gold<p?' no':'';
        return `<div class="rgc ${POOL[n].over?'ovr':''}${no}" data-s="${i}">
          ${tcardHTML(n,{size:'md'})}<span class="price">${p}G</span></div>`;}).join('')}</div>`
    +`<div class="mbtns">
        <button id="rgRm" ${RG.gold<rm||!RG.deck.length?'disabled':''}>카드 제거 (${rm}G)</button>
        <button class="go" id="rgLeave">떠난다</button></div>`);
  document.querySelectorAll('#rg .rgc:not(.no)').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.s, n=RG.shopStock[i], p=priceOf(n);
    if(RG.gold<p)return;
    RG.gold-=p; RG.deck.push(n); RG.shopStock.splice(i,1);
    log(`구매 — ${n} (${p}G)`,'g'); rgShop();
  });
  document.getElementById('rgRm').onclick=()=>{ RG.gold-=rm; RG.removes++; rgRemove(1,rgShop); };
  document.getElementById('rgLeave').onclick=rgMap;
}

const tutHas=el=>!!TUTS[el];
const tutS=()=>TUTS[TUT.el]||TUTS.fire;
function tutStart(el){
  TUT.on=true; TUT.step=0; TUT.shown=-1; TUT.el=el||'fire';
  const T=tutS();
  PDECK=T.deck.me.map(x=>x.slice()); EDECK=T.deck.ai.map(x=>x.slice());
  EHP=null; EOPEN=null; RG.foe=null; RG.fighting=true;
  newGame();
  /* ⚠ newGame 이 돌린 무작위 손패를 **대본으로 덮는다.** 멀리건 창도 닫는다 —
     "이 카드를 내세요" 를 시키려면 그 카드가 반드시 손에 있어야 한다. */
  ['me','ai'].forEach(q=>{
    S[q].hand.forEach(n=>S[q].deck.push(n));
    S[q].hand=T.hand[q].slice();
    T.hand[q].forEach(n=>{ const i=S[q].deck.indexOf(n); if(i>=0)S[q].deck.splice(i,1); });
  });
  S.mull={back:[],done:true};
  /* ⚠ 훈련 상대에게 지형 셋을 미리 깔아 준다. 안 그러면 3코 수호(홉고블린)가 세 턴 뒤에나
     나와서 '수호' 안내가 한참 뒤로 밀린다 — 대본이 가르치려는 순서가 무너진다. */
  for(let i=0;i<3;i++){ S.ai.landPlayed=false; playLand('ai',T.deck.ai[0][0]); }
  S.ai.lands.forEach(l=>{l.used=false;l.entering=false;}); S.ai.landPlayed=false;
  document.getElementById('mull').classList.remove('on');
  document.querySelector('#foeBar .who').textContent='훈련 상대';
  log('튜토리얼 — 안내를 따라가 보세요','t');
  render(); tutSync();
}
function tutEnd(){
  TUT.on=false; RG.fighting=false; tutPanel(null);
  PDECK=EDECK=null;
  veilRun('지도로 나가는 중…',()=>rgMap());
}
/* 안내판 — 지금 단계의 글과 버튼. null 이면 걷는다. */
function tutPanel(st){
  let el=document.getElementById('tutbox');
  if(!st){ if(el)el.remove(); document.body.classList.remove('tutmode');
    document.documentElement.style.removeProperty('--tuth'); return; }
  if(!el){ el=document.createElement('div'); el.id='tutbox'; document.body.appendChild(el); }
  document.body.classList.add('tutmode');
  const n=TUT.step+1, tot=tutS().steps.length;
  el.innerHTML=`<div class="tutn">${n}/${tot}</div><div class="tutt">${st.t}</div>`
    +`<div class="tutd">${st.d}</div>`
    +`<div class="tutb">${st.info?`<button class="go" id="tutNext">${st.last?'지도로':'다음'}</button>`:''}`
    +`<button id="tutSkip">건너뛰기</button></div>`;
  const nx=document.getElementById('tutNext');
  if(nx)nx.onclick=()=>{ if(st.last)tutEnd(); else{ TUT.step++; tutSync(); } };
  document.getElementById('tutSkip').onclick=tutEnd;
  /* 실제 높이를 재어 본문 여백에 반영한다(글이 길어지면 그만큼 더 민다) */
  requestAnimationFrame(()=>{ const h=el.offsetHeight;
    if(h)document.documentElement.style.setProperty('--tuth',h+'px'); });
}
/* 지금 단계를 보고 안내판을 맞춘다. render() 가 매번 부른다(상태가 바뀌면 저절로 넘어간다). */
function tutSync(){
  if(!TUT.on)return;
  const ST=tutS().steps;
  let st=ST[TUT.step];
  /* 조건이 이미 채워진 단계는 건너뛴다(정보 단계는 '다음' 을 눌러야 넘어간다) */
  let guard=0;
  while(st&&!st.info&&st.ok&&st.ok()&&guard++<20){ TUT.step++; st=ST[TUT.step]; }
  if(!st){ tutEnd(); return; }
  /* 아직 조건이 안 된 정보 단계는 기다린다(수호가 나올 때까지) */
  if(st.info&&st.need&&!st.need()){ tutPanel({t:'상대 차례',d:'상대가 무엇을 하는지 지켜보세요.',info:false}); return; }
  if(TUT.shown!==TUT.step){ TUT.shown=TUT.step; }
  tutPanel(st);
}
/* 상대 차례 — AI 가 아니라 **대본**이 움직인다. 지형 한 장 + 그 턴에 낼 카드. */
async function tutFoeTurn(){
  if(!TUT.on)return endTurn();
  S.busy=true; render();
  await sleep(500);
  const P=S.ai;
  const li=P.hand.findIndex(isLand);
  if(li>=0&&!P.landPlayed){ playLand('ai',P.hand[li]); P.hand.splice(li,1); render(); await sleep(450); }
  for(const act of (tutS().foe[S.turn]||[])){
    /* 문자열이면 크리처 소환, {sp,at} 이면 **내 판 at 번째에 주문**을 쏜다.
       ⚠ 주문이 필요한 이유: 막는 쪽은 반격하지 않으므로, 수호에 부딪히는 것만으로는
         내 몸이 죽지 않는다 — 환류를 보여 주려면 상대가 직접 잡아야 한다. */
    const nm=typeof act==='string'?act:act.sp;
    const i=P.hand.indexOf(nm);
    if(i<0||!canPay('ai',nm))continue;
    if(typeof act==='string'){
      if(!boardRoom('ai'))continue;
      await reveal('ai',nm);
      const at=P.board.length;
      pay('ai',nm); P.hand.splice(i,1);
      placeCreature('ai',nm,at); onSummon('ai',nm,at);
      log(`상대 ${nm} 소환`,'a');
    }else{
      const at=Math.min(act.at||0,S.me.board.length-1);
      if(at<0||!S.me.board[at]||S.me.board[at].kind!=='cr')continue;
      await reveal('ai',nm);
      await castBolt('ai',boltTarget('me',at),nm);
      pay('ai',nm); P.hand.splice(i,1);
      resolveOnFoe('ai',nm,at); cleanup('me');
    }
    render(); await flushFx(150); await sleep(400);
  }
  S.busy=false; render();
  if(!S.over)endTurn();
}
function rgStart(el){
  RG.on=true; RG.el=el;
  RG.gold=RC.startGold; RG.hp=RC.startHp; RG.maxhp=RC.startHp;
  RG.floor=-1; RG.at=-1; RG.removes=0; RG.cleared=0; RG.shopStock=null; RG.foe=null;
  RG.fighting=false; RG.entering=false; EHP=null; FOEUSED=[];
  RG.deck=[]; RG.lands=[];
  DECKS[el].list.filter(([n])=>!LANDS[n]).forEach(([n,c])=>{for(let i=0;i<c;i++)RG.deck.push(n);});
  RG.map=rgMakeMap();
  DECKEL=el; DECKLIST=DECKS[el].list; renderDeckPick();
  document.getElementById('log').innerHTML='';
  log(`원정 시작 — ${(EL[el]||{}).ko} · ${DECKS[el].name}`,'t');
  /* ⚠ 지도가 아니라 **전투로 시작한다.** 첫 전투가 곧 튜토리얼이다(건너뛰면 바로 지도로).
     ⚠ 대본이 없는 속성은 바로 지도로 — 엉뚱한 속성 카드로 가르치는 것보다 안 하는 게 낫다. */
  if(tutHas(el))tutStart(el); else rgMap();

/* ============ 첫 턴 멀리건 (하스스톤식 · 단 한 번, 손해 없음) ============
   7장을 뽑아 가운데에 펼치고, 마음에 안 드는 것만 골라서 '확인'을 누르면
   그만큼 새로 뽑아 준다. 되돌린 카드는 **새로 뽑은 뒤에** 덱에 섞으므로 같은 카드가 다시 오지 않는다.
   기회는 한 번뿐이고 장수 손해도 없다 — 런던 멀리건(뽑을 때마다 한 장씩 덱 아래로)에서 바꿨다.
   ⚠ 지형 17/40 덱이라 지형 0장 손패는 게임이 안 된다 → 뽑기 보정으로 **최소 1장을 확정**한다.
      단 보정은 최초 배분에만 건다. 멀리건으로 지형을 스스로 버렸다면 그건 플레이어의 선택이다. */
function landsIn(hand){ return hand.filter(isLand).length; }
function shuffleDeck(P){
  for(let i=P.deck.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[P.deck[i],P.deck[j]]=[P.deck[j],P.deck[i]];}
}
/* 뽑기 보정 — 첫 손패에 지형이 하나도 없으면 덱의 지형 한 장과 손패의 가장 비싼 카드를 맞바꾼다.
   (7장을 통째로 다시 돌리지 않는다 — 그러면 다른 카드 구성까지 흔들려 보정이 티가 난다) */
function fixLand(p){
  const P=S[p];
  if(P.hand.some(isLand))return false;
  const j=P.deck.findIndex(isLand);
  if(j<0)return false;
  const land=P.deck.splice(j,1)[0];
  let k=0;
  for(let i=1;i<P.hand.length;i++)
    if(((POOL[P.hand[i]]||{}).c||0)>((POOL[P.hand[k]]||{}).c||0))k=i;
  P.deck.push(P.hand[k]); P.hand[k]=land;
  shuffleDeck(P);
  return true;
}
function dealHand(p){
  const P=S[p];
  P.deck=P.deck.concat(P.hand); P.hand=[];
  shuffleDeck(P);
  for(let i=0;i<HANDSTART&&P.deck.length;i++)P.hand.push(P.deck.pop());
  fixLand(p);
  /* 적별 첫 패 보정 — **카드 효과가 아니다.** '이 적은 늘 이걸 쥐고 시작한다' 는 규칙이다
     (그록의 화염의 원천). 없으면 이 적의 8코 거물이 영영 안 나온다. */
  if(p==='ai'&&EOPEN)forceOpener(P,EOPEN);
}
function forceOpener(P,name){
  if(P.hand.includes(name))return;
  const j=P.deck.indexOf(name); if(j<0)return;
  P.deck.splice(j,1);
  /* 제일 비싼 카드 한 장과 바꾼다 — 지형은 fixLand 가 이미 챙겨 놨으니 건드리지 않는다 */
  let k=-1,kv=-1;
  P.hand.forEach((n,i)=>{ if(isLand(n))return;
    const v=(POOL[n]||{}).c||0; if(v>kv){kv=v;k=i;} });
  if(k<0){ P.hand.push(name); return; }
  P.deck.push(P.hand[k]); P.hand[k]=name; shuffleDeck(P);
}
/* 고른 자리들을 새 카드로 갈아 끼운다. 새로 뽑은 다음에 되돌리므로 같은 카드가 되돌아오지 않는다. */
function redrawPicked(p,idxs){
  const P=S[p];
  const back=[];
  idxs.slice().sort((a,b)=>b-a).forEach(i=>{ back.push(P.hand[i]); P.hand.splice(i,1); });
  for(let i=0;i<back.length&&P.deck.length;i++)P.hand.push(P.deck.pop());
  P.deck=P.deck.concat(back); shuffleDeck(P);
  return back.length;
}
/* 상대도 기회는 한 번. 지형이 2~4장이 되도록 남는 지형과 무거운 카드만 골라 바꾼다. */
function aiMulligan(){
  const h=S.ai.hand, idxs=[];
  let seen=0;
  h.forEach((n,i)=>{
    if(isLand(n)){ seen++; if(seen>4)idxs.push(i); return; }
    if(((POOL[n]||{}).c||0)>=6)idxs.push(i);
  });
  if(landsIn(h)<2) h.forEach((n,i)=>{ if(!isLand(n)&&idxs.indexOf(i)<0&&idxs.length<4)idxs.push(i); });
  if(idxs.length)redrawPicked('ai',idxs);
}
function mullHTML(){

    <div class="msub">${(EL[DECKEL]||{}).ko} · ${DECKS[DECKEL].name} — 덱 40장 (지형 17)<br>

    <div class="mstat">

    }).join('')}</div>
    <div class="mbtns">
      <button class="go" id="keepBtn">${picked?`확인 — ${picked}장 다시 뽑기`:'이 패로 시작'}</button>

}
function showMull(){
  const m=document.getElementById('mull');
  m.innerHTML=mullHTML(); m.classList.add('on');
  m.querySelectorAll('.mcard').forEach(el=>el.onclick=()=>{
    if(S.mull.done)return;
    const i=+el.dataset.m, k=S.mull.back.indexOf(i);
    if(k>=0)S.mull.back.splice(k,1); else S.mull.back.push(i);
    showMull();
  });
  document.getElementById('keepBtn').onclick=()=>{
    if(S.mull.done)return;
    S.mull.done=true;
    const n=S.mull.back.length?redrawPicked('me',S.mull.back):0;
    if(n)log(`나 멀리건 — ${n}장을 다시 뽑았다`,'t');
    document.getElementById('mull').classList.remove('on');
    document.getElementById('mull').innerHTML='';
    log(`게임 시작 — ${(EL[DECKEL]||{}).ko} 단색 덱 40장 · 양측 HP 60`,'t');
    render();
    startTurn('me');
  };
}
/* ══════════ 어둠 3단계 — 카드를 펼쳐 고르는 창 ══════════
   덱 맨 위를 들여다보거나(불길한 예감·호박 머리) 손에서 버리는(사신의 시간) 카드가
   한꺼번에 들어왔다. **고르는 창은 하나면 된다** — 무엇을 고르는지만 다르다.
   ⚠ `S.busy` 를 켜지 않는다. 처리 가리개(z-140)가 이 창(z-80) 위를 덮어
     **카드를 못 누르는 채로 멈춘다**(승리 화면에서 똑같이 당했다).
   ⚠ 고르기 전에는 턴을 못 넘긴다 — endTurn 이 S.cpick 을 본다.
   ⚠ 상대(ai)는 이 창을 절대 안 연다. 부르는 쪽이 p==='ai' 면 스스로 골라야 한다. */
function cardPick(o){ S.cpick=Object.assign({sel:[]},o); showPick(); }
function pickHTML(){
  const c=S.cpick, done=c.sel.length>=c.need;
  return `<div class="mbox">
    <h2>${c.title}</h2>
    <div class="msub">${c.sub}</div>
    <div class="mstat"><span class="${done?'good':''}">${c.sel.length} / ${c.need} 선택</span></div>
    <div class="mhand">${c.list.map((n,i)=>{
      const k=c.sel.includes(i)?' pick':'';
      return `<div class="mcard${k}" data-c="${i}">${isLand(n)?landCardHTML(n,'md'):tcardHTML(n,{size:'md'})}</div>`;
    }).join('')}</div>
    <div class="mbtns"><button class="go" id="pickBtn"${done?'':' disabled'}>${c.btn||'확인'}</button></div>
  </div>`;
}
function showPick(){
  const m=document.getElementById('cpick');
  if(!S.cpick){ m.classList.remove('on'); m.innerHTML=''; return; }
  m.innerHTML=pickHTML(); m.classList.add('on');
  m.querySelectorAll('.mcard').forEach(el=>el.onclick=()=>{
    const c=S.cpick; if(!c)return;
    const i=+el.dataset.c, k=c.sel.indexOf(i);
    if(k>=0)c.sel.splice(k,1);
    else if(c.sel.length<c.need)c.sel.push(i);
    showPick();
  });
  const b=document.getElementById('pickBtn');
  if(b)b.onclick=()=>{
    const c=S.cpick; if(!c||c.sel.length<c.need)return;
    S.cpick=null; showPick();
    c.act(c.sel.slice());
    cleanup('me'); cleanup('ai'); render();
  };
}
/* 덱 맨 위 n 장을 **위에서부터** 펼쳐 본다. 되돌릴 때 순서를 지키려고 배열째 다룬다. */
function topOfDeck(p,n){
  const D=S[p].deck, k=Math.min(n,D.length);
  return D.slice(D.length-k).reverse();          /* [0] 이 맨 위 */
}
function takeFromTop(p,n,keepIdx){
  const D=S[p].deck, k=Math.min(n,D.length);
  const top=D.splice(D.length-k,k).reverse();    /* 맨 위부터 */
  const got=top[keepIdx];
  const rest=top.filter((_,i)=>i!==keepIdx).reverse();
  rest.forEach(x=>D.push(x));                    /* 나머지는 순서 그대로 되돌린다 */
  return got;
}
/* 호박 머리 — 내 턴에 뽑을 때, 그냥 뽑는 대신 덱 맨 위 다섯을 펼쳐 하나를 고른다.
   ⚠ `draw()` 전체를 건드리지 않는다. draw 는 발동 도중에도 불리는 동기 함수라
     거기서 창을 띄우면 처리 한복판에 끼어든다. **턴 시작 드로우 한 자리**에서만 갈아탄다. */
function turnDraw(p){
  const P=S[p];
  const e=P.board.find(u=>u&&u.kind==='en'&&(POOL[u.name]||{}).fx==='scry'&&u.charge>0);
  const m=e?(rule(e.name).match(/덱 맨 위 (\d+)장을 보고 그중 1장을 뽑는다/)):null;
  if(!e||!m||!P.deck.length||P.hand.length>=8){ draw(p); return; }
  const n=Math.min(+m[1],P.deck.length);
  const top=topOfDeck(p,n);
  e.charge--;
  const fin=i=>{ const got=takeFromTop(p,n,i);
    if(got)P.hand.push(got);
    log(`${p==='me'?'나':'상대'} ${e.name} — ${n}장을 보고 ${got} 을(를) 뽑았다 · 잔여 충전 ${e.charge}`,'e');
    if(e.charge<=0){ const j=P.board.indexOf(e); if(j>=0)P.board.splice(j,1);
      log(`  ${e.name} 소진 — 슬롯 반환`,'e'); }
    render(); };
  if(p==='ai'){ fin(bestIdx(top)); return; }
  cardPick({list:top,need:1,title:e.name,
    btn:'이 카드를 뽑는다',
    sub:`덱 맨 위 <b>${n}장</b>입니다. 그중 <b>한 장</b>을 뽑으세요 — 나머지는 순서 그대로 덱에 남습니다.`,
    act:sel=>fin(sel[0])});
}
/* 고를 게 여럿일 때 상대가 쓰는 눈 — 비싼 카드를 좋게 본다(지형은 낮게). */
function bestIdx(list){
  let j=0,bv=-1;
  list.forEach((n,i)=>{ const c=POOL[n]||{};
    const v=isLand(n)?0:((c.c||0)*10+(c.k==='cr'?5:0)); if(v>bv){bv=v;j=i;} });
  return j;
}
function draw(p){
  const P=S[p];
  if(!P.deck.length){P.deckout=true;P.hp=0;log(`${p==='me'?'나':'상대'} 덱 소진 — 패배`,'a');return;}
  /* ⚠⚠ **뽑는 순간 발동하는 카드는 손을 안 거친다**(관 · 듀라한의 머리).
     손이 가득 찬 상태에서 그냥 pop 하면 조용히 갈려 나간다 — 덱에 심어 둔 장치가
     보이지도 않게 사라지는 셈이라, 손 검사보다 **먼저** 본다. */
  const top=P.deck[P.deck.length-1];
  if(drawTrigger(p,top)){ P.deck.pop(); return; }
  if(P.hand.length>=8){P.deck.pop();return;}
  P.hand.push(P.deck.pop());
}
/* 덱에 심어 두는 카드 — 미이라의 관, 듀라한의 머리.
   ⚠ 이름을 안 박는다. **뽑힌 카드의 규칙문**을 보고 갈린다.
   되돌려 놓을 때는 **무작위 자리**에 꽂는다 — 맨 위에 두면 다음 드로우가 또 그 카드다. */
function deckIn(p,name,n){
  const D=S[p].deck;
  for(let k=0;k<(n||1);k++)D.splice(rnd(D.length+1),0,name);
}
function drawTrigger(p,name){
  const c=POOL[name]; if(!c)return false;
  const d=(c.kw||'')+' '+(c.d||'');
  const who=p==='me'?'나':'상대';
  /* 관 — 뽑으면 손을 거치지 않고 그대로 판에 선다 */
  if(/덱에서 뽑으면 즉시 판에 나온다/.test(d)){
    if(!boardRoom(p)){ log(`  ${who} ${name} — 자리가 없어 사라졌다`,'t'); return true; }
    const at=S[p].board.length;
    placeCreature(p,name,at); onSummon(p,name,at);
    log(`  ${who} ${name} 을(를) 뽑아 그대로 판에`,'g');
    mummyCheck(p);
    return true;
  }
  /* 듀라한의 머리 — 판 위 듀라한을 전부 키우고 덱으로 돌아간다. 없으면 소멸한다. */
  const hm=d.match(/판 위의 (.+?) 전부에 \+(\d+)\/\+(\d+) · 이 카드를 덱으로 되돌린다/);
  if(hm){
    const [_,host,ha,hh]=hm;
    let k=0;
    S[p].board.forEach(u=>{ if(u&&u.kind==='cr'&&u.name===host&&u.insts.length){
      u.a+=+ha; u.insts.forEach(i=>{i.hp+=+hh;i.mh+=+hh;}); k++; } });
    if(k){ deckIn(p,name,1);
      log(`  ${who} ${name} — ${host} ${k}종에 +${ha}/+${hh} · 덱으로 돌아간다`,'g'); }
    else log(`  ${who} ${name} — 판에 ${host} 이(가) 없어 소멸`,'t');
    return true;
  }
  return false;
}
/* 미이라 — 관이 다 서고 본인이 살아 있으면 군주로 갈아입는다.
   ⚠ 조건도 갈아입을 몸 이름도 **미이라의 규칙문**에서 읽는다. */
function mummyCheck(p){
  const B=S[p].board;
  for(let i=0;i<B.length;i++){
    const u=B[i]; if(!u||u.kind!=='cr'||!u.insts.length)continue;
    const m=(u.kw||'').match(/(.+?) (\d+)장이 모두 내 판에 서면 (.+?)로 변한다/);
    if(!m)continue;
    const [_,tok,n,to]=[m[0],m[1].trim().split(/\s+/).pop(),m[2],m[3].trim()];
    const have=B.filter(x=>x&&x.kind==='cr'&&x.name===tok&&x.insts.length).length;
    if(have>=+n&&POOL[to]){ transformUnit(p,i,to,`${tok} ${n}장`); return true; }
  }
  return false;
}
function log(t,c=''){
  const l=document.getElementById('log');
  const d=document.createElement('div');
  d.className=c;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;
}


/* ============ 지형 · 마나 ============ */
/* ⚠ 특수 지형(l.sp)은 **자원을 만들지 않는다** — 여기서 빼야 마나·유색 계산이 맞는다.
   빼먹으면 자원 없는 지형으로도 카드가 나가 버린다. */
function freeLands(p){ return S[p].lands.filter(l=>!l.used&&!l.entering&&!l.sp); }
/* ⚠⚠ 마나는 이제 **지형 장수가 아니라 자원 합**이다. 화염의 원천은 한 장이 둘을 낸다.
   `.length` 로 세던 곳이 세 군데(manaLeft·colorLeft·pay) 있었다 — 한 곳이라도 놓치면
   '낼 수 있다고 해 놓고 지불이 모자라' 조용히 어긋난다. */
const landN=l=>l.n||1;
function manaLeft(p){ return freeLands(p).reduce((s,l)=>s+landN(l),0); }
function colorLeft(p,el){
  return freeLands(p).filter(l=>l.els.includes(el)).reduce((s,l)=>s+landN(l),0); }

/* 지형 카드 — 손패·지형존·확대가 모두 이 함수를 쓴다 (다른 카드와 같은 규격) */
function landCardHTML(name,size){
  const L=LANDS[name]; if(!L) return '';
  /* 특수 지형은 자원을 안 만들어 els 가 비어 있다 — 색은 테마 속성(home)에서 가져온다. */
  const c1=(EL[L.els[0]]||EL[L.home]||EL.steel).c;
  const pips=L.els.map(e=>`<i class="cp c" style="background:${(EL[e]||EL.steel).c}"></i>`).join('');
  const txt=L.sp?`<b>지형</b> — 자원을 만들지 않는다. ${LANDFX[L.sp]||L.note||''}`
    :(L.dual?'두 속성 중 <b>택1</b>. 놓은 턴에는 쓸 수 없다.'
    :(L.n>1?`<b>지형</b> — 자원 <b>${L.n}</b>을 생성한다.${L.max?` 덱에 ${L.max}장만.`:''}`
     :(L.extra?`<b>추가 지형</b> — 자원 <b>${L.pay}</b>를 내고 놓는다. 이번 턴에 지형을 이미 놓았어도 놓을 수 있다.`
     :(L.temp?'<b>소멸</b> — 다음 내 턴에 한 번 쓰고 사라진다.'
             :'<b>지형</b> — 자원 1을 생성한다.'))));
  /* 자원을 둘 내는 지형은 희귀도 테두리를 그대로 받는다(카드와 같은 r- 클래스) */
  const rc=(L.r&&L.r!=='common')?' r-'+L.r:'';
  return `<div class="tcard ${size||'md'} land${rc}" style="--el:${c1}">
    <div class="thead"><div class="tname">${name}</div><div class="tcost">${pips}</div></div>
    <div class="tart landart"></div>
    <div class="tbody"><div class="teff">${txt}</div></div>
    <div class="tstat"></div>
  </div>`;
}

/* 지형존 — 내려놓은 지형 카드를 그대로 보여주고, 그 위에 자원 토큰을 얹는다. */
/* 지형존도 놓은 것만 보여 준다 — 손패처럼 오른쪽이 왼쪽을 일부 덮으며 쌓인다. */
function lzHTML(p){
  const L=S[p].lands; let h='';
  for(let i=0;i<L.length;i++){
    const l=L[i];
    /* 특수 지형은 자원을 안 만들므로 '사용 가능/사용함' 상태 자체가 없다 — 늘 앞면이다 */
    const st=l.sp?'sp':(l.entering?'ent':(l.used?'used':'rdy'));
    const tip=l.sp?'자원을 만들지 않는다'
      :(l.entering?'배치한 턴에는 쓸 수 없다'
      :(l.used?'이번 턴 사용함 — 다음 내 턴에 앞면으로':'사용 가능'));
    /* data-lz/data-i 는 길게 눌러 확대할 때 쓴다. **뒤집힌 지형도** 이 값으로 원본을 찾는다. */
    const meta=`data-lz="${p}" data-i="${i}" title="${l.name} · ${tip}"`;
    /* 뒤집기 연출은 **양방향** 모두 태운다 — 쓸 때(justUsed)와 돌아올 때(justBack). */
    const fl=(l.justUsed||l.justBack)?' flip':'';
    /* 쓴 지형은 카드를 **뒤집어** 놓는다. 왼쪽부터 소모되고(freeLands 순서),
       다음 내 턴 시작에 startTurn 이 used 를 풀어 한꺼번에 앞면으로 돌아온다. */
    if(l.used){
      h+=`<div class="slot occ used${fl}" ${meta}>`
        +`<div class="lface"><i class="cback"></i></div></div>`;
      continue;
    }
    /* 카드 가운데 있던 동그란 자원 마커(.tok)는 없앴다 —
       이제 '뒤집힘 + 알갱이가 빠져나가는 연출'이 같은 정보를 더 잘 보여 준다. */
    const tag=st==='ent'?'대기':(st==='sp'?'요새':'');
    h+=`<div class="slot occ ${st}${fl}" ${meta}><div class="lface">`
      +`${landCardHTML(l.name,'sm')}${tag?`<span class="ltag">${tag}</span>`:''}</div></div>`;
  }
  return h;
}
/* 지금 이 카드의 **실제 비용**. 인쇄값이 곧 비용이 아닌 카드가 있다(용암거인).
   ⚠ 규칙문이 곧 규칙 — 카드 이름을 코드에 박지 않는다. 최소 1 아래로는 안 내려간다. */
const CUTDEAD=/소멸한 크리처 1개체마다 비용 -(\d+)/;
function costOf(p,name){
  const c=POOL[name]; if(!c)return 0;
  const m=(c.kw||'').match(CUTDEAD); if(!m)return c.c;
  return Math.max(1,c.c-(S.dead||0)*(+m[1]));
}
const isCut=n=>CUTDEAD.test((POOL[n]||{}).kw||'');
/* "HP 20 이하에서만 낼 수 있고" — 카드 자신이 거는 사용 조건. 규칙문이 곧 규칙이다. */
function hpGateOK(p,name){
  const m=((POOL[name]||{}).kw||'').match(/HP (\d+) 이하에서만 낼 수 있/);
  return !m||S[p].hp<=+m[1];
}
function canPay(p,name){
  const c=POOL[name]; if(!c) return false;
  if(!hpGateOK(p,name))return false;
  const el=CE[name]||'steel';
  const cost=costOf(p,name);
  const cc=Math.min(+c.cc||1, cost);
  return colorLeft(p,el)>=cc && manaLeft(p)>=cost;
}
/* 스펠을 낼 때 반응하는 크리처(화염 아귀). pay() 가 **모든 사용 경로**를 지나므로 여기 한 곳에 건다.
   ⚠ 지형은 pay() 를 부르지 않고, 크리처·인챈트는 k 가 'sp' 가 아니라 걸러진다. */
/* ── 주문 환류 ───────────────────────────────────────────────
   "환류" 가 규칙문에 붙은 주문은 쓰고 나서 **손으로 돌아온다. 단 한 번.**
   ⚠ 손패는 이름 문자열이라 개체마다 표시를 달 수 없다 → 크리처 환류와 **같은 장치**를 쓴다:
     이름별 '환류를 이미 썼다' 카운터(`nospell`). 돌아온 장을 또 쓰면 그냥 사라진다.
   ⚠ 되돌리는 자리는 손패 **맨 뒤**다. 복제 공격이 '맨 왼쪽 카드' 를 보므로 앞에 꽂으면
     자기가 자기를 복제하는 이상한 카드가 된다. */
const isEchoSpell=n=>{ const c=POOL[n]||{};
  return c.k==='sp'&&/(^|[\s·])환류([\s·]|$)/.test(c.d||''); };
function spellEcho(p,name){
  if(!isEchoSpell(name))return false;
  const P=S[p]; P.nospell=P.nospell||{};
  if(P.nospell[name]>0){ P.nospell[name]--; return false; }   /* 돌아온 장이다 — 이번엔 안 돌아온다 */
  if(P.hand.length>=8)return false;
  echoToHand(p,name);
  P.nospell[name]=(P.nospell[name]||0)+1;
  log(`  ${p==='me'?'나':'상대'} ${name} — 환류, 손으로 돌아왔다`,'t');
  return true;
}
function onCast(p,name){
  const who=p==='me'?'나':'상대';
  spellEcho(p,name);
  fireEnch(p,'cast',{name});                 /* 루비 목걸이 — 쓴 주문을 복제해 손으로 */
  S[p].board.forEach(u=>{
    if(!u||!u.insts&&u.kind!=='en')return;
    if(u.kind==='cr'&&u.spellhp&&u.insts.length){
      u.insts.forEach(i=>{i.hp+=u.spellhp;i.mh+=u.spellhp;});
      log(`  ${who} ${u.name} — 주문에 반응 HP +${u.spellhp} (${u.insts[0].hp})`,'g');
    }
    if(u.kind==='cr'&&u.spellup&&u.spellup.length&&u.insts.length){
      const [da,dh]=u.spellup;
      u.a+=da; u.insts.forEach(i=>{i.hp+=dh;i.mh+=dh;});
      log(`  ${who} ${u.name} — 주문에 반응 +${da}/+${dh} (${u.a}/${u.insts[0].hp})`,'g');
    }
    if(u.kind==='cr'&&u.spellland&&u.insts.length){
      const k=unflipLands(p,u.spellland);
      if(k)log(`  ${who} ${u.name} — 지형 ${k}장을 되돌렸다`,'t');
    }
    /* 충전식 화염구 — **충전이 줄지 않고 늘어난다.** 규칙문이 곧 판정이다. */
    if(u.kind==='en'){
      const d=(POOL[u.name]||{}).d||'';
      const g=d.match(/주문을 쓸 때마다 충전 \+(\d+)/); if(!g)return;
      const cap=+((d.match(/최대 (\d+)/)||[])[1]||99);
      if(u.charge>=cap)return;
      u.charge=Math.min(cap,u.charge+(+g[1]));
      log(`  ${who} ${u.name} — 충전 ${u.charge}${u.charge>=cap?' (최대)':''}`,'e');
    }
  });
  burnSpell(p,name);
}
/* 써 버린 주문을 소각 더미에 쌓는다. 화염 광신도가 여기서 무작위로 하나 되찾는다. */
function burnSpell(p,name){
  if((POOL[name]||{}).k!=='sp')return;
  (S[p].burned=S[p].burned||[]).push(name);
}
function pay(p,name){
  spellPay(p,name);                          /* "내 HP N 지불" — 모든 사용 경로가 여기를 지난다 */
  const c=POOL[name], el=CE[name]||'steel';
  if(c.k==='sp')onCast(p,name);
  const cost=costOf(p,name);
  const cc=Math.min(+c.cc||1, cost);
  /* ⚠ 작은 지형부터 쓴다 — 자원 2짜리를 1 짜리 값에 태우면 그만큼 버려진다.
     (모자랄 때만 큰 것이 딸려 들어간다) */
  const take=(pool,need)=>{
    const out=[], avail=pool.filter(l=>!l.used); let got=0;
    while(got<need&&avail.length){
      const left=need-got;
      /* 남은 몫에 **딱 들어가는 것 중 가장 큰 것**을 먼저. 그런 게 없을 때만 제일 작은 것을
         (넘치더라도 최소로) 쓴다. 그냥 작은 것부터 쓰면 3코를 화산·화산·원천(=4)으로 내
         자원 하나를 버린다 — 실제로 그렇게 샜다. */
      let pick=null;
      avail.forEach(l=>{ if(landN(l)<=left&&(!pick||landN(l)>landN(pick)))pick=l; });
      if(!pick)avail.forEach(l=>{ if(!pick||landN(l)<landN(pick))pick=l; });
      avail.splice(avail.indexOf(pick),1);
      pick.used=true; out.push(pick); got+=landN(pick);
    }
    return {out,got};
  };
  const A=take(freeLands(p).filter(l=>l.els.includes(el)),cc);
  const B=take(freeLands(p),Math.max(0,cost-A.got));
  const colored=A.out, rest=B.out;
  /* freeLands 는 배열 순서 그대로다 → **왼쪽부터** 소모된다. 이번에 쓴 것만 표시해 두고
     뒤집기 애니메이션(.flip)과 자원 이동 연출이 그것을 본다. */
  const spent=colored.concat(rest);
  if(!spent.length)return;
  spent.forEach(l=>{l.justUsed=true;});
  manaFlow(p,spent,(EL[el]||EL.steel).c);
  setTimeout(()=>spent.forEach(l=>{l.justUsed=false;}),Math.round(700/SPEED));
}
/* 지형에서 자원이 빠져나와 방금 낸 카드로 빨려 들어가는 연출. 색은 **실제로 지불한 속성** 색.
   ⚠ 위치는 render 가 끝난 뒤에 재야 한다(지형이 방금 뒤집혀 자리가 바뀌었을 수 있다) →
     rAF 두 번 미룬다. 목적지는 방금 소환된 슬롯(S.spawn), 없으면 그 편의 판 가운데. */
function manaFlow(p,spent,color){
  const idxs=spent.map(l=>S[p].lands.indexOf(l)).filter(i=>i>=0);
  if(!idxs.length||typeof requestAnimationFrame!=='function')return;
  const gen=S.gen;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(S.gen!==gen)return;
    const lz=document.getElementById(p==='me'?'myLz':'foeLz');
    const bd=document.getElementById(p==='me'?'myBoard':'foeBoard');
    if(!lz||!bd)return;
    const sp=(S.spawn&&S.spawn.side===p)?slotEl(p,S.spawn.idx):null;
    const dr=(sp||bd).getBoundingClientRect();
    const tx=dr.left+dr.width/2, ty=dr.top+dr.height/2;
    const dur=Math.max(90,Math.round(640/SPEED)), step=Math.max(0,Math.round(70/SPEED));
    idxs.forEach((i,k)=>{
      const s=lz.querySelector(`.slot[data-i="${i}"]`); if(!s)return;
      const r=s.getBoundingClientRect();
      const x=r.left+r.width/2, y=r.top+r.height*0.38;
      const d=document.createElement('i');
      d.className='mspark';
      d.style.cssText=`--c:${color};--dx:${Math.round(tx-x)}px;--dy:${Math.round(ty-y)}px;`
        +`left:${Math.round(x)}px;top:${Math.round(y)}px;`
        +`animation-duration:${dur}ms;animation-delay:${k*step}ms`;
      document.body.appendChild(d);
      setTimeout(()=>d.remove(),dur+k*step+120);
    });
  }));
}
/* 지형 한 장을 판에 올린다(스펠이 만들어 내는 것도 여기를 지난다) */
function putLand(p,name,opt){
  const L=LANDS[name]; if(!L)return null;
  const l={name,els:L.els.slice(),entering:!!L.dual,used:false,sp:L.sp||null};
  if(L.n)l.n=L.n;                       /* 화염의 원천 — 자원 둘 */
  if(L.temp)l.temp=L.temp;              /* 수정구 — 소멸 지형 */
  Object.assign(l,opt||{});
  S[p].lands.push(l);
  return l;
}
function playLand(p,name){
  const L=LANDS[name]; if(!L)return false;
  /* ⚠ **추가 지형(인어 기둥 · 지하 감옥)** 은 턴당 1장 제한을 안 먹는다. 대신 자원을 내고 놓는다.
     이름이 아니라 `L.extra`/`L.pay` 로 도니, 새 추가 지형은 lands.csv 에 kind=extra 만 적으면 된다.
     그래서 '이번 턴 지형을 놓았나' 가 아니라 '자원이 있나' 로 막힌다. */
  if(L.extra){
    if(manaLeft(p)<(L.pay||0))return false;
  }else if(S[p].landPlayed)return false;
  if(S[p].lands.length>=MANACAP){       /* 홍수 완화: 상한 도달 시 버리고 드로우 */
    log(`${p==='me'?'나':'상대'} ${name} 폐기 → 카드 1장`,'t'); draw(p);
    if(!L.extra)S[p].landPlayed=true;
    return true;
  }
  if(L.extra&&L.pay)payMana(p,L.pay);
  putLand(p,name);
  if(!L.extra)S[p].landPlayed=true;
  log(`${p==='me'?'나':'상대'} ${name} 배치`
      +(L.extra?` (자원 ${L.pay} 지불 · 추가 배치)`:(L.dual?' (다음 턴부터 가동)':'')),'t');
  return true;
}
/* 뒤집힌(써 버린) 지형을 **왼쪽부터** n 장 되돌린다. 리자드 마술사·상어 인간이 쓴다.
   ⚠ 자원 수가 아니라 **장수**로 센다 — '지형 1장을 되돌린다' 는 문구 그대로다. */
function unflipLands(p,n){
  let k=0;
  for(const l of S[p].lands){
    if(k>=n)break;
    if(!l.used||l.sp)continue;
    l.used=false; l.justBack=true; k++;
  }
  if(k)setTimeout(()=>S[p].lands.forEach(l=>{l.justBack=false;}),Math.round(420/SPEED));
  return k;
}
/* 낸 비용을 그 자리에서 돌려준다(상어 인간). 자원 n 어치가 될 때까지 왼쪽부터 되돌린다. */
function refundMana(p,n){
  let got=0;
  for(const l of S[p].lands){
    if(got>=n)break;
    if(!l.used||l.sp)continue;
    l.used=false; l.justBack=true; got+=landN(l);
  }
  if(got)setTimeout(()=>S[p].lands.forEach(l=>{l.justBack=false;}),Math.round(420/SPEED));
  return got;
}
/* 카드 없이 자원만 쓰는 경우(추가 지형). pay() 와 같은 '작은 것부터' 규칙을 쓴다. */
function payMana(p,n){
  let got=0;
  while(got<n){
    const pool=freeLands(p); if(!pool.length)break;
    const left=n-got;
    let pick=null;
    pool.forEach(l=>{ if(landN(l)<=left&&(!pick||landN(l)>landN(pick)))pick=l; });
    if(!pick)pool.forEach(l=>{ if(!pick||landN(l)<landN(pick))pick=l; });
    pick.used=true; pick.justUsed=true; got+=landN(pick);
  }
  setTimeout(()=>S[p].lands.forEach(l=>{l.justUsed=false;}),Math.round(700/SPEED));
  return got;
}

/* ── 특수 지형 ─────────────────────────────────────────────
   자원을 만들지 않는 대신 다른 일을 한다. **문구와 동작을 여기 한 곳에서** 정의한다
   (카드에 찍히는 설명은 landCardHTML 이 LANDFX 에서 가져다 쓴다).
   ⚠ 자원을 안 내므로 판에 깔릴수록 실질 마나 상한이 내려간다 — 덱에 몇 장 넣을지가 곧 밸런스다. */
const LANDFX={'고블린 요새':'내 턴이 시작될 때 <b>고블린 폭탄병</b>을 소환한다.',
  '호수 유적':'내 턴이 끝날 때 무작위 아군 크리처의 HP를 <b>1</b> 올린다.',
  '바닷속 풍경':'내 턴이 끝날 때 카드를 <b>1장</b> 뽑는다.',
  '불지옥의 계곡':'내 턴이 끝날 때 <b>파이어버그</b>를 소환한다.'};
function landStart(p){
  const who=p==='me'?'나':'상대';
  S[p].lands.forEach(l=>{
    if(l.sp!=='고블린 요새')return;
    if(!boardRoom(p)){ log(`  ${who} 고블린 요새 — 자리가 없다`,'t'); return; }
    const i=S[p].board.length;
    placeCreature(p,'고블린 폭탄병',i);
    log(`  ${who} 고블린 요새 — 고블린 폭탄병 소환 [${i+1}번째]`,'g');
  });
}

/* 내 턴이 **끝날 때** 도는 특수 지형. landStart(턴 시작)의 짝이다.
   ⚠⚠ **이름이 아니라 lands.csv 의 note 를 읽는다.** 예전엔 지형 이름으로 분기했는데,
     어둠의 저주의 땅이 바닷속 풍경과 **글자 그대로 같은 일**("내 턴 종료마다 카드 1장")을
     하는 순간 같은 코드를 두 번 쓰게 됐다. 지형이 늘 때마다 분기를 하나씩 더는 대신,
     문구를 읽는다 — 카드에 적힌 것이 곧 규칙이라는 이 프로젝트의 원칙 그대로다. */
function landEnd(p){
  const who=p==='me'?'나':'상대';
  S[p].lands.forEach(l=>{
    if(!l.sp)return;
    const note=((LANDS[l.sp]||{}).note)||'';
    if(!/내 턴 종료마다/.test(note))return;
    if(/무작위 아군 HP \+1/.test(note)){                    /* 호수 유적 */
      const c=[]; S[p].board.forEach(u=>{ if(u&&u.kind==='cr'&&u.insts.length)c.push(u); });
      if(!c.length)return;
      const u=c[rnd(c.length)];
      u.insts.forEach(i=>{i.hp+=1;i.mh+=1;});
      log(`  ${who} ${l.sp} — ${u.name} HP +1 (${u.insts[0].hp})`,'g');
      return;
    }
    if(/카드 1장/.test(note)){                              /* 바닷속 풍경 · 저주의 땅 */
      draw(p); log(`  ${who} ${l.sp} — 카드 1장`,'t'); return;
    }
    /* 불지옥의 계곡 — 고블린 요새의 짝이되 **턴이 끝날 때** 나온다. 상대 턴을 넘겨
       살아남으므로 먼저 벽으로 쓰이고, 그래서 파이어버그는 폭탄병보다 몸이 크다. */
    const m=note.match(/내 턴 종료마다 (.+?) 소환/);
    if(m&&POOL[m[1]]){
      if(!boardRoom(p)){ log(`  ${who} ${l.sp} — 자리가 없다`,'t'); return; }
      const i=S[p].board.length;
      placeCreature(p,m[1],i);
      log(`  ${who} ${l.sp} — ${m[1]} 소환 [${i+1}번째]`,'g');
    }
  });
}
/* 내 크리처가 소멸할 때 도는 특수 지형 — 묘지. 부르는 곳은 onDeath 하나뿐이다. */
function landDeath(p,cnt){
  const who=p==='me'?'나':'상대';
  S[p].lands.forEach(l=>{
    if(!l.sp)return;
    const m=(((LANDS[l.sp]||{}).note)||'').match(/내 크리처가 소멸할 때마다 (.+?) 소환/);
    if(!m||!POOL[m[1]])return;
    for(let k=0;k<cnt;k++){
      if(!boardRoom(p)){ log(`  ${who} ${l.sp} — 자리가 없다`,'t'); return; }
      const i=S[p].board.length;
      placeCreature(p,m[1],i);
      log(`  ${who} ${l.sp} — ${m[1]} 소환 [${i+1}번째]`,'g');
    }
  });
}
/* ============ 보드 조작 ============ */
/* ============ 키워드 엔진 ============ */
/* 카드의 kw 문자열이 유일한 출처다 — 이 파서가 곧 규칙 구현이다.
   원본 표는 tools/gen_decks.py 의 KW. 문자열 형식을 바꾸면 여기도 같이 바꿔야 한다. */
/* 키워드 텍스트에서 숫자 뽑기 — "제물 6 · 비행" → 6 */
function kwNum(txt,key){
  /* 부호가 붙는 표기가 있을 수 있다 — +를 빼먹으면 조용히 0이 된다 */
  const m=(txt||'').match(new RegExp(key+'\\s*\\+?(\\d+)'));
  return m?+m[1]:0;
}
/* ⚠⚠ 예전엔 그냥 `includes` 였다. 포그위저드의 문구("자신을 제외한 내 크리처 전체가
   **면역**을 얻는다")가 '면역' 을 품고 있어서 **위저드 자신이 면역이 돼 버렸다**(검사에서 잡혔다).
   키워드는 ' · ' 로 갈린 **한 토막 그 자체**다 — 토막을 보고 판정한다.
   숫자가 붙는 키워드(연소 3 · 제물 6)는 앞머리가 맞으면 된다. */
const kwHas=(txt,key)=>(txt||'').split('·').some(t=>{
  t=t.trim();
  return t===key||new RegExp('^'+key+'\\s*\\d+$').test(t);
});
/* 개체는 최대 체력(mh)을 들고 다닌다 — 연마·성장 누적과 회복 상한에 쓴다 */
const mkInst=(h)=>({hp:h,mh:h});
/* 성장·진형이 갈아입는 상위 몸(data/grown.json → GROWN). 없으면 변신하지 않는다. */
function grownOf(name,kind){
  const g=(kind==='진형'?'각성한 ':'성장한 ')+name;
  return (typeof GROWN!=='undefined'&&GROWN[g])?g:null;
}
/* "소멸 시 잿더미 좀비로 되살아난다" → '잿더미 좀비'. 카드 이름을 코드에 박지 않는다 —
   규칙문이 곧 규칙이다. 뒤에 겹쳐 보여 주는 확대창(grownPeer)도 이걸 쓴다. */
const RISE=/소멸 시 (.+?)(?:으로|로) (?:되살아난다|변한다)/;
function riseOf(kw){
  const m=(kw||'').match(RISE);
  return (m&&POOL[m[1].trim()])?m[1].trim():null;
}
/* "내 턴이 시작되면 불사조로 되돌아온다" → '불사조'. 알이 스스로 깨어나는 쪽이다.
   ⚠ rise 와 짝을 이룬다 — rise 는 죽을 때, hatch 는 내 턴이 시작될 때. */
const HATCH=/내 턴이 시작되면 (.+?)(?:으로|로) 되돌아온다/;
function hatchOf(kw){
  const m=(kw||'').match(HATCH);
  return (m&&POOL[m[1].trim()])?m[1].trim():null;
}
/* ══════════ 어둠 2단계 — 단말마 · 출진 · 탈취 · 면역 아우라 ══════════
   ⚠⚠ **규칙문을 읽는다.** '단말마 —' / '출진 —' 뒤부터 **줄 끝까지**가 그 효과다.
     그래서 이 둘은 카드 문구의 **맨 뒤**에 와야 한다("제물 6 · 출진 — …").
     ' · ' 로 자를 수가 없다 — 효과 안에 ' · ' 가 들어가는 카드가 있다(본드래곤).
   ⚠ 카드 이름은 어디에도 박지 않는다. 같은 문구를 쓰는 새 카드는 그냥 돈다. */
const drText=kw=>((kw||'').match(/단말마 — (.*)$/)||[])[1]||'';
const brText=kw=>((kw||'').match(/출진 — (.*)$/)||[])[1]||'';
/* 면역 아우라 — **되돌릴 수 있게** 건다. 위저드가 죽으면 풀려야 하므로 u.veil 을
   파괴적으로 켜지 않는다. 면역과 수호는 양립하지 않으므로(용어집) 아우라가 켜진
   동안만 수호를 접어 두고, 풀릴 때 원래대로 되돌린다. */
function refreshVeilAura(p){
  const P=S[p]; if(!P||!P.board)return;
  const on=P.board.some(u=>u&&u.kind==='cr'&&u.veilaura&&u.insts.length);
  P.board.forEach(u=>{
    if(!u||u.kind!=='cr')return;
    const want=on&&!u.veilaura;
    if(want===!!u.vaura)return;
    u.vaura=want;
    if(want){ u.gWas=!!u.g; u.g=false; }
    else if(u.gWas){ u.g=true; u.gWas=false; }
  });
}
const veiled=u=>!!(u&&(u.veil||u.vaura));
/* 빼앗은 몸의 **원래 주인**. 소멸하거나 손으로 돌아갈 때 이쪽으로 간다(성권 결정). */
const ownerOf=(side,u)=>(u&&u.own)?u.own:side;
function stealUnit(to,from,idx){
  const B=S[from].board, u=B[idx];
  if(!u||u.kind!=='cr'||!u.insts.length||!boardRoom(to))return false;
  B.splice(idx,1);
  if(!u.own)u.own=from;                /* 처음 빼앗길 때만 — 되뺏겨도 원주인은 그대로 */
  S[to].board.push(u);
  refreshVeilAura('me'); refreshVeilAura('ai');
  return true;
}
/* 죽은 자리에 다시 세운다. shrink 면 공/체를 한 칸씩 깎고, 깎을 게 없으면 실패한다. */
function reviveAt(p,u,idx,shrink){
  const who=p==='me'?'나':'상대', c=POOL[u.name]||{};
  const n=(u.shrink||0)+(shrink?1:0);
  if(shrink&&((c.a||0)-n<1||(c.h||0)-n<1)){
    log(`  ${who} ${u.name} 단말마 — 더 줄일 능력치가 없다 (부활 실패)`,'t'); return null; }
  if(!boardRoom(p)){ log(`  ${who} ${u.name} 단말마 — 자리가 없다`,'t'); return null; }
  const at=Math.min(idx,S[p].board.length);
  const nu=mkUnit(u.name,at);
  nu.own=u.own; nu.shrink=n;
  if(n){ nu.a=Math.max(0,(c.a||0)-n);
         nu.insts.forEach(i=>{ i.hp=Math.max(1,(c.h||0)-n); i.mh=i.hp; }); }
  if(!shrink)nu.dr='';                 /* (1회) — 되살아난 몸은 그 능력을 잃는다 */
  S[p].board.splice(at,0,nu);
  /* 단말마 부활은 **보라 오오라**로 소환과 구별한다(성권 요청).
     ⚠ 슬롯 번호가 아니라 **개체**에 표시를 단다 — 부활 뒤에도 판이 당겨져 번호가 밀린다. */
  nu.revfx=true; setTimeout(()=>{ nu.revfx=false; render(); },Math.round(900/SPEED));
  log(`  ${who} ${u.name} 단말마 — 죽은 자리에 다시 소환`
      +(n?` (${nu.a}/${nu.insts[0].hp})`:''),'g');
  refreshVeilAura(p);
  return nu;
