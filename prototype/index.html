/* 단말마 — onDeath 가 한 번만 부른다. */
function deathRattle(p,u,idx,cnt){
  const t=u.dr, who=p==='me'?'나':'상대';
  const dw=(t.match(/카드 (\d+)장을 뽑는다/)||[])[1]|0;
  if(dw){ for(let k=0;k<cnt*dw;k++)draw(p);
    log(`  ${who} ${u.name} 단말마 — 카드 ${cnt*dw}장`,'t'); }
  if(/상대 크리처 1개체를 무작위로 내 판으로/.test(t)){
    const foe=foeOf(p);
    for(let k=0;k<cnt;k++){
      const list=[];
      S[foe].board.forEach((x,i)=>{ if(x&&x.kind==='cr'&&x.insts.length)list.push(i); });
      if(!list.length){ log(`  ${who} ${u.name} 단말마 — 가져올 상대가 없다`,'t'); break; }
      const j=list[rnd(list.length)], nm=S[foe].board[j].name;
      if(!stealUnit(p,foe,j)){ log(`  ${who} ${u.name} 단말마 — 자리가 없다`,'t'); break; }
      log(`  ${who} ${u.name} 단말마 — ${nm} 을(를) 빼앗았다`,'a');
    }
  }
  if(/죽은 자리에 다시 소환된다/.test(t)){
    const sh=/공격력과 체력을 1 씩 줄이고/.test(t)?1:0;
    for(let k=0;k<cnt;k++){ if(!reviveAt(p,u,idx,sh))break; }
  }
}
/* 출진 — onSummon 이 한 번만 부른다. */
function battleCry(p,name,idx,t){
  const who=p==='me'?'나':'상대', me=S[p].board[idx];
  const dw=(t.match(/카드 (\d+)장을 뽑는다/)||[])[1]|0;
  if(dw){ for(let k=0;k<dw;k++)draw(p); log(`  ${who} ${name} 출진 — 카드 ${dw}장`,'t'); }
  if(/내 덱의 인챈트 1장을 무작위로 손으로/.test(t)){
    const list=[]; S[p].deck.forEach((n,i)=>{ if((POOL[n]||{}).k==='en')list.push(i); });
    if(!list.length)log(`  ${who} ${name} 출진 — 덱에 인챈트가 없다`,'t');
    else if(S[p].hand.length>=8)log(`  ${who} ${name} 출진 — 손이 가득 찼다`,'t');
    else{ const j=list[rnd(list.length)], n=S[p].deck.splice(j,1)[0];
      S[p].hand.push(n); log(`  ${who} ${name} 출진 — ${n} 을(를) 손으로`,'t'); }
  }
  if(/비용이 낮은 상대 크리처 1개체를 내 판으로/.test(t)){
    const cost=(POOL[name]||{}).c||0, foe=foeOf(p), list=[];
    S[foe].board.forEach((x,i)=>{ if(x&&x.kind==='cr'&&x.insts.length
      &&((POOL[x.name]||{}).c||0)<cost)list.push({side:foe,idx:i}); });
    if(!boardRoom(p))log(`  ${who} ${name} 출진 — 빈 자리가 없다`,'t');
    else if(!list.length)log(`  ${who} ${name} 출진 — ${cost}코 미만 상대가 없다`,'t');
    else pickOne(p,list,`${name} — 데려올 상대 크리처를 고르세요`,
      (side,i)=>{ const nm=S[side].board[i].name;
        if(stealUnit(p,side,i))log(`  ${who} ${name} 출진 — ${nm} 을(를) 빼앗았다`,'a'); },
      t2=>{ const x=S[t2.side].board[t2.idx]; return x.a*10+x.insts[0].hp; });
  }
  if(/단말마를 가진 내 크리처를 모두 복제한다/.test(t)){
    const src=S[p].board.filter(x=>x&&x.kind==='cr'&&x.dr&&x.insts.length&&x!==me)
                        .map(x=>x.name);
    let k=0;
    src.forEach(n=>{ if(!boardRoom(p))return; placeCreature(p,n,S[p].board.length); k++; });
    log(k?`  ${who} ${name} 출진 — 단말마 ${k}종을 복제`
         :`  ${who} ${name} 출진 — 복제할 단말마가 없다`, k?'g':'t');
  }
  /* 듀라한 · 미이라 — 덱에 카드를 심는다. 뽑으면 drawTrigger 가 받는다. */
  const di=t.match(/내 덱에 (.+?)(?: (\d+)장)?을?를? 넣는다/);
  if(di){
    const nm=(()=>{ const w=di[1].trim().split(/\s+/);
      for(let i=Math.max(0,w.length-3);i<w.length;i++){
        const x=w.slice(i).join(' '); if(POOL[x])return x; }
      return ''; })();
    if(!nm)log(`  ${who} ${name} 출진 — 심을 카드를 못 찾았다 ("${di[1]}")`,'t');
    else{ const k=+(di[2]||1); deckIn(p,nm,k);
      log(`  ${who} ${name} 출진 — 덱에 ${nm} ${k}장을 심었다`,'t'); }
  }
  if(/판 위의 인챈트 1장을 골라 내 쪽에 복제한다/.test(t)){
    const list=[];
    ['me','ai'].forEach(sd=>S[sd].board.forEach((x,i)=>{
      if(x&&x.kind==='en'&&x.charge>0)list.push({side:sd,idx:i}); }));
    if(!boardRoom(p))log(`  ${who} ${name} 출진 — 빈 자리가 없다`,'t');
    else if(!list.length)log(`  ${who} ${name} 출진 — 판에 인챈트가 없다`,'t');
    else pickOne(p,list,`${name} — 복제할 인챈트를 고르세요`,
      (side,i)=>{ const e=S[side].board[i], c=POOL[e.name]||{};
        if(!boardRoom(p))return;
        S[p].board.push({name:e.name,kind:'en',v:c.v,charge:c.ch});
        log(`  ${who} ${name} 출진 — ${e.name} 복제 (충전 ${c.ch})`,'e'); },
      t2=>{ const e=S[t2.side].board[t2.idx]; return (e.charge||0)*10; });
  }
}
/* 판에서 **반드시 하나를 고르는** 상태. 마인드 플레어(S.mind)가 혼자 쓰던 장치를
   서큐버스·리치도 쓰게 일반화했다. 상대(ai)는 score 로 알아서 고른다.
   ⚠ 고르기 전에는 턴을 못 넘긴다 — endTurn 이 S.pick 을 본다. */
function pickOne(p,list,msg,act,score){
  if(!list.length)return;
  if(p==='ai'){ let best=list[0],bv=-1;
    list.forEach(t=>{ const v=score?score(t):0; if(v>bv){bv=v;best=t;} });
    act(best.side,best.idx); return; }
  S.pick={p,list,act,msg}; toast(msg);
}
function mkUnit(name,idx,opt){
  const c=POOL[name]||{}, kw=c.kw||'';
  const growN=kwNum(kw,'성장');
  return {name,kind:'cr',insts:[mkInst(c.h||0)],
    a:c.a,g:!!c.g,f:!!c.f,p:!!c.p,kw,
    burn:kwNum(kw,'연소'),                       /* 매 턴 종료 시 자신이 N 피해 */
    boom:kwHas(kw,'폭발'),                       /* 소멸 시 상대 플레이어에게 **자기 ATK** 만큼 */
    hard:kwNum(kw,'경화'),
    drain:kwHas(kw,'흡혈'),                      /* 입힌 피해만큼 회복 — 수치가 아니라 on/off */
    echo:kwHas(kw,'환류')&&!(opt&&opt.noecho),   /* 한 번 돌아온 개체는 환류를 잃는다 */
    breed:kwHas(kw,'증식'),
    hone:kwHas(kw,'연마'),                       /* 상한 없음 */
    grow:growN?{left:growN,to:grownOf(name,'성장')}:null,
    awake:kwHas(kw,'진형')?grownOf(name,'진형'):null,
    heavy:kwHas(kw,'육중'),
    rush:kwHas(kw,'속공'),                       /* 소환 시 아군 하나가 즉시 공격 */
    /* 연격 N — 한 턴에 N 번 친다. 1 이면 평소와 같다(없는 것과 같은 값을 넣어 둔다). */
    multi:Math.max(1,kwNum(kw,'연격')),
    /* 광분 — HP 가 줄 때마다 상대 얼굴을 한 번 더 친다. hurt() 안에서 켜진다. */
    rage:kwHas(kw,'광분'),
    maw:/삼[킨켜켰]/.test(kw),                    /* 고블린 전차 — 아군 하나를 삼켰다가 돌려 놓는다 */
    ate:null,
    /* 화염 아귀 — 내가 스펠을 낼 때마다 몸이 두꺼워진다(최대치도 같이 오른다) */
    spellhp:(kw.match(/내가 스펠을 쓸 때마다 HP \+(\d+)/)||[])[1]|0,
    /* 작열 좀비 · 불사조 — 죽으면 그 자리에 다른 카드가 남는다. 삼킴(ate)과 같은 장치를 쓴다 */
    rise:riseOf(kw),
    hatch:hatchOf(kw),                           /* 불사조의 알 — 내 턴이 시작되면 원래 몸으로 */
    /* 용암 쥐 — 죽을 때 카드를 뽑는다. 연소로 어차피 죽으니 사실상 확정 드로우다 */
    deathdraw:(kw.match(/소멸 시 카드 (\d+)장을 뽑는다/)||[])[1]|0,
    /* 푸른 불꽃의 수호병 — **내가 쓴 스펠의 자해 조항**을 통째로 무시한다 */
    spellproof:/내가 쓴 스펠에는 피해를 받지 않는다/.test(kw),
    /* 이그니스 — 서 있는 동안 **내 플레이어가 받는 모든 피해가 0** 이 된다 */
    aegis:/받는 모든 피해를 무효로/.test(kw),
    /* 이그니스 — 이 몸이 죽으면 그 자리에서 진다. AI 는 이 몸을 절대 제물로 쓰지 않는다 */
    core:/소멸하면 즉시 패배/.test(kw),
    /* 홍염 — 죽으면서 적 크리처 전체에 N */
    dburst:(kw.match(/소멸 시 적 전체에 (\d+) 피해/)||[])[1]|0,
    sick:kwHas(kw,'육중'),                     /* 소환한 턴에는 공격하지 않는다 */
    ward:kwHas(kw,'가호'),                       /* 처음 받는 피해를 통째로 무효 */
    veil:kwHas(kw,'면역'),                       /* HP 가 아예 줄지 않는다(수호와 양립 불가) */
    /* 세이렌 — **양쪽 스펠 모두**의 피해를 안 받는다(푸른 불꽃의 수호병은 '내 스펠' 만) */
    spellimm:/스펠에 의한 피해를 받지 않는다/.test(kw),
    /* 리자드 전사 — 공격 시 판 위 동명 크리처 수만큼 연타 */
    ally:kwHas(kw,'연합'),
    /* 인어 마술사 — 내가 주문을 쓸 때마다 +1/+1 */
    spellup:(kw.match(/내가 주문을 쓸 때마다 \+(\d+)\/\+(\d+)/)||[]).slice(1).map(Number),
    /* 리자드 마술사 — 내가 주문을 쓸 때마다 뒤집힌 지형 1장을 되돌린다 */
    spellland:/내가 주문을 쓸 때마다 뒤집힌 내 지형 (\d+)장을 되돌린다/.test(kw)
      ?+(kw.match(/뒤집힌 내 지형 (\d+)장/)||[0,1])[1]:0,
    /* 시 서펜트 — 내 턴 종료마다 제일 싼 상대 크리처 하나를 손으로 */
    reaper:/비용이 가장 낮은 상대 크리처 (\d+)개체를 손으로/.test(kw),
    /* ── 어둠 2단계 ─────────────────────────────────────── */
    dr:drText(kw),                               /* 단말마 — 소멸할 때 발동(문구 그대로 보관) */
    /* 다크조커 — 이 개체가 적을 때릴 때마다 그만큼 더 준다 */
    extra:(kw.match(/적에게 피해를 줄 때마다 (\d+) 피해를 더 준다/)||[])[1]|0,
    /* 포그위저드 — 서 있는 동안 **다른** 아군이 전부 면역이다 */
    veilaura:/자신을 제외한 내 크리처 전체가 면역을 얻는다/.test(kw),
    vaura:false, gWas:false,
    shrink:0,                                    /* 본드래곤 — 부활할 때마다 깎인 칸 수 */
    own:null,                                    /* 빼앗긴 몸의 **원래 주인** */
    doom:0};                                     /* 사신의 수확 — 다음 내 턴 시작 시 파괴 */
}
/* 플레이어(얼굴)에게 가는 피해는 **여기 한 곳**을 지난다.
   ⚠⚠ 이그니스처럼 "내가 받는 모든 피해를 무효로 한다" 는 몸이 서 있으면 전부 0 이 된다.
      예전에는 `S[foe].hp-=v` 가 일곱 군데에 흩어져 있었다 — 한 곳만 놓쳐도 무적이 새다.
   제물(HP 지불)은 피해가 아니므로 여기를 지나지 않는다. */
function faceDmg(p,v,why){
  if(v<=0)return 0;
  const w=S[p].board.find(u=>u&&u.kind==='cr'&&u.aegis&&u.insts.length);
  if(w){ log(`  ${p==='me'?'나':'상대'} ${w.name} — 피해 ${v} 무효`,'g'); return 0; }
  S[p].hp-=v;
  faceFx(p,v);                               /* 폭발·광분·직격 — 얼굴에도 한 발 */
  /* 흑마도서 — 내 HP 가 줄면 아군 전체가 그만큼 커진다.
     ⚠ 얼굴 피해가 지나는 곳은 여기 하나다. 부르는 쪽을 늘리면 또 빠뜨린다.
     ⚠ 제물(HP 지불)은 faceDmg 를 안 지난다 — 그건 피해가 아니라 비용이라 일부러 뺐다. */
  fireEnch(p,'facehurt',{v});
  return v;
}
/* 모든 피해는 여기를 지난다 — **가호와 경화를 한 곳에서만** 적용하기 위해서다.
   ⚠ 순서가 규칙이다: 가호(전부 무효)가 먼저, 그 다음 경화(수치 감소).
      뒤집으면 경화가 깎은 뒤의 0 피해가 가호를 벗겨 버린다. */
/* ⚠ 피해 트리거(강철 의지)는 여기서 건다. `sideOf` 로 누구 것인지 되짚어야 하는데,
   보드를 훑는 비용이 싸므로 그냥 찾는다(한 판에 최대 20칸). */
function sideOf(u){ return S.me&&S.me.board&&S.me.board.includes(u)?'me'
  :(S.ai&&S.ai.board&&S.ai.board.includes(u)?'ai':null); }
/* ⚠⚠ **면역** — 이 몸은 HP 가 줄지 않는다. 가호(첫 피해 1회)와 달리 **끝이 없다**.
   수호와 양립하지 않는다 — 면역을 얻으면 수호가 벗겨진다(둘 다면 '못 뚫는 벽' 이 된다).
   hurt/hurtRaw/hurtAll 이 전부 여기를 지나므로 한 곳만 막으면 된다. */
function grantVeil(u){
  u.veil=true;
  if(u.g){ u.g=false; log(`  ${u.name} — 면역을 얻어 수호가 풀린다`,'t'); }
}
function hurt(u,inst,v){
  if(v<=0)return 0;
  if(u.ward){ u.ward=false; return 0; }
  if(veiled(u)){ return 0; }                 /* 면역 — 아예 안 줄어든다(아우라 포함) */
  const d=Math.max(0,v-(u.hard||0)); inst.hp-=d;
  if(d>0){ const sd=sideOf(u); if(sd)fireEnch(sd,'hurt',{unit:u}); rageHit(u,d); }
  return d;
}
/* 광분 — **HP 가 실제로 줄었을 때** 상대 얼굴을 자기 ATK 만큼 한 번 더 친다.
   ⚠ 재진입을 막는다: 광분 피해가 또 hurt 를 부르면(상대 광분과 맞물리면) 무한히 튄다.
   ⚠ 가호·면역·경화로 실피해가 0 이면 안 켜진다 — '줄면' 이 규칙이다. */
let RAGED=0;
function rageHit(u,d){
  if(!u||!u.rage||d<=0||RAGED>3)return;
  const p=sideOf(u); if(!p)return;
  RAGED++;
  const foe=foeOf(p);
  /* 광분이 **한 번 더 칠 때** 그 몸이 붉게 달아오르고, 그 값이 상대 본체로 날아간다(성권 요청).
     ⚠ 때리는 연출(strike)이 아니라 여기다 — 광분은 '맞으면 반격' 이라 정규 공격과 다른 박자다. */
  const rEl=slotEl(p,S[p].board.indexOf(u));
  u.ragefx=true; setTimeout(()=>{ u.ragefx=false; },Math.round(560/SPEED));
  if(rEl)rEl.classList.add('raging');
  flyBolt(rEl,document.getElementById(foe==='me'?'myBar':'foeBar'),'#ff5a46');
  const dv=faceDmg(foe,u.a);
  if(u.a>0)log(`  ${p==='me'?'나':'상대'} ${u.name} 광분 — 상대에게 ${dv} · HP ${Math.max(0,S[foe].hp)}`,'a');
  RAGED--;
}
/* 경화를 무시하는 피해(쐐기·관통 사격). 가호는 그대로 먹는다 — 무시하는 건 경화뿐이다. */
function hurtRaw(u,inst,v){
  if(v<=0)return 0;
  if(u.ward){ u.ward=false; return 0; }
  if(veiled(u))return 0;                     /* 면역 — 경화 무시 피해도 안 통한다 */
  inst.hp-=v;
  const sd=sideOf(u); if(sd)fireEnch(sd,'hurt',{unit:u});
  rageHit(u,v);
  return v;
}
function hurtAll(u,v,tone){
  if(v<=0)return 0;
  if(veiled(u))return 0;                     /* 면역 — 여기도 막는다(광역·연소가 이 길로 온다) */
  if(u.ward){ u.ward=false; return 0; }
  const d=Math.max(0,v-(u.hard||0));
  u.insts.forEach(i=>{i.hp-=d;});
  hitFx(sideOf(u),u,d,tone);                 /* 연소·광역 — 눈에 보이게 한 발 */
  rageHit(u,d);                              /* 광역·연소도 '줄면' 이다 */
  return d;
}

/* 밀물 — 이 카드 코스트 이하인 상대 크리처. 대상이 하나라도 있으면 **반드시** 골라야 한다. */
function tideTargets(p,cost){
  const D=S[p==='me'?'ai':'me'].board, out=[];
  for(let i=0;i<SLOTS;i++){ const u=D[i];
    if(!u||u.kind!=='cr'||u.token||!u.insts.length)continue;
    if(((POOL[u.name]||{}).c||99)>cost)continue;
    out.push(i); }
  return out;
}
function tideBounce(p,idx,el){
  const foe=p==='me'?'ai':'me', D=S[foe].board, u=D[idx];
  if(!u)return false;
  /* ⚠ 빼앗은 몸은 **원래 주인**에게 돌아간다 — 예전엔 상대 손에 그냥 밀어 넣었다.
     되돌아가는 곳을 정하는 규칙은 toHand 와 같아야 한다(ownerOf 하나만 본다). */
  const own=ownerOf(foe,u);
  /* 연출은 지우기 전에 — 슬롯이 사라지면 뜰 모습이 없다.
     ⚠ 색은 **밀물을 부른 쪽의 속성**이다. 못 받았으면 되돌아가는 카드 색으로 떨어진다. */
  toHandFx(foe,idx,own);
  burstFx(slotEl(foe,idx),(EL[el||(POOL[u.name]||{}).el]||EL.water).c);
  D[idx]=null;
  if(!u.token){ S[own].hand.push(u.name);
    /* 되돌아간 카드는 상대 손에서도 앞면 — 판에서 보고 있던 몸이다 */
    S[own].shown=S[own].shown||{};
    S[own].shown[u.name]=(S[own].shown[u.name]||0)+1; }
  const packed=D.filter(Boolean); D.length=0; packed.forEach(x=>D.push(x));
  log(`  ${p==='me'?'나':'상대'} 밀물 — 상대 ${u.name} 손으로`,'g');
  S.tide=null; render();
  return true;
}

/* 소환 시 — 제물·축복·밀물 + 카드별 고유 문구 */
const ONSUMMON={
  '조수술사':(p,idx)=>{                       /* 소환 시 내 크리처 1개체를 손으로 회수 */
    const B=S[p].board; let best=-1,bv=1e9;
    for(let i=0;i<SLOTS;i++){ if(i===idx)continue; const u=B[i];
      if(!u||u.kind!=='cr'||u.token||!u.insts.length)continue;
      const v=u.a*10+u.insts[0].hp; if(v<bv){bv=v;best=i;} }
    if(best<0){ log('  조수술사 — 회수할 크리처 없음','t'); return; }
    const u=B[best]; B[best]=null; S[p].hand.push(u.name);
    log(`  ${p==='me'?'나':'상대'} 조수술사 — ${u.name} 손으로 회수`,'g');
  },
  '숲의 여왕':(p)=>{                          /* 소환 시 내 크리처 전체 +1/+1 */
    let k=0;
    S[p].board.forEach(u=>{ if(!u||u.kind!=='cr')return;
      u.a+=1; u.insts.forEach(i=>{i.hp+=1;i.mh+=1;}); k++; });
    log(`  ${p==='me'?'나':'상대'} 숲의 여왕 — 내 크리처 ${k}종 +1/+1`,'g');
  },
  '지진술사':(p)=>{                           /* 소환 시 상대 슬롯 1~3에 각각 2 피해 */
    const foe=p==='me'?'ai':'me', D=S[foe].board;
    let k=0;
    for(let i=0;i<3;i++){ const u=D[i]; if(!u||u.kind!=='cr')continue; hurtAll(u,2); k++; }
    log(`  ${p==='me'?'나':'상대'} 지진술사 — 상대 앞열 ${k}종에 2 피해`,'a');
    cleanup(foe);
  },
};
function onSummon(p,name,idx){
  const c=POOL[name]||{}, kw=c.kw||'', who=p==='me'?'나':'상대';
  /* ⚠ 2026-08 '대가' → **제물** 로 개명. 같은 규칙에 이름이 둘이면 용어표부터 갈라진다. */
  const cost=kwNum(kw,'제물'), bless=kwNum(kw,'축복');
  if(cost){ S[p].hp-=cost; log(`  ${who} 제물 ${cost} — HP ${S[p].hp+cost}→${S[p].hp}`,'a');
    /* 제물은 **내 체력을 내는 값**이다 — 그게 어디로 가는지 보여 준다(성권 요청).
       ⚠ 기다리지 않는다. onSummon 은 동기라 await 를 걸 수 없고, 순수 연출이라 걸 이유도 없다. */
    flyBolt(slotEl(p,idx)||document.getElementById(p==='me'?'myBar':'foeBar'),
            document.getElementById(p==='me'?'myBar':'foeBar'),'#c0392b');
    fireEnch(p,'paid',{}); }
  if(bless){ S[p].hp=Math.min(S[p].maxhp||MAXHP,S[p].hp+bless); log(`  ${who} 축복 ${bless} — HP 회복`,'g'); }
  if(kwHas(kw,'밀물')){
    const t=tideTargets(p,c.c||0);
    if(!t.length)log(`  ${who} 밀물 — ${c.c}코 이하 대상 없음`,'t');
    else if(p==='ai'){                        /* 상대는 가장 값나가는 것을 고른다 */
      let best=t[0],bv=-1;
      t.forEach(i=>{ const u=S.me.board[i]; const v=u.a*10+u.insts[0].hp; if(v>bv){bv=v;best=i;} });
      tideBounce(p,best,c.el);
    }else{
      /* ⚠ 내 밀물은 **반드시 고르게** 한다 — 자동으로 골라 주면 어느 카드가 왜 돌아갔는지 안 보인다.
         S.tide 가 켜져 있는 동안 턴 종료가 막힌다(endTurn 이 본다). */
      S.tide={p,idx,cost:c.c||0,list:t,el:c.el};
      toast(`밀물 — ${c.c}코 이하 상대 크리처를 고르세요`);
    }
  }
  const bc=brText(kw);
  if(bc)battleCry(p,name,idx,bc);            /* 출진 — 소환할 때 발동 */
  /* 고블린 전차 — 소환 시 **아군 하나를 파괴해 삼킨다**. 이 카드가 죽을 때 그 자리에 되돌려 놓는다.
     ⚠ **파괴 판정을 정식으로 지난다** — 폭발·환류·불사조가 그대로 터진다. 그게 이 카드의 존재 이유다.
        (한때 조용히 치웠는데, 그러면 '희생 콤보' 라는 정체성이 통째로 사라진다.)
     ⚠ 그래서 이름을 **cleanup 전에** 떠 둬야 한다. 파괴되면 슬롯이 사라져 못 읽는다. */
  const me=S[p].board[idx];
  if(me&&me.maw){
    /* ⚠ 삼킬 대상은 '가장 좋은 몸' 이 아니라 **죽어서 이득인 몸**을 고른다.
       폭발이 있으면 삼키는 순간 얼굴에 꽂히고, 나중에 되돌아오기까지 한다 — 그게 이 카드의 콤보다.
       한때 최고 스탯을 삼켜서 제 에이스를 도로 치우고 있었다. */
    const B=S[p].board; let best=-1,bv=-1;
    for(let i=0;i<SLOTS;i++){ if(i===idx)continue; const u=B[i];
      if(!sacOK(u)||u.token)continue;
      const cost=(POOL[u.name]||{}).c||0;
      const v=(u.boom?100+u.a:0)+(u.name==='불사조'?80:0)+(u.echo?40:0)+(9-cost)*3;
      if(v>bv){bv=v;best=i;} }
    if(best<0)log(`  ${who} 고블린 전차 — 삼킬 아군이 없다`,'t');
    else{ me.ate=B[best].name;
      log(`  ${who} 고블린 전차 — ${me.ate} 을(를) 파괴해 삼켰다`,'a');
      B[best].insts.forEach(x=>{x.hp=0;});
      cleanup(p); }
  }
  /* 속공 — 내 크리처 하나를 골라 즉시 한 번 공격시킨다. 내 쪽은 직접 고른다(밀물과 같은 장치). */
  if(me&&me.rush){
    const list=[];
    S[p].board.forEach((u,i)=>{ if(u&&u.kind==='cr'&&u.a>0&&!u.sick)list.push(i); });
    if(!list.length)log(`  ${who} 속공 — 지금 공격할 수 있는 아군이 없다`,'t');
    else if(p==='ai'){
      let best=list[0]; list.forEach(i=>{ if(S.ai.board[i].a>S.ai.board[best].a)best=i; });
      rushAttack('ai',best);
    }else{ S.rush={p,list}; toast('속공 — 즉시 공격할 내 크리처를 고르세요'); }
  }
  /* 고블린 미치광이 — 소환 순간 판 전체에 N 을 **1 점씩 흩뿌린다**. 자기 편도 맞는다.
     ⚠ 규칙문으로 판정한다(이름을 코드에 박지 않는다). 무작위는 개체가 아니라 **칸** 단위다. */
  const spl=(kw.match(/자신을 제외한 모든 크리처에 (\d+) 피해를 1씩 나눠 준다/)||[])[1]|0;
  if(spl&&me)splashHit(p,me,spl);
  /* 운디네 — 덱에서 지형 카드 한 장을 손으로 */
  const ld=(kw.match(/소환 시 지형 카드 (\d+)장을 뽑는다/)||[])[1]|0;
  for(let k=0;k<ld;k++){
    const j=S[p].deck.findIndex(isLand);
    if(j<0){ log(`  ${who} ${name} — 덱에 지형이 없다`,'t'); break; }
    if(S[p].hand.length>=8)break;
    S[p].hand.push(S[p].deck.splice(j,1)[0]);
    log(`  ${who} ${name} — 지형 1장을 손으로`,'t');
  }
  /* 상어 인간 — 상대에게 수호가 서 있으면 낸 값을 그 자리에서 돌려받는다 */
  if(/상대에게 수호 크리처가 있으면 비용을 돌려받는다/.test(kw)){
    const hasG=S[foeOf(p)].board.some(x=>x&&x.kind==='cr'&&x.g&&x.insts.length);
    if(hasG){ const back=refundMana(p,c.c);
      log(`  ${who} ${name} — 상대 수호를 보고 자원 ${back} 환급`,'g'); }
    else log(`  ${who} ${name} — 상대에게 수호가 없다`,'t');
  }
  /* 양옆 소환(스킬라 · 메두사) — 자리가 없으면 있는 만큼만.
     ⚠⚠ 예전 정규식은 `소환 시 \d+\/\d+ \S+ (.+?) N개체를` 였다. 스킬라("1/4 수호 여왕의 가신")
       한 장에 맞춰 쓴 것이라 **앞머리가 없는 메두사("뱀 2개체")는 통째로 안 걸렸다** —
       카드가 조용히 아무것도 안 했다. 능력치·태그 앞머리는 있어도 없어도 되게 풀고,
       이름은 cardBefore 와 같은 수로 **뒤에서부터** POOL 을 뒤져 찾는다. */
  const esc=kw.match(/소환 시 (.+?)\s*(\d+)개체를 양옆에 소환/);
  if(esc){
    const nm=(()=>{ const w=esc[1].trim().split(/\s+/);
      for(let i=Math.max(0,w.length-3);i<w.length;i++){
        const x=w.slice(i).join(' '); if(POOL[x])return x; }
      return ''; })();
    if(!nm)log(`  ${who} ${name} — 소환할 카드를 못 찾았다 ("${esc[1]}")`,'t');
    else{
      const B=S[p].board;
      let put=0;
      const at=B.indexOf(me);
      if(at>=0&&boardRoom(p)){ placeCreature(p,nm,at); put++; }
      const at2=B.indexOf(me);
      if(at2>=0&&boardRoom(p)){ placeCreature(p,nm,at2+1); put++; }
      log(`  ${who} ${name} — ${nm} ${put}개체를 양옆에`,'g');
    }
  }
  /* 크라켄 — 제 값보다 싼 몸을 **양쪽 다** 손으로. 판이 통째로 되감긴다. */
  if(/이 카드보다 비용이 낮은 모든 크리처를 양쪽 손으로/.test(kw)){
    let k=0;
    ['me','ai'].forEach(side=>{
      for(let i=S[side].board.length-1;i>=0;i--){
        const x=S[side].board[i];
        if(!x||x.kind!=='cr'||x===me||!x.insts.length)continue;
        if(((POOL[x.name]||{}).c||0)>=c.c)continue;
        while(x.insts.length){ toHand(side,S[side].board.indexOf(x)); k++;
          if(!S[side].board.includes(x))break; }
      }
    });
    log(`  ${who} ${name} — ${c.c}코 미만 ${k}개체를 양쪽 손으로`,'t');
  }
  /* 마인드 플레어 — **반드시 하나를 고른다**(양쪽 어디든). 고를 게 없으면 그냥 나온다. */
  if(/인쇄된 능력치로 되돌리고 효과를 지운다/.test(kw)){
    const list=[];
    ['me','ai'].forEach(side=>S[side].board.forEach((x,i)=>{
      if(x&&x.kind==='cr'&&x!==me&&x.insts.length)list.push({side,idx:i}); }));
    if(!list.length)log(`  ${who} ${name} — 되돌릴 대상이 없다`,'t');
    else if(p==='ai'){                       /* 상대는 제일 값나가는 것을 지운다 */
      let best=list[0],bv=-1;
      list.forEach(t=>{ const x=S[t.side].board[t.idx];
        const v=x.a*10+x.insts[0].hp+(t.side==='me'?100:0); if(v>bv){bv=v;best=t;} });
      mindWipe(best.side,best.idx);
    }else{ S.mind={p,list}; toast('마인드 플레어 — 되돌릴 크리처를 고르세요 (반드시 하나)'); }
  }
  /* 화염 광신도 — 소각 더미에서 주문 하나를 무작위로 되찾는다 */
  const rec=(kw.match(/소각된 주문 (\d+)장을 무작위로 손에 되돌린다/)||[])[1]|0;
  for(let k=0;k<rec;k++){
    const pile=S[p].burned||[];
    if(!pile.length){ log(`  ${who} ${name} — 소각된 주문이 없다`,'t'); break; }
    if(S[p].hand.length>=8){ log(`  ${who} ${name} — 손이 가득 찼다`,'t'); break; }
    const j=rnd(pile.length), n=pile.splice(j,1)[0];
    S[p].hand.push(n);
    log(`  ${who} ${name} — 소각된 ${n} 을(를) 손으로`,'g');
  }
  const fn=ONSUMMON[name]; if(fn)fn(p,idx);
  /* 인챈트 트리거 — 내 소환은 나에게, 상대에게는 '상대가 소환했다' 로 간다 */
  const born=S[p].board[idx]&&S[p].board[idx].name===name?S[p].board[idx]
    :S[p].board.find(u=>u&&u.name===name);
  fireEnch(p,'summon',{unit:born});
  fireEnch(foeOf(p),'foesummon',{unit:born});
}
/* 판 전체에 1 점씩 흩뿌린다. 상태는 **한 번에** 바꾸고(로직은 동기), 눈에 보이는 연출만
   나중에 한 발씩 띄운다(popHits). 연출을 기다리게 만들면 onSummon 이 전부 async 가 되어
   소환 경로 다섯 군데를 다 고쳐야 한다 — 그럴 값어치가 없다. */
function splashHit(p,self,total){
  const who=p==='me'?'나':'상대', shots=[];
  for(let k=0;k<total;k++){
    const cand=[];
    ['me','ai'].forEach(side=>S[side].board.forEach((x,j)=>{
      if(x&&x!==self&&x.kind==='cr'&&x.insts.length)cand.push([side,j]); }));
    if(!cand.length)break;
    const [side,j]=cand[rnd(cand.length)];
    const t=S[side].board[j];
    hurt(t,t.insts[0],1);
    shots.push([side,j,t.name]);
    if(t.insts[0].hp<=0){ cleanup(side); }   /* 죽은 칸은 다음 발의 후보에서 빠진다 */
  }
  cleanup('me'); cleanup('ai');
  const tally={};
  shots.forEach(([,,n])=>{tally[n]=(tally[n]||0)+1;});
  log(`  ${who} 미치광이 — ${shots.length}발: `
      +(Object.keys(tally).map(n=>`${n}×${tally[n]}`).join(', ')||'표적 없음'),'a');
  popHits(shots);
}
/* 슬롯 위로 '1' 이 한 발씩 톡톡 떠오르는 연출. 상태를 건드리지 않으므로 render 와 안 싸운다. */
function popHits(shots){
  if(typeof document==='undefined'||!shots.length)return;
  const gen=S.gen, step=Math.max(24,Math.round(90/SPEED));
  shots.forEach(([side,j],k)=>setTimeout(()=>{
    if(S.gen!==gen)return;
    const el=slotEl(side,j)||document.querySelector(`.slot[data-i="${j}"]`);
    if(!el)return;
    const r=el.getBoundingClientRect();
    const d=document.createElement('i');
    d.className='hitpop'; d.textContent='1';
    d.style.cssText=`left:${Math.round(r.left+r.width*(.3+Math.random()*.4))}px;`
      +`top:${Math.round(r.top+r.height*.42)}px`;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),700);
  },k*step));
}
/* 마인드 플레어 — **인쇄된 카드로 되돌린다.** 버프·부여·키워드가 통째로 사라지고,
   그동안 받은 피해만 남는다. 그 피해로 죽어야 할 상황이면 HP 1 로 남긴다(즉사 카드가 아니다). */
function mindWipe(side,idx){
  const B=S[side].board, u=B[idx]; if(!u||u.kind!=='cr'||!u.insts.length)return false;
  const dmg=u.insts.map(i=>Math.max(0,i.mh-i.hp));     /* 받은 피해만 떠 둔다 */
  const n=u.insts.length, nm=u.name;
  const fresh=mkUnit(nm,idx);
  /* 키워드는 '원래 없던 것' 으로 친다 — 인쇄 능력치만 남기고 효과를 전부 지운다 */
  Object.keys(fresh).forEach(k=>{
    if(['name','kind','insts','a','g','f','p','kw'].includes(k))return;
    fresh[k]=(typeof fresh[k]==='number')?0:(Array.isArray(fresh[k])?[]:
             (typeof fresh[k]==='boolean'?false:null));
  });
  fresh.insts=[]; 
  for(let k=0;k<n;k++){
    const i=mkInst((POOL[nm]||{}).h||1);
    i.hp=Math.max(1,i.mh-(dmg[k]||0));                 /* 죽어야 하면 1 로 남긴다 */
    fresh.insts.push(i);
  }
  B[idx]=fresh;
  log(`  ${nm} — 인쇄된 몸으로 되돌아간다 (${fresh.a}/${fresh.insts[0].hp} · 효과 없음)`,'t');
  return true;
}
/* 속공으로 고른 한 개체만 즉시 공격시킨다 — 정식 전투와 같은 대상 판정을 쓴다. */
function rushAttack(p,i){
  const foe=p==='me'?'ai':'me', u=S[p].board[i];
  S.rush=null;
  if(!u||u.kind!=='cr'||u.a<=0){ render(); return; }
  const D=S[foe].board;
  let tgt=-1;
  for(let j=0;j<SLOTS;j++){ const d=D[j];
    if(!d||d.kind!=='cr'||!d.insts.length)continue;
    if(u.p)continue; if(!d.g)continue; if(u.f&&!d.f)continue;
    tgt=j;break; }
  const who=p==='me'?'나':'상대';
  if(tgt>=0){ const d=D[tgt], b=d.insts[0].hp, dealt=hurt(d,d.insts[0],u.a);
    log(`  ${who} 속공 — ${u.name}(${u.a}) → ${d.name} ${b}→${Math.max(0,d.insts[0].hp)}`,'a');
    if(u.drain&&dealt>0&&u.insts.length){ const i=u.insts[0]; i.hp=Math.min(i.mh,i.hp+Math.round(dealt/2)); }
    cleanup(foe);
  }else{ const dv=faceDmg(foe,u.a);
    log(`  ${who} 속공 — ${u.name}(${u.a}) → 플레이어 ${dv?'':'(무효) '}· HP ${Math.max(0,S[foe].hp)}`,'a');
    if(u.drain&&u.insts.length){ const i=u.insts[0]; i.hp=Math.min(i.mh,i.hp+Math.round(u.a/2)); } }
  u.sick=true;                       /* 이번 턴 정규 공격에서는 빠진다 — 두 번 때리지 않는다 */
  render();
}
/* 보드는 **구멍 없는 목록**이다(2026-08). 슬롯 번호가 아니라 '몇 번째'가 곧 위치이고,
   원하는 자리에 끼워 넣을 수 있다. 상한은 SLOTS(10)장. */
function boardRoom(p){ return S[p].board.filter(Boolean).length<SLOTS; }
function placeCreature(p,name,at){
  const B=S[p].board;
  if(!boardRoom(p))return false;
  const i=Math.max(0,Math.min(B.length,at==null?B.length:at));
  /* 환류로 한 번 돌아온 카드는 그 능력을 잃는다 — 손패는 이름뿐이라 진영별 카운터로 센다 */
  const noe=(S[p].noecho&&S[p].noecho[name])>0;
  if(noe)S[p].noecho[name]--;
  B.splice(i,0,mkUnit(name,i,{noecho:noe}));
  refreshVeilAura(p);                        /* 나중에 나온 몸도 아우라를 받는다 */
  return true;
}
/* 빈 자리 = 목록의 끝. 자리가 없으면 -1. */
function firstEmpty(p){ return boardRoom(p)?S[p].board.length:-1; }
/* 성장·진형 — 자리를 지킨 채 **상위 몸으로 통째로 갈아입는다.** 체력은 새 몸의 최대치로 찬다. */
function transformUnit(p,i,to,why){
  const B=S[p].board, u=B[i]; if(!u||!to||!POOL[to])return false;
  B[i]=mkUnit(to,i);
  log(`  ${p==='me'?'나':'상대'} ${u.name} ${why} — ${to} 으로 교체`,'g');
  S.spawn={side:p==='me'?'me':'ai',idx:i};
  setTimeout(()=>{S.spawn=null;},520/SPEED);
  return true;
}
/* 사망 판정은 전부 여기를 지난다 — 환류·폭발·불사조가 걸려 있다.
   ⚠ 가호는 여기가 아니라 hurt() 에 있다. '파괴 무효' 가 아니라 '첫 피해 무효' 로 바뀌었다. */
let DEATHD=0;                                /* 폭발 연쇄가 무한히 튀지 않게 하는 깊이 제한 */
function cleanup(p){
  const B=S[p].board, deaths=[];
  for(let i=0;i<SLOTS;i++){
    const u=B[i];if(!u)continue;
    if(u.kind!=='cr'){ if(u.charge<=0)B[i]=null; continue; }
    const alive=[]; let died=0;
    u.insts.forEach(inst=>{ if(inst.hp>0)alive.push(inst); else died++; });
    u.insts=alive;
    if(died){ deaths.push({u,i,died}); S.dead=(S.dead||0)+died; }
    /* ⚠ 개체마다 **한 번뿐**. 판에서 빠진 몸을 다시 볼 일은 없지만, 부르는 자리가 늘면
       같은 죽음이 두 번 터진다 — 표시를 개체에 달아 두면 어디서 불러도 안전하다. */
    if(!u.insts.length){ if(!u.fxdead){ u.fxdead=true; deathFx(p,i); } B[i]=null; }
  }
  deaths.forEach(d=>onDeath(p,d.u,d.i,d.died));
  const packed=B.filter(Boolean);                 /* 구멍을 남기지 않는다 */
  if(packed.length!==B.length){ B.length=0; packed.forEach(u=>B.push(u)); }
  refreshVeilAura(p);                             /* 포그위저드가 죽으면 면역이 풀린다 */
  mummyCheck(p);                                  /* 관이 다 서면 미이라가 군주로 */
}
function onDeath(p,u,idx,cnt){
  /* 무덤 — **원래 주인** 쪽에 쌓인다(빼앗은 몸은 주인에게 돌아간다).
     혼령 부활이 여기서 하나를 꺼낸다. 토큰은 카드가 아니라 안 쌓는다. */
  const own=ownerOf(p,u);
  if(POOL[u.name]&&!u.token){ S[own].grave=S[own].grave||[];
    for(let k=0;k<cnt;k++)S[own].grave.push(u.name); }
  if(u.token)return;
  const who=p==='me'?'나':'상대', foe=p==='me'?'ai':'me';
  if(u.echo){                                 /* 환류 — 무덤 대신 손으로, 단 한 번 */
    let back=0;
    /* ⚠ echoToHand 를 쓴다 — 손에 넣는 것 말고 **문어 다리(echo 트리거)** 도 같이 울려야 한다.
       그냥 hand.push 로 두면 인챈트가 조용히 안 도는, 찾기 어려운 종류의 누락이 된다. */
    for(let k=0;k<cnt;k++){ if(S[p].hand.length>=10)break; echoToHand(p,u.name); back++; }
    S[p].noecho=S[p].noecho||{};
    S[p].noecho[u.name]=(S[p].noecho[u.name]||0)+back;
    log(`  ${who} ${u.name} 환류 — 손으로 ${back}장 (환류 소진)${back<cnt?' · 손이 가득 참':''}`,'g');
  }
  /* 폭발 — 소멸 시 상대 **플레이어**에게 **자기 ATK 만큼**.
     ⚠ 수치가 카드에 안 적혀 있다 = 죽는 시점의 ATK 를 쓴다. 연마·버프로 커진 값이 그대로 들어간다. */
  if(u.boom&&u.a>0&&DEATHD<4){
    const v=u.a*cnt;
    /* 폭발 — **그 자리에서 진짜 터지고**, 터진 값이 상대 본체로 날아간다(성권 요청).
       ⚠ 슬롯은 cleanup 이 이미 판에서 뺐지만 DOM 은 아직 남아 있다(다음 render 전) —
         그래서 여기서 좌표를 뜰 수 있다. 순서를 바꾸면 터질 자리를 잃는다. */
    const bEl=slotEl(p,idx);
    burstFx(bEl,(EL[(POOL[u.name]||{}).el]||EL.fire).c);
    flyBolt(bEl,document.getElementById(foe==='me'?'myBar':'foeBar'),
            (EL[(POOL[u.name]||{}).el]||EL.fire).c);
    const dv=faceDmg(foe,v);
    log(`  ${who} ${u.name} 폭발 — 상대에게 ATK ${u.a}${cnt>1?`×${cnt}`:''} = ${dv} 피해 · HP ${Math.max(0,S[foe].hp)}`,'a');
    fireEnch(p,'boom',{dmg:v,unit:u});      /* 고블린 지뢰 — 터진 값을 상대 크리처에게도 */
  }
  if(u.rise&&POOL[u.rise]){                 /* 작열 좀비 — 죽은 자리에 다른 몸이 남는다 */
    for(let k=0;k<cnt;k++){
      if(!boardRoom(p)){ log(`  ${who} ${u.name} — 자리가 없어 ${u.rise} 이(가) 못 나왔다`,'t'); break; }
      placeCreature(p,u.rise,Math.min(idx,S[p].board.length));
      log(`  ${who} ${u.name} 소멸 — ${u.rise} 이(가) 그 자리에 남는다`,'g');
    }
  }
  if(u.ate){                                  /* 고블린 전차 — 삼킨 개체를 그 자리에 되돌려 놓는다 */
    if(boardRoom(p)){ placeCreature(p,u.ate,Math.min(idx,S[p].board.length));
      log(`  ${who} 고블린 전차 소멸 — ${u.ate} 이(가) 튀어나온다`,'g'); }
    else log(`  ${who} 고블린 전차 — 자리가 없어 ${u.ate} 이(가) 사라졌다`,'t');
    u.ate=null;
  }
  if(u.dburst){                               /* 홍염 — 죽으면서 적 판을 훑는다 */
    let k=0;
    S[foe].board.forEach(t=>{ if(t&&t.kind==='cr'){hurtAll(t,u.dburst*cnt);k++;} });
    if(k)log(`  ${who} ${u.name} 소멸 — 적 ${k}종에 ${u.dburst*cnt} 피해`,'a');
    cleanup(foe);
  }
  if(u.core){                                 /* 이그니스 — 이 몸이 곧 목숨이다 */
    log(`  ${who} ${u.name} 소멸 — 그 자리에서 패배`,'a');
    S[p].hp=0;
  }
  if(u.deathdraw){                            /* 용암 쥐 — 죽으면서 카드를 남긴다 */
    for(let k=0;k<cnt*u.deathdraw;k++)draw(p);
    log(`  ${who} ${u.name} 소멸 — 카드 ${cnt*u.deathdraw}장`,'t');
  }
  if(u.dr)deathRattle(p,u,idx,cnt);         /* 단말마 — 문구 그대로 */
  hagBrew(p,cnt);                            /* 해그 — 아군이 죽을 때마다 주문 하나 */
  /* ⚠ idx 를 같이 넘긴다 — 불사조의 깃털이 **죽은 자리**에 되살려야 하기 때문이다. */
  for(let k=0;k<cnt;k++)fireEnch(p,'death',{unit:u,idx});   /* 인챈트 트리거 */
  landDeath(p,cnt);                          /* 묘지 — 내 크리처가 죽을 때마다 좀비랫 */
}
/* 내 턴 종료 시 — 연마·증식·변신이 먼저, **연소 자해가 마지막**.
   ⚠ 연소를 먼저 태우면 그 턴에 성장할 개체가 타 죽어 변신을 못 본다. */
/* 턴 종료 처리 — **왼쪽부터 한 개체씩 순서대로** 돈다.
   ⚠⚠ 예전에는 전부 동기로 한꺼번에 처리하고 연출만 나중에 몰아 띄웠다. 그러면 무엇이
     무엇을 죽였는지 순서가 안 읽힌다(연소로 죽은 몸의 폭발이 옆 몸의 연소와 뭉쳤다).
     이제 **한 개체의 일이 끝까지 끝난 뒤에 다음 개체로 간다** — 연소로 깎이고, 죽고,
     폭발이 터지고, 그게 눈에 보이고 나서야 오른쪽 칸으로 넘어간다.
   ⚠ 그래서 async 다. 호출부는 endTurn 하나뿐이라 번지는 범위가 없다
     (cleanup 은 27곳에서 부르므로 **동기 그대로** 둔다 — 여기서 개체마다 불러 준다).
   ⚠ 슬롯 번호가 아니라 **개체 목록을 미리 떠서** 돈다. 죽으면 판이 당겨져 번호가 어긋난다.
     앞선 폭발에 이미 죽은 개체는 건너뛴다. */
async function endStep(p){
  const B=S[p].board, who=p==='me'?'나':'상대';
  const gen=S.gen;
  const beat=async(ms)=>{ render(); await flushFx(150); if(ms)await sleep(ms); };
  for(let i=0;i<SLOTS;i++){
    const u=B[i]; if(!u||u.kind!=='cr')continue;
    if(u.hone){                             /* 연마 — 상한 없이 ATK +1 */
      u.a+=1;
      log(`  ${who} ${u.name} 연마 — ATK ${u.a}`,'g');
    }
    if(u.breed){                            /* 증식 — 왼쪽 빈 슬롯에 복제, 단 한 번 */
      const s=firstEmpty(p);
      if(s<0)log(`  ${who} ${u.name} 증식 — 빈 슬롯 없음 (다음 턴에 다시)`,'t');
      else{
        const c=mkUnit(u.name,s);
        c.breed=false; c.bred=true;         /* 복제본은 증식하지 않는다 */
        B[s]=c; u.breed=false; u.bred=true; /* 원본도 능력을 소진한다 */
        log(`  ${who} ${u.name} 증식 — [슬롯 ${s+1}]에 복제 (증식 소진)`,'g');
      }
    }
  }
  /* 변신은 따로 돈다 — 위 반복 중에 슬롯을 갈아 끼우면 그 턴의 연마·증식이 새 몸에 또 걸린다 */
  for(let i=0;i<SLOTS;i++){
    const u=B[i]; if(!u||u.kind!=='cr')continue;
    if(u.grow&&u.grow.left>0){
      u.grow.left--;
      if(u.grow.left<=0&&u.grow.to)transformUnit(p,i,u.grow.to,'성장');
      else log(`  ${who} ${u.name} 성장까지 ${u.grow.left}턴`,'t');
    }
  }
  const alive=B.filter(x=>x&&x.kind==='cr');
  if(alive.length===1&&alive[0].awake){     /* 진형 — 내 크리처가 나 하나뿐이면 각성 */
    const i=B.indexOf(alive[0]);
    transformUnit(p,i,alive[0].awake,'진형');
  }
  /* 시 서펜트 — 내 턴이 끝날 때 **제일 싼** 상대 크리처 하나를 손으로 돌린다 */
  const foe=p==='me'?'ai':'me';
  B.forEach(u=>{
    if(!u||u.kind!=='cr'||!u.reaper||!u.insts.length)return;
    let j=-1,bv=1e9;
    S[foe].board.forEach((x,k)=>{ if(!x||x.kind!=='cr'||!x.insts.length)return;
      const v=((POOL[x.name]||{}).c||0)*10+x.a; if(v<bv){bv=v;j=k;} });
    if(j<0){ log(`  ${who} ${u.name} — 되돌릴 상대가 없다`,'t'); return; }
    const nm=S[foe].board[j].name;
    toHand(foe,j);
    log(`  ${who} ${u.name} — 상대 ${nm} 을(를) 손으로`,'t');
  });
  /* ── 연소 — **왼쪽부터 한 개체씩.** 한 몸이 타고, 죽고, 폭발까지 끝난 뒤 다음으로 간다 */
  const burners=B.filter(u=>u&&u.kind==='cr'&&u.burn>0);
  for(const u of burners){
    if(S.gen!==gen)return;                  /* 판이 갈렸다 — 지난 판의 연출을 이어 그리지 않는다 */
    if(!S[p].board.includes(u)||!u.insts.length)continue;   /* 앞선 폭발에 이미 죽었다 */
    /* 연소는 **불붙는 연출**로 따로 표시한다(성권 요청) — 광역 피해와 눈으로 갈린다 */
    const d=hurtAll(u,u.burn,'burn');
    log(`  ${who} ${u.name} 연소 ${u.burn} — 자신이 ${d} 피해`,'a');
    cleanup(p);                             /* 이 몸의 죽음과 그 폭발 연쇄를 여기서 마무리 */
    await beat();                           /* 그리고 눈으로 보여 준 뒤에 다음 칸으로 */
  }
  cleanup(p);
  render();
}

/* ── 피해 연출 큐 ──────────────────────────────────────────────
   ⚠⚠ 연소·폭발·광분은 **동기 코드**에서 한꺼번에 처리된다(endStep · onDeath · hurt).
     그래서 예전에는 숫자만 툭 바뀌고 아무 일도 안 일어난 것처럼 스쳐 지나갔다.
     상태는 그대로 즉시 바꾸고, **눈에 보이는 것만** 여기에 쌓아 뒀다가 나중에 한 발씩 띄운다
     (splashHit 이 쓰던 수법과 같다). 로직을 async 로 바꾸면 소환·사망 경로를 전부
     뜯어고쳐야 하는데 그럴 값어치가 없다.
   ⚠ 개체는 죽으면 판에서 빠진다 → **자리 번호가 아니라 개체를 들고 있다가** 띄울 때
     현재 자리를 다시 찾는다. 이미 사라졌으면 쌓을 때의 자리로 띄운다. */
let FXQ=[];
function hitFx(side,u,v,tone){
  if(!(v>0)||!u)return;
  const B=(S[side]||{}).board||[];
  FXQ.push({side,u,idx:B.indexOf(u),v,tone:tone||'dmg'});
  if(FXQ.length>40)FXQ.shift();            /* 흘려보내지 못한 것이 쌓이지 않게 */
}
function faceFx(side,v){ if(v>0)FXQ.push({side,face:1,v,tone:'dmg'}); }
/* 연소 불꽃 — 슬롯 위에 **떠 있는** 요소로 띄운다(슬롯 클래스는 다음 render 에 지워진다). */
function burnFx(r){
  const d=document.createElement('i');
  d.className='burnfx';
  d.style.cssText=`left:${r.left-4}px;top:${r.top-4}px;width:${r.width+8}px;height:${r.height+8}px`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),Math.round(680/SPEED));
}
function drawFx(e){
  if(typeof document==='undefined')return;
  let r=null;
  if(e.face){ const b=document.getElementById(e.side==='me'?'myBar':'foeBar');
    if(b){ r=b.getBoundingClientRect(); b.classList.add('struck');
      setTimeout(()=>b.classList.remove('struck'),420); } }
  else{
    const B=(S[e.side]||{}).board||[];
    const at=B.indexOf(e.u)>=0?B.indexOf(e.u):e.idx;
    const el=at>=0?slotEl(e.side,at):null;
    if(el){ r=el.getBoundingClientRect();
      if(e.tone==='burn')burnFx(r);              /* 연소 — 불이 올랐다 사라진다 */
      else{ el.classList.add('fxhit'); setTimeout(()=>el.classList.remove('fxhit'),420); }
    }
  }
  if(!r)return;
  const d=document.createElement('i');
  d.className='hitpop big'; d.textContent='-'+e.v;
  d.style.cssText=`left:${Math.round(r.left+r.width/2)}px;top:${Math.round(r.top+r.height*.4)}px`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),760);
}
/* 쌓인 연출을 한 발씩 띄우고, 그만큼 기다린다. 피해가 없었으면 시간을 안 쓴다. */
async function flushFx(gap){
  if(!FXQ.length)return 0;
  const q=FXQ; FXQ=[];
  const gen=S.gen, g=gap||170;
  for(const e of q){
    if(S.gen!==gen)return 0;
    drawFx(e);
    await sleep(g);
  }
  /* 마지막 한 발이 뜬 것을 눈이 따라잡을 여유. 간격에 비례시킨다 —
     고정 140 으로 두면 짧은 간격(공격 한 번마다)에서 상대적으로 길게 느껴진다. */
  await sleep(Math.round(g*0.6));

/* 때리는 연출 — 공격자가 대상으로 **달려들어 박고** 제자리로 돌아온다(성권 요청).
   ⚠ **실제 슬롯을 옮긴다**(복제가 아니다). 복제하면 원본이 제자리에 남아 몸이 둘로 보인다.
   ⚠ 가속이 규칙이다: 달려들 때 ease-in(점점 빨라짐) · 돌아올 때 ease-out(스르르).
     둘 다 같은 곡선을 쓰면 '미끄러지는' 느낌이 나고 부딪히는 맛이 없다.

   ⚠ `.slot` 은 transform 을, 그 안 `.tcard`/`.tart` 는 부유·광분 연출을 쓴다. 층을 갈라 둔다. */
async function lungeFx(aEl,tEl,tUnit){
  if(typeof document==='undefined'||!aEl||!tEl)return;
  const a=aEl.getBoundingClientRect(), b=tEl.getBoundingClientRect();
  if(!a.width||!b.width)return;
  const dx=(b.left+b.width/2)-(a.left+a.width/2);
  const dy=(b.top+b.height/2)-(a.top+a.height/2);
  const k=0.58;                                   /* 끝까지 안 간다 — 살짝 못 미쳐 박는다 */
  const go=Math.max(70,Math.round(180/SPEED)), back=Math.max(80,Math.round(240/SPEED));
  const z0=aEl.style.zIndex, t0=aEl.style.transition;
  aEl.style.zIndex='40';
  aEl.style.transition=`transform ${go}ms cubic-bezier(.6,0,.95,.45)`;
  aEl.style.transform=`translate(${dx*k}px,${dy*k}px) scale(1.07)`;
  await new Promise(r=>setTimeout(r,go));
  tEl.classList.add('bumped');
  /* 반동은 개체에도 적어 둔다 — 곧 이어질 render() 가 클래스를 지우기 때문이다 */
  if(tUnit){ tUnit.bumpfx=true; setTimeout(()=>{tUnit.bumpfx=false;},Math.round(300/SPEED)); }
  aEl.style.transition=`transform ${back}ms cubic-bezier(.18,.72,.3,1)`;
  aEl.style.transform='';
  await new Promise(r=>setTimeout(r,Math.round(back*0.45)));
  setTimeout(()=>{ aEl.style.zIndex=z0; aEl.style.transition=t0; aEl.style.transform='';
    tEl.classList.remove('bumped'); },back);
}
/* 파괴 연출 — **사라지기 직전의 그 자리**에서 카드가 금이 가며 부서진다.

     body 위에 얹는다. 슬롯 자체에 애니메이션을 걸면 다음 render 에 그냥 사라진다.

const boltTarget=(side,idx)=>idx===FACE||idx==null
  ? document.getElementById(side==='me'?'myBar':'foeBar') : slotEl(side,idx);

let DEALT=0;                             /* 흡혈용 — 방금 실제로 입힌 피해 */
/* 한 개체가 **한 번** 때린다. 정규 공격도, 연합이 부른 추가 공격도 전부 여기를 지난다.
   ⚠ 슬롯 번호가 아니라 **유닛 자체**를 받는다 — 앞의 몸이 죽으면 판이 다시 채워져 번호가 밀린다.
   돌려주는 값: false 면 그 뒤 공격을 이어갈 이유가 없다(게임이 끝났거나 판이 갈렸다). */
async function strike(p,u,gen,tag,opt){
  const foe=p==='me'?'ai':'me', D=S[foe].board, me=p==='me';
  if(S.gen!==gen)return false;
  if(S[foe].hp<=0){S.fx=null;return false;}
  const i=S[p].board.indexOf(u);
  if(i<0||!u.insts.length||u.a<=0)return true;

  /* --- 대상 판정 : 왼쪽부터 스캔 --- */
  let tgt=-1;
  for(let j=0;j<SLOTS;j++){
    const d=D[j];
    if(!d||d.kind!=='cr'||!d.insts.length)continue;
    if(u.p)continue;                     // 관통 — 수호를 통째로 무시
    if(!d.g)continue;                    // 수호 아님 → 통과
    if(u.f&&!d.f)continue;               // 비행 공격은 지상 수호 무시
    tgt=j;break;
  }

  /* --- 1) 공격자 강조 + 대상 조준 --- */
  S.fx={aSide:p,aIdx:i,tSide:foe,tIdx:tgt>=0?tgt:null,tHero:tgt<0?foe:null};
  render();
  const label=u.name+(tag||'');
  const aEl=slotEl(p,i);
  const tEl=tgt>=0?slotEl(foe,tgt):document.getElementById(foe==='me'?'myBar':'foeBar');
  /* ⚠ 연격·연합의 **두 번째 이후 타격은 화살표를 다시 안 그린다**(성권 요청).
     같은 대상을 향해 화살표가 몇 번씩 다시 뜨면 몇 대를 때렸는지 되레 안 보인다.
     대신 달려드는 연출은 매번 한다 — '여러 번 때린다' 가 그걸로 읽힌다. */
  if(!(opt&&opt.notrace))drawTrace(aEl,tEl,u.f?'f':(tgt>=0?'g':''));
  await lungeFx(aEl,tEl,tgt>=0?D[tgt]:null);
  if(S.gen!==gen||!S.fx)return false;

  /* --- 2) 피해 적용 --- */
  if(tgt>=0){
    // sleep(400) 사이에 대상이 사라졌을 수 있다 → 재검증 후 없으면 이번 타격은 흘린다
    const d=D[tgt];
    if(!d||d.kind!=='cr'||!d.insts.length){S.fx=null;render();return true;}
    const inst=d.insts[0];
    const before=inst.hp;
    /* 다크조커 — 적을 때릴 때마다 그만큼 더 준다. 얼굴에도 똑같이 붙는다(아래). */
    const dealt=hurt(d,inst,u.a+(u.extra||0)); // 가호·경화 적용 · 초과 피해 이월 없음
    const waste=dealt-before;
    const dead=inst.hp<=0;
    S.fx.dmg=dealt; S.fx.struck=true;
    S.fx.kill=dead?`${d.name} 파괴`:null;
    S.fx.waste=(dead&&waste>0)?`초과 ${waste} 소멸`:null;
    log(`${me?'나':'상대'} ${label}(${u.a}${dealt!==u.a?`→${dealt}${dealt===0?' 가호':' 경화'}`:''}) → ${d.name} ${before}→${Math.max(0,inst.hp)}`,u.f?'f':'g');
    if(dead){
      log(`  ${d.name} 1개체 파괴${waste>0?` · 초과 ${waste} 소멸(이월 없음)`:''}`,'a');
      /* ⚠⚠⚠ 예전엔 여기서 `d.insts.shift()` 로 **죽은 개체를 직접 지웠다.**
         그러면 cleanup 이 볼 시체가 남지 않는다 → `onDeath` 가 아예 안 불린다 →
         **전투로 죽은 몸은 폭발도 환류도 단말마도 안 돌았다.** 무덤·묘지 지형·
         소멸 트리거 인챈트(불사조의 깃털·악마의 석상)까지 통째로 조용히 죽어 있었다.
         (스켈톤이 맞아 죽었는데 안 되살아나는 것으로 성권이 잡았다.)
         죽음은 **한 통로(cleanup → onDeath)** 로만 지나가야 한다 — 여기서 지름길을
         내면 그 통로에 매달린 것들이 전부 새 나간다. */
      cleanup(foe);
    }
    DEALT=dealt;
    render();
  }else{
    const av=u.a+(u.extra||0);
    faceDmg(foe,av);
    DEALT=av;
    S.fx.dmg=av; S.fx.struck=true;
    log(`${me?'나':'상대'} ${label}(${av}) → 플레이어 · HP ${Math.max(0,S[foe].hp)}`,u.f?'f':'a');
    render();
  }
  /* 흡혈 — 실제로 입힌 피해의 **절반**만큼 회복한다(가호·경화로 0이면 회복도 0).
     ⚠⚠ 2026-08 **회복 대상이 본체에서 그 크리처 자신으로 바뀌었다.**
        최대 체력을 넘지 않는다 — 넘게 두면 흡혈 하나로 몸이 무한히 불어난다. */
  if(u.drain&&DEALT>0&&u.insts.length){
    const g=Math.round(DEALT/2), inst=u.insts[0], b=inst.hp;
    inst.hp=Math.min(inst.mh,inst.hp+g);
    /* 흡혈 — **맞은 쪽에서 때린 몸으로** 붉은 것이 빨려 들어간다.
       ⚠ 회복 대상은 본체가 아니라 **그 크리처 자신**이다(2026-08 규칙 변경) —
         발사체도 그 몸으로 가야 한다. 본체로 보내면 규칙과 그림이 어긋난다. */
    flyBolt(tEl,slotEl(p,S[p].board.indexOf(u))||aEl,'#c0392b');
    log(`  ${me?'나':'상대'} ${u.name} 흡혈 — 입힌 ${DEALT} 의 절반 ${g} 회복 · HP ${b}→${inst.hp}`,'g'); render();
  }
  await sleep(560);
  if(S.gen!==gen)return false;
  S.fx=null;
  /* 이 공격으로 터진 폭발·광분을 **그 자리에서** 보여 준다. 다음 공격과 뭉치면
     누가 왜 아팠는지 읽을 수가 없다. */
  render(); await flushFx(150);
  return true;
}

async function resolveAttacks(p){
  const gen=S.gen;                       // 도중에 새 게임이 시작되면 중단한다
  const foe=p==='me'?'ai':'me';
  const B=S[p].board;
  const me=p==='me';
  const hasAtk=B.some(u=>u&&u.kind==='cr'&&u.a>0);
  if(hasAtk){phaseCard(me?'내 공격':'상대 공격');await sleep(760);}

  /* ⚠ 판이 공격 중에 갈린다(죽으면 슬롯이 당겨진다) — **시작 시점의 명단**을 떠 두고
     매번 아직 살아 있는지 확인한다. 슬롯 번호로 돌면 죽은 자리 뒤가 통째로 밀린다. */
  const order=B.filter(u=>u&&u.kind==='cr');
  for(const u of order){
    if(S.gen!==gen)return;
    if(!S[p].board.includes(u)||!u.insts.length||u.a<=0)continue;
    if(u.sick){                            /* 육중 — 소환한 턴에는 공격하지 않는다 */
      log(`${me?'나':'상대'} ${u.name} 육중 — 소환한 턴이라 공격하지 않는다`,'t');
      continue;
    }
    let go=true;
    /* 연격 N — 개체마다 **N 번** 친다. 연격이 없으면 multi 가 1 이라 예전과 똑같다.
       ⚠ 개체 수(insts) 와 곱해진다 — 증식으로 몸이 둘이면 2×N 번이다. */
    const hits=u.insts.length*(u.multi||1);
    for(let n=0;n<hits&&go;n++){
      if(!S[p].board.includes(u)||!u.insts.length)break;
      /* 화살표는 **첫 발에만**(성권 요청) — 같은 대상에 몇 번씩 다시 뜨면
         몇 대를 때렸는지 되레 안 보인다. 달려드는 연출은 매번 한다. */
      go=await strike(p,u,gen,(u.multi||1)>1?` 연격 ${n+1}/${hits}`:'',{notrace:n>0});
    }
    if(!go)return;
    /* ── 연합 ─────────────────────────────────────────────────
       이 몸이 때리면 **같은 이름의 아군이 모두 한 번씩** 따라 때린다.
       ⚠ 따라 때리는 공격은 다시 연합을 부르지 않는다(안 그러면 무한히 튄다).
       ⚠ 자기 자신은 뺀다 — 방금 때렸다. */
    if(u.ally){
      const mates=S[p].board.filter(x=>x&&x.kind==='cr'&&x!==u&&x.name===u.name
                                       &&x.insts.length&&x.a>0&&!x.sick);
      for(const m of mates){
        if(!S[p].board.includes(m))continue;
        /* 연합도 화살표는 **주체가 그린 것 하나뿐**이다. 따라 치는 몸들은 달려들기만 한다. */
        go=await strike(p,m,gen,' 연합',{notrace:true});
        if(!go)return;
      }
      if(mates.length)log(`  ${me?'나':'상대'} ${u.name} 연합 — 동명 ${mates.length}개체가 따라 쳤다`,'g');
    }
  }
  S.fx=null;
  cleanup(foe);
  render();
}

/* ── 인챈트 = 트리거형 ────────────────────────────────────────
   **상시 버프가 아니다.** 정해진 트리거가 올 때마다 충전을 1 소모하고 한 번 발동한다.
   (한때 '내 크리처 전체 ATK +2' 같은 상시 오라가 있었는데, 충전을 안 쓰니 인챈트가 아니었다.
    더 나쁘게는 엔진이 그걸 무시하고 **전부 얼굴 피해**로 처리하고 있었다 — 12종이 규칙과 달랐다.)
   정본은 tools/gen_decks.py 의 `ENCH_TRIG` 이고, 여기 `fx` 키가 그 짝이다.
   ⚠ 새 인챈트를 만들면 **양쪽에 다** 넣어야 한다. `test_ench.js` 가 짝이 맞는지 대조한다. */
/* 규칙문에서 **조사 앞에 붙은 카드 이름**을 꺼낸다.
   뒤에서부터 최대 세 낱말까지 이어 붙여 POOL 에 있는 이름을 찾는다 — 이름에 띄어쓰기가
   있어도("산호의 축복") 문장 앞머리를 같이 집지 않는다. */
function cardBefore(text,tail){
  const m=(text||'').match(tail); if(!m)return '';
  const w=(text.slice(0,m.index)).trim().split(/\s+/);
  for(let i=Math.max(0,w.length-3);i<w.length;i++){
    const nm=w.slice(i).join(' ');
    if(POOL[nm])return nm;
  }
  return '';
}
const ENCHFX={

                   const t=S[f].board[j], b=t.insts[0].hp; hurt(t,t.insts[0],u.v); cleanup(f);
                   return `${t.name} ${b}→${Math.max(0,b-u.v)}`; },

                   const t=S[f].board[j], d=Math.max(1,Math.round(u.v/2));
                   const b=t.a; t.a=Math.max(0,t.a-d); return `${t.name} ATK ${b}→${t.a}`; },

                   const t=S[p].board[j]; t.a+=1; t.insts.forEach(i=>{i.hp+=1;i.mh+=1;});

  buffnew:(p,u,ctx)=>{ const t=ctx&&ctx.unit; if(!t||t.kind!=='cr')return '대상 없음';

                   return `${t.name} HP ${b}→${i.hp}`; },

const foeOf=p=>p==='me'?'ai':'me';
function bestFoe(f){ let best=-1,bv=-1;
  S[f].board.forEach((u,j)=>{ if(u&&u.kind==='cr'&&u.insts.length){
    const v=u.a*10+u.insts[0].hp; if(v>bv){bv=v;best=j;} } }); return best; }
function weakMine(p){ let best=-1,bv=1e9;                 /* 버프·경화는 약한 쪽부터 챙긴다 */
  S[p].board.forEach((u,j)=>{ if(u&&u.kind==='cr'&&u.insts.length){
    const v=u.a*10+u.insts[0].hp; if(v<bv){bv=v;best=j;} } }); return best; }

/* 트리거가 왔다 — 그 트리거를 가진 내 인챈트를 **충전 1씩 소모하며** 전부 발동한다.
   ⚠ `ENCHD` 로 재진입을 막는다. 인챈트가 피해를 주면 그게 또 death/hurt 를 부른다. */
let ENCHD=0;
/* 아직 안 만든 fx. **충전을 쓰지 않고 그냥 지나간다** — 반쯤 도는 것보다 아예 안 도는 게
   낫다(써 버린 충전은 되돌릴 수 없다). 여기서 빠지는 이름은 카드 뷰어에도 표시하지 않는다. */
/* 아직 안 만든 fx. 지금은 비어 있다 — 호박 머리(scry)는 어둠 3단계에서 만들었다.
   ⚠ 장치는 남긴다. 다음에 '데이터는 있는데 엔진이 없는' 카드가 또 생긴다. */
const FXPEND=new Set();
function fireEnch(p,trig,ctx){
  if(ENCHD>3||!S[p]||!S[p].board)return;
  const who=p==='me'?'나':'상대';
  ENCHD++;
  for(let i=0;i<SLOTS;i++){
    const u=S[p].board[i];
    if(!u||u.kind!=='en'||u.charge<=0)continue;
    const c=POOL[u.name]||{};
    if((c.tg||'end')!==trig)continue;
    if(FXPEND.has(c.fx))continue;              /* 미구현 — 충전을 안 쓰고 넘어간다 */
    const fx=ENCHFX[c.fx||'face']; if(!fx)continue;
    const detail=fx(p,u,ctx);
    u.charge--;
    log(`${who} ${u.name} 발동 — ${detail} · 잔여 충전 ${u.charge}`,'e');
    if(u.charge<=0)log(`  ${u.name} 소진 — 슬롯 반환`,'e');
  }
  ENCHD--;
  S[p].board.forEach((u,i)=>{ if(u&&u.kind==='en'&&u.charge<=0)S[p].board[i]=null; });
  const packed=S[p].board.filter(Boolean);
  if(packed.length!==S[p].board.length){ S[p].board.length=0; packed.forEach(x=>S[p].board.push(x)); }
}
/* ── 모았다가 한 번에 터지는 인챈트(충전식 화염구) ──────────────────
   보통 인챈트는 트리거마다 충전을 **1씩 쓴다.** 이건 반대로 주문을 쓸 때마다 **모으고**,
   조건이 맞는 턴 끝에 모은 만큼을 통째로 쏟고 소멸한다.
   ⚠ 그래서 트리거를 'fuse' 로 둬서 fireEnch 의 일반 경로에 **안 걸리게** 했다
     (걸리면 매 턴 종료마다 충전이 1씩 깎여 영영 안 모인다).
   ⚠ 조건은 endStep **뒤에** 재야 한다 — 연소로 내 판이 비는 것도 '비었다' 로 쳐야 한다. */
const isFuse=n=>/내 크리처가 없는 채로 내 턴이 끝나면/.test((POOL[n]||{}).d||'');
/* 판에 얹힌 뇌관의 총 충전. AI 가 '지금 판을 비울 값어치가 있나' 를 재는 데 쓴다. */
function fuseCharge(P){
  return (P.board||[]).reduce((s,u)=>s+((u&&u.kind==='en'&&isFuse(u.name))?u.charge:0),0);
}
function fuseEnchants(p){
  const f=p==='me'?'ai':'me', who=p==='me'?'나':'상대';
  let blew=false;
  S[p].board.forEach((u,i)=>{
    if(!u||u.kind!=='en'||!isFuse(u.name))return;
    if(S[p].board.some(x=>x&&x.kind==='cr'&&x.insts.length))return;   /* 아직 판에 몸이 있다 */
    const v=u.charge; if(v<=0)return;
    let k=0;
    S[f].board.forEach(t=>{ if(t&&t.kind==='cr'){hurtAll(t,v);k++;} });
    const dv=faceDmg(f,v);
    log(`${who} ${u.name} 폭발 — 충전 ${v} · 적 ${k}종과 상대에게 ${dv} 피해 `
        +`· HP ${Math.max(0,S[f].hp)}`,'a');
    S[p].board[i]=null; blew=true;
  });
  if(blew){ cleanup(f);
    const packed=S[p].board.filter(Boolean);
    S[p].board.length=0; packed.forEach(x=>S[p].board.push(x)); }
  return blew;
}
/* 내 턴 종료 인챈트만 연출을 태운다(나머지는 트리거 순간에 로그로 흐른다) */
async function drainEnchants(p){
  const has=S[p].board.some(u=>u&&u.kind==='en'&&u.charge>0&&((POOL[u.name]||{}).tg||'end')==='end');
  fireEnch(p,'end');
  if(has){ render(); await sleep(620); }
  cleanup(p); render();
}

/* ============ 턴 ============ */
function startTurn(p){
  const P=S[p];
  P.landPlayed=false;
  /* 지형이 한꺼번에 앞면으로 돌아온다 — **돌아올 때도 뒤집기 연출**을 태운다.
     (연출 없이 그냥 바뀌면 '턱' 하고 갈리는 느낌이 난다) */
  const back=P.lands.filter(l=>l.used||l.entering);
  P.lands.forEach(l=>{l.used=false;l.entering=false;l.justUsed=false;});
  if(back.length){
    back.forEach(l=>{l.justBack=true;});
    setTimeout(()=>back.forEach(l=>{l.justBack=false;}),Math.round(420/SPEED));
  }
  /* 육중 — 내 턴이 시작되면 소환 멀미가 풀린다 */
  P.board.forEach(u=>{ if(u&&u.kind==='cr')u.sick=false; });
  /* 사신의 수확 — **표식을 건 쪽의 턴이 시작될 때** 거둔다. 양쪽 판을 다 훑는다. */
  ['me','ai'].forEach(sd=>{
    let k=0;
    S[sd].board.forEach(u=>{ if(u&&u.kind==='cr'&&u.doom&&u.doomBy===p&&u.insts.length){
      u.insts[0].hp=0; u.doom=0; k++;
      log(`  사신의 수확 — ${u.name} 을(를) 거둔다`,'a'); } });
    if(k)cleanup(sd);
  });
  /* 소멸 지형(수정구) — 내 턴이 시작될 때마다 수명이 하나씩 준다. 0 이 되면 사라진다.
     ⚠ used 를 푸는 위 코드보다 **뒤**에 둔다 — 사라질 지형까지 굳이 되돌릴 필요가 없다. */
  for(let i=P.lands.length-1;i>=0;i--){
    const l=P.lands[i]; if(!l.temp)continue;
    l.temp--;
    if(l.temp<=0){ P.lands.splice(i,1); log(`  ${p==='me'?'나':'상대'} ${l.name} 소멸`,'t'); }
  }
  /* 불사조의 알 — 내 턴이 시작되면 멀쩡한 몸으로 돌아온다(성장과 같은 transformUnit) */
  for(let i=0;i<SLOTS;i++){ const u=P.board[i];
    if(u&&u.kind==='cr'&&u.hatch&&POOL[u.hatch])transformUnit(p,i,u.hatch,'부화'); }
  landStart(p);                    /* 특수 지형(고블린 요새 등) — 턴 종료 쪽은 landEnd */
  turnDraw(p);                     /* 호박 머리는 여기서만 갈아탄다 */
  if(checkEnd())return;
  log(`— 턴 ${S.turn} · ${p==='me'?'내 턴':'상대 턴'} (지형 ${P.lands.length})`,'t');
  turnBanner(p);
  render();
  /* 튜토리얼에서는 AI 가 아니라 **대본**이 상대를 움직인다 */
  if(p==='ai')setTimeout(TUT.on?tutFoeTurn:aiTurn,760/SPEED);
}
async function endTurn(){
  if(S.busy)return;
  /* 밀물 대상을 안 고르고 턴을 넘길 수 없다 — 고를 수 있는 대상이 있으면 **반드시** 고른다 */
  if(S.mind){ toast('마인드 플레어 대상을 먼저 고르세요'); return; }
  if(S.pick){ toast(S.pick.msg); return; }
  if(S.cpick){ toast('카드를 먼저 고르세요'); return; }
  if(S.tide){ toast('밀물 대상을 먼저 고르세요'); return; }
  if(S.rush){ toast('속공으로 공격할 크리처를 먼저 고르세요'); return; }
  S.busy=true;S.sel=null;S.mode=null;render();
  const p=S.active;
  await resolveAttacks(p);           // 크리처 공격 먼저
  render(); await flushFx();         // 공격 중 터진 폭발·광분을 한 발씩 보여 준다
  if(checkEnd()){S.busy=false;return;}
  landEnd(p);                        // 특수 지형(호수 유적·바닷속 풍경·불지옥의 계곡)
  await drainEnchants(p);            // 인챈트 발동
  render(); await flushFx();
  if(checkEnd()){S.busy=false;return;}
  /* 성장·연마·증식·연소는 턴 종료 마지막에. **왼쪽부터 한 개체씩** 돌며 스스로 보여 준다. */
  await endStep(p);
  await flushFx(); render();         /* 마지막에 남은 연출이 있으면 마저 흘려보낸다 */
  /* ⚠ 뇌관은 **endStep 뒤**에 본다 — 연소로 내 판이 비는 것도 '비었다' 로 쳐야 한다 */
  if(fuseEnchants(p)){ render(); await sleep(700); }
  if(checkEnd()){S.busy=false;return;}
  S.busy=false;
  if(p==='me'){S.active='ai';startTurn('ai');}
  else{S.turn++;S.active='me';startTurn('me');}
}
function checkEnd(){
  if(S.ai.hp<=0||S.me.hp<=0){
    /* ⚠⚠ **busy 를 여기서 끈다.** 예전에는 부르는 쪽이 `if(checkEnd()){S.busy=false;return;}` 로
       껐는데, 그 사이 이 함수가 이미 render() 를 한 번 한다 — 그리고 그 뒤로 다시 그리는 코드가
       없다. 그래서 판이 끝난 뒤에도 '전투 처리 중…' 가리개가 화면에 그대로 남았고,
       가리개(z-index 140)가 보상 창(80) 위를 덮어 **카드를 못 누르는 채로 멈췄다.**
       끄는 자리를 한 곳으로 모은다 — 부르는 쪽이 하나라도 빠뜨리면 같은 일이 또 난다. */
    S.busy=false;
    S.over=true;render();
    const win=S.ai.hp<=0&&S.me.hp>0;
    /* ⚠ 튜토리얼은 원정 전투가 아니다 — 보상·패배 화면으로 새면 안 된다. 안내만 닫고 지도로. */
    if(TUT.on){ tutPanel(null);
      rgOpen(`<h2>${win?'훈련 완료':'훈련 종료'}</h2>`
        +`<div class="msub">이제 지도로 나가 원정을 시작하세요.</div>`
        +`<div class="mbtns"><button class="go" id="tutGo">지도로</button></div>`);
      document.getElementById('tutGo').onclick=()=>{rgClose();tutEnd();};
      return true; }
    if(RG.on){ RG.hp=Math.max(0,S.me.hp); RG.fighting=false; return rgAfterBattle(win); }
    document.getElementById('overT').textContent=win?'승리':(S.me.hp<=0&&S.ai.hp<=0?'무승부':'패배');
    document.getElementById('overS').textContent=`${S.turn}턴 종료 · 내 HP ${Math.max(0,S.me.hp)} / 상대 HP ${Math.max(0,S.ai.hp)}`;
    document.getElementById('over').classList.add('on');
    return true;
  }
  return false;
}

/* ============ AI ============ */
async function aiTurn(){
  const P=S.ai;
  S.busy=true;render();
  let guard=0;
  while(guard++<14){
    await sleep(300);
    /* 지형 먼저 */
    if(!P.landPlayed){
      const li=P.hand.findIndex(isLand);
      if(li>=0){ playLand('ai',P.hand[li]); P.hand.splice(li,1); render(); continue; }
    }
    /* 추가 지형(인어 기둥 · 지하 감옥)은 지형을 이미 놓았어도 낼 수 있다 — 자원만 있으면 깐다 */
    {
      const xi=P.hand.findIndex(n=>isLand(n)&&LANDS[n].extra
                                   &&manaLeft('ai')>=(LANDS[n].pay||0)+1);
      if(xi>=0){ playLand('ai',P.hand[xi]); P.hand.splice(xi,1); render(); continue; }
    }
    const playable=P.hand.map((n,i)=>({n,i,c:POOL[n]})).filter(x=>x.c&&canPay('ai',x.n));
    if(!playable.length)break;
    /* 내 크리처에 붙이는 강화·부여 스펠(도화선 · 화염 방패). 광역 판단이 이걸 먼저 봐야 해서
       여기서 한 번만 찾아 두고 아래 2.65 와 4) 가 같은 것을 쓴다. */
    const gsp=playable.find(x=>x.c.k==='sp'&&NEEDS_MINE.includes(x.c.mode)
                               &&!isMassBuff(x.n)&&!isFoeGrant(x.n));

    /* 1) 광역 — 상대 판이 두꺼울 때.
       ⚠ **내 판까지 태우는 광역**(파이어볼·겁화)은 내 몸이 살아남을 때 쓴다.
          살릴 수단(화염 방패 같은 +HP 강화)이 손에 있으면 이번 턴은 **그걸 먼저** 낸다 —
          그게 화염술사의 콤보다. 한때 조건이 '내 개체 3 이상' 하나뿐이라
          제 화염 아귀를 매번 같이 태워 죽였다. */
    const aoe=playable.find(x=>x.c.k==='sp'&&x.c.mode==='aoe');
    const myInsts=S.me.board.reduce((s,u)=>s+(u&&u.kind==='cr'?u.insts.length:0),0);
    let aoeSelf=0, saveIdx=-1, aoeOK=false;
    if(aoe){
      /* ⚠ aoeVal 은 부르면 안 된다 — 분신은 재는 순간 내 크리처를 태워 버린다(부작용). */
      const v=aoe.c.v||0;
      aoeSelf=selfDmgOf(aoe.n);
      const foeKill=S.me.board.reduce((s,u)=>
        s+(u&&u.kind==='cr'?u.insts.filter(i=>i.hp<=v).length:0),0);
      let lose=0, bv=-1;
      P.board.forEach((u,j)=>{
        if(!u||u.kind!=='cr'||!u.insts.length||!aoeSelf)return;
        if(u.spellproof)return;                 /* 푸른 불꽃의 수호병 — 어차피 안 맞는다 */
        if(u.insts[0].hp>aoeSelf)return;
        lose++;
        const val=u.a*10+u.insts[0].hp; if(val>bv){bv=val;saveIdx=j;}   /* 살릴 값어치가 큰 쪽 */
      });
      /* ⚠ 살릴 수단이 **지금 손에** 있으면 이번 턴은 쏘지 않는다. 셈으로만 보면
         화염 아귀 하나와 상대 셋을 바꾸는 게 이득이지만, 화염술사가 하려는 건 그 교환이 아니라
         **방패를 두르고 혼자 살아남는** 것이다 — 다음 차례에 그대로 쏜다. */
      const saveH=gsp?parseBuff(gsp.c.d).h:0;
      const rescuable=saveIdx>=0&&saveH>0&&(P.board[saveIdx].insts[0].hp+saveH)>aoeSelf;
      aoeOK=(myInsts>=3||foeKill>=2)&&(lose===0||foeKill>lose)&&!rescuable;
      /* ⚠ 뇌관(충전식 화염구)이 얹혀 있으면 셈이 뒤집힌다 — **내 판을 비우는 것이 목적**이다.
         이 광역으로 내 크리처가 전부 정리되면 이번 턴 끝에 충전만큼 통째로 터진다. */
      if(fuseCharge(P)>0&&aoeSelf>0){
        const left=P.board.filter(u=>u&&u.kind==='cr'&&u.insts.length
          &&(u.spellproof||u.insts[0].hp>aoeSelf)).length;
        if(left===0)aoeOK=true;
      }
    }
    if(aoe&&aoeOK){
      await reveal('ai',aoe.n);
      pay('ai',aoe.n);P.hand.splice(aoe.i,1);
      /* 침묵형 광역(인어의 노래·비명)은 피해가 아니라 ATK 을 0 으로 만든다 */
      if(aoeSilence('ai',aoe.n)!==null){ phaseCard(aoe.n); render(); continue; }
      if(darkMass('ai',aoe.n)!==null){ phaseCard(aoe.n); render(); continue; }
      burnRightLand('ai',aoe.n);
      const av=aoeVal('ai',aoe.n);
      /* ⚠ '모든 크리처' 광역은 **자기 판도** 맞는다 — 사람 쪽과 같은 규칙이어야 한다 */
      const asides=aoeBoth(aoe.n)?['me','ai']:['me'];
      log(`상대 ${aoe.n} 사용 — ${aoeBoth(aoe.n)?'양쪽':'내'} 전체 개체에 ${av} 피해`,'a');
      aoeSpread('ai',aoe.n,asides,av);
      if(aoeFace(aoe.n))faceDmg('me',av);
      let akill=0;
      S.me.board.forEach(u=>{if(u&&u.kind==='cr')akill+=u.insts.filter(i=>i.hp<=0).length;});
      S.aoeFx={side:'me',v:av};render();
      phaseCard(aoe.n);
      await sleep(760);
      asides.forEach(sd=>S[sd].board.forEach(u=>{if(u&&u.kind==='cr'){const k=u.insts.filter(i=>i.hp<=0).length;if(k)log(`  ${u.name} ${k}개체 파괴`,'a');}}));
      S.aoeFx=null;asides.forEach(cleanup);
      spellSelfDmg('ai',aoe.n); spellHeal('ai',aoe.n,akill);
      render();
      continue;
    }

    /* 2) 확실히 죽일 수 있는 제거 */
    const kills=[];
    playable.filter(x=>x.c.k==='sp'&&x.c.mode==='dmg').forEach(x=>{
      S.me.board.forEach((u,j)=>{
        if(u&&u.kind==='cr'&&u.insts.length&&x.c.v>=u.insts[0].hp)
          kills.push({x,j,val:u.a*10+u.insts[0].hp-x.c.c*3});
      });
    });
    if(kills.length){
      kills.sort((a,b)=>b.val-a.val);
      const k=kills[0], u=S.me.board[k.j];
      await reveal('ai',k.x.n);
      await castBolt('ai',boltTarget('me',k.j),k.x.n);
      const before=u.insts[0].hp;
      hurt(u,u.insts[0],k.x.c.v);
      log(`상대 ${k.x.n} → 내 ${u.name} ${before}→${Math.max(0,u.insts[0].hp)}`,'a');
      log(`  ${u.name} 1개체 파괴`,'a');
      pay('ai',k.x.n);P.hand.splice(k.x.i,1);
      S.fx={tSide:'me',tIdx:k.j,dmg:k.x.c.v,struck:true,kill:`${u.name} 파괴`};
      render();
      cleanup('me'); S.fx=null; render();   /* 맞는 그 순간에 부서진다(사람 쪽과 같은 규칙) */
      await sleep(640);
      S.fx=null;cleanup('me');render();
      continue;
    }

    /* 2.2) 본체에 꽂기 — '크리처 또는 상대에게' 주문(파이어 애로우 · 화염구).
       ⚠ 이걸 안 붙이면 AI 는 이 주문을 **크리처에만** 쓴다. 상대 판이 비었을 때 손에 쥔 채
         아무것도 못 하고, 마무리 한 방도 영영 안 나간다.
       두 경우에만 얼굴로 간다: ① 그 한 방으로 끝난다 ② 때릴 크리처가 아예 없다. */
    {
      const fsp=playable.filter(x=>x.c.k==='sp'&&x.c.mode==='dmg'&&canFace(x.n))
        .sort((a,b)=>(b.c.v||0)-(a.c.v||0))[0];
      const foeBodies=S.me.board.some(u=>u&&u.kind==='cr'&&u.insts.length);
      if(fsp&&((fsp.c.v||0)>=S.me.hp||!foeBodies)){
        await reveal('ai',fsp.n);
        await castBolt('ai',boltTarget('me',FACE),fsp.n);
        const v=dmgVal('ai',fsp.n,null), dv=faceDmg('me',v);
        log(`상대 ${fsp.n} → 내 본체 ${dv} 피해 · HP ${Math.max(0,S.me.hp)}`,'a');
        pay('ai',fsp.n);P.hand.splice(fsp.i,1);
        render(); await sleep(520);
        if(checkEnd())return;
        continue;
      }
    }

    /* 2.5) 요격 — 가장 비싼 내 크리처를 자른다 */
    const killsp=playable.find(x=>x.c.k==='sp'&&x.c.mode==='kill');
    if(killsp){
      let best=-1,bv=-1;
      S.me.board.forEach((u,j)=>{
        if(u&&u.kind==='cr'&&u.insts.length){const v=u.a*10+u.insts[0].hp;if(v>bv){bv=v;best=j;}}
      });
      if(best>=0&&bv>=14){
        await reveal('ai',killsp.n);
        resolveOnFoe('ai',killsp.n,best);
        pay('ai',killsp.n);P.hand.splice(killsp.i,1);
        S.fx={tSide:'me',tIdx:best,struck:true,kill:'파괴'};render();
        await sleep(620);S.fx=null;cleanup('me');render();
        continue;
      }
    }

    /* 2.55) 희생 드로우(불사조의 깃털) — **손해 보지 않을 때만** 쓴다.
       ① 곧 죽을 개체(HP 가 낮거나 연소로 이번 턴에 타 죽는다)를 제물로 → 어차피 잃을 몸
       ② 값싼 개체(2코 이하)를 제물로 → 카드 2장이 확실히 이득
       ③ 손에 낼 수 있는 게 이것뿐 → 안 쓰면 턴이 통째로 빈다
       ⚠ 조건 없이 쓰게 두면 AI 가 자기 에이스를 갈아 넣는다. */
    const sac=playable.find(x=>x.c.k==='sp'&&isSac(x.n));
    if(sac){
      let best=-1,bs=1e9;
      P.board.forEach((u,j)=>{
        if(!sacOK(u))return;
        const hp=u.insts[0].hp, cost=(POOL[u.name]||{}).c||0;
        const dying=hp<=2||(u.burn&&hp<=u.burn);
        const cheap=cost<=2;
        if(!dying&&!cheap)return;
        const loss=(dying?0:u.a*2+hp);       /* 곧 죽을 몸은 잃는 게 없다 */
        if(loss<bs){bs=loss;best=j;}
      });
      const onlyPlay=playable.length===1;
      if(best>=0&&(bs<=10||onlyPlay)){
        await reveal('ai',sac.n);
        resolveOnMine('ai',sac.n,best);
        pay('ai',sac.n);P.hand.splice(sac.i,1);render();
        continue;
      }
    }

    /* 2.6) 드로우·회복 — 손이 얇거나 HP가 낮을 때 */
    const inst=playable.find(x=>x.c.k==='sp'&&INSTANT.includes(x.c.mode)&&x.c.mode!=='aoe'&&!isSac(x.n));
    if(inst&&((inst.c.mode==='draw'&&P.hand.length<=4)||(inst.c.mode==='heal'&&P.hp<MAXHP*0.6))){
      await reveal('ai',inst.n);
      resolveInstant('ai',inst.n);
      pay('ai',inst.n);P.hand.splice(inst.i,1);render();
      continue;
    }

    /* 2.6-b) 상대에게 심는 부여(소이탄) — **지연 제거**다. 두 턴 안에 타 죽을 몸에만 쓴다.
       ⚠ 그냥 제일 큰 놈에게 던지면 체력 20짜리에 연소 5를 심고 아무 일도 안 일어난다. */
    const fg=playable.find(x=>x.c.k==='sp'&&isFoeGrant(x.n));
    if(fg){
      const bn=grantOf(fg.c.d).burn||0;
      let best=-1,bv=-1;
      S.me.board.forEach((u,j)=>{
        if(!u||u.kind!=='cr'||!u.insts.length||!bn)return;
        if(u.insts[0].hp>bn*2)return;          /* 두 턴 안에 안 죽는다 — 아깝다 */
        const v=u.a*10+u.insts[0].hp; if(v>bv){bv=v;best=j;}
      });
      if(best>=0){
        await reveal('ai',fg.n);
        resolveOnFoe('ai',fg.n,best);
        pay('ai',fg.n);P.hand.splice(fg.i,1);render();
        continue;
      }
    }

    /* 2.65) 강화·부여 — 대상을 고를 수 있을 때 쓴다.
       ⚠ 예전에는 AI 가 이 부류를 **아예 못 냈다** — 고블린 덱의 도화선이 손에서 썩었다.
       대상은 붙이고도 이번 턴을 넘길 몸으로 고른다(연소로 곧 타 죽을 개체에 주면 그냥 버리는 것). */
    if(gsp){
      const bf=parseBuff(gsp.c.d), gr=grantOf(gsp.c.d);
      let best=-1,bv=-1;
      P.board.forEach((u,j)=>{
        /* ⚠ 연소를 얹는 부여(도화선)는 핵심 몸에 쓰지 않는다 — 천천히 자살하는 셈이다 */
        if(!sacOK(u)||(gr.burn&&u.core))return;
        const hp=u.insts[0].hp+bf.h, bn=(u.burn||0)+gr.burn;
        if(bn&&hp<=bn)return;                /* 붙여도 이번 턴 종료에 타 죽는다 */
        /* 이번 턴 쏘려던 광역에 타 죽을 몸을 **먼저** 살린다 — 화염 방패 → 파이어볼 순서 */
        const rescue=(j===saveIdx&&hp>aoeSelf)?1000:0;
        const v=rescue+(u.a+bf.a)*10+hp;
        if(v>bv){bv=v;best=j;}
      });
      if(best>=0){
        await reveal('ai',gsp.n);
        resolveOnMine('ai',gsp.n,best);
        pay('ai',gsp.n);P.hand.splice(gsp.i,1);render();
        continue;
      }
    }

    /* 2.66) 전체 강화(불씨 살리기) — 대상을 고르지 않는다. 받을 개체가 둘 이상일 때만 낸다 */
    const mb=playable.find(x=>x.c.k==='sp'&&isMassBuff(x.n));
    if(mb&&massCount('ai',mb.n)>=2){
      await reveal('ai',mb.n);
      resolveInstant('ai',mb.n);
      pay('ai',mb.n);P.hand.splice(mb.i,1);render();
      continue;
    }

    /* 2.7) 소환 스펠 */
    /* 판을 채우는 소환(화산 폭발)은 **빈 칸이 넉넉할 때** 쓴다 — 한두 칸 남기고 쓰면 헛돈다 */
    const room=SLOTS-P.board.filter(Boolean).length;
    const sm=playable.find(x=>x.c.k==='sp'&&x.c.mode==='summon'
                              &&!(/빈 슬롯을 전부/.test(x.c.d||'')&&room<4));
    if(sm){
      const slot=firstEmpty('ai',false);
      if(slot>=0){
        await reveal('ai',sm.n);
        P.hand.splice(sm.i,1);               /* ⚠ 패를 세는 카드가 있다 → 먼저 뺀다 */
        resolveSummon('ai',sm.n,slot);
        pay('ai',sm.n);
        S.spawn={side:'ai',idx:slot};render();await sleep(460);S.spawn=null;render();
        continue;
      }
    }

    /* 2.9) **마지막 보루** — 이그니스처럼 '이 몸이 곧 목숨' 인 카드는 무엇보다 먼저 낸다.
       ⚠ 판이 꽉 차 있으면 영영 못 낸다(2단계가 통째로 안 열린다). 그래서 제일 값 안 나가는
          내 몸 하나를 **정식으로 파괴해** 자리를 만든다 — 그 카드 자신은 절대 고르지 않는다(sacOK). */
    const last=playable.find(x=>x.c.k==='cr'&&/소멸하면 즉시 패배/.test(x.c.kw||''));
    if(last){
      let slot=firstEmpty('ai');
      if(slot<0){
        let j=-1,bv=1e9;
        P.board.forEach((u,k)=>{ if(!sacOK(u))return;
          const v=u.a*10+u.insts[0].hp; if(v<bv){bv=v;j=k;} });
        if(j>=0){
          log(`  상대 ${P.board[j].name} — ${last.n} 을(를) 세울 자리를 비운다`,'a');
          P.board[j].insts.forEach(i=>{i.hp=0;}); cleanup('ai');
          slot=firstEmpty('ai');
        }
      }
      if(slot>=0){
        await reveal('ai',last.n);
        pay('ai',last.n); P.hand.splice(last.i,1);
        placeCreature('ai',last.n,slot); onSummon('ai',last.n,slot);
        S.spawn={side:'ai',idx:slot}; render(); await sleep(520); S.spawn=null; render();
        continue;
      }
    }

    /* 3) 크리처 / 인챈트
       ⚠ 뇌관이 충분히 찼고 판이 이미 비어 있으면 **크리처를 내지 않는다** —
          한 마리만 놔도 조건이 깨져 이번 턴 폭발이 통째로 날아간다. 인챈트는 몸이 아니라 괜찮다. */
    const hold=fuseCharge(P)>=4&&!P.board.some(u=>u&&u.kind==='cr'&&u.insts.length);
    const units=playable.filter(x=>(x.c.k==='cr'&&!hold)||x.c.k==='en').sort((a,b)=>b.c.c-a.c.c);
    if(!units.length){
      /* 4) **가장 낮은 순위** — 좋은 대상이 없어도 남은 하수인에게 부여 스펠을 쓴다.
         2.65 는 '이번 턴을 넘길 몸' 만 고르므로, 잿불 방화범처럼 판이 죄다 자폭병인 덱에서는
         도화선이 손에서 그대로 썩는다. 더 낼 게 없으면 아무에게나 붙이는 편이 낫다 —
         어차피 태워 죽일 몸이라 얹은 ATK 만큼은 얼굴에 들어간다. */
      if(gsp){
        let j=-1,bv=-1;
        P.board.forEach((x,k)=>{ if(sacOK(x)){
          const v=x.a*10+x.insts[0].hp; if(v>bv){bv=v;j=k;} } });
        if(j>=0){
          await reveal('ai',gsp.n);
          resolveOnMine('ai',gsp.n,j);
          pay('ai',gsp.n);P.hand.splice(gsp.i,1);render();
          continue;
        }
      }
      break;
    }
    const u=units[0];
    let slot=-1;
    if(u.c.k==='en'){
      slot=firstEmpty('ai',false);if(slot<0)break;
    }else{
      slot=-1;
      if(slot<0)slot=u.c.g?firstEmpty('ai',true):firstEmpty('ai',false);
      if(slot<0)break;
    }
    await reveal('ai',u.n);
    if(u.c.k==='en'){
      P.board[slot]={name:u.n,kind:'en',v:u.c.v,charge:u.c.ch};
      log(`상대 ${u.n} 배치 [슬롯 ${slot+1}] 충전 ${u.c.ch}`,'e');
    }else{
      placeCreature('ai',u.n,slot);
      log(`상대 ${u.n} 소환 [슬롯 ${slot+1}]`,u.c.g?'g':(u.c.f?'f':''));
      onSummon('ai',u.n,slot);
    }
    pay('ai',u.n);P.hand.splice(u.i,1);
    S.spawn={side:'ai',idx:slot};render();
    await sleep(480);
    S.spawn=null;render();
  }
  S.busy=false;render();
  await sleep(420);
  if(!S.over)endTurn();
}

/* 상대가 낸 카드를 손패에서 뽑아 공개하는 연출 */
async function reveal(side,name){
  S.reveal={side,name};
  render();
  await sleep(700);
  S.reveal=null;
}



/* ============ 스펠 해결 ============ */
/* 구현된 분류: 단일·광역·요격·바운스·드로우·회복·강화·소환·파쇄
   미구현(텍스트만): 부여, 그리고 크리처 키워드 대부분 — 카드에 그대로 인쇄된다. */
const SPELL_KO={dmg:'단일',aoe:'광역',kill:'요격',bounce:'바운스',draw:'드로우',
  heal:'회복',buff:'강화',summon:'소환',shatter:'파쇄',grant:'부여',direct:'직접'};
const NEEDS_FOE=['dmg','kill','bounce','shatter'];
const NEEDS_MINE=['buff','grant'];
/* 상대를 겨누는 부여(소이탄 = 연소 5 심기). 지연 제거라 요격과 같은 자리에 쓴다. */
const isFoeGrant=n=>NEEDS_MINE.includes((POOL[n]||{}).mode)
                    &&/상대 크리처/.test((POOL[n]||{}).d||'');
/* 용의 숨결 — 상대 **전체**에 심는다. 고를 게 없으니 즉시 발동이다. */
const isFoeMass=n=>isFoeGrant(n)&&/상대 크리처 전체/.test((POOL[n]||{}).d||'');
function foeMassGrant(p,name){
  const f=foeOf(p), gr=grantOf((POOL[name]||{}).d||''), who=p==='me'?'나':'상대';
  let k=0;
  /* 규칙문의 ' · N 피해' 라이더 — 눈보라는 부여와 함께 얕은 광역을 같이 준다 */
  const rider=+(((POOL[name]||{}).d||'').match(/·\s*(\d+) 피해/)||[])[1]||0;
  const what=[];
  if(gr.burn)what.push(`연소 ${gr.burn}`);
  if(gr.hard)what.push(`경화 ${gr.hard}`);
  if(gr.guard)what.push('수호');
  S[f].board.forEach(u=>{ if(!u||u.kind!=='cr'||!u.insts.length)return;
    if(gr.burn)u.burn=(u.burn||0)+gr.burn;
    if(gr.hard)u.hard=(u.hard||0)+gr.hard;
    if(gr.guard&&!u.veil)u.g=true;
    if(rider)hurtAll(u,rider);
    k++; });
  log(`${who} ${name} — 적 ${k}종에 ${what.join(' · ')||'부여'}`
      +(rider?` · ${rider} 피해`:''),'a');
  return k;
}
/* 대상을 고르지 않고 즉시 발동하는 모드.
   ⚠⚠ **여기 안 적으면 modeOf 가 맨 끝의 `return 'target'` 으로 흘려보낸다** — 대상이 필요
     없는 카드인데 대상 선택 창이 뜬다. 산불·수정구의 힘(ritual)이 실제로 그렇게 됐다.
     새 mode 를 만들면 반드시 이 줄이나 modeOf 의 분기 중 한 곳에 등록할 것. */
const INSTANT=['draw','heal','aoe','ritual'];
/* 희생 드로우 — "내 크리처 1개체를 파괴하고 …" 처럼 **내 개체를 제물로 삼는** 스펠.
   mode 는 draw 지만 자리(대상)가 필요하므로 즉시 발동 취급하면 안 된다.
   ⚠ 판정은 규칙문 하나로 한다 — 카드 이름을 코드에 박으면 새 카드마다 코드를 고쳐야 한다. */
const isSac=n=>/내 크리처 1개체를 파괴하고/.test((POOL[n]||{}).d||'');

/* ── 스펠 부가 조항(라이더) ────────────────────────────────────
   규칙문의 ' · ' 뒤나 '→' 앞에 붙는 조항들. 예전에는 전부 **글자만 찍히고 안 돌았다** —
   특히 어둠 덱의 'HP 지불' 5종이 공짜였다(덱 정체성이 통째로 무료였다).
   ⚠ **카드 이름을 코드에 박지 않는다.** 규칙문 자체가 규칙이다 — 새 카드는 문구만 맞추면 돈다. */
const rule=n=>((POOL[n]||{}).d||'');
/* "내 HP 8 지불" — pay() 가 모든 카드 사용 경로를 지나므로 여기 한 곳에 건다 */
function spellPay(p,name){
  const m=rule(name).match(/내 HP (\d+)\s*지불/); if(!m)return 0;
  const v=+m[1], b=S[p].hp; S[p].hp-=v;
  log(`  ${p==='me'?'나':'상대'} ${name} — HP ${v} 지불 (${b}→${S[p].hp})`,'a');
  fireEnch(p,'paid',{});
  return v;
}
/* "내 HP 8 회복" · "처치한 수만큼 내 HP 4 회복" */
function spellHeal(p,name,killed){
  const d=rule(name);
  const per=d.match(/처치한 수만큼 내 HP (\d+)\s*회복/);
  const flat=d.match(/내 HP (\d+)\s*회복/);
  let v=0;
  if(per)v=(+per[1])*(killed||0);
  else if(flat&&!/지불/.test(d))v=+flat[1];
  if(v<=0)return 0;
  const b=S[p].hp; S[p].hp=Math.min(S[p].maxhp||MAXHP,S[p].hp+v);
  log(`  ${p==='me'?'나':'상대'} ${name} — HP ${b}→${S[p].hp}`,'g');
  return v;
}
/* 자해 조항의 수치만 읽는다 — AI 가 '이걸 쏘면 내 몸도 죽나' 를 미리 재는 데 쓴다 */
const selfDmgOf=n=>+((rule(n).match(/내 크리처(?:도| 전체) (\d+)\s*피해/)||[])[1]||0);
/* "내 크리처도 3 피해" · "내 크리처 전체 2 피해" — 광역·요격의 자해 조항 */
function spellSelfDmg(p,name){
  const m=rule(name).match(/내 크리처(?:도| 전체) (\d+)\s*피해/); if(!m)return 0;
  const v=+m[1]; let k=0, safe=0;
  S[p].board.forEach(u=>{ if(!u||u.kind!=='cr')return;
    if(u.spellproof||u.spellimm){safe++;return;} /* 수호병(내 스펠) · 세이렌(모든 스펠) */
    hurtAll(u,v);k++; });
  if(k||safe)log(`  ${p==='me'?'나':'상대'} ${name} — 내 크리처 ${k}종도 ${v} 피해`
                 +(safe?` (${safe}종은 면역)`:''),'a');
  cleanup(p); return v;
}
/* 광역 피해량 — 조건부로 커지는 것들. 분신은 **제물의 ATK** 이 곧 피해량이다. */
function aoeVal(p,name){
  const c=POOL[name]||{}, d=rule(name);
  if(/1개체를 소멸/.test(d)){                    /* 분신 — 내 크리처 하나를 태워 그 ATK 만큼 */
    let j=-1,bv=-1;
    S[p].board.forEach((u,i)=>{ if(sacOK(u)&&u.a>bv){bv=u.a;j=i;} });
    if(j<0){ log(`  ${name} — 태울 크리처가 없다`,'t'); return 0; }
    const u=S[p].board[j];
    log(`  ${p==='me'?'나':'상대'} ${name} — ${u.name}(ATK ${u.a})를 태운다`,'a');
    u.insts.forEach(x=>{x.hp=0;}); cleanup(p);
    return u.a;
  }
  /* 폭풍우 — 양쪽 판의 **빈 슬롯 합**이 곧 피해량. 판이 비어 있을수록 크게 터진다. */
  if(/양쪽 빈 슬롯 수만큼/.test(d))return emptySlots('me')+emptySlots('ai');
  const per=d.match(/내 (\S+) 크리처 1개체당 \+(\d+)/);   /* 연쇄 폭발 — 연소 크리처 수만큼 */
  if(per){
    const key=per[1], n=S[p].board.filter(u=>u&&u.kind==='cr'&&(u.kw||'').includes(key)).length;
    if(n)log(`  ${name} — ${key} 크리처 ${n}종만큼 +${n*(+per[2])}`,'a');
    return c.v+n*(+per[2]);
  }
  return c.v;
}
/* 광역이 **양쪽 판**을 치는가. 기본은 상대만이다(적 전체). */
const aoeBoth=n=>/모든 크리처/.test(rule(n));
/* 불꽃의 벽·화산 폭발 — **연소가 없는** 몸만 맞는다. 연소 덱이 제 판을 안 태우는 장치다. */
const aoeSkipBurn=n=>/연소가 없는 모든 크리처/.test(rule(n));
/* 메테오 — 크리처뿐 아니라 상대 **얼굴**에도 같은 값이 들어간다. */
const aoeFace=n=>/모든 크리처와 상대에게/.test(rule(n));
/* 화산 폭발 — 총량을 1씩 **나눠** 준다(고블린 미치광이와 같은 연출 규칙). */
function aoeSplit(n){
  const m=rule(n).match(/(\d+) 피해를 1씩 나눠 준다/);
  return m?+m[1]:0;
}
/* 이 개체가 **주문 피해를 받는가.** 두 가지가 있다:
     spellimm(세이렌)   — 양쪽 **모든** 주문에 안 맞는다
     spellproof(수호병) — **주인이 쓴** 주문에만 안 맞는다
   ⚠ 예전에는 spellSelfDmg(자해 조항) 한 곳에서만 봤다. 그래서 **광역 주문이 세이렌을
     그냥 때렸다** — 카드에 적힌 규칙이 안 돌고 있었다. 통로를 하나로 모은다. */
function spellHits(caster,u){
  if(!u||u.kind!=='cr')return false;
  if(u.spellimm)return false;
  if(u.spellproof&&sideOf(u)===caster)return false;
  return true;
}
/* 광역 피해를 실제로 뿌리는 단 하나의 통로.
   ⚠ '연소가 없는' 조건과 '1씩 나눠 준다' 를 여기서 같이 본다 — 사람/AI 두 경로가
     따로 구현하면 반드시 한쪽이 어긋난다(실제로 광역에서 여러 번 겪었다). */
function aoeSpread(p,name,sides,v){
  const skip=aoeSkipBurn(name);
  const pick=()=>{ const out=[];
    sides.forEach(sd=>S[sd].board.forEach(u=>{
      if(!u||u.kind!=='cr'||!u.insts.length)return;
      if(skip&&(u.burn||0)>0)return;          /* 연소가 있는 몸은 건너뛴다 */
      if(!spellHits(p,u))return;              /* 세이렌·수호병 — 주문 피해 면역 */
      out.push(u); })); return out; };
  const total=aoeSplit(name);
  if(total>0){                                /* 1씩 돌아가며 — 총량이 정해진 광역 */
    let left=total;
    while(left>0){ const c=pick(); if(!c.length)break;
      for(const u of c){ if(left<=0)break; hurtAll(u,1); left--; } }
    log(`  ${name} — ${total-left}/${total} 을 1씩 나눠 줬다`,'a');
    return;
  }
  pick().forEach(u=>hurtAll(u,v));
}
/* 해그 — 내 크리처가 소멸할 때마다 문구에 적힌 주문 중 하나를 무작위로 손에 쥐여 준다.
   ⚠ 이름을 코드에 안 박는다. 문구에서 ' · ' 로 갈라 POOL 에 있는 것만 고른다 —
     주문 이름을 갈아도 카드만 고치면 된다. */
function hagBrew(p,cnt){
  const RE=/내 크리처가 소멸할 때마다 (.+?) 중 하나를 무작위로 손으로/;
  S[p].board.forEach(u=>{
    if(!u||u.kind!=='cr'||!u.insts.length)return;
    const m=(u.kw||'').match(RE); if(!m)return;
    const list=m[1].split('·').map(x=>x.trim()).filter(x=>POOL[x]);
    if(!list.length)return;
    for(let k=0;k<cnt;k++){
      if(S[p].hand.length>=8){ log(`  ${p==='me'?'나':'상대'} ${u.name} — 손이 가득 찼다`,'t'); break; }
      const n=list[rnd(list.length)];
      S[p].hand.push(n);
      log(`  ${p==='me'?'나':'상대'} ${u.name} — ${n} 을(를) 손으로`,'t');
    }
  });
}
/* 어둠의 **피해가 아닌 광역**. 처리했으면 건드린 수를, 아니면 null 을 돌려준다.
   ⚠ aoeSilence 와 같은 자리에 끼운다(사람 쪽·상대 쪽 두 군데 모두) — 한쪽만 넣으면
     AI 가 같은 카드를 내고 아무 일도 안 일어난다. */
function darkMass(p,name){
  const d=rule(name), who=p==='me'?'나':'상대';
  const each=fn=>{ let k=0;
    ['me','ai'].forEach(sd=>S[sd].board.forEach(u=>{
      if(u&&u.kind==='cr'&&u.insts.length){fn(sd,u);k++;} })); return k; };
  /* 물구나무 해골 — 공/체를 통째로 맞바꾼다. 최대치도 같이 바뀐다. */
  if(/모든 크리처의 ATK 과 HP 를 서로 바꾼다/.test(d)){
    const k=each((sd,u)=>{ const a=u.a, h=u.insts[0].hp;
      u.a=h; u.insts.forEach(i=>{ i.hp=a; i.mh=Math.max(a,1); }); });
    log(`${who} ${name} — ${k}종의 ATK 과 HP 를 맞바꿨다`,'a');
    ['me','ai'].forEach(cleanup); return k;
  }
  /* 전염병 — HP 를 1 로. 이미 1 이하면 그대로 둔다(회복이 아니다). */
  if(/모든 크리처의 HP 를 (\d+) 로 만든다/.test(d)){
    const to=+d.match(/HP 를 (\d+) 로 만든다/)[1];
    const k=each((sd,u)=>u.insts.forEach(i=>{ if(i.hp>to)i.hp=to; i.mh=Math.max(i.mh,to); }));
    log(`${who} ${name} — ${k}종의 HP 를 ${to} 로`,'a');
    ['me','ai'].forEach(cleanup); return k;
  }
  /* 블랙홀 — 판을 통째로 지우고 내 지형까지 부순다. 값은 그 지형 손해로 산 것이다. */
  const bh=d.match(/모든 크리처를 파괴하고 내 지형 (\d+)장도 파괴한다/);
  if(bh){
    const k=each((sd,u)=>u.insts.forEach(i=>{i.hp=0;}));
    let ld=0;
    for(let i=0;i<+bh[1]&&S[p].lands.length;i++){ const g=S[p].lands.pop(); ld++;
      log(`  ${who} ${name} — ${g.name} 소멸`,'a'); }
    log(`${who} ${name} — 크리처 ${k}종 파괴 · 내 지형 ${ld}장 파괴`,'a');
    ['me','ai'].forEach(cleanup); return k;
  }
  /* 자폭 공격 — **오른쪽부터** 1:1 로 맞바꾼다. 내가 먼저 죽고, 죽은 수만큼 상대가 죽는다. */
  if(/상대 크리처 수만큼 내 크리처를 오른쪽부터 파괴하고, 파괴한 수만큼 상대 크리처도 오른쪽부터 파괴/.test(d)){
    const foe=foeOf(p);
    const live=sd=>S[sd].board.filter(u=>u&&u.kind==='cr'&&u.insts.length);
    const n=Math.min(live(p).length,live(foe).length);
    const kill=(sd,c)=>{ const L=live(sd); let k=0;
      for(let i=L.length-1;i>=0&&k<c;i--,k++)L[i].insts.forEach(x=>{x.hp=0;}); return k; };
    const a=kill(p,n); const b=kill(foe,a);
    log(`${who} ${name} — 내 ${a}종을 터뜨려 상대 ${b}종을 부쉈다`,'a');
    ['me','ai'].forEach(cleanup); return a+b;
  }
  /* 몸통던지기 — 내 판을 통째로 던진다. HP 합의 2배가 상대 크리처 전체에 들어간다. */
  if(/내 크리처를 모두 파괴하고 그 HP 합의 (\d+)배만큼 상대 크리처 전체에 피해/.test(d)){
    const mult=+d.match(/합의 (\d+)배/)[1];
    let sum=0;
    S[p].board.forEach(u=>{ if(u&&u.kind==='cr')u.insts.forEach(i=>{ sum+=Math.max(0,i.hp); i.hp=0; }); });
    const v=sum*mult, foe=foeOf(p);
    let k=0;
    S[foe].board.forEach(u=>{ if(u&&u.kind==='cr'&&u.insts.length&&spellHits(p,u)){hurtAll(u,v);k++;} });
    log(`${who} ${name} — 내 HP 합 ${sum} × ${mult} = ${v} 를 상대 ${k}종에`,'a');
    ['me','ai'].forEach(cleanup); return k+1;
  }
  return null;
}
/* 인어의 노래·비명 — 피해가 아니라 **ATK 을 0 으로** 만든다. 몸은 그대로 남는다. */
function aoeSilence(p,name){
  const m=rule(name).match(/ATK (\d+) 이하인 모든 크리처의 ATK 을 0/);
  if(!m)return null;
  const cap=+m[1]; let k=0;
  ['me','ai'].forEach(side=>S[side].board.forEach(u=>{
    if(!u||u.kind!=='cr'||!u.insts.length)return;
    if(u.a>0&&u.a<=cap){ u.a=0; k++; } }));
  log(`${p==='me'?'나':'상대'} ${name} — ATK ${cap} 이하 ${k}종을 침묵시켰다`,'a');
  return k;
}
/* 단일 피해량 — "내 크리처가 3개체 이상이면 5" 같은 조건부 상향 */
function dmgVal(p,name,tgt){
  const c=POOL[name]||{}, d=rule(name);
  const m=d.match(/내 크리처가 (\d+)개체 이상이면 (\d+)/);
  if(m&&S[p].board.filter(u=>u&&u.kind==='cr').length>=+m[1])return +m[2];
  /* 환룡 강림 — 상대의 **빈 슬롯** 수가 곧 피해량. 판을 비워 둔 쪽을 벌한다. */
  if(/상대의 빈 슬롯 수만큼/.test(d))return emptySlots(foeOf(p));
  /* 환영검 소환 — 대상 **자신의 ATK** 이 곧 피해량. 큰 몸일수록 크게 맞는다. */
  if(/그 ATK 만큼/.test(d))return tgt?tgt.a:0;
  /* 그림자야수 — 판 위에 선 몸이 많을수록 크게 문다(양쪽을 다 센다) */
  if(/판 위 크리처 수만큼/.test(d))
    return ['me','ai'].reduce((n,sd)=>n+S[sd].board.filter(u=>u&&u.kind==='cr'&&u.insts.length).length,0);
  return c.v;
}
/* 내 지형 **맨 오른쪽** 한 장을 부순다(산불 · 화산 폭발).
   ⚠ 특수 지형도 똑같이 부순다 — '맨 오른쪽' 이 규칙이지 '자원을 내는 것 중' 이 아니다. */
function burnRightLand(p,name){
  if(!/맨 오른쪽 1장을 부수고/.test(rule(name)))return null;
  const L=S[p].lands; if(!L.length){ log(`  ${p==='me'?'나':'상대'} ${name} — 부술 지형이 없다`,'t'); return null; }
  const gone=L.pop();
  log(`  ${p==='me'?'나':'상대'} ${name} — ${gone.name} 소멸`,'a');
  return gone;
}
/* 그 편의 빈 크리처 슬롯 수. 지형은 세지 않는다(판 = 크리처 자리). */
function emptySlots(p){ return Math.max(0,SLOTS-S[p].board.filter(u=>u&&u.kind==='cr').length); }
const ignoresHard=n=>/경화를? 무시/.test(rule(n));
/* 드로우 장수 — "내 크리처가 없으면 3장, 있으면 1장" 같은 조건부 */
function drawVal(p,name){
  const c=POOL[name]||{}, d=rule(name);
  const m=d.match(/내 크리처가 없으면 카드 (\d+)장, 있으면 (\d+)장/);
  if(m)return S[p].board.some(u=>u&&u.kind==='cr')?+m[2]:+m[1];
  const n=d.match(/카드 (\d+)장/);
  return n?+n[1]:drawCount(c.v);
}

function parseBuff(d){                       /* "+2/+3" → {a:2,h:3} */
  const m=(d||'').match(/\+(\d+)\/\+(\d+)/);
  return m?{a:+m[1],h:+m[2]}:{a:0,h:0};
}
/* "2/4 망령 2개체" → {a,h,n,nm}. nm 은 토큰 이름 — 없으면 카드 이름 앞머리를 쓴다.
   ⚠ 개수를 **패에서 세는** 카드가 있다(정령의 불꽃) → n:null 로 돌려주고 부르는 쪽이 센다. */
function parseSummon(d,card){
  const t=d||'';
  const st=t.match(/(\d+)\/(\d+)/), cnt=t.match(/(\d+)\s*개체/);
  const nm=t.match(/\d+\/\d+\s+([^\d·]+?)\s*(?:\d+\s*개체|[을를] 소환)/);
  /* 스탯이 안 적힌 소환문("고블린 폭탄병 2개체를 소환한다")은 **카드 그대로** 부른다 —
     토큰이 아니라 진짜 개체라 연소·폭발 같은 키워드가 전부 따라온다. */
  /* ⚠ 이름이 문장 **중간**에 있을 수 있다("내 HP 8 지불 → 부름의 망령 2개체를 소환",
     "…버린 수만큼 용암 정령을 소환한다"). 앞머리까지 통째로 잡히므로 **뒤에서부터 낱말을 붙여**
     POOL 에 있는 이름을 찾는다(최대 세 낱말). 이러면 '용암 정령' 은 잡히고 앞의 서술은 버려진다. */
  const rl=(()=>{
    const m=t.match(/([가-힣A-Za-z][가-힣A-Za-z ]*?)\s*(?:\d+\s*개체|[을를] 소환)/);
    if(!m)return '';
    const w=m[1].trim().split(/\s+/);
    for(let i=Math.max(0,w.length-3);i<w.length;i++){
      const nm=w.slice(i).join(' ');
      if(POOL[nm])return nm;
    }
    return '';
  })();
  /* "빈 슬롯을 전부 불씨정령으로 채운다" — 개수를 판이 정한다(n:-1) */
  const fl=t.match(/빈 슬롯을 전부 (.+?)(?:으로|로) 채운다/);
  const fill=fl&&POOL[fl[1].trim()]?fl[1].trim():null;
  return {a:st?+st[1]:2,h:st?+st[2]:2,
          n:fl?-1:(/버린 수만큼/.test(t)?null:(cnt?+cnt[1]:1)),
          real:fill||(POOL[rl]?rl:null),
          nm:(nm?nm[1].trim():(card||'').replace(/\s.*$/,''))+' 토큰'};
}
function drawCount(v){ return Math.max(1,Math.round(v/1.5)); }

/* 토큰 크리처 — POOL에 없는 임시 개체 */
function mkToken(nm,a,h){ return {name:nm,kind:'cr',insts:[mkInst(h)],a,g:0,f:0,p:0,kw:'토큰',token:true,th:h}; }

/* "내 (…) 크리처 전체 HP +N" — 대상을 고르지 않는 강화. 규칙문이 곧 판정이다.
   최대치를 무시하므로 현재 HP 와 최대 HP 를 **함께** 올린다(= 영구 +0/+N). */
const MASSBUFF=/내 (?:(\S+) )?크리처 전체 HP \+(\d+)/;
const isMassBuff=n=>MASSBUFF.test((POOL[n]||{}).d||'');
function massCount(p,name){                  /* 지금 이 카드가 실제로 붙을 개체 수 */
  const m=((POOL[name]||{}).d||'').match(MASSBUFF); if(!m)return 0;
  const key=m[1]||'';
  return S[p].board.filter(u=>u&&u.kind==='cr'&&u.insts.length
                              &&(!key||(u.kw||'').includes(key))).length;
}
function massBuff(p,name){
  const m=rule(name).match(MASSBUFF); if(!m)return 0;
  const key=m[1]||'', v=+m[2], who=p==='me'?'나':'상대';
  let k=0;
  S[p].board.forEach(u=>{
    if(!u||u.kind!=='cr'||!u.insts.length)return;
    if(key&&!(u.kw||'').includes(key))return;
    u.insts.forEach(i=>{i.hp+=v;i.mh+=v;}); k++;
  });
  log(`${who} ${name} — ${key?key+' ':''}크리처 ${k}종 HP +${v}`,'g');
  return k;
}
function resolveInstant(p,name){
  const c=POOL[name], who=p==='me'?'나':'상대';
  if(isFoeMass(name)){ foeMassGrant(p,name); cleanup(foeOf(p)); return; }
  if(isMassBuff(name)){ massBuff(p,name); return; }
  if(c.mode==='draw'){
    /* 불길한 예감 — 덱 맨 위 N 장을 펼쳐 한 장만 손으로. 나머지는 순서 그대로 남는다. */
    const sc=rule(name).match(/내 덱 맨 위 (\d+)장을 보고 그중 1장을 손으로/);
    if(sc){
      if(!S[p].deck.length){ log(`${who} ${name} — 덱이 비었다`,'t'); return; }
      const n=Math.min(+sc[1],S[p].deck.length), top=topOfDeck(p,n);
      const fin=i=>{ const got=takeFromTop(p,n,i);
        if(got&&S[p].hand.length<8)S[p].hand.push(got);
        log(`${who} ${name} — ${n}장을 보고 ${got} 을(를) 손으로`,'t'); render(); };
      if(p==='ai'){ fin(bestIdx(top)); return; }
      cardPick({list:top,need:1,title:name,btn:'이 카드를 손으로',
        sub:`덱 맨 위 <b>${n}장</b>입니다. 그중 <b>한 장</b>을 손으로 가져오세요.`,
        act:sel=>fin(sel[0])});
      return;
    }
    /* 사신의 시간 — 먼저 뽑고, 그 다음 **손에서** 골라 버린다(순증 2장). */
    const gd=rule(name).match(/카드 (\d+)장을 뽑고 손에서 (\d+)장을 골라 버린다/);
    if(gd){
      for(let i=0;i<+gd[1];i++)draw(p);
      const k=Math.min(+gd[2],S[p].hand.length);
      log(`${who} ${name} — 카드 ${gd[1]}장`,'t');
      if(!k)return;
      const hand=S[p].hand.slice();
      const fin=sel=>{ const gone=sel.map(i=>hand[i]);
        sel.slice().sort((a,b)=>b-a).forEach(i=>{ const j=S[p].hand.indexOf(hand[i]);
          if(j>=0){ S[p].hand.splice(j,1); (S[p].burned=S[p].burned||[]).push(hand[i]); } });
        log(`  ${who} ${name} — ${gone.join(', ')} 을(를) 버렸다`,'t'); render(); };
      if(p==='ai'){ const idx=hand.map((n,i)=>i)
          .sort((a,b)=>((POOL[hand[a]]||{}).c||0)-((POOL[hand[b]]||{}).c||0)).slice(0,k);
        fin(idx); return; }
      cardPick({list:hand,need:k,title:name,btn:'이 카드를 버린다',
        sub:`카드 <b>${gd[1]}장</b>을 뽑았습니다. 이제 손에서 <b>${k}장</b>을 골라 버리세요.`,
        act:fin});
      return;
    }
    /* 안개성 소환 — 이번 턴에 **안 쓴** 지형을 전부 뒤집고 그 수만큼 뽑는다.
       ⚠ 특수 지형(자원을 안 내는 것)은 세지 않는다 — 뒤집을 자원이 없다. */
    if(/안 쓴 내 지형을 모두 뒤집고/.test(rule(name))){
      const free=S[p].lands.filter(l=>!l.used&&!l.sp&&!l.entering);
      free.forEach(l=>{ l.used=true; l.justUsed=true; });
      for(let i=0;i<free.length;i++)draw(p);
      log(`${who} ${name} — 지형 ${free.length}장을 뒤집고 카드 ${free.length}장`,'t');
      return;
    }
    const k=drawVal(p,name);                  /* "내 크리처가 없으면 3장, 있으면 1장" 같은 조건부 */
    for(let i=0;i<k;i++)draw(p);
    log(`${who} ${name} — 카드 ${k}장`,'t');
  }else if(c.mode==='heal'){
    const b=S[p].hp; S[p].hp=Math.min(S[p].maxhp||MAXHP,S[p].hp+c.v);
    log(`${who} ${name} — HP ${b}→${S[p].hp}`,'g');
  }else if(c.mode==='ritual'){
