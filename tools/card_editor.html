<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>TEN — 카드 디자이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFF2; --paper-2:#E3E6EB; --ink:#141821; --ink-soft:#4A5364;
  --ink-faint:#8A94A6; --rule:#C6CCD6;
  --indigo:#2D3BAF; --teal:#0F8A80; --amber:#B87400; --crimson:#B03A3F; --violet:#6A4FBF;
  --gold:#c9a24b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Batang','Noto Serif KR',serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:40px}
.wrap{max-width:1180px;margin:0 auto;padding:14px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 14px;margin:-14px -14px 14px}
h1{font-family:'Cinzel',serif;font-weight:900;font-size:21px;letter-spacing:.02em}
h1 span{color:var(--teal)}
.desc{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.stats{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.stat{border:1px solid var(--rule);border-radius:4px;padding:6px 10px;background:var(--paper-2);flex:1;min-width:88px}
.stat .n{font-family:'JetBrains Mono';font-weight:700;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}
.stat.bad .n{color:var(--crimson)} .stat.good .n{color:var(--teal)}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
button{font-family:'JetBrains Mono';font-size:12px;font-weight:500;letter-spacing:.03em;background:var(--ink);color:var(--paper);
  border:1px solid var(--ink);padding:9px 13px;border-radius:5px;cursor:pointer;min-height:40px;transition:.13s}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button.sm{padding:6px 10px;font-size:11px;min-height:32px}
button:active{opacity:.7}
input[type=file]{display:none}
.hint{font-family:'JetBrains Mono';font-size:10px;color:var(--ink-faint);margin-top:7px;line-height:1.6}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border-radius:20px;background:transparent;color:var(--ink-soft);border:1px solid var(--rule)}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.add{border:2px dashed var(--rule);border-radius:14px;display:flex;align-items:center;justify-content:center;
  min-height:180px;color:var(--ink-faint);font-family:'JetBrains Mono';font-size:13px;cursor:pointer;background:transparent}
.add:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- 카드 (갤러리와 동일 렌더) ---------- */
.card{--fc:var(--ink);position:relative;background:var(--paper);border:2.5px solid var(--fc);border-radius:13px;
  overflow:hidden;display:flex;flex-direction:column;aspect-ratio:5/7;box-shadow:0 3px 9px rgba(20,24,33,.13);cursor:pointer;transition:.14s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(20,24,33,.2)}
.card.guard{--fc:var(--teal)} .card.fly{--fc:var(--amber)} .card.flyguard{--fc:var(--amber)}
.card.normal{--fc:var(--ink)} .card.sp{--fc:var(--crimson)} .card.en{--fc:var(--violet)}
.chead{display:flex;align-items:center;gap:6px;padding:7px 8px 5px}
.cost{flex:none;width:26px;height:26px;border-radius:50%;background:var(--indigo);color:#fff;
  font-family:'JetBrains Mono';font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.nm{font-family:'Cinzel',serif;font-weight:900;font-size:13.5px;letter-spacing:-.01em;line-height:1.1;flex:1}
.art{position:relative;margin:0 8px;border-radius:7px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 14%,var(--paper)),color-mix(in srgb,var(--fc) 4%,var(--paper)));
  border:1px solid color-mix(in srgb,var(--fc) 30%,transparent)}
.art svg{width:60%;height:60%;color:var(--fc)}
.flyguard .art::after{content:'';position:absolute;inset:0;border-radius:7px;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--teal) 45%,transparent)}
.tagrow{display:flex;gap:4px;padding:7px 8px 3px}
.chip{font-family:'JetBrains Mono';font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--fc);color:var(--fc);padding:2px 5px;border-radius:3px}
.eff{font-size:10px;line-height:1.45;color:var(--ink-soft);padding:1px 9px 5px;flex:1}
.eff b{color:var(--ink);font-weight:700}
.meter{display:flex;gap:2px;padding:0 9px 7px}
.meter i{width:8px;height:12px;border:1.5px solid var(--violet);border-radius:2px;background:color-mix(in srgb,var(--violet) 22%,transparent)}
.stnums{display:flex;justify-content:space-between;align-items:center;padding:6px 9px 9px;margin-top:auto}
.st{display:flex;align-items:center;gap:3px;font-family:'JetBrains Mono';font-weight:700;font-size:15px}
.st .ic{width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}
.st.atk .ic{background:var(--crimson)} .st.hp .ic{background:var(--teal)}
.st.atk{color:var(--crimson)} .st.hp{color:var(--teal)}
.spfoot{padding:6px 9px 10px;margin-top:auto;display:flex;justify-content:flex-end}
.big{font-family:'JetBrains Mono';font-weight:700;font-size:18px;color:var(--fc)}
.big small{font-size:8.5px;color:var(--ink-faint);font-weight:500}
.vbadge{position:absolute;top:7px;right:7px;font-family:'JetBrains Mono';font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:3px}
.vbadge.over{background:var(--crimson);color:#fff} .vbadge.under{background:var(--amber);color:#fff} .vbadge.ok{display:none}

/* ---------- 편집 모달 ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,24,33,.55);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.overlay.on{display:flex}
.sheet{background:var(--paper);border-radius:14px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);margin:auto;overflow:hidden}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.sheet .shead h3{font-family:'Cinzel',serif;font-size:15px}
.sbody{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:16px}
@media(max-width:560px){.sbody{grid-template-columns:1fr}}
.pvwrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.pv{width:150px}
.vline{font-family:'JetBrains Mono';font-size:11px;font-weight:700;text-align:center}
.vline.over{color:var(--crimson)} .vline.under{color:var(--amber)} .vline.ok{color:var(--teal)}
.fields{display:flex;flex-direction:column;gap:11px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.field input,.field select,.field textarea{font-family:'Gowun Batang',serif;font-size:13px;border:1px solid var(--rule);border-radius:5px;padding:8px;background:#fff;color:var(--ink);width:100%;min-height:38px}
.field textarea{min-height:52px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}
.row{display:flex;gap:9px}.row .field{flex:1}
/* 아트 선택기 */
.artpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:150px;overflow-y:auto;padding:4px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-2)}
.artopt{aspect-ratio:1;border:1.5px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;gap:1px;padding:3px}
.artopt svg{width:60%;height:60%;color:var(--ink-soft)}
.artopt small{font-size:7px;color:var(--ink-faint);font-family:'JetBrains Mono'}
.artopt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,#fff);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 40%,transparent)}
.artopt.on svg{color:var(--gold)}
.sfoot{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--rule)}
.del{background:transparent;border:1px solid var(--crimson);color:var(--crimson)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--paper);
  font-family:'JetBrains Mono';font-size:12px;padding:11px 18px;border-radius:6px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>TE<span>N</span> — 카드 디자이너</h1>
    <div class="desc">Visual card editor · art · frame · stats · live budget</div>
    <div class="stats">
      <div class="stat" id="st-deck"><div class="n">–</div><div class="l">덱 / 목표 30</div></div>
      <div class="stat" id="st-over"><div class="n">–</div><div class="l">예산 초과</div></div>
      <div class="stat" id="st-guard"><div class="n">–</div><div class="l">수호 35~40</div></div>
      <div class="stat" id="st-fly"><div class="n">–</div><div class="l">비행 8~10</div></div>
    </div>
    <div class="acts">
      <button id="export">⤓ JSON 내보내기</button>
      <button class="ghost" id="copy">⧉ 복사</button>
      <button class="ghost" id="loadBtn">↥ 불러오기</button>
      <input type="file" id="file" accept=".json">
    </div>
    <div class="hint">카드를 탭하면 이름·아트·프레임·능력치·설명을 편집합니다. 편집 후 <b>내보내기</b>(또는 복사)해서 Claude에게 보내면 검산·커밋·push까지 이어집니다.</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const DATA = {"rules": {"constants": {"start_hp": 60, "mana_cap": 6, "board_slots": 10, "stack_max": 5, "deck_size": 30}, "budget": {"a": 3, "b": 1, "k": 0.5, "enchant_a": 4, "enchant_b": 2}, "tags": {"normal": {"atk_w": 2, "hp_w": 1, "budget_adj": 0}, "guard": {"atk_w": 2, "hp_w": 2, "budget_adj": 2}, "fly": {"atk_w": 4, "hp_w": 1, "budget_adj": 0}, "flyguard": {"atk_w": 4, "hp_w": 2, "budget_adj": 2}}, "cost_budget": [{"cost": 1, "creature_p": 4, "enchant_t": 6}, {"cost": 2, "creature_p": 8, "enchant_t": 11}, {"cost": 3, "creature_p": 12, "enchant_t": 16}, {"cost": 4, "creature_p": 18, "enchant_t": 23}, {"cost": 5, "creature_p": 24, "enchant_t": 30}, {"cost": 6, "creature_p": 32, "enchant_t": 39}], "spell_tier": [{"cost": 1, "single": 2, "aoe": null, "direct": null}, {"cost": 2, "single": 4, "aoe": 2, "direct": null}, {"cost": 3, "single": 6, "aoe": 3, "direct": 5}, {"cost": 4, "single": 8, "aoe": 5, "direct": null}, {"cost": 5, "single": 12, "aoe": 7, "direct": null}, {"cost": 6, "single": 99, "aoe": 10, "direct": null}]}, "creatures": [{"id": "CR01", "name": "파수병", "cost": 1, "tag": "guard", "atk": 0, "hp": 3, "copies": 3, "art": "shield", "desc": "", "budget_p": "6", "verdict": "적정", "note": "1코 스택 주력. 흡수 1회 × 5중첩 가능"}, {"id": "CR02", "name": "잔날개", "cost": 1, "tag": "normal", "atk": 1, "hp": 2, "copies": 1, "art": "wings", "desc": "", "budget_p": "4", "verdict": "적정", "note": "초반 페이스 확보용"}, {"id": "CR03", "name": "방벽병", "cost": 2, "tag": "guard", "atk": 1, "hp": 4, "copies": 3, "art": "wall", "desc": "", "budget_p": "10", "verdict": "적정", "note": "중첩 시 딜도 누적되는 벽"}, {"id": "CR04", "name": "검사", "cost": 2, "tag": "normal", "atk": 2, "hp": 4, "copies": 2, "art": "sword", "desc": "", "budget_p": "8", "verdict": "적정", "note": "커브 기본값"}, {"id": "CR05", "name": "전투매", "cost": 2, "tag": "fly", "atk": 1, "hp": 4, "copies": 2, "art": "hawk", "desc": "", "budget_p": "8", "verdict": "적정", "note": "저코스트 우회 딜"}, {"id": "CR06", "name": "석벽", "cost": 3, "tag": "guard", "atk": 1, "hp": 6, "copies": 2, "art": "wall", "desc": "", "budget_p": "14", "verdict": "적정", "note": "단일 제거 3코로는 못 잡음"}, {"id": "CR07", "name": "창병", "cost": 3, "tag": "normal", "atk": 4, "hp": 4, "copies": 2, "art": "spear", "desc": "", "budget_p": "12", "verdict": "적정", "note": "3코 최대 딜"}, {"id": "CR08", "name": "그리핀", "cost": 3, "tag": "fly", "atk": 2, "hp": 4, "copies": 1, "art": "griffin", "desc": "", "budget_p": "12", "verdict": "적정", "note": "수호 덱 상대 핵심"}, {"id": "CR09", "name": "기사", "cost": 4, "tag": "normal", "atk": 6, "hp": 6, "copies": 1, "art": "helmet", "desc": "", "budget_p": "18", "verdict": "적정", "note": "중반 전환점"}, {"id": "CR10", "name": "와이번", "cost": 4, "tag": "fly", "atk": 4, "hp": 2, "copies": 1, "art": "wyvern", "desc": "", "budget_p": "18", "verdict": "적정", "note": "유리대포. 저코스트 제거에 취약"}, {"id": "CR11", "name": "장군", "cost": 5, "tag": "normal", "atk": 8, "hp": 8, "copies": 1, "art": "banner", "desc": "", "budget_p": "24", "verdict": "적정", "note": "5코 피니셔 후보"}, {"id": "CR12", "name": "파괴자", "cost": 6, "tag": "normal", "atk": 11, "hp": 10, "copies": 1, "art": "axe", "desc": "", "budget_p": "32", "verdict": "적정", "note": "결정력 카드. 대응은 5코 소멸뿐"}], "spells": [{"id": "SP01", "name": "화살", "cost": 1, "mode": "dmg", "value": 2, "copies": 2, "art": "arrow", "desc": "", "note": "2코 크리처 1개체 처리"}, {"id": "SP02", "name": "창격", "cost": 2, "mode": "dmg", "value": 4, "copies": 2, "art": "thrust", "desc": "", "note": "3코 수호(HP 4~6) 대응"}, {"id": "SP03", "name": "처형", "cost": 3, "mode": "dmg", "value": 6, "copies": 2, "art": "exec", "desc": "", "note": "4코 크리처까지 사정권"}, {"id": "SP04", "name": "화염비", "cost": 4, "mode": "aoe", "value": 5, "copies": 1, "art": "firerain", "desc": "", "note": "스택 덱의 유일한 해답"}, {"id": "SP05", "name": "소멸", "cost": 5, "mode": "dmg", "value": 12, "copies": 1, "art": "burst", "desc": "", "note": "6코 크리처 대응 카드"}], "enchants": [{"id": "EN01", "name": "성화", "cost": 3, "drain_type": "persistent", "effect_value": 3, "charge": 5, "target": "상대", "copies": 2, "art": "flame", "desc": "", "note": "내 턴 종료마다 상대에게 3 피해"}, {"id": "EN02", "name": "군기", "cost": 4, "drain_type": "persistent", "effect_value": 2, "charge": 5, "target": "전체", "copies": 0, "art": "flag", "desc": "", "note": "내 크리처 전체 ATK +2 (미구현 · 잠정)"}, {"id": "EN03", "name": "각성", "cost": 2, "drain_type": "active", "effect_value": 5, "charge": 2, "target": "단일", "copies": 0, "art": "awaken", "desc": "", "note": "내 크리처 1개체 HP +5 (미구현 · 잠정)"}]};
const R = DATA.rules;
const S = (inner) => `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const M = {
  shield: S('<path d="M50 14 L80 25 V50 C80 71 66 82 50 88 C34 82 20 71 20 50 V25 Z"/>'),
  wings: S('<path d="M50 30 L50 78"/><path d="M50 40 C34 30 20 34 14 46 C30 46 42 44 50 52"/><path d="M50 40 C66 30 80 34 86 46 C70 46 58 44 50 52"/>'),
  wall: S('<rect x="20" y="30" width="60" height="44" rx="2"/><path d="M20 52 H80 M50 30 V52 M35 52 V74 M65 52 V74"/>'),
  sword: S('<path d="M50 16 L50 66"/><path d="M38 60 L62 60"/><path d="M44 84 L56 84 M50 66 V84"/>'),
  hawk: S('<path d="M50 40 C30 20 14 30 18 40 C34 40 44 46 50 56 C56 46 66 40 82 40 C86 30 70 20 50 40Z"/><path d="M50 56 L50 74"/>'),

  griffin: S('<path d="M30 44 C20 30 30 22 40 30"/><circle cx="40" cy="42" r="4" fill="currentColor" stroke="none"/><path d="M44 40 L58 36 L50 46"/><path d="M40 48 C40 68 60 74 74 60 C60 66 52 60 52 50"/><path d="M52 50 C66 40 80 46 84 56"/>'),
  helmet: S('<path d="M32 44 C32 26 68 26 68 44 V60 C68 76 32 76 32 60 Z"/><path d="M50 30 V22 M44 52 H60 M40 44 L44 44"/>'),
  wyvern: S('<path d="M24 40 C40 34 44 44 50 44 C56 44 60 34 76 40 C64 46 60 54 50 54 C40 54 36 46 24 40Z"/><path d="M50 54 C50 70 40 78 30 80 M50 54 C50 68 58 74 66 76"/>'),
  banner: S('<path d="M30 20 V84"/><path d="M30 24 H74 L64 38 L74 52 H30"/>'),

  arrow: S('<path d="M18 82 L82 18"/><path d="M82 18 L62 22 M82 18 L78 38"/><path d="M18 82 L28 72 M18 82 L32 78 M18 82 L22 68"/>'),
  thrust: S('<path d="M16 84 L84 16"/><path d="M84 16 L66 20 L80 34"/><path d="M30 62 L38 70"/>'),
  exec: S('<path d="M46 20 L46 84"/><path d="M46 26 C24 26 22 50 42 52 C30 42 40 34 46 40 C52 34 62 42 50 52 C70 50 68 26 46 26Z"/>'),
  firerain: S('<path d="M28 26 L22 44 M50 22 L44 42 M72 26 L66 44"/><path d="M50 84 C40 84 34 76 40 66 C42 72 46 70 46 64 C54 68 60 76 50 84Z"/>'),
  burst: S('<circle cx="50" cy="50" r="14"/><path d="M50 12 V26 M50 74 V88 M12 50 H26 M74 50 H88 M24 24 L34 34 M66 66 L76 76 M76 24 L66 34 M34 66 L24 76"/>'),
  flame: S('<path d="M50 78 C36 78 28 66 38 52 C41 60 47 58 46 50 C58 54 66 66 62 74 C60 78 55 78 50 78Z"/><path d="M40 86 H60"/>'),
  flag: S('<path d="M34 16 V86"/><path d="M34 20 H78 L68 34 L78 48 H34"/>'),
  awaken: S('<path d="M50 84 V40"/><path d="M32 56 L50 38 L68 56"/><path d="M50 30 L50 16 M38 24 L34 18 M62 24 L66 18"/>'),
  star: S('<path d="M50 16 L59 40 L84 40 L64 56 L72 82 L50 66 L28 82 L36 56 L16 40 L41 40 Z"/>'),
};
const ARTLABELS = {shield:'방패',wings:'날개',wall:'성벽',sword:'검',hawk:'매',spear:'창',griffin:'그리핀',helmet:'투구',wyvern:'비룡',banner:'군기',axe:'도끼',arrow:'화살',thrust:'창격',exec:'처형',firerain:'화염비',burst:'폭발',flame:'불꽃',flag:'깃발',awaken:'각성',star:'별'};
const TAGKO={normal:'일반',guard:'수호',fly:'비행',flyguard:'비행수호'};
const MODEKO={dmg:'단일',aoe:'광역',direct:'직접'};
const DRAINKO={persistent:'지속형',triggered:'발동형',active:'사용형'};
const TARGETS=['상대','전체','단일','자신'];

/* ===== 예산 계산 ===== */
function creatureBudget(cost,tag){const b=R.budget,t=R.tags[tag]||R.tags.normal;return Math.floor(b.a*cost+b.b+Math.pow(cost-1,2)*b.k+0.5)+t.budget_adj;}
function creatureSpent(tag,atk,hp){const t=R.tags[tag]||R.tags.normal;return t.atk_w*atk+t.hp_w*hp;}
function spellRef(cost,mode){const t=R.spell_tier.find(x=>x.cost===cost);if(!t)return null;return mode==='dmg'?t.single:mode==='aoe'?t.aoe:mode==='direct'?t.direct:null;}
function enchantBudget(cost){const c=R.cost_budget.find(x=>x.cost===cost);return c?c.enchant_t:null;}
function verdict(c,k){
  if(k==='creatures'){const dev=creatureSpent(c.tag,+c.atk,+c.hp)-creatureBudget(+c.cost,c.tag);
    return {v:dev>0?'over':dev<0?'under':'ok',calc:`${creatureSpent(c.tag,+c.atk,+c.hp)}/${creatureBudget(+c.cost,c.tag)}`};}
  if(k==='spells'){const ref=spellRef(+c.cost,c.mode);if(ref==null)return {v:'under',calc:`${c.value}/–`};
    const dev=+c.value-ref;return {v:dev>0?'over':dev<0?'under':'ok',calc:`${c.value}/${ref}`};}
  const bud=enchantBudget(+c.cost),tot=(+c.effect_value)*(+c.charge);
  if(+c.copies===0)return {v:'ok',calc:`${tot}/${bud==null?'–':bud} · 미채용`};
  const dev=bud==null?0:tot-bud;return {v:dev>0?'over':dev<0?'under':'ok',calc:`${tot}/${bud==null?'–':bud}`};
}
const VKO={over:'초과',under:'미달',ok:'적정'};

/* ===== 카드 렌더 ===== */
function art(c){const key=(c.art&&M[c.art])?c.art:(c.k==='sp'?'burst':c.k==='en'?'flame':c.tag==='guard'||c.tag==='flyguard'?'shield':c.tag==='fly'?'hawk':'sword');return M[key];}
function defEffect(c){
  if(c.k==='cr'){const m={normal:'턴 종료 시 <b>ATK</b>만큼 상대를 공격.',guard:'<b>수호</b> — 대신 왼쪽부터 피해를 받는다.',fly:'<b>비행</b> — 비행 없는 수호를 무시.',flyguard:'<b>비행·수호</b> — 공중·지상 모두 막는다.'};return m[c.tag]||m.normal;}
  return `<b>${c.k==='sp'?MODEKO[c.mode]||'':DRAINKO[c.drain_type]||''}</b> · ${c.note||''}`;
}
function cardHTML(c,k){
  c.k = k==='creatures'?'cr':k==='spells'?'sp':'en';
  const cls=c.k==='cr'?c.tag:c.k;
  const eff=(c.desc&&c.desc.trim())?c.desc:defEffect(c);
  const chip=c.k==='cr'?TAGKO[c.tag]:(c.k==='sp'?'스펠':'인챈트');
  let foot;
  if(c.k==='cr') foot=`<div class="stnums"><div class="st atk"><span class="ic"></span>${c.atk}</div><div class="st hp"><span class="ic"></span>${c.hp}</div></div>`;
  else if(c.k==='en') foot=`<div class="meter">${'<i></i>'.repeat(Math.min(+c.charge||0,10))}</div><div class="spfoot"><span class="big">${c.effect_value}<small> ×${c.charge}</small></span></div>`;
  else foot=`<div class="spfoot"><span class="big">${c.value}<small> 위력</small></span></div>`;
  const vd=verdict(c,k);
  return `<div class="card ${cls}"><div class="vbadge ${vd.v}">${VKO[vd.v]}</div>
    <div class="chead"><div class="cost">${c.cost}</div><div class="nm">${c.name||'—'}</div></div>
    <div class="art">${art(c)}</div>
    <div class="tagrow"><span class="chip">${chip}</span></div>
    <div class="eff">${eff}</div>${foot}</div>`;
}

/* ===== 그리드 / 탭 ===== */
const TABS=[['creatures','크리처'],['spells','스펠'],['enchants','인챈트']];
let tab='creatures';
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="sm ${k===tab?'on':''}" data-tab="${k}">${l} (${DATA[k].length})</button>`).join('');}
function renderGrid(){
  const cards=DATA[tab].map((c,i)=>`<div data-open="${i}">${cardHTML(c,tab)}</div>`).join('');
  document.getElementById('grid').innerHTML=cards+`<div class="add" data-add="1">+ 추가</div>`;
}
function renderStats(){
  let over=0,deck=0,g=0,f=0,cre=0;
  DATA.creatures.forEach(c=>{const v=verdict(c,'creatures').v;if(v==='over')over++;deck+=+c.copies;cre+=+c.copies;if(c.tag==='guard'||c.tag==='flyguard')g+=+c.copies;if(c.tag==='fly'||c.tag==='flyguard')f+=+c.copies;});
  DATA.spells.forEach(c=>{if(verdict(c,'spells').v==='over')over++;deck+=+c.copies;});
  DATA.enchants.forEach(c=>{if(+c.copies>0){deck+=+c.copies;if(verdict(c,'enchants').v==='over')over++;}});
  setStat('st-deck',deck,`덱 / 목표 ${R.constants.deck_size}`,deck===R.constants.deck_size?'good':'bad');
  setStat('st-over',over,'예산 초과',over===0?'good':'bad');
  const gp=cre?Math.round(g/cre*100):0,fp=cre?Math.round(f/cre*100):0;
  setStat('st-guard',gp+'%','수호 35~40',gp>=35&&gp<=40?'good':'');
  setStat('st-fly',fp+'%','비행 8~10',fp>=8&&fp<=10?'good':'');
}
function setStat(id,n,l,cls){const el=document.getElementById(id);el.className='stat'+(cls?' '+cls:'');el.querySelector('.n').textContent=n;el.querySelector('.l').textContent=l;}
function renderAll(){renderTabs();renderGrid();renderStats();}

/* ===== 편집 모달 ===== */
let sel=null;
function fieldNum(k,i,f,label){return `<div class="field"><label>${label}</label><input inputmode="numeric" data-f="${f}" value="${DATA[k][i][f]}"></div>`;}
function openEditor(k,i){
  sel={k,i};const c=DATA[k][i];
  let typeFields='';
  if(k==='creatures'){
    typeFields=`<div class="field"><label>프레임 (태그)</label><select data-f="tag">${Object.entries(TAGKO).map(([v,l])=>`<option value="${v}"${c.tag===v?' selected':''}>${l}</option>`).join('')}</select></div>
      <div class="row">${fieldNum(k,i,'atk','ATK')}${fieldNum(k,i,'hp','HP')}</div>`;
  }else if(k==='spells'){
    typeFields=`<div class="field"><label>분류</label><select data-f="mode">${Object.entries(MODEKO).map(([v,l])=>`<option value="${v}"${c.mode===v?' selected':''}>${l}</option>`).join('')}</select></div>${fieldNum(k,i,'value','위력')}`;
  }else{
    typeFields=`<div class="field"><label>소모 타입</label><select data-f="drain_type">${Object.entries(DRAINKO).map(([v,l])=>`<option value="${v}"${c.drain_type===v?' selected':''}>${l}</option>`).join('')}</select>
      <div class="row">${fieldNum(k,i,'effect_value','효과값 E')}${fieldNum(k,i,'charge','충전 C')}</div>
      <div class="field"><label>대상</label><select data-f="target">${TARGETS.map(t=>`<option value="${t}"${c.target===t?' selected':''}>${t}</option>`).join('')}</select></div>`;
  }
  const artpick=Object.keys(M).map(key=>`<div class="artopt ${(c.art||'')===key?'on':''}" data-art="${key}">${M[key]}<small>${ARTLABELS[key]||key}</small></div>`).join('');
  document.getElementById('sheet').innerHTML=`
    <div class="shead"><h3>카드 편집</h3><button class="ghost sm" data-close="1">닫기 ✕</button></div>
    <div class="sbody">
      <div class="pvwrap"><div class="pv" id="pv"></div><div class="vline" id="vline"></div></div>
      <div class="fields">
        <div class="row"><div class="field" style="flex:2"><label>이름</label><input data-f="name" value="${c.name||''}"></div>${fieldNum(k,i,'cost','코스트')}</div>
        ${typeFields}
        ${fieldNum(k,i,'copies','덱 매수')}
        <div class="field"><label>효과·설명 (비우면 자동)</label><textarea data-f="desc" placeholder="예: 크리처 1개체에 4 피해">${c.desc||''}</textarea></div>
        <div class="field"><label>아트</label><div class="artpick">${artpick}</div></div>
      </div>
    </div>
    <div class="sfoot"><button class="del sm" data-del="1">이 카드 삭제</button><button class="sm" data-close="1">완료</button></div>`;
  document.getElementById('overlay').classList.add('on');
  refreshPreview();
}
function refreshPreview(){
  if(!sel)return;const c=DATA[sel.k][sel.i];
  document.getElementById('pv').innerHTML=cardHTML(c,sel.k);
  const vd=verdict(c,sel.k);
  const vl=document.getElementById('vline');vl.className='vline '+vd.v;vl.textContent=`예산 ${vd.calc} · ${VKO[vd.v]}`;
}
function closeEditor(){document.getElementById('overlay').classList.remove('on');sel=null;renderAll();}

/* ===== 이벤트 ===== */
document.getElementById('grid').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){openEditor(tab,+o.dataset.open);return;}
  if(e.target.closest('[data-add]'))addRow();
});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;renderAll();}});
document.getElementById('sheet').addEventListener('input',e=>{
  if(!sel||!e.target.dataset.f)return;
  DATA[sel.k][sel.i][e.target.dataset.f]=e.target.value;refreshPreview();renderStats();
});
document.getElementById('sheet').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeEditor();return;}
  if(e.target.closest('[data-del]')){DATA[sel.k].splice(sel.i,1);closeEditor();toast('삭제됨');return;}
  const a=e.target.closest('[data-art]');
  if(a){DATA[sel.k][sel.i].art=a.dataset.art;
    document.querySelectorAll('.artopt').forEach(x=>x.classList.toggle('on',x.dataset.art===a.dataset.art));
    refreshPreview();}
});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeEditor();});
function addRow(){
  if(tab==='creatures')DATA.creatures.push({name:'새 크리처',cost:1,tag:'normal',atk:1,hp:2,copies:1,art:'sword',desc:''});
  if(tab==='spells')DATA.spells.push({name:'새 스펠',cost:1,mode:'dmg',value:2,copies:1,art:'burst',desc:''});
  if(tab==='enchants')DATA.enchants.push({name:'새 인챈트',cost:2,drain_type:'persistent',effect_value:2,charge:5,target:'상대',copies:0,art:'flame',desc:''});
  renderTabs();renderGrid();openEditor(tab,DATA[tab].length-1);
}

/* ===== 내보내기/불러오기 ===== */
function cleaned(){
  const norm=(arr,nf)=>arr.map(o=>{const out={...o};delete out.k;nf.forEach(f=>out[f]=+out[f]||0);return out;});
  return {rules:DATA.rules,
    creatures:norm(DATA.creatures,['cost','atk','hp','copies']),
    spells:norm(DATA.spells,['cost','value','copies']),
    enchants:norm(DATA.enchants,['cost','effect_value','charge','copies'])};
}
document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(cleaned(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ten_data.json';a.click();
  toast('ten_data.json 내보냄 — 채팅으로 보내주세요');
};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(cleaned(),null,2));toast('복사됨 — 채팅에 붙여넣기');}catch(_){toast('복사 실패 — 내보내기를 쓰세요');}};
document.getElementById('loadBtn').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);['creatures','spells','enchants','rules'].forEach(k=>{if(d[k])DATA[k]=d[k];});renderAll();toast('불러옴');}catch(_){toast('불러오기 실패');}};r.readAsText(f);};
let toastT;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200);}

renderAll();
</script>
</body>
</html>
