<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>TEN — 카드 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFF2; --paper-2:#E3E6EB; --ink:#141821; --ink-soft:#4A5364;
  --ink-faint:#8A94A6; --rule:#C6CCD6;
  --indigo:#2D3BAF; --teal:#0F8A80; --amber:#B87400; --crimson:#B03A3F; --violet:#6A4FBF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;padding:16px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-family:'Gothic A1';font-weight:900;font-size:22px;letter-spacing:-.03em}
h1 span{color:var(--teal)}
.sub{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:3px 0 14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filters button{font-family:'JetBrains Mono';font-size:11.5px;font-weight:500;background:transparent;
  border:1px solid var(--rule);color:var(--ink-soft);padding:8px 13px;border-radius:20px;cursor:pointer;min-height:36px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}

/* ---------- 카드 ---------- */
.card{
  --fc:var(--ink);
  position:relative;background:var(--paper);border:4px solid var(--fc);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;
  aspect-ratio:5/7;                       /* 규격 고정 — 내용이 카드 크기를 바꾸지 못한다 */
  box-shadow:0 3px 10px rgba(20,24,33,.12);
}
.card.guard{--fc:var(--teal)} .card.fly{--fc:var(--amber)}
.card.flyguard{--fc:var(--amber)} .card.normal{--fc:var(--ink)}
.card.sp{--fc:var(--crimson)} .card.en{--fc:var(--violet)}

.chead{flex:none;height:40px;box-sizing:border-box;display:flex;align-items:center;gap:7px;padding:6px 9px 4px}
.cost{flex:none;width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;
  font-family:'JetBrains Mono';font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.name{font-family:'Gothic A1';font-weight:900;font-size:15px;letter-spacing:-.02em;line-height:1.1;flex:1}

.art{position:relative;margin:0;flex:none;height:47%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 16%,var(--paper)),color-mix(in srgb,var(--fc) 5%,var(--paper)));border-top:3px solid color-mix(in srgb,var(--fc) 60%,transparent);border-bottom:3px solid color-mix(in srgb,var(--fc) 60%,transparent)}
.art svg{width:62%;height:62%;color:var(--fc)}
.flyguard .art::after{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--teal) 45%,transparent)}

.tagrow{flex:none;height:22px;box-sizing:border-box;overflow:hidden;display:flex;gap:5px;padding:4px 9px 2px;flex-wrap:nowrap}
.chip{font-family:'JetBrains Mono';font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--fc);color:var(--fc);padding:2px 6px;border-radius:3px}

.eff{flex:none;height:42px;box-sizing:border-box;font-size:9.5px;line-height:1.38;color:var(--ink-soft);padding:3px 9px 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.eff b{color:var(--ink);font-weight:700}
.flavor{display:none}

/* 충전 미터 (인챈트) */
.meter{flex:none;height:20px;box-sizing:border-box;display:flex;gap:2px;padding:0 10px;overflow:hidden}
.meter i{width:9px;height:14px;border:1.5px solid var(--violet);border-radius:2px;background:color-mix(in srgb,var(--violet) 22%,transparent)}

/* 하단 스탯 (크리처) */
.stats{flex:none;height:38px;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;padding:5px 10px}
.stat{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono';font-weight:700;font-size:16px}
.stat .ic{width:9px;height:9px;border-radius:2px;transform:rotate(45deg)}
.stat.atk .ic{background:var(--crimson)} .stat.hp .ic{background:var(--teal)}
.stat.charge .ic{background:var(--violet)} .stat.charge{color:var(--violet)}
.stat.atk{color:var(--crimson)} .stat.hp{color:var(--teal)}
.copies{flex:none;height:18px;margin-top:auto;box-sizing:border-box;font-family:'JetBrains Mono';font-size:9px;color:var(--ink-faint);text-align:right;padding:0 10px}
.spfoot{flex:none;height:38px;box-sizing:border-box;padding:5px 10px;display:flex;align-items:center;justify-content:flex-end}
.big{font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:var(--fc)}
.big small{font-size:9px;color:var(--ink-faint);font-weight:500}
.art{overflow:hidden}.artimg{width:100%;height:100%;object-fit:cover;display:block}

/* ---- 속성 프레임 + 타입 아이콘 ---- */
.card{border-color:var(--el,var(--ink))!important}
.art{background:linear-gradient(160deg,color-mix(in srgb,var(--el) 16%,var(--paper)),color-mix(in srgb,var(--el) 5%,var(--paper)))!important;
  border-top-color:color-mix(in srgb,var(--el) 60%,transparent)!important;
  border-bottom-color:color-mix(in srgb,var(--el) 60%,transparent)!important}
.tico{flex:none;width:17px;height:17px;color:var(--el);opacity:.92}
.tico svg{width:100%;height:100%;display:block}
.chip{border-color:var(--el)!important;color:var(--el)!important}
.card .art svg{color:var(--el)}


/* ---- 코스트 줄 (이름 아래 별도 영역) ---- */
.chead{flex-direction:column;align-items:stretch!important;gap:3px!important;padding:6px 9px 4px!important}
.ctitle{display:flex;align-items:center;gap:6px}
.cost{display:flex!important;align-items:center;justify-content:flex-start!important;gap:3px;flex-wrap:wrap;
  width:auto!important;height:auto!important;background:none!important;border-radius:0!important;box-shadow:none!important;
  padding:1px 0 0!important;border-top:1px solid color-mix(in srgb,var(--el) 22%,transparent);margin-top:1px}
.pip{width:12px;height:12px;border-radius:50%;flex:none;box-sizing:border-box}
.pip.c{background:var(--el);border:1.5px solid color-mix(in srgb,var(--el) 62%,#000);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45)}
.pip.g{background:var(--paper);border:1.5px solid var(--ink-faint);box-shadow:inset 0 1px 1px rgba(0,0,0,.10)}
</style>
</head>
<body>
<div class="wrap">
  <h1>TE<span>N</span> — 카드 갤러리</h1>
  <div class="sub">Card design draft · frames · vector art</div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const DATA = __DATA__;
const TAGKO = {normal:'일반', guard:'수호', fly:'비행', flyguard:'비행수호'};
const MODEKO = {dmg:'단일', aoe:'광역', direct:'직접'};
const DRAINKO = {persistent:'지속형', triggered:'발동형', active:'사용형'};

/* ---------- 벡터 아트 모티프 (stroke=currentColor) ---------- */
const S = (inner) => `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const M = __MOTIFS__;
const TI = __TYPEICONS__;
const EL = __ELEMENTS__;
function costPips(c){
  const n=+c.cost||0;
  let cc=+c.cost_color; if(!cc) cc=Math.min(3,Math.max(1,Math.ceil((n-1)/2)));
  cc=Math.min(cc,n);
  return '<i class="pip c"></i>'.repeat(cc)+'<i class="pip g"></i>'.repeat(n-cc);
}
function artBlock(c){return (c.image)?`<img class="artimg" src="${c.image}">`:art(c);}
function art(c){
  const key=(c.art&&M[c.art])?c.art:(c.k==='sp'?'burst':c.k==='en'?'flame':(c.tag==='guard'||c.tag==='flyguard')?'shield':c.tag==='fly'?'hawk':'sword');
  return M[key];
}

/* ---------- 효과 텍스트 ---------- */
function effect(c){
  if(c.desc&&String(c.desc).trim())return c.desc;
  if(c.k==='cr'){
    const map={
      normal:'',
      guard:'<b>수호</b> — 플레이어 대신 왼쪽 슬롯부터 피해를 받는다.',
      fly:'<b>비행</b> — 비행 없는 수호를 무시하고 공격한다.',
      flyguard:'<b>비행·수호</b> — 공중·지상 양쪽을 모두 막는다.',
    };
    return map[c.tag]||'';
  }
  if(c.k==='sp'){
    if(c.mode==='dmg')return `크리처 1개체에 <b>${c.value}</b> 피해`;
    if(c.mode==='aoe')return `적 전체 개체에 <b>${c.value}</b> 피해`;
    if(c.mode==='direct')return `플레이어에게 <b>${c.value}</b> 피해 · 수호 무시`;
    return '';
  }
  return c.note||`충전 ${c.charge} · 효과 ${c.effect_value}`;
}
function cardHTML(c){
  const cls = c.k==='cr'?c.tag : c.k;
  const chips = `<span class="chip">${(EL[c.element]||EL.steel).ko}</span>`;
  let foot;
  if(c.k==='cr'){
    foot=`<div class="stats">
        <div class="stat atk"><span class="ic"></span>${c.atk}</div>
        <div class="stat hp"><span class="ic"></span>${c.hp}</div>
      </div><div class="copies">×${c.copies} in deck</div>`;
  }else if(c.k==='en'){
    foot=`<div class="stats"><div></div>
        <div class="stat charge"><span class="ic"></span>${c.charge}</div>
      </div><div class="copies">×${c.copies} in deck</div>`;
  }else{
    foot=`<div class="copies">×${c.copies} in deck</div>`;
  }
  const el=EL[c.element]||EL.steel;
  return `<div class="card ${cls}" style="--el:${el.c}">
    <div class="chead"><div class="ctitle"><div class="tico">${TI[c.k]}</div><div class="name">${c.name}</div></div><div class="cost">${costPips(c)}</div></div>
    <div class="art">${artBlock(c)}</div>
    <div class="tagrow">${chips}</div>
    <div class="eff">${effect(c)}</div>
    ${c.note && c.k==='cr' ? `<div class="flavor">${c.note}</div>`:''}
    ${foot}
  </div>`;
}

/* ---------- 목록 / 필터 ---------- */
function allCards(){
  return [
    ...DATA.creatures.map(c=>({...c,k:'cr'})),
    ...DATA.spells.map(c=>({...c,k:'sp'})),
    ...DATA.enchants.filter(c=>+c.copies>0).map(c=>({...c,k:'en'})),
  ];
}
const FILTERS=[['all','전체'],['cr','크리처'],['sp','스펠'],['en','인챈트'],['guard','수호'],['fly','비행']];
let cur='all';
function match(c){
  if(cur==='all')return true;
  if(cur==='cr'||cur==='sp'||cur==='en')return c.k===cur;
  if(cur==='guard')return c.tag==='guard'||c.tag==='flyguard';
  if(cur==='fly')return c.tag==='fly'||c.tag==='flyguard';
}
function renderFilters(){
  document.getElementById('filters').innerHTML=FILTERS.map(([k,l])=>
    `<button class="${k===cur?'on':''}" data-f="${k}">${l}</button>`).join('');
}
function renderGrid(){
  const cards=allCards().filter(match).sort((a,b)=>a.cost-b.cost);
  document.getElementById('grid').innerHTML=cards.map(cardHTML).join('');
}
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('[data-f]'); if(!b)return;
  cur=b.dataset.f; renderFilters(); renderGrid();
});
renderFilters(); renderGrid();
</script>
</body>
</html>
